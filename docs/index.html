/* Spiele: Enzym-Spiel und „Die Reise eines Brötchens“.
   Inhalte: inhalte/spiele/enzym-spiel.md und inhalte/spiele/broetchen-reise.md */
(function () {
  var esc = LT.esc, icon = LT.icon;
  var SP = LT.D.spiele || {};
  var norm = function (s) { return String(s).toLowerCase().trim(); };

  /* =================== Enzym-Spiel =================== */
  var ENZ = SP.enzym;
  if (ENZ && ENZ.enzyme.length) {
    LT.modus({
      id: 'enzym', titel: 'Enzym-Spiel', icon: 'enzym',
      text: function () { return 'Du bist ein Enzym: Klicke nur, was du spalten kannst! Bestwert: ' + LT.S.enzymBest; },
      verfuegbar: function (m) { return m.id === ENZ.modul; }
    });

    /** Welche Enzyme spalten dieses Substrat? */
    var spalter = function (substrat) {
      return ENZ.enzyme.filter(function (e) { return e.spaltet.some(function (p) { return norm(p.links) === norm(substrat); }); });
    };
    /** Erklärung, warum das gewählte Enzym dieses Substrat NICHT spaltet */
    var erklaerung = function (enzym, substrat) {
      var eigen = enzym.nicht.filter(function (p) { return norm(p.links) === norm(substrat); })[0];
      if (eigen) return { text: eigen.rechts, quelle: enzym.quelle };
      var andere = spalter(substrat);
      if (andere.length) {
        var p = andere[0].spaltet.filter(function (x) { return norm(x.links) === norm(substrat); })[0];
        return { text: '**' + substrat + '** wird nicht durch ' + enzym.name + ' gespalten, sondern durch ' +
          andere.map(function (e) { return e.name; }).join(' bzw. ') + '. ' + p.rechts, quelle: andere[0].quelle };
      }
      return { text: enzym.name + ' spaltet ' + substrat + ' nicht.', quelle: enzym.quelle };
    };

    LT.route(/^\/modul\/([^/]+)\/enzym$/, function (id) {
      var m = LT.modul(id);
      if (!m || !LT.modulOffen(m)) { LT.gehe('/'); return; }
      LT.modulKontext(m.id);
      var ruhig = LT.bewegungReduziert();
      var h = LT.zeige(LT.seitenkopf('Enzym-Spiel', { pfad: '/modul/' + m.id, text: m.titel }, 'Bestwert: ' + LT.S.enzymBest + ' Punkte') +
        (ENZ.einleitung ? '<p>' + LT.txt(ENZ.einleitung) + '</p>' : '') +
        '<fieldset class="optionen"><legend class="frage">Welches Enzym bist du?</legend>' +
        ENZ.enzyme.map(function (e, i) {
          return '<label class="opt"><input type="radio" name="enzym" value="' + i + '"' + (i === 0 ? ' checked' : '') + '> <span><b>' + esc(e.name) + '</b>' +
            (e.ort ? ' <span class="muted klein">· ' + esc(e.ort) + '</span>' : '') + (e.info ? '<br><span class="klein">' + LT.txt(e.info) + '</span>' : '') + '</span></label>';
        }).join('') + '</fieldset>' +
        '<label class="opt"><input type="checkbox" id="ruhig"' + (ruhig ? ' checked' : '') + '> <span><b>Ruhiger Modus</b><br><span class="klein muted">Nichts fliegt – die Stoffe stehen still. Gut mit Tastatur.</span></span></label>' +
        '<div><button class="btn primaer" type="button" id="enzym-los">' + icon('enzym') + 'Los geht’s (' + LT.E.enzym_sekunden + ' Sekunden)</button></div>');
      LT.$('#enzym-los', h).addEventListener('click', function () {
        spielen(m, ENZ.enzyme[+LT.$('input[name=enzym]:checked', h).value], LT.$('#ruhig', h).checked);
      });
    }, 'start');

    var spielen = function (m, enzym, ruhig) {
      var ziele = enzym.spaltet.map(function (p) { return p.links; });
      // Fallen: nur die eigenen „nicht:“-Einträge des Enzyms. Lebensmittel enthalten oft mehrere
      // Nährstoffe (Ei: Fett UND Eiweiß) – deshalb dürfen die Ziele anderer Enzyme keine Fallen sein.
      // Nur wenn ein Enzym keine „nicht:“-Liste hat, werden die Ziele der anderen Enzyme genutzt.
      var falle = enzym.nicht.map(function (p) { return p.links; });
      if (!falle.length) ENZ.enzyme.forEach(function (e) { if (e !== enzym) e.spaltet.forEach(function (p) { falle.push(p.links); }); });
      falle = falle.filter(function (f, i, a) { return a.indexOf(f) === i && !ziele.some(function (z) { return norm(z) === norm(f); }); });
      var punkte = 0, fehler = 0, rest = LT.E.enzym_sekunden, pause = false, teile = [], raf, uhr, nachschub, zaehler = 0, MAX = 7;

      var h = LT.zeige(LT.seitenkopf('Du bist: ' + esc(enzym.name), { pfad: '/modul/' + m.id + '/enzym', text: 'Enzym-Spiel' }, 'Enzym-Spiel') +
        '<div class="reihe zw"><span class="chip" role="timer" id="e-zeit">' + rest + ' s</span><span class="chip ok" id="e-punkte">0 Punkte</span></div>' +
        '<p class="muted klein">Tippe nur auf Lebensmittel, in denen etwas steckt, das ' + esc(enzym.name) + ' spalten kann.</p>' +
        '<div class="spielfeld' + (ruhig ? ' ruhig' : '') + '" id="feld" role="group" aria-label="Spielfeld"></div>' +
        '<div id="e-info" aria-live="assertive"></div>');
      var feld = LT.$('#feld', h);

      function neuesTeil() {
        var istZiel, name, versuche = 0;
        do {   // im ruhigen Modus keinen Stoff doppelt zeigen
          istZiel = Math.random() < 0.45 || !falle.length;
          name = istZiel ? ziele[Math.floor(Math.random() * ziele.length)] : falle[Math.floor(Math.random() * falle.length)];
        } while (++versuche < 12 && teile.some(function (t) { return t.name === name; }));   // nichts doppelt
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'teil'; b.textContent = name;
        b.setAttribute('data-id', ++zaehler);
        // Kreuz und quer: zufällige Startposition und Richtung, Abprallen am Rand, begrenzte Lebensdauer
        var winkel = Math.random() * Math.PI * 2, tempo = 0.006 + Math.random() * 0.006;   // % pro ms
        var t = { el: b, name: name, ziel: istZiel, x: 5 + Math.random() * 65, y: 8 + Math.random() * 80,
                  vx: Math.cos(winkel) * tempo, vy: Math.sin(winkel) * tempo, leben: 6000 + Math.random() * 3000 };
        if (!ruhig) { b.style.left = t.x + '%'; b.style.top = t.y + '%'; b.classList.add('neu'); }
        b.addEventListener('click', function () { treffer(t); });
        feld.appendChild(b);
        teile.push(t);
        return t;
      }
      function entfernen(t) { t.el.remove(); teile = teile.filter(function (x) { return x !== t; }); }

      function treffer(t) {
        if (pause || rest <= 0) return;
        if (t.ziel) {
          punkte++;
          LT.$('#e-punkte', h).textContent = punkte + ' Punkte';
          t.el.classList.add('weg');
          LT.ansage('Richtig, ' + t.name + ' gespalten. ' + punkte + ' Punkte.');
          setTimeout(function () { entfernen(t); if (ruhig) neuesTeil(); }, LT.bewegungReduziert() ? 0 : 250);
        } else {
          fehler++;
          pause = true;
          t.el.classList.add('falsch');
          var e = erklaerung(enzym, t.name);
          LT.$('#e-info', h).innerHTML = '<div class="rueck nein"><b>' + icon('kreuz') + esc(t.name) + ' passt nicht zu ' + esc(enzym.name) + '</b><p>' +
            LT.txt(e.text) + '</p>' + LT.liesNach(e.quelle) +
            '<div><button class="btn primaer" type="button" id="e-weiter">Weiter spielen</button></div></div>';
          var w = LT.$('#e-weiter', h);
          w.focus({ preventScroll: false });
          w.addEventListener('click', function () {
            LT.$('#e-info', h).innerHTML = '';
            entfernen(t); if (ruhig) neuesTeil();
            pause = false; letzte = performance.now();
            var erstes = LT.$('.teil', feld); if (erstes) erstes.focus({ preventScroll: true });
          });
        }
      }

      var letzte = performance.now();
      function bewegen(jetzt) {
        var dt = jetzt - letzte; letzte = jetzt;
        if (!pause) {
          var breite = feld.clientWidth || 1;
          teile.slice().forEach(function (t) {
            var w = t.el.offsetWidth / breite * 100;
            t.x += t.vx * dt; t.y += t.vy * dt; t.leben -= dt;
            if (t.x < 0) { t.x = 0; t.vx = Math.abs(t.vx); }
            if (t.x + w > 100) { t.x = 100 - w; t.vx = -Math.abs(t.vx); }
            if (t.y < 7) { t.y = 7; t.vy = Math.abs(t.vy); }
            if (t.y > 93) { t.y = 93; t.vy = -Math.abs(t.vy); }
            t.el.style.left = t.x + '%'; t.el.style.top = t.y + '%';
            if (t.leben < 600) t.el.classList.add('geht');
            if (t.leben <= 0) entfernen(t);
          });
        }
        raf = requestAnimationFrame(bewegen);
      }

      if (ruhig) { for (var i = 0; i < 6; i++) neuesTeil(); var erstes = LT.$('.teil', feld); if (erstes) erstes.focus(); }
      else {
        neuesTeil();
        nachschub = setInterval(function () { if (!pause && teile.length < MAX) neuesTeil(); }, 900);
        raf = requestAnimationFrame(bewegen);
      }
      uhr = setInterval(function () {
        if (pause) return;
        rest--;
        LT.$('#e-zeit', h).textContent = rest + ' s';
        if (rest === 10) LT.ansage('Noch 10 Sekunden.');
        if (rest <= 0) ende();
      }, 1000);
      LT.aufraeumen = stopp;
      function stopp() { clearInterval(uhr); clearInterval(nachschub); cancelAnimationFrame(raf); }

      function ende() {
        stopp(); LT.aufraeumen = null;
        var rekord = punkte > LT.S.enzymBest;
        LT.S.enzymBest = Math.max(LT.S.enzymBest, punkte);
        var xp = LT.xpDazu('enzym_treffer', punkte);
        LT.uebungstag(); LT.speichern(); LT.awardsPruefen();
        LT.ergebnisSeite({
          titel: 'Zeit ist um!', eyebrow: 'Enzym-Spiel · ' + enzym.name, zurueck: { pfad: '/modul/' + m.id, text: m.titel },
          html: '<p class="prozent">' + punkte + '</p><p>Punkte mit ' + esc(enzym.name) + ' · ' + fehler + ' Fehlklick' + (fehler === 1 ? '' : 's') + '.' +
            (rekord ? ' <b>Neuer Bestwert!</b>' : ' Bestwert: ' + LT.S.enzymBest + '.') + '</p>' +
            '<p><b>' + esc(enzym.name) + ' spaltet:</b> ' + enzym.spaltet.map(function (p) { return esc(p.links); }).join(', ') + '</p>' + LT.liesNach(enzym.quelle) +
            (xp ? '<p class="chip gold">+' + xp + ' XP</p>' : ''),
          knoepfe: '<a class="btn primaer" href="#/modul/' + esc(m.id) + '/enzym">Nochmal / Enzym wechseln</a><a class="btn" href="#/modul/' + esc(m.id) + '">Zum Modul</a>'
        });
      }
    };
  }

  /* =================== Die Reise eines Brötchens =================== */
  var REISE = SP.reise;
  if (REISE && REISE.stationen.length) {
    var naehrstoffe = REISE.stationen.map(function (s) { return s.naehrstoff; }).filter(function (n, i, a) { return a.indexOf(n) === i; });
    LT.modus({
      id: 'reise', titel: 'Die Reise eines Brötchens', icon: 'broetchen',
      text: 'Begleite ' + naehrstoffe.join(', ') + ' durch den Verdauungstrakt',
      verfuegbar: function (m) { return m.id === REISE.modul; }
    });

    LT.route(/^\/modul\/([^/]+)\/reise$/, function (id) {
      var m = LT.modul(id);
      if (!m || !LT.modulOffen(m)) { LT.gehe('/'); return; }
      LT.zeige(LT.seitenkopf('Die Reise eines Brötchens', { pfad: '/modul/' + m.id, text: m.titel }) +
        (REISE.einleitung ? '<div class="karte flach">' + LT.absaetze(REISE.einleitung) + '</div>' : '') +
        '<h2>Wen begleitest du?</h2><div class="modi">' + naehrstoffe.map(function (n) {
          var anz = REISE.stationen.filter(function (s) { return s.naehrstoff === n; }).length;
          return '<a class="modus" href="#/modul/' + esc(m.id) + '/reise/' + encodeURIComponent(n) + '">' + icon('broetchen') +
            '<div><b>' + esc(n) + '</b><span>' + anz + ' Stationen</span></div></a>';
        }).join('') + '</div>');
    }, 'start');

    LT.route(/^\/modul\/([^/]+)\/reise\/(.+)$/, function (id, n) {
      var m = LT.modul(id);
      if (!m || !LT.modulOffen(m)) { LT.gehe('/'); return; }
      LT.modulKontext(m.id);
      var stationen = REISE.stationen.filter(function (s) { return s.naehrstoff === n; });
      if (!stationen.length) { LT.gehe('/modul/' + id + '/reise'); return; }
      var i = 0, richtig = 0, xp = 0;
      var h = LT.zeige(LT.seitenkopf('Reise: ' + esc(n), { pfad: '/modul/' + m.id + '/reise', text: 'Die Reise eines Brötchens' }) +
        '<ol class="route" aria-label="Stationen">' + stationen.map(function (s, k) {
          return '<li data-k="' + k + '"><span class="punkt" aria-hidden="true"></span><span>' + esc(s.ort) + '</span></li>';
        }).join('') + '</ol><div id="station"></div>');

      function zeigen() {
        LT.$$('.route li', h).forEach(function (li, k) {
          li.classList.toggle('jetzt', k === i); li.classList.toggle('vorbei', k < i);
          if (k === i) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
        });
        if (i >= stationen.length) return ende();
        var s = stationen[i];
        var box = LT.$('#station', h);
        box.innerHTML = '<section class="karte stapel"><p class="eyebrow">Station ' + (i + 1) + ' von ' + stationen.length + ': ' + esc(s.ort) + '</p>' +
          '<div class="a-inhalt"></div><div class="a-rueck" aria-live="polite"></div>' +
          '<div><button class="btn primaer" type="button" data-pruefen disabled>Prüfen</button></div></section>';
        var steuer = LT.typen['single-choice'].bauen(s, LT.$('.a-inhalt', box));
        var knopf = LT.$('[data-pruefen]', box);
        LT.$('.a-inhalt', box).addEventListener('change', function () { knopf.disabled = !steuer.bereit(); });
        knopf.addEventListener('click', function () {
          if (knopf.getAttribute('data-weiter')) { i++; zeigen(); return; }
          var anteil = steuer.pruefen();
          LT.$$('input', box).forEach(function (x) { x.disabled = true; });
          LT.uebungstag();
          if (anteil >= 1) { richtig++; xp += LT.xpDazu('richtige_aufgabe'); }
          LT.speichern();
          LT.$('.a-rueck', box).innerHTML = LT.rueckmeldung(anteil, s);
          LT.$('.a-rueck', box).scrollIntoView({ block: 'nearest', behavior: LT.bewegungReduziert() ? 'auto' : 'smooth' });
          knopf.textContent = i + 1 < stationen.length ? 'Weiter zur nächsten Station' : 'Ziel erreicht';
          knopf.setAttribute('data-weiter', '1');
          knopf.focus({ preventScroll: true });
          LT.kopfAktualisieren();
        });
      }
      function ende() {
        LT.awardsPruefen();
        LT.ergebnisSeite({
          titel: 'Angekommen!', eyebrow: 'Reise: ' + n, zurueck: { pfad: '/modul/' + m.id + '/reise', text: 'Die Reise eines Brötchens' },
          html: '<p class="prozent">' + richtig + ' / ' + stationen.length + '</p><p>Stationen richtig gemeistert.</p>' + (xp ? '<p class="chip gold">+' + xp + ' XP</p>' : ''),
          knoepfe: '<a class="btn primaer" href="#/modul/' + esc(m.id) + '/reise">Anderen Nährstoff begleiten</a><a class="btn" href="#/modul/' + esc(m.id) + '">Zum Modul</a>'
        });
      }
      zeigen();
    }, 'start');
  }
})();

/* ---- js/aufgaben/60-modulcheck.js ---- */
/* Modulcheck: zufällige, automatisch bewertbare Aufgaben → Prozentwert → bestanden ab Grenze */
(function () {
  var esc = LT.esc, icon = LT.icon;
  LT.CHECK_TYPEN = ['single-choice', 'multiple-choice', 'zuordnung', 'reihenfolge', 'lückentext', 'bildzuordnung'];
  var checkAufgaben = function (m) { return m.aufgaben.filter(function (a) { return LT.CHECK_TYPEN.indexOf(a.typ) >= 0; }); };

  LT.modus({
    id: 'check', titel: 'Modulcheck', icon: 'check',
    text: function (m) { return Math.min(LT.E.modulcheck_aufgaben, checkAufgaben(m).length) + ' gemischte Aufgaben – bestehe mit mindestens ' + LT.E.bestehensgrenze + ' %'; },
    verfuegbar: function (m) { return checkAufgaben(m).length > 0; }
  });

  /** Aprilscherz: nur am 1. April wird die Scherzfrage (falls vorhanden) vorne eingefügt */
  function aprilscherz() {
    var d = new Date(), f = LT.D.spiele && LT.D.spiele.aprilscherz;
    return d.getMonth() === 3 && d.getDate() === 1 && f ? f : null;
  }

  LT.route(/^\/modul\/([^/]+)\/check$/, function (id) {
    var m = LT.modul(id);
    if (!m || !LT.modulOffen(m)) { LT.gehe('/'); return; }
    LT.modulKontext(m.id);
    var liste = LT.ziehen(checkAufgaben(m), LT.E.modulcheck_aufgaben).map(function (a) { return { a: a, modulId: m.id }; });
    var scherz = aprilscherz();
    if (scherz) liste.unshift({ a: scherz, modulId: m.id, scherz: true });
    var richtigeXp = 0;
    LT.sitzung({
      titel: 'Modulcheck: ' + m.titel, eyebrow: 'Bestehen ab ' + LT.E.bestehensgrenze + ' %',
      zurueck: { pfad: '/modul/' + m.id, text: m.titel }, liste: liste,
      nachAntwort: function (e, anteil) {
        if (e.scherz) { if (anteil >= 1) LT.S.aprilscherz = true; return; }
        if (anteil >= 1) richtigeXp += LT.xpDazu('richtige_aufgabe');
      },
      ende: function (erg) {
        var gewertet = erg.filter(function (e, i) { return !liste[i].scherz; });
        var summe = gewertet.reduce(function (s, e) { return s + e.anteil; }, 0);
        var prozent = Math.round(summe / gewertet.length * 100);
        var lauf = LT.laufBeenden(m.id, prozent);
        LT.speichern();
        LT.awardsPruefen();
        LT.ergebnisSeite({
          titel: lauf.bestanden ? 'Bestanden!' : 'Noch nicht bestanden', eyebrow: 'Modulcheck ' + m.titel,
          zurueck: { pfad: '/modul/' + m.id, text: m.titel },
          html: '<p class="prozent ' + (lauf.bestanden ? 'ok' : 'nein') + '">' + prozent + ' %</p>' +
            '<p>' + (lauf.bestanden
              ? (lauf.erstmals ? 'Stark! Du hast das Modul zum ersten Mal bestanden.' : 'Du hast das Modul erneut bestanden.')
              : 'Du brauchst mindestens ' + LT.E.bestehensgrenze + ' %. Schau dir die Aufgaben unten noch einmal an und versuch es erneut.') + '</p>' +
            '<p class="chip gold">+' + (richtigeXp + lauf.xp) + ' XP</p>' + LT.sichernErinnerung(),
          falsch: gewertet.filter(function (e) { return e.anteil < 1; }),
          knoepfe: '<a class="btn primaer" href="#/modul/' + esc(m.id) + '">Zurück zum Modul</a>' +
            '<button class="btn" type="button" onclick="LT.gehe(\'/modul/' + esc(m.id) + '/check\')">Neuer Durchgang</button>'
        });
      }
    });
  }, 'start');
})();

/* ---- js/aufgaben/70-karteikarten.js ---- */
/* Karteikarten mit Leitner-System (5 Fächer).
   Gewusst → ein Fach weiter. Nicht gewusst → zurück in Fach 1.
   Karten eines Fachs sind erst nach einer Pause wieder dran (Fach 1: sofort … Fach 5: 14 Tage). */
(function () {
  var esc = LT.esc, icon = LT.icon;
  var PAUSE_TAGE = [0, 1, 3, 7, 14];   // Index = Fach − 1
  var PRO_RUNDE = 15;

  function fach(id) { return (LT.S.leitner[id] && LT.S.leitner[id].f) || 1; }
  function faellig(id) {
    var k = LT.S.leitner[id];
    if (!k) return true;
    var tage = (new Date(LT.tag()) - new Date(k.t)) / 864e5;
    return tage >= PAUSE_TAGE[k.f - 1];
  }
  function faecher(m) {
    var z = [0, 0, 0, 0, 0];
    m.karten.forEach(function (k) { z[fach(k.id) - 1]++; });
    return z;
  }
  function faecherHtml(m) {
    return '<div class="faecher" aria-label="Karten pro Fach">' + faecher(m).map(function (n, i) {
      return '<div class="fach"><span class="muted klein">Fach ' + (i + 1) + '</span><b>' + n + '</b></div>';
    }).join('') + '</div>';
  }

  LT.modus({
    id: 'karten', titel: 'Karteikarten', icon: 'karten',
    text: function (m) {
      var n = m.karten.filter(function (k) { return faellig(k.id); }).length;
      return m.karten.length + ' Karten · ' + (n ? n + ' heute dran' : 'heute alles gelernt');
    },
    verfuegbar: function (m) { return m.karten.length > 0; }
  });

  LT.route(/^\/modul\/([^/]+)\/karten$/, function (id) {
    var m = LT.modul(id);
    if (!m || !LT.modulOffen(m)) { LT.gehe('/'); return; }
    LT.modulKontext(m.id);
    var dran = LT.mischen(m.karten.filter(function (k) { return faellig(k.id); }))
      .sort(function (a, b) { return fach(a.id) - fach(b.id); }).slice(0, PRO_RUNDE);
    var extra = !dran.length;
    if (extra) dran = LT.mischen(m.karten).sort(function (a, b) { return fach(a.id) - fach(b.id); }).slice(0, PRO_RUNDE);
    var i = 0, gewusst = 0, xp = 0;
    var h = LT.zeige(LT.seitenkopf('Karteikarten: ' + esc(m.titel), { pfad: '/modul/' + m.id, text: m.titel }, 'Leitner-System') +
      (extra ? '<p class="hinweis">Heute ist keine Karte fällig. Du kannst trotzdem freiwillig wiederholen.</p>' : '') +
      '<div id="faecher">' + faecherHtml(m) + '</div><div id="karte"></div>');

    function zeigen() {
      if (i >= dran.length) return ende();
      var k = dran[i];
      LT.$('#karte', h).innerHTML =
        '<section class="karte stapel kk" aria-labelledby="kk-t"><div class="reihe zw"><span class="eyebrow" id="kk-t">Karte ' + (i + 1) + ' von ' + dran.length + '</span>' +
        '<span class="chip">Fach ' + fach(k.id) + '</span></div>' +
        '<div class="kk-seite"><p class="eyebrow">Frage</p><div class="kk-text">' + LT.absaetze(k.vorne) + '</div></div>' +
        '<div class="kk-seite kk-hinten" hidden><p class="eyebrow">Antwort</p><div class="kk-text">' + LT.absaetze(k.hinten) + '</div>' + LT.liesNach(k.quelle) + '</div>' +
        '<div class="reihe" data-vorne><button class="btn primaer" type="button" data-umdrehen>Umdrehen</button></div>' +
        '<div class="reihe" data-hinten hidden><button class="btn primaer" type="button" data-ja>' + icon('haken') + 'Gewusst</button>' +
        '<button class="btn" type="button" data-nein>' + icon('kreuz') + 'Nicht gewusst</button></div></section>';
      var karte = LT.$('.kk', h);
      LT.$('[data-umdrehen]', karte).focus({ preventScroll: true });
      LT.$('[data-umdrehen]', karte).addEventListener('click', function () {
        LT.$('.kk-hinten', karte).hidden = false;
        LT.$('[data-vorne]', karte).hidden = true;
        LT.$('[data-hinten]', karte).hidden = false;
        LT.$('[data-ja]', karte).focus({ preventScroll: true });
      });
      LT.$('[data-ja]', karte).addEventListener('click', function () { bewerten(k, true); });
      LT.$('[data-nein]', karte).addEventListener('click', function () { bewerten(k, false); });
    }

    function bewerten(k, ok) {
      var alt = fach(k.id);
      var neu = ok ? Math.min(5, alt + 1) : 1;
      LT.S.leitner[k.id] = { f: neu, t: LT.tag() };
      if (ok) { gewusst++; if (neu > alt) xp += LT.xpDazu('karte_weiter'); }
      LT.uebungstag();
      LT.speichern();
      LT.ansage(ok ? 'Gewusst. Jetzt in Fach ' + neu + '.' : 'Zurück in Fach 1.');
      LT.$('#faecher', h).innerHTML = faecherHtml(m);
      LT.kopfAktualisieren();
      i++;
      zeigen();
    }

    function ende() {
      LT.awardsPruefen();
      LT.ergebnisSeite({
        titel: 'Runde geschafft', eyebrow: 'Karteikarten ' + m.titel, zurueck: { pfad: '/modul/' + m.id, text: m.titel },
        html: '<p class="prozent">' + gewusst + ' / ' + dran.length + '</p><p>Karten gewusst.</p>' + faecherHtml(m) +
          (xp ? '<p class="chip gold">+' + xp + ' XP</p>' : ''),
        knoepfe: '<a class="btn primaer" href="#/modul/' + esc(m.id) + '">Zurück zum Modul</a>'
      });
    }
    zeigen();
  }, 'start');
})();

/* ---- js/aufgaben/80-fehler-quiz.js ---- */
/* „Meine Fehler“ (nur falsch beantwortete Aufgaben) und „Quiz auf Zeit“ (freiwillig) */
(function () {
  var esc = LT.esc, icon = LT.icon;

  function aufgabeFinden(id, modulId) {
    var m = LT.modul(modulId);
    if (!m) return null;
    for (var i = 0; i < m.aufgaben.length; i++) if (m.aufgaben[i].id === id) return m.aufgaben[i];
    return null;
  }

  /* ---------- Meine Fehler ---------- */
  LT.route(/^\/fehler$/, function () {
    var liste = [];
    Object.keys(LT.S.falsch).forEach(function (id) {
      var modulId = LT.S.falsch[id], a = aufgabeFinden(id, modulId), m = LT.modul(modulId);
      if (a && m && LT.modulOffen(m)) liste.push({ a: a, modulId: modulId });
      else if (!a) delete LT.S.falsch[id];   // Aufgabe gibt es nicht mehr
    });
    liste = LT.mischen(liste).slice(0, 15);
    if (!liste.length) {
      LT.zeige(LT.seitenkopf('Meine Fehler', { pfad: '/', text: 'Übersicht' }) +
        '<section class="karte stapel"><p>Zurzeit hast du keine falsch beantworteten Aufgaben. Stark!</p>' +
        '<p class="muted">Aufgaben, die du in einem Modulcheck nicht ganz richtig löst, landen hier. Sobald du sie richtig beantwortest, verschwinden sie wieder.</p>' +
        '<div><a class="btn primaer" href="#/">Zur Übersicht</a></div></section>');
      return;
    }
    var xp = 0;
    LT.sitzung({
      titel: 'Meine Fehler', eyebrow: 'Wiederholen', zurueck: { pfad: '/', text: 'Übersicht' }, liste: liste,
      nachAntwort: function (e, anteil) { if (anteil >= 1) xp += LT.xpDazu('richtige_aufgabe'); },
      ende: function (erg) {
        LT.awardsPruefen();
        var richtig = erg.filter(function (e) { return e.anteil >= 1; }).length;
        var rest = Object.keys(LT.S.falsch).length;
        LT.ergebnisSeite({
          titel: 'Wiederholung geschafft', zurueck: { pfad: '/', text: 'Übersicht' },
          html: '<p class="prozent">' + richtig + ' / ' + erg.length + '</p><p>Aufgaben jetzt richtig gelöst. ' +
            (rest ? 'Noch ' + rest + ' Aufgabe' + (rest === 1 ? '' : 'n') + ' zum Wiederholen.' : 'Deine Fehlerliste ist leer!') + '</p>' +
            (xp ? '<p class="chip gold">+' + xp + ' XP</p>' : ''),
          falsch: erg.filter(function (e) { return e.anteil < 1; }),
          knoepfe: '<a class="btn primaer" href="#/">Zur Übersicht</a>' + (rest ? '<button class="btn" type="button" onclick="LT.gehe(\'/fehler\')">Weiter wiederholen</button>' : '')
        });
      }
    });
  }, 'start');

  /* ---------- Quiz auf Zeit ---------- */
  function quizPool() {
    var pool = [];
    LT.D.module.forEach(function (m) {
      if (!LT.modulOffen(m)) return;
      m.aufgaben.forEach(function (a) { if (a.typ === 'single-choice') pool.push({ a: a, modulId: m.id }); });
    });
    return pool;
  }

  LT.route(/^\/quiz$/, function () {
    var pool = quizPool();
    var h = LT.zeige(LT.seitenkopf('Quiz auf Zeit', { pfad: '/', text: 'Übersicht' }, 'Freiwillig') +
      '<section class="karte stapel" id="quiz">' +
      (pool.length
        ? '<p>Beantworte in <b>' + LT.E.quiz_sekunden + ' Sekunden</b> so viele Fragen wie möglich. Die Fragen stammen aus allen Modulen, die du schon freigeschaltet hast. ' +
          'Das Quiz ist freiwillig und zählt nicht für das Bestehen eines Moduls.</p>' +
          '<p class="muted klein">Bestwert Serie: ' + LT.S.quizSerieMax + ' richtige Antworten in Folge</p>' +
          '<div><button class="btn primaer" type="button" id="quiz-los">' + icon('blitz') + 'Start</button></div>'
        : '<p class="muted">Sobald du ein Modul mit Single-Choice-Fragen freigeschaltet hast, kannst du hier spielen.</p>') +
      '</section>');
    if (!pool.length) return;
    LT.$('#quiz-los', h).addEventListener('click', function () { starten(pool); });
  }, 'start');

  function starten(pool) {
    var rest = LT.E.quiz_sekunden, richtig = 0, falsch = 0, serie = 0, xp = 0, reihe = LT.mischen(pool), k = 0, timer;
    var box = LT.$('#quiz');
    box.innerHTML = '<div class="reihe zw"><span class="chip" id="q-zeit" role="timer" aria-label="Verbleibende Zeit">' + rest + ' s</span>' +
      '<span class="chip ok" id="q-stand">0 richtig</span></div><div class="balken" aria-hidden="true"><i id="q-balken" style="width:100%"></i></div>' +
      '<div id="q-frage" aria-live="polite"></div>';
    timer = setInterval(function () {
      rest--;
      LT.$('#q-zeit').textContent = rest + ' s';
      LT.$('#q-balken').style.width = (rest / LT.E.quiz_sekunden * 100) + '%';
      if (rest === 10) LT.ansage('Noch 10 Sekunden.');
      if (rest <= 0) ende();
    }, 1000);
    LT.aufraeumen = function () { clearInterval(timer); };

    function frage() {
      if (k >= reihe.length) { reihe = LT.mischen(pool); k = 0; }
      var e = reihe[k++], a = e.a;
      LT.modulKontext(e.modulId);
      var opts = LT.mischen(a.optionen);
      LT.$('#q-frage').innerHTML = '<p class="frage">' + LT.txt(a.frage) + '</p><div class="quiz-opts">' +
        opts.map(function (o, i) { return '<button type="button" class="opt-btn" data-i="' + i + '">' + LT.txt(o.text, { ohneKlammer: true }) + '</button>'; }).join('') + '</div>';
      LT.$$('.opt-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          var o = opts[+b.getAttribute('data-i')];
          LT.$$('.opt-btn').forEach(function (x) { x.disabled = true; if (opts[+x.getAttribute('data-i')].richtig) x.classList.add('richtig'); });
          LT.uebungstag();
          if (o.richtig) {
            richtig++; serie++; xp += LT.xpDazu('quiz_richtig');
            LT.S.quizSerieMax = Math.max(LT.S.quizSerieMax, serie);
          } else { falsch++; serie = 0; b.classList.add('falsch'); }
          LT.$('#q-stand').textContent = richtig + ' richtig';
          setTimeout(function () { if (rest > 0) frage(); }, o.richtig ? 450 : 1400);
        });
      });
      var erstes = LT.$('.opt-btn'); if (erstes) erstes.focus({ preventScroll: true });
    }

    function ende() {
      clearInterval(timer); LT.aufraeumen = null;
      LT.speichern();
      LT.awardsPruefen();
      LT.ergebnisSeite({
        titel: 'Zeit ist um!', eyebrow: 'Quiz auf Zeit', zurueck: { pfad: '/', text: 'Übersicht' },
        html: '<p class="prozent">' + richtig + '</p><p>richtige Antworten (' + falsch + ' falsch). Beste Serie bisher: ' + LT.S.quizSerieMax + '.</p>' +
          (xp ? '<p class="chip gold">+' + xp + ' XP</p>' : ''),
        knoepfe: '<button class="btn primaer" type="button" onclick="LT.gehe(\'/quiz\')">Nochmal</button><a class="btn" href="#/">Zur Übersicht</a>'
      });
    }
    frage();
  }
})();

/* ---- js/60-ansichten.js ---- */
/* Ansichten: Start, Modul, Awards, Glossar, Mehr (Spielstand, Nachweis, Datenschutz) */
(function () {
  var esc = LT.esc, icon = LT.icon;

  /* ---------- Willkommen / Formwahl ---------- */
  LT.route(/^\/willkommen$/, function () {
    var h = LT.zeige(
      LT.seitenkopf('Willkommen!', null, 'Lerntool Verdauung') +
      '<section class="karte stapel">' +
      '<p>Hier lernst du alles über das Verdauungssystem, von den Nährstoffen bis zu den Erkrankungen. ' +
      'Für richtige Antworten bekommst du XP, steigst im Rang auf und sammelst Awards.</p>' +
      '<fieldset class="stapel" style="border:0;padding:0;margin:0"><legend><h2>Wie sollen wir deinen Rang nennen?</h2></legend>' +
      '<div class="wahl">' +
      '<label><input type="radio" name="form" value="w"> Praktikantin → … → Gesundheitsministerin</label>' +
      '<label><input type="radio" name="form" value="m"> Praktikant → … → Gesundheitsminister</label>' +
      '<label><input type="radio" name="form" value="n"> Praktikant:in → … → Gesundheitsminister:in</label>' +
      '</div></fieldset>' +
      '<p class="muted klein">Deine Wahl wird nur auf diesem Gerät gespeichert. Du kannst sie unter „Mehr“ jederzeit ändern.</p>' +
      LT.datenschutzKurz() +
      '<div class="reihe"><button class="btn primaer" id="los" type="button" disabled>Los geht’s</button>' +
      '<a class="btn" href="#/mehr/laden">Ich habe schon einen Spielstand</a></div>' +
      '</section>');
    LT.$$('input[name=form]', h).forEach(function (r) {
      r.addEventListener('change', function () { LT.$('#los').disabled = false; });
    });
    LT.$('#los').addEventListener('click', function () {
      var w = LT.$('input[name=form]:checked', h);
      if (!w) return;
      LT.S.form = w.value;
      LT.speichern();
      LT.gehe('/');
    });
  }, 'start');

  LT.datenschutzKurz = function () {
    return '<div class="hinweis">' +
      '<p><b>Datenschutz:</b> Das Lerntool speichert keinen Namen, keine Klasse und keinen Standort und sendet nichts ins Internet. ' +
      'Dein Fortschritt bleibt nur in diesem Browser. Sichere ihn regelmäßig als Datei. <a href="#/datenschutz">Mehr erfahren</a></p></div>';
  };

  /* ---------- Startseite ---------- */
  function modulKarte(m) {
    var offen = LT.modulOffen(m), bestes = LT.bestes(m.id), bestanden = LT.bestanden(m.id);
    var status;
    if (m.status !== 'aktiv') status = '<span class="chip">in Vorbereitung</span>';
    else if (!LT.blockOffen(m.block)) status = '<span class="chip">' + icon('schloss') + 'Block gesperrt</span>';
    else if (!offen) status = '<span class="chip">' + icon('schloss') + 'erst ' + esc(LT.fehlendeOrgane(m).join(' + ')) + '</span>';
    else if (bestanden) status = '<span class="chip ok">' + icon('haken') + 'bestanden · ' + bestes + ' %</span>';
    else if (bestes >= 0) status = '<span class="chip">bestes Ergebnis ' + bestes + ' %</span>';
    else status = '<span class="chip gold">neu</span>';
    var inhalt = '<span class="ic" style="background:' + esc(m.farbe) + '">' + icon(m.icon) + '</span>' +
      '<h3>' + esc(m.titel) + '</h3><p class="muted klein">' + esc(m.beschreibung) + '</p><div class="fuss">' + status + '</div>';
    return offen ? '<a class="modul" href="#/modul/' + esc(m.id) + '">' + inhalt + '</a>'
                 : '<div class="modul zu" aria-disabled="true">' + inhalt + '</div>';
  }

  LT.route(/^\/$/, function () {
    var r = LT.rang();
    var fehler = Object.keys(LT.S.falsch).length;
    var html = LT.seitenkopf('Verdauung lernen', null, 'Dein Lernstand') +
      '<section class="karte rangkarte" aria-label="Dein Rang">' +
      '<div><p class="eyebrow">Rang</p><p class="stufe">' + esc(r.name) + '</p></div>' +
      '<p class="muted" style="text-align:right">' + LT.zahl(LT.S.xp) + ' XP' +
      (r.naechster ? '<br><span class="klein">noch ' + LT.zahl(r.naechsterXp - LT.S.xp) + ' XP bis ' + esc(r.naechster) + '</span>' : '') + '</p>' +
      '<div class="balken" role="progressbar" aria-label="Fortschritt zum nächsten Rang" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
      Math.round(r.anteil * 100) + '"><i style="width:' + (r.anteil * 100).toFixed(1) + '%"></i></div></section>' +
      '<section class="modi" aria-label="Übergreifende Übungen">' +
      '<a class="modus" href="#/fehler">' + icon('wiederholen') + '<div><b>Meine Fehler</b><span>' +
      (fehler ? fehler + ' Aufgabe' + (fehler === 1 ? '' : 'n') + ' zum Wiederholen' : 'Zurzeit nichts zu wiederholen') + '</span></div></a>' +
      '<a class="modus" href="#/quiz">' + icon('blitz') + '<div><b>Quiz auf Zeit</b><span>Freiwillig: Wie viele schaffst du in ' + LT.E.quiz_sekunden + ' Sekunden?</span></div></a>' +
      '</section>';
    LT.E.bloecke.forEach(function (b) {
      var offen = LT.blockOffen(b.nr);
      html += '<section aria-labelledby="block-' + b.nr + '"><div class="block-kopf"><h2 id="block-' + b.nr + '">' +
        b.nr + ' · ' + esc(b.titel) + '</h2>' +
        (offen ? '' : '<span class="chip">' + icon('schloss') + 'Bestehe erst alle Module aus Block ' + (b.nr - 1) + '</span>') +
        '</div><div class="module">' + LT.moduleImBlock(b.nr).map(modulKarte).join('') + '</div></section>';
    });
    if (LT.S.laeufe.length && !LT.S.gesichert) {
      html += '<div class="hinweis gold reihe zw"><span>Du hast deinen Spielstand noch nie als Datei gesichert.</span>' +
        '<a class="btn klein" href="#/mehr">Jetzt sichern</a></div>';
    }
    if (!LT.speicherOk) {
      html += '<div class="hinweis nein">Dein Browser erlaubt kein Speichern (z. B. privater Modus). Sichere deinen Spielstand deshalb unbedingt als Datei.</div>';
    }
    LT.zeige(html);
  }, 'start');

  /* ---------- Modulseite ---------- */

  LT.route(/^\/modul\/([^/]+)$/, function (id) {
    var m = LT.modul(id);
    if (!m || !LT.modulOffen(m)) { LT.gehe('/'); return; }
    LT.modulKontext(m.id);
    var laeufe = LT.laeufeVon(m.id);
    var modi = LT.modi.filter(function (d) { return d.verfuegbar(m); });
    LT.zeige(
      LT.seitenkopf(esc(m.titel), { pfad: '/', text: 'Übersicht' }, 'Block ' + m.block + ' · ' + LT.blockTitel(m.block)) +
      '<p>' + esc(m.beschreibung) + '</p>' +
      '<div class="reihe">' +
      (LT.bestanden(m.id) ? '<span class="chip ok">' + icon('haken') + 'bestanden</span>' : '<span class="chip">Bestehen ab ' + LT.E.bestehensgrenze + ' %</span>') +
      (laeufe.length ? '<span class="chip">bestes Ergebnis ' + LT.bestes(m.id) + ' %</span><span class="chip">' + laeufe.length + '× abgeschlossen</span>' : '') +
      '</div>' +
      '<section aria-labelledby="modi-t"><h2 id="modi-t" class="sr-only">Übungen</h2><div class="modi">' +
      modi.map(function (d) {
        return '<a class="modus" href="#/modul/' + esc(m.id) + '/' + d.id + '">' + icon(d.icon) +
          '<div><b>' + esc(d.titel) + '</b><span>' + esc(typeof d.text === 'function' ? d.text(m) : d.text) + '</span></div></a>';
      }).join('') + '</div></section>' +
      '<p class="lies">' + icon('buch') + '<span>Quellen: ' + esc(LT.quelleText(m.quellen.split(';').map(function (s) { return s.trim(); }))) + '</span></p>');
  }, 'start');

  /* ---------- Award-Wand ---------- */
  LT.route(/^\/awards$/, function () {
    var anzahl = Object.keys(LT.S.awards).length;
    LT.zeige(LT.seitenkopf('Deine Awards', null, anzahl + ' von ' + LT.D.awards.length + ' erreicht') +
      '<p class="muted">Tippe einen Award an: Jeder Award verrät dir einen Fachfakt aus den Büchern.</p>' +
      '<div class="wand">' + LT.D.awards.map(function (a) {
        var datum = LT.S.awards[a.id], stand = LT.awardStand(a);
        var geheim = a.geheim && !datum;
        return '<button type="button" class="award' + (datum ? '' : ' zu') + '" data-award="' + esc(a.id) + '">' +
          LT.plakette(geheim ? { form: a.form, farbe1: '#888', farbe2: '#555', icon: 'info' } : a) +
          (datum ? '' : '<span class="schloss">' + icon('schloss') + '</span>') +
          '<span class="n">' + (geheim ? '???' : esc(LT.awardName(a))) + '</span>' +
          (datum ? '<span class="d">' + LT.datum(datum) + '</span>'
                 : (geheim ? '<span class="d">geheim</span>' : '<span class="mini" aria-hidden="true"><i style="width:' + Math.round(stand.f * 100) + '%"></i></span>' +
                   '<span class="sr-only">Fortschritt ' + Math.round(stand.f * 100) + ' Prozent</span>')) +
          '</button>';
      }).join('') + '</div>');
    LT.$$('.award').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = LT.D.awards.filter(function (x) { return x.id === b.getAttribute('data-award'); })[0];
        var datum = LT.S.awards[a.id];
        if (a.geheim && !datum) { LT.dialog('???', '<p>Dieser Award ist geheim. Vielleicht findest du ihn ja zufällig …</p>'); return; }
        LT.dialog(esc(LT.awardName(a)),
          '<div class="feier">' + LT.plakette(a, 'plakette gross' + (datum ? '' : ' grau')) +
          '<p><b>So bekommst du ihn:</b> ' + esc(a.bedingung) + '</p>' +
          (datum ? '<p class="chip ok">erreicht am ' + LT.datum(datum) + '</p>' : '<p class="chip">' + Math.round(LT.awardStand(a).f * 100) + ' % geschafft</p>') +
          (a.fakt ? '<div class="hinweis gold"><p class="eyebrow">Fachfakt</p><p>' + LT.txt(a.fakt, { ohneKlammer: true }) + '</p>' + LT.liesNach(a.quelle) + '</div>' : '') +
          '</div>');
      });
    });
  }, 'awards');

  /* ---------- Glossar ---------- */
  LT.route(/^\/glossar$/, function () {
    var begriffe = Object.keys(LT.D.glossar).sort(function (a, b) { return a.localeCompare(b, 'de'); });
    LT.zeige(LT.seitenkopf('Glossar', null, begriffe.length + ' Fachbegriffe') +
      '<div class="feld"><label for="gsuche">Suchen</label><input type="text" id="gsuche" autocomplete="off" placeholder="z. B. Pylorus oder Magenpförtner"></div>' +
      '<dl class="glossar">' + begriffe.map(function (b) {
        var g = LT.D.glossar[b];
        return '<div class="g-eintrag" data-suche="' + esc((b + ' ' + g.deutsch).toLowerCase()) + '"><dt>' + esc(b) + ' <span class="muted">(' + esc(g.deutsch) + ')</span></dt>' +
          '<dd>' + LT.txt(g.erklaerung, { ohneKlammer: true }) + LT.liesNach(g.quelle) + '</dd></div>';
      }).join('') + '</dl>' + (begriffe.length ? '' : '<p class="muted">Das Glossar wird gerade aufgebaut.</p>'));
    LT.$('#gsuche').addEventListener('input', function (e) {
      var q = e.target.value.trim().toLowerCase();
      LT.$$('.g-eintrag').forEach(function (el) { el.hidden = q && el.getAttribute('data-suche').indexOf(q) < 0; });
    });
  }, 'glossar');
})();

    '<p><b>Android:</b> Die Datei landet im Ordner <i>Downloads</i>. Du findest sie in der App <i>Dateien</i> bzw. <i>Eigene Dateien</i>.</p>' +
    '<p><b>PC / Mac:</b> Die Datei landet im Ordner <i>Downloads</i>. Speichere sie am besten zusätzlich auf einem USB-Stick oder in deinem Schul-Cloudspeicher.</p>' +
    '<p class="muted klein">Tipp: Behalte immer die neueste Datei. Das Datum steht im Dateinamen, z. B. <code>verdauung-spielstand-' + LT.tag() + '.json</code>.</p>' +
    '</div></details>';

  /* ---------- Übersicht „Mehr“ ---------- */
  LT.route(/^\/mehr$/, function () {
    var s = LT.S;
    LT.zeige(LT.seitenkopf('Mehr', null, 'Spielstand & Einstellungen') +
      '<section class="karte stapel" aria-labelledby="ss-t"><h2 id="ss-t">Spielstand</h2>' +
      '<p>Dein Fortschritt wird automatisch in diesem Browser gespeichert. Wenn du den Browserverlauf löschst oder das Gerät wechselst, ist er aber weg. ' +
      'Sichere ihn deshalb regelmäßig als Datei.</p>' +
      '<p class="muted klein">' + (s.gesichert ? 'Zuletzt gesichert: ' + LT.datum(s.gesichert) + ', ' + LT.uhrzeit(s.gesichert) + ' Uhr' : 'Noch nie als Datei gesichert.') + '</p>' +
      '<div class="reihe"><button class="btn primaer" id="export" type="button">' + icon('download') + 'Spielstand speichern</button>' +
      '<a class="btn" href="#/mehr/laden">' + icon('upload') + 'Spielstand laden</a></div>' + ANLEITUNG + '</section>' +
      '<section class="modi" aria-label="Weitere Bereiche">' +
      '<a class="modus" href="#/nachweis">' + icon('auge') + '<div><b>Nachweis für die Lehrkraft</b><span>Rang, Awards und Prüfcode auf einen Blick</span></div></a>' +
      '<a class="modus" href="#/datenschutz">' + icon('schild_ds') + '<div><b>Datenschutz</b><span>Was gespeichert wird und was nicht</span></div></a>' +
      '</section>' +
      '<section class="karte stapel" aria-labelledby="form-t"><h2 id="form-t">Anrede der Ränge</h2><div class="wahl">' +
      [['w', 'weiblich (Praktikantin …)'], ['m', 'männlich (Praktikant …)'], ['n', 'neutral (Praktikant:in …)']].map(function (f) {
        return '<label><input type="radio" name="form" value="' + f[0] + '"' + (s.form === f[0] ? ' checked' : '') + '> ' + f[1] + '</label>';
      }).join('') + '</div></section>' +
      '<section class="karte stapel" aria-labelledby="rs-t"><h2 id="rs-t">Neu anfangen</h2>' +
      '<p class="muted">Löscht deinen gesamten Fortschritt in diesem Browser. Eine gesicherte Datei bleibt erhalten.</p>' +
      '<div><button class="btn gefahr" id="reset" type="button">Fortschritt löschen</button></div></section>' +
      '<p class="muted klein">Version vom ' + LT.datum(LT.D.erstellt) + (LT.D.variante === 'kurs' ? ' · Kursversion' : '') + '</p>');
    LT.$('#export').addEventListener('click', function () {
      LT.exportieren();
      LT.ansage('Spielstand wurde als Datei gespeichert.');
      LT.navigieren();
    });
    LT.$$('input[name=form]').forEach(function (r) {
      r.addEventListener('change', function () { LT.S.form = r.value; LT.speichern(); LT.kopfAktualisieren(); LT.ansage('Anrede geändert.'); });
    });
    LT.$('#reset').addEventListener('click', function () {
      LT.dialog('Wirklich alles löschen?', '<p>Dein Rang, deine XP, Awards und Karteikarten-Fächer werden in diesem Browser gelöscht. Das kann nicht rückgängig gemacht werden.</p>', [
        { text: 'Abbrechen', aktion: function () {} },
        { text: 'Ja, alles löschen', klasse: 'gefahr', aktion: function () { LT.zuruecksetzen(); LT.gehe('/'); } }
      ]);
    });
  }, 'mehr');

  /* ---------- Spielstand laden ---------- */
  LT.route(/^\/mehr\/laden$/, function () {
    var h = LT.zeige(LT.seitenkopf('Spielstand laden', { pfad: LT.S.form ? '/mehr' : '/willkommen', text: 'Zurück' }) +
      '<section class="karte stapel"><p>Wähle deine Spielstand-Datei aus (<code>verdauung-spielstand-….json</code>). ' +
      'Du siehst vorher, was darin steht, und entscheidest dann.</p>' +
      '<div class="feld"><label for="datei">Datei auswählen</label><input type="file" id="datei" accept=".json,application/json"></div>' +
      '<div id="vorschau" aria-live="polite"></div></section>' + ANLEITUNG);
    LT.$('#datei', h).addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var leser = new FileReader();
      leser.onload = function () { vorschau(LT.dateiPruefen(String(leser.result))); };
      leser.readAsText(f);
    });
  }, 'mehr');

  function vorschau(erg) {
    var ziel = LT.$('#vorschau');
    if (!erg.ok) { ziel.innerHTML = '<div class="hinweis nein">' + esc(erg.meldung) + '</div>'; return; }
    var d = erg.daten, aktuell = LT.S;
    var aelter = aktuell.laeufe.length && new Date(erg.gespeichert) < new Date(aktuell.geaendert);
    ziel.innerHTML = '<div class="karte flach stapel"><h2>Vorschau</h2><table class="liste"><tbody>' +
      '<tr><th scope="row">Gespeichert am</th><td>' + LT.datum(erg.gespeichert) + ', ' + LT.uhrzeit(erg.gespeichert) + ' Uhr</td></tr>' +
      '<tr><th scope="row">Rang</th><td>' + esc(rangName(d)) + ' (' + LT.zahl(d.xp) + ' XP)</td></tr>' +
      '<tr><th scope="row">Awards</th><td>' + Object.keys(d.awards).length + '</td></tr>' +
      '<tr><th scope="row">Abgeschlossene Modulchecks</th><td>' + d.laeufe.length + '</td></tr></tbody></table>' +
      (aelter ? '<div class="hinweis nein"><b>Achtung:</b> Diese Datei ist älter als dein aktueller Stand in diesem Browser (' +
        LT.datum(aktuell.geaendert) + ', ' + LT.uhrzeit(aktuell.geaendert) + ' Uhr). Wenn du sie lädst, geht neuerer Fortschritt verloren.</div>' : '') +
      (aktuell.laeufe.length ? '<p class="muted klein">Dein aktueller Stand: ' + esc(LT.rang().name) + ', ' + LT.zahl(aktuell.xp) + ' XP, ' +
        Object.keys(aktuell.awards).length + ' Awards. Er wird ersetzt.</p>' : '') +
      '<div class="reihe"><button class="btn primaer" id="uebernehmen" type="button">Spielstand übernehmen</button>' +
      '<button class="btn" id="abbrechen" type="button">Abbrechen</button></div></div>';
    LT.$('#uebernehmen').addEventListener('click', function () {
      LT.uebernehmen(d);
      LT.awardsPruefen(); LT.neueAwards = [];
      LT.S.rangGesehen = Math.max(LT.S.rangGesehen || 0, LT.rang().stufe); LT.speichern();
      LT.ansage('Spielstand geladen.');
      LT.gehe('/');
    });
    LT.$('#abbrechen').addEventListener('click', function () { ziel.innerHTML = ''; LT.$('#datei').value = ''; });
  }

  /* ---------- Erinnerung ans Sichern (nach jedem Modulabschluss) ---------- */
  LT.sichernErinnerung = function () {
    return '<div class="hinweis gold stapel"><p><b>Denk ans Sichern!</b> Speichere deinen Spielstand als Datei, damit nichts verloren geht.</p>' +
      '<div><button class="btn klein" type="button" data-export>' + icon('download') + 'Spielstand speichern</button></div></div>';
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-export]');
    if (b) { LT.exportieren(); b.outerHTML = '<span class="chip ok">' + icon('haken') + 'gespeichert</span>'; }
  });

  /* ---------- Nachweis für die Lehrkraft (nur Bildschirm) ---------- */
  LT.route(/^\/nachweis$/, function () {
    var s = LT.S, r = LT.rang();
    var erreichte = LT.D.awards.filter(function (a) { return s.awards[a.id]; })
      .sort(function (a, b) { return s.awards[a.id] < s.awards[b.id] ? -1 : 1; });
    var module = LT.D.module.filter(function (m) { return LT.laeufeVon(m.id).length; });
    LT.zeige(LT.seitenkopf('Nachweis', { pfad: '/mehr', text: 'Mehr' }, 'Für die Lehrkraft') +
      '<section class="karte stapel nachweis">' +
      '<div class="reihe zw"><div><p class="eyebrow">Rang</p><p class="stufe" style="font-family:var(--f-display);font-size:1.6rem;font-weight:700">' + esc(r.name) + '</p>' +
      '<p class="muted">' + LT.zahl(s.xp) + ' XP</p></div>' +
      '<div style="text-align:right"><p class="eyebrow">Prüfcode</p><p class="pruefcode">' + LT.pruefcode() + '</p>' +
      '<p class="muted klein">Stand: ' + LT.datum(LT.iso()) + ', ' + LT.uhrzeit(LT.iso()) + ' Uhr</p></div></div>' +
      '<h2>Awards (' + erreichte.length + ')</h2>' +
      (erreichte.length ? '<table class="liste"><thead><tr><th>Award</th><th>erreicht am</th></tr></thead><tbody>' +
        erreichte.map(function (a) { return '<tr><td>' + esc(LT.awardName(a)) + '</td><td>' + LT.datum(s.awards[a.id]) + '</td></tr>'; }).join('') +
        '</tbody></table>' : '<p class="muted">Noch keine Awards.</p>') +
      '<h2>Module</h2>' +
      (module.length ? '<table class="liste"><thead><tr><th>Modul</th><th>bestes Ergebnis</th><th>Durchgänge</th></tr></thead><tbody>' +
        module.map(function (m) {
          return '<tr><td>' + esc(m.titel) + '</td><td>' + LT.bestes(m.id) + ' %' + (LT.bestanden(m.id) ? ' ✓' : '') + '</td><td>' + LT.laeufeVon(m.id).length + '</td></tr>';
        }).join('') + '</tbody></table>' : '<p class="muted">Noch kein Modulcheck abgeschlossen.</p>') +
      '<p class="muted klein">Der Prüfcode wird aus Rang, Awards und Modulergebnissen berechnet. Ändert sich etwas daran, ändert sich auch der Code.</p>' +
      '</section>');
  }, 'mehr');

  /* ---------- Datenschutz ---------- */
  LT.route(/^\/datenschutz$/, function () {
    LT.zeige(LT.seitenkopf('Datenschutz', { pfad: LT.S.form ? '/mehr' : '/willkommen', text: 'Zurück' }) +
      '<section class="karte stapel">' +
      '<h2>Kurz gesagt</h2><ul>' +
      '<li>Du brauchst <b>kein Konto</b> und gibst <b>keinen Namen, keine Klasse und keinen Standort</b> an.</li>' +
      '<li>Das Lerntool <b>sendet nichts ins Internet</b>. Es lädt keine Schriften, keine Bilder und keine Statistik-Dienste nach.</li>' +
      '<li>Dein Fortschritt liegt <b>nur in diesem Browser</b> (localStorage) und in Dateien, die du selbst speicherst.</li>' +
      '<li><b>Texte, die du in Operatoraufgaben schreibst, werden nie gespeichert.</b> Sie sind weg, sobald du die Aufgabe verlässt.</li>' +
      '<li>Uhrzeit und Datum für manche Awards werden nur auf deinem Gerät geprüft.</li></ul>' +
      '<h2>Was genau gespeichert wird</h2><ul>' +
      '<li>deine gewählte Anrede (weiblich / männlich / neutral)</li>' +
      '<li>XP, Ergebnisse der Modulchecks (Datum, Uhrzeit, Prozent)</li>' +
      '<li>Fächer deiner Karteikarten, Kennungen falsch beantworteter Aufgaben („Meine Fehler“)</li>' +
      '<li>erreichte Awards mit Datum, Übungstage, Bestwerte in den Spielen</li></ul>' +
      '<p class="muted">Alles löschen kannst du unter „Mehr → Neu anfangen“.</p></section>');
  }, 'mehr');
})();

/* ---- js/90-start.js ---- */
/* Start: Thema (hell/dunkel), Navigation, erste Anzeige */
(function () {
  var THEMA = 'verdauung-thema';
  function themaSetzen(t) {
    if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    var dunkel = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var b = LT.$('#thema-btn');
    b.innerHTML = LT.icon(dunkel ? 'sonne' : 'mond');
    b.setAttribute('aria-label', dunkel ? 'Hellen Modus einschalten' : 'Dunklen Modus einschalten');
  }
  var gespeichert = null;
  try { gespeichert = localStorage.getItem(THEMA); } catch (e) { /* egal */ }
  themaSetzen(gespeichert);
  LT.$('#thema-btn').addEventListener('click', function () {
    var dunkel = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var neu = dunkel ? 'light' : 'dark';
    try { localStorage.setItem(THEMA, neu); } catch (e) { /* egal */ }
    themaSetzen(neu);
  });

  LT.$$('.leiste .ni').forEach(function (s) { s.innerHTML = LT.icon(s.getAttribute('data-icon')); });

  // Klick auf den abgedunkelten Hintergrund schließt den Dialog
  LT.$('#dialog').addEventListener('click', function (e) { if (e.target === this) LT.dialogZu(); });

  LT.navigieren();
})();

</script>
</body>
</html>
