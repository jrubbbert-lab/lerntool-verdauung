-choice","quelle":["i-care S. 195"],"erklaerung":"","id":"mundhoehle-sc-parotis","frage":"Wie heißt die Ohrspeicheldrüse in der Fachsprache?","optionen":[{"text":"Parotis","richtig":true},{"text":"Pankreas","richtig":false},{"text":"Pulpa","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 200"],"erklaerung":"","id":"mundhoehle-sc-schmelz","frage":"Welche Substanz ist die härteste im ganzen Körper?","optionen":[{"text":"der Zahnschmelz","richtig":true},{"text":"das Zahnfleisch","richtig":false},{"text":"das Zahnmark","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 199"],"erklaerung":"Backen- und Mahlzähne kauen und zermahlen die Nahrung.","id":"mundhoehle-sc-schneide","frage":"Mit welchen Zähnen wird feste Nahrung abgebissen?","optionen":[{"text":"mit den Schneidezähnen","richtig":true},{"text":"mit den Mahlzähnen","richtig":false},{"text":"mit den Backenzähnen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-sc-karies","frage":"Wodurch entsteht [[Karies]]?","optionen":[{"text":"Bakterien bauen Zucker ab und bilden Säure, die den Zahnschmelz angreift.","richtig":true},{"text":"Der Speichel löst den Zahnschmelz auf.","richtig":false},{"text":"Zu viel Kauen nutzt die Zähne ab.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 202"],"erklaerung":"","id":"mundhoehle-sc-kehldeckel","frage":"Was verschließt beim Schlucken den Eingang des Kehlkopfs?","optionen":[{"text":"der Kehldeckel ([[Epiglottis]])","richtig":true},{"text":"das Zäpfchen ([[Uvula]])","richtig":false},{"text":"die Zunge","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-sc-gaumen","frage":"Was trennt der Gaumen voneinander?","optionen":[{"text":"die Mundhöhle von der Nasenhöhle","richtig":true},{"text":"die Speiseröhre vom Magen","richtig":false},{"text":"die Zunge von den Zähnen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 203"],"erklaerung":"","id":"mundhoehle-sc-speiseroehre","frage":"Wohin transportiert die Speiseröhre die Nahrung?","optionen":[{"text":"in den Magen","richtig":true},{"text":"in die Luftröhre","richtig":false},{"text":"in den Dünndarm","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 204"],"erklaerung":"","id":"mundhoehle-sc-peristaltik","frage":"Wie wird die Nahrung in der Speiseröhre weitertransportiert?","optionen":[{"text":"durch wellenförmige Muskelbewegungen ([[Peristaltik]])","richtig":true},{"text":"nur durch die Schwerkraft","richtig":false},{"text":"durch die Atmung","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 204"],"erklaerung":"","id":"mundhoehle-sc-sodbrennen","frage":"Was passiert bei Sodbrennen?","optionen":[{"text":"Magensäure fließt in die Speiseröhre zurück.","richtig":true},{"text":"Speichel fließt in die Luftröhre.","richtig":false},{"text":"Galle fließt in den Mund.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-sc-kiefer","frage":"Welcher Kiefer bewegt sich beim Kauen?","optionen":[{"text":"nur der Unterkiefer","richtig":true},{"text":"nur der Oberkiefer","richtig":false},{"text":"beide Kiefer gleich stark","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 353"],"erklaerung":"Eine länger bestehende Schluckstörung sollte immer abgeklärt werden.","id":"mundhoehle-sc-dysphagie","frage":"Was bedeutet [[Dysphagie]]?","optionen":[{"text":"Schluckstörung","richtig":true},{"text":"Sodbrennen","richtig":false},{"text":"Zahnfleischentzündung","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 195, 197"],"erklaerung":"","id":"mundhoehle-mc-speichel","frage":"Welche Aufgaben hat der Speichel?","optionen":[{"text":"Er macht die Nahrung gleitfähig.","richtig":true},{"text":"Er beginnt mit der Spaltung der Stärke.","richtig":true},{"text":"Er schützt die Mundschleimhaut vor Austrocknung.","richtig":true},{"text":"Er spaltet Eiweiße.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 195"],"erklaerung":"","id":"mundhoehle-mc-druesen","frage":"Welche gehören zu den großen Speicheldrüsen?","optionen":[{"text":"Ohrspeicheldrüse","richtig":true},{"text":"Unterkieferspeicheldrüse","richtig":true},{"text":"Unterzungenspeicheldrüse","richtig":true},{"text":"Bauchspeicheldrüse","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 198"],"erklaerung":"","id":"mundhoehle-mc-zunge","frage":"Woran ist die Zunge beteiligt?","optionen":[{"text":"am Kauen","richtig":true},{"text":"am Schlucken","richtig":true},{"text":"am Sprechen","richtig":true},{"text":"am Schmecken","richtig":true},{"text":"an der Bildung von Magensaft","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-mc-karies","frage":"Was hilft, Karies vorzubeugen?","optionen":[{"text":"häufiges Zähneputzen","richtig":true},{"text":"wenig Süßigkeiten und zuckerhaltige Getränke","richtig":true},{"text":"regelmäßige Besuche beim Zahnarzt","richtig":true},{"text":"viel Limonade trinken","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 202"],"erklaerung":"","id":"mundhoehle-mc-schlucken","frage":"Was passiert beim Schlucken?","optionen":[{"text":"Der weiche Gaumen verschließt den Übergang zur Nasenhöhle.","richtig":true},{"text":"Der Kehldeckel verschließt den Kehlkopf.","richtig":true},{"text":"Der obere Schließmuskel der Speiseröhre öffnet sich.","richtig":true},{"text":"Die Luftröhre öffnet sich weit.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 204"],"erklaerung":"","id":"mundhoehle-mc-reflux","frage":"Was kann Sodbrennen begünstigen oder verstärken?","optionen":[{"text":"starkes Übergewicht","richtig":true},{"text":"eine Schwangerschaft","richtig":true},{"text":"das Liegen","richtig":true},{"text":"aufrechtes Sitzen","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 199"],"erklaerung":"","id":"mundhoehle-zu-zaehne","frage":"Ordne jeder Zahnart ihre Aufgabe zu.","paare":[{"links":"Schneidezähne","rechts":"Nahrung abbeißen"},{"links":"Eckzähne","rechts":"Nahrung festhalten und abreißen"},{"links":"Mahlzähne","rechts":"Nahrung zermahlen"}]},{"typ":"zuordnung","quelle":["i-care S. 199–200"],"erklaerung":"","id":"mundhoehle-zu-zahn","frage":"Ordne jedem Teil des Zahns seine Beschreibung zu.","paare":[{"links":"Zahnkrone","rechts":"im Mund sichtbar"},{"links":"Zahnwurzel","rechts":"im Kieferknochen verankert"},{"links":"Zahnschmelz","rechts":"überzieht die Krone"},{"links":"[[Pulpa]]","rechts":"Zahnmark mit Nerven und Gefäßen"}]},{"typ":"zuordnung","quelle":["i-care S. 199, 201–203"],"erklaerung":"","id":"mundhoehle-zu-begriffe","frage":"Ordne jedem Fachbegriff den deutschen Namen zu.","paare":[{"links":"[[Ösophagus]]","rechts":"Speiseröhre"},{"links":"[[Palatum]]","rechts":"Gaumen"},{"links":"[[Gingiva]]","rechts":"Zahnfleisch"},{"links":"[[Epiglottis]]","rechts":"Kehldeckel"}]},{"typ":"reihenfolge","quelle":["i-care S. 202, 204"],"erklaerung":"","id":"mundhoehle-rf-schlucken","frage":"Bring die Schritte des Schluckens in die richtige Reihenfolge.","schritte":["Die Zunge schiebt den Bissen in Richtung Rachen.","Der Schluckreflex wird ausgelöst.","Der Kehldeckel verschließt den Kehlkopf.","Der Bissen gelangt in die Speiseröhre.","Die Speiseröhre transportiert ihn in den Magen."]},{"typ":"reihenfolge","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-rf-kauen","frage":"Bring die Vorgänge vom Abbeißen bis zum Schlucken in die richtige Reihenfolge.","schritte":["Schneide- und Eckzähne trennen den Bissen ab.","Die Zunge schiebt die Nahrung zu den Backenzähnen.","Die Mahlzähne zermahlen die Nahrung zu einem feinen Brei.","Der Speichel macht den Brei gleitfähig.","Der Brei wird heruntergeschluckt."]},{"typ":"reihenfolge","quelle":["i-care S. 199"],"erklaerung":"","id":"mundhoehle-rf-zahn","frage":"Ordne die Teile des Zahns von oben (im Mund) nach unten (im Kiefer).","schritte":["Zahnkrone","Zahnhals","Zahnwurzel"]},{"typ":"lückentext","quelle":["i-care S. 195, 197"],"erklaerung":"","id":"mundhoehle-lt-speichel","text":"Der Speichel enthält das Enzym {{Amylase}}. Es beginnt, die {{Stärke}} in der Nahrung zu spalten."},{"typ":"lückentext","quelle":["i-care S. 199–200"],"erklaerung":"","id":"mundhoehle-lt-zahn","text":"Der im Mund sichtbare Teil des Zahns heißt {{Zahnkrone|Krone}}. Sie ist vom {{Zahnschmelz|Schmelz}} überzogen, der härtesten Substanz des Körpers."},{"typ":"lückentext","quelle":["i-care S. 202"],"erklaerung":"","id":"mundhoehle-lt-schlucken","text":"Beim Schlucken verschließt der {{Kehldeckel|Epiglottis}} den Kehlkopf. So gelangt die Nahrung in die {{Speiseröhre|Ösophagus}} und nicht in die Luftröhre."},{"typ":"fehlerfahndung","quelle":["i-care S. 197, 200, 202, 204","MKK S. 353"],"erklaerung":"Der Speichel enthält Amylase; Pepsin wirkt im Magen. Den Kehlkopf verschließt der Kehldeckel. Sodbrennen verstärkt sich im Liegen, deshalb soll man sich nach dem Essen nicht sofort hinlegen. Die härteste Substanz des Körpers ist der Zahnschmelz.","id":"mundhoehle-ff-essen","titel":"Robartinas Lernnotiz: Mund und Speiseröhre","bericht":"Heute habe ich Herrn T. beim Essen begleitet und mir danach Notizen gemacht. Im Speichel ist das Enzym Pepsin, das die Stärke spaltet. Beim Schlucken verschließt das Zäpfchen den Kehlkopf, damit nichts in die Luftröhre gelangt. Herr T. hat oft Sodbrennen. Ich habe ihm geraten, sich nach dem Essen sofort flach hinzulegen. Der härteste Stoff im Körper ist übrigens das Zahnfleisch.","fehler":[{"links":"Pepsin","rechts":"amylase","loesung":"Amylase"},{"links":"das Zäpfchen","rechts":"kehldeckel|epiglottis","loesung":"der Kehldeckel (Epiglottis)"},{"links":"sofort flach hinzulegen","rechts":"nicht|erhöht|aufrecht|sitzen","loesung":"nicht sofort hinzulegen bzw. den Oberkörper erhöht zu lagern"},{"links":"das Zahnfleisch","rechts":"zahnschmelz|schmelz","loesung":"der Zahnschmelz"}]}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 193"],"erklaerung":"","id":"mundhoehle-kk-406e4e","vorne":"Welche Aufgaben hat die Mundhöhle bei der Verdauung?","hinten":"Die Speisen werden zerkleinert, mit Speichel vermischt und so auf die Verdauung vorbereitet. Außerdem wird geprüft, ob die Nahrung genießbar ist."},{"typ":"karteikarte","quelle":["i-care S. 195, 197"],"erklaerung":"","id":"mundhoehle-kk-ff7711","vorne":"Welche Aufgaben hat der Mundspeichel?","hinten":"Er feuchtet die Nahrung an und macht sie gleitfähig, beginnt mit der Spaltung der Stärke, ist wichtig für die Zahngesundheit und schützt die Mundschleimhaut vor Austrocknung."},{"typ":"karteikarte","quelle":["i-care S. 195"],"erklaerung":"","id":"mundhoehle-kk-9d3a1e","vorne":"Welche drei großen Speicheldrüsen gibt es?","hinten":"Die Ohrspeicheldrüse ([[Parotis]]), die Unterkieferspeicheldrüse und die Unterzungenspeicheldrüse."},{"typ":"karteikarte","quelle":["i-care S. 197"],"erklaerung":"","id":"mundhoehle-kk-88ddad","vorne":"Welches Enzym enthält der Speichel, und was bewirkt es?","hinten":"Die [[Amylase]]. Sie spaltet Malzzucker von der Stärke ab und leitet so die Verdauung ein."},{"typ":"karteikarte","quelle":["i-care S. 197"],"erklaerung":"","id":"mundhoehle-kk-33b120","vorne":"Welche Bestandteile des Speichels schützen vor Krankheitserregern?","hinten":"Das Enzym Lysozym und Antikörper. Sie können Mikroorganismen unschädlich machen."},{"typ":"karteikarte","quelle":["i-care S. 198"],"erklaerung":"","id":"mundhoehle-kk-bb337f","vorne":"Welche Aufgaben hat die Zunge?","hinten":"Sie bewegt die Nahrung beim Kauen, befördert sie beim Schlucken in Richtung Rachen, hilft beim Sprechen und dient dem Schmecken."},{"typ":"karteikarte","quelle":["i-care S. 198"],"erklaerung":"","id":"mundhoehle-kk-12adb1","vorne":"Welche Geschmacksqualitäten kann die Zunge wahrnehmen?","hinten":"Süß, sauer, salzig, bitter und umami."},{"typ":"karteikarte","quelle":["i-care S. 199"],"erklaerung":"","id":"mundhoehle-kk-1ab6cd","vorne":"Welche vier Zahnarten gibt es?","hinten":"Schneidezähne, Eckzähne, Backenzähne und Mahlzähne."},{"typ":"karteikarte","quelle":["i-care S. 199"],"erklaerung":"","id":"mundhoehle-kk-332a31","vorne":"Aus welchen drei Teilen besteht ein Zahn?","hinten":"Aus der Zahnkrone (im Mund sichtbar), dem Zahnhals und der Zahnwurzel (im Kieferknochen verankert)."},{"typ":"karteikarte","quelle":["i-care S. 200"],"erklaerung":"","id":"mundhoehle-kk-0d2f7e","vorne":"Woraus besteht ein Zahn?","hinten":"Aus Zahnbein ([[Dentin]]). Die Krone ist vom Zahnschmelz überzogen, der härtesten Substanz des Körpers. Im Inneren liegt das Zahnmark ([[Pulpa]])."},{"typ":"karteikarte","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-kk-328040","vorne":"Wie entsteht [[Karies]]?","hinten":"Bakterien im Mund bauen Zucker ab und bilden dabei Säure. Die Säure greift den Zahnschmelz an."},{"typ":"karteikarte","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-kk-367685","vorne":"Wie beugt man Karies vor?","hinten":"Durch häufiges Zähneputzen, wenig Süßigkeiten und zuckerhaltige Getränke sowie regelmäßige Besuche beim Zahnarzt."},{"typ":"karteikarte","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-kk-e9644c","vorne":"Welche Aufgabe hat der Gaumen ([[Palatum]])?","hinten":"Er trennt die Mundhöhle von der Nasenhöhle und ist beim Kauen ein Widerlager für die Zunge."},{"typ":"karteikarte","quelle":["i-care S. 201–202"],"erklaerung":"","id":"mundhoehle-kk-1dac00","vorne":"Was ist der Unterschied zwischen hartem und weichem Gaumen?","hinten":"Der harte Gaumen hat eine knöcherne Grundlage. Der weiche Gaumen besteht aus Muskulatur, Fett- und Bindegewebe und ist deshalb beweglich."},{"typ":"karteikarte","quelle":["i-care S. 202"],"erklaerung":"","id":"mundhoehle-kk-dc9939","vorne":"Was verhindert beim Schlucken, dass Nahrung in die Luftröhre gelangt?","hinten":"Der Kehldeckel ([[Epiglottis]]) legt sich auf den Eingang des Kehlkopfs und verschließt ihn."},{"typ":"karteikarte","quelle":["i-care S. 202"],"erklaerung":"","id":"mundhoehle-kk-677730","vorne":"Was verhindert beim Schlucken, dass Nahrung in die Nase gelangt?","hinten":"Der weiche Gaumen (das Gaumensegel) verschließt den Übergang zur Nasenhöhle."},{"typ":"karteikarte","quelle":["i-care S. 203"],"erklaerung":"","id":"mundhoehle-kk-f1c89e","vorne":"Welche Aufgabe hat die Speiseröhre ([[Ösophagus]])?","hinten":"Sie transportiert die geschluckte Nahrung aus dem Rachen in den Magen."},{"typ":"karteikarte","quelle":["i-care S. 204"],"erklaerung":"","id":"mundhoehle-kk-a4d20f","vorne":"Wie wird die Nahrung durch die Speiseröhre transportiert?","hinten":"Ring- und Längsmuskulatur spannen sich abwechselnd an. So entsteht eine Wellenbewegung in Richtung Magen, die [[Peristaltik]]."},{"typ":"karteikarte","quelle":["i-care S. 204"],"erklaerung":"","id":"mundhoehle-kk-6ffbfa","vorne":"Welche Aufgabe hat der untere Schließmuskel der Speiseröhre?","hinten":"Er verhindert, dass Magensaft in die Speiseröhre zurückfließt."},{"typ":"karteikarte","quelle":["i-care S. 204"],"erklaerung":"","id":"mundhoehle-kk-d303e8","vorne":"Wie entsteht Sodbrennen?","hinten":"Der untere Schließmuskel der Speiseröhre ist geschwächt, und Magensäure fließt in die Speiseröhre zurück ([[Reflux]]). Die Beschwerden verstärken sich im Liegen."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 202"],"erklaerung":"","id":"mundhoehle-op-schlucken","operator":"beschreiben","afb":"I","fall":"Robartina hilft einer Patientin beim Essen. Alaa beobachtet das und fragt: „Wie schafft der Körper es eigentlich, dass das Essen nicht in die Luftröhre oder in die Nase rutscht?“","auftrag":"Beschreibe den Schluckvorgang.","mindestlaenge":250,"kriterien":["Ich beschreibe, dass die Zunge den Bissen in Richtung Rachen schiebt und der Schluckreflex ausgelöst wird.","Ich nenne den weichen Gaumen, der den Übergang zur Nasenhöhle verschließt.","Ich nenne den Kehldeckel, der den Kehlkopf verschließt.","Ich beschreibe, dass der Bissen in die Speiseröhre gelangt."],"musterloesung":"Die **Zunge** schiebt einen Teil des zerkauten Speisebreis in Richtung Rachen. Dadurch wird der **Schluckreflex** ausgelöst. Der **weiche Gaumen** verschließt den Übergang zur Nasenhöhle, sodass keine Nahrung in die Nase gelangt. Der Kehlkopf wird nach oben gezogen, und der **Kehldeckel** legt sich auf den Eingang des Kehlkopfs. So kann die Nahrung nicht in die Luftröhre gelangen. Der obere Schließmuskel der Speiseröhre öffnet sich, und der Bissen wird in die **Speiseröhre** geschoben."},{"typ":"operator","quelle":["i-care S. 201"],"erklaerung":"","id":"mundhoehle-op-karies","operator":"erläutern","afb":"II","fall":"Robartinas kleiner Bruder nascht gern und putzt sich ungern die Zähne. Er sagt: „Zucker ist doch weich. Wie soll der meine harten Zähne kaputt machen?“","auftrag":"Erläutere, wie Karies entsteht und wie man ihr vorbeugen kann.","mindestlaenge":300,"kriterien":["Ich erkläre, dass Bakterien im Mund Zucker abbauen und dabei Säure bilden.","Ich erkläre, dass die Säure den Zahnschmelz angreift.","Ich nenne das Zähneputzen als Vorbeugung.","Ich nenne weniger Süßigkeiten und zuckerhaltige Getränke.","Ich nenne regelmäßige Besuche beim Zahnarzt."],"musterloesung":"Nicht der Zucker selbst schädigt die Zähne. Im Mund kommen **Bakterien** vor, die Zucker abbauen und dabei **Säure** bilden. Diese Säure greift den **Zahnschmelz** an und löst Mineralien heraus. Gelingt es nicht, die Schädigung aufzuhalten, entsteht Karies. Schmerzen treten erst auf, wenn auch das Zahnbein betroffen ist. **Vorbeugen** kann man durch häufiges **Zähneputzen**, weil so die zuckerhaltigen Beläge entfernt werden und den Bakterien die „Nahrung“ fehlt. Außerdem sollte man möglichst auf **Süßigkeiten und zuckerhaltige Getränke** verzichten und regelmäßig zum **Zahnarzt** gehen."},{"typ":"operator","quelle":["i-care S. 204","MKK S. 353"],"erklaerung":"","id":"mundhoehle-op-reflux","operator":"beurteilen","afb":"III","fall":"Frau L. klagt über häufiges Sodbrennen, besonders nachts. Sie isst abends spät und reichlich und legt sich danach gleich ins Bett. Ihrer Zimmernachbarin sagt sie: „Dagegen kann man nichts machen, das ist eben so.“ Robartina hört das Gespräch.","auftrag":"Beurteile die Aussage von Frau L. mithilfe der Informationen aus den Büchern.","mindestlaenge":350,"kriterien":["Ich erkläre, wie Sodbrennen entsteht (Rückfluss von Magensäure in die Speiseröhre).","Ich erkläre, dass sich die Beschwerden im Liegen verstärken.","Ich nenne Verhaltensänderungen (keine späten Mahlzeiten, nach dem Essen nicht sofort hinlegen, Oberkörper erhöht).","Ich nenne mögliche Folgen eines häufigen Rückflusses (Entzündung der Speiseröhre).","Ich komme zu einem begründeten Urteil."],"musterloesung":"Sodbrennen entsteht, wenn der untere Schließmuskel der Speiseröhre nicht richtig schließt und **Magensäure in die Speiseröhre zurückfließt** (Reflux). Die Beschwerden **verstärken sich im Liegen**. Frau L. isst spät und legt sich sofort hin – beides begünstigt ihre Beschwerden. Laut Buch können bei leichten Beschwerden schon **Verhaltensänderungen** helfen: keine Mahlzeiten am späten Abend, nach dem Essen nicht sofort hinlegen, mit erhöhtem Oberkörper liegen und unverträgliche Speisen meiden. Fließt der Magensaft häufig zurück, kann sich die Schleimhaut der Speiseröhre **entzünden** (Refluxösophagitis). **Urteil:** Die Aussage von Frau L. ist falsch. Sie kann selbst viel gegen ihr Sodbrennen tun und sollte die Beschwerden ärztlich abklären lassen, damit keine Entzündung entsteht."}],"status":"aktiv"},{"id":"magen","titel":"Magen","block":2,"nr":2,"organ":"","beschreibung":"Magensaft, Magenschleimhaut und Magenentleerung.","quellen":"i-care S. 205–210; MKK S. 353–357","icon":"magen","farbe":"#2A473B","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 207"],"erklaerung":"Die Belegzellen bilden die Salzsäure. Die Hauptzellen bilden Pepsinogen, die Nebenzellen Schleim.","id":"magen-sc-belegzellen","frage":"Welche Zellen der Magendrüsen bilden die Salzsäure?","optionen":[{"text":"Hauptzellen","richtig":false},{"text":"Belegzellen","richtig":true},{"text":"Nebenzellen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-sc-lage","frage":"Wo liegt der Magen?","optionen":[{"text":"im linken Oberbauch","richtig":true},{"text":"im rechten Oberbauch","richtig":false},{"text":"im rechten Unterbauch","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 354"],"erklaerung":"Die Kardia ist der Mageneingang, der Fundus der Magengrund.","id":"magen-sc-pylorus","frage":"Wie heißt der Abschnitt, mit dem der Magen in den Dünndarm übergeht?","optionen":[{"text":"[[Pylorus]]","richtig":true},{"text":"[[Kardia]]","richtig":false},{"text":"[[Fundus]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 205"],"erklaerung":"Weil er so sauer ist, tötet der Magensaft auch Keime ab.","id":"magen-sc-sauer","frage":"Wie ist der Magensaft beschaffen?","optionen":[{"text":"sehr sauer","richtig":true},{"text":"neutral","richtig":false},{"text":"basisch","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-sc-pepsinogen","frage":"Wodurch wird Pepsinogen in das aktive Enzym [[Pepsin]] umgewandelt?","optionen":[{"text":"durch die Salzsäure","richtig":true},{"text":"durch den Schleim","richtig":false},{"text":"durch den Intrinsic Factor","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 209"],"erklaerung":"Dadurch wird die Magenschleimhaut geschont, z. B. bei einer Magenschleimhautentzündung.","id":"magen-sc-ppi","frage":"Was bewirken Protonenpumpenhemmer?","optionen":[{"text":"Es wird weniger Salzsäure gebildet.","richtig":true},{"text":"Es wird mehr Salzsäure gebildet.","richtig":false},{"text":"Der Magen entleert sich schneller.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 205, 240"],"erklaerung":"Achtung Verwechslungsgefahr: Die fetthaltige Lymphe heißt [[Chylus]].","id":"magen-sc-chymus","frage":"Was ist der [[Chymus]]?","optionen":[{"text":"der Speisebrei aus Nahrung und Magensaft","richtig":true},{"text":"der Schleim der Nebenzellen","richtig":false},{"text":"die Galle","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 355"],"erklaerung":"Fettreiche Speisen passieren den Magen am langsamsten.","id":"magen-sc-verweildauer","frage":"Welche Speisen verlassen den Magen am schnellsten?","optionen":[{"text":"kohlenhydratreiche Speisen, z. B. das Frühstücksbrötchen","richtig":true},{"text":"fettreiche Speisen, z. B. die Weihnachtsgans","richtig":false},{"text":"Alle Speisen bleiben gleich lange im Magen.","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-sc-entleerung","frage":"Wie wird der Magen entleert?","optionen":[{"text":"in kleinen Portionen: Der Pylorus öffnet sich immer wieder kurz.","richtig":true},{"text":"auf einmal, sobald der Magen voll ist","richtig":false},{"text":"nur über Nacht","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-sc-intrinsic","frage":"Wofür ist der Intrinsic Factor notwendig?","optionen":[{"text":"für die Aufnahme von Vitamin B12","richtig":true},{"text":"für die Aufnahme von Vitamin C","richtig":false},{"text":"für die Bildung des Magenschleims","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-sc-helicobacter","frage":"Was ist laut Buch die wichtigste Ursache für Magengeschwüre?","optionen":[{"text":"das Bakterium Helicobacter pylori","richtig":true},{"text":"zu wenig Salzsäure","richtig":false},{"text":"zu wenig Vitamin B12","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-sc-falten","frage":"Wozu dienen die Falten der Magenschleimhaut?","optionen":[{"text":"Sie ermöglichen die Dehnung der Magenwand.","richtig":true},{"text":"Sie bilden die Salzsäure.","richtig":false},{"text":"Sie nehmen die Nährstoffe auf.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-mc-salzsaeure","frage":"Welche Aufgaben hat die Salzsäure des Magensafts?","optionen":[{"text":"Sie wandelt Pepsinogen in Pepsin um.","richtig":true},{"text":"Sie verändert die Struktur der Eiweiße.","richtig":true},{"text":"Sie wirkt gegen Bakterien.","richtig":true},{"text":"Sie spaltet Fette.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 205, 210"],"erklaerung":"Die Galle bildet die Leber, die Nährstoffe werden hauptsächlich im Dünndarm aufgenommen.","id":"magen-mc-aufgaben","frage":"Welche Aufgaben hat der Magen?","optionen":[{"text":"Er vermischt die Nahrung mit Magensaft zum Speisebrei.","richtig":true},{"text":"Er speichert den Speisebrei und gibt ihn portionsweise weiter.","richtig":true},{"text":"Sein saurer Magensaft tötet Keime ab.","richtig":true},{"text":"Er bildet die Galle.","richtig":false},{"text":"Er nimmt den Großteil der Nährstoffe ins Blut auf.","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 354–355"],"erklaerung":"","id":"magen-mc-magensaft","frage":"Welche Bestandteile enthält der Magensaft?","optionen":[{"text":"Salzsäure","richtig":true},{"text":"Pepsinogen bzw. Pepsin","richtig":true},{"text":"Schleim","richtig":true},{"text":"Galle","richtig":false},{"text":"Insulin","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-mc-schutz","frage":"Was schützt die Magenschleimhaut vor der Selbstverdauung?","optionen":[{"text":"ein zäher Schleimfilm","richtig":true},{"text":"Bikarbonat im Schleim, das die Säure abpuffert","richtig":true},{"text":"eine gute Durchblutung der Schleimhaut","richtig":true},{"text":"besonders viel Pepsin","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 356"],"erklaerung":"Eine gute Durchblutung schützt vor Geschwüren.","id":"magen-mc-ulkus","frage":"Was kann die Entstehung eines Magengeschwürs begünstigen?","optionen":[{"text":"eine Besiedlung mit Helicobacter pylori","richtig":true},{"text":"Rauchen","richtig":true},{"text":"Stress","richtig":true},{"text":"eine gute Durchblutung der Schleimhaut","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-mc-dyspepsie","frage":"Welche Beschwerden zählen zu den typischen Magenbeschwerden (Dyspepsie)?","optionen":[{"text":"Völlegefühl","richtig":true},{"text":"Sodbrennen","richtig":true},{"text":"Übelkeit","richtig":true},{"text":"Fieber","richtig":false},{"text":"Durchfall","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-zu-zellen","frage":"Ordne jeder Zellart ihr Produkt zu.","paare":[{"links":"Belegzellen","rechts":"Salzsäure"},{"links":"Hauptzellen","rechts":"Pepsinogen"},{"links":"Nebenzellen","rechts":"Schleim"}]},{"typ":"zuordnung","quelle":["i-care S. 205","MKK S. 354"],"erklaerung":"","id":"magen-zu-abschnitte","frage":"Ordne jedem Magenabschnitt den deutschen Namen zu.","paare":[{"links":"[[Kardia]]","rechts":"Mageneingang"},{"links":"[[Fundus]]","rechts":"Magengrund"},{"links":"[[Korpus]]","rechts":"Magenkörper"},{"links":"[[Pylorus]]","rechts":"Magenpförtner"}]},{"typ":"zuordnung","quelle":["i-care S. 205, 209"],"erklaerung":"","id":"magen-zu-begriffe","frage":"Ordne jedem Begriff seine Bedeutung zu.","paare":[{"links":"[[Gaster]]","rechts":"Magen"},{"links":"[[Chymus]]","rechts":"Speisebrei"},{"links":"[[Denaturierung]]","rechts":"Strukturveränderung der Eiweiße"}]},{"typ":"reihenfolge","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-rf-weg","frage":"Bring die Stationen in die Reihenfolge, die der Speisebrei durchläuft.","schritte":["Speiseröhre","[[Kardia]]","[[Korpus]]","[[Pylorus]]","Zwölffingerdarm"]},{"typ":"reihenfolge","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-rf-entleerung","frage":"Bring die Vorgänge vom Essen bis zur Magenentleerung in die richtige Reihenfolge.","schritte":["Der Speisebrei gelangt nach dem Schlucken in den Magen.","Die Magenwand erschlafft und macht Platz für die Nahrung.","Wellenbewegungen durchmischen den Speisebrei.","Der Pylorus öffnet sich kurz, eine kleine Portion tritt in den Zwölffingerdarm über."]},{"typ":"reihenfolge","quelle":["i-care S. 207, 209"],"erklaerung":"","id":"magen-rf-eiweiss","frage":"Was passiert mit dem Eiweiß im Magen? Bring die Schritte in die richtige Reihenfolge.","schritte":["Die Hauptzellen geben Pepsinogen ab.","Die Salzsäure wandelt Pepsinogen in Pepsin um.","Pepsin spaltet die Eiweiße."]},{"typ":"lückentext","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-lt-zellen","text":"Die Belegzellen bilden die {{Salzsäure|HCl}}. Die Hauptzellen bilden {{Pepsinogen}}, die Vorstufe des Enzyms {{Pepsin}}."},{"typ":"lückentext","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-lt-magensaft","text":"Der Magensaft ist sehr {{sauer}}. Dadurch tötet er auch {{Keime|Bakterien}} ab."},{"typ":"lückentext","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-lt-chymus","text":"Im Magen wird die Nahrung mit dem Magensaft zum Speisebrei vermischt. Erreicht eine Welle den Magenausgang, öffnet sich der Schließmuskel kurz, und eine kleine Menge gelangt in den {{Zwölffingerdarm|Duodenum}}. Größere Nahrungsbestandteile werden im Magen {{zurückgehalten|zurück gehalten}}."},{"typ":"fehlerfahndung","quelle":["MKK S. 355","i-care S. 207"],"erklaerung":"Bei Erbrechen besteht Aspirationsgefahr. Betroffene sollen deshalb aufrecht sitzen oder – wenn das nicht möglich ist – in Seitenlage liegen. Bis zur Klärung bleiben sie nüchtern. Uhrzeit, Menge, Art, Aussehen und Geruch des Erbrochenen werden dokumentiert. Die Salzsäure des Magensafts bilden die Belegzellen, nicht die Hauptzellen.","id":"magen-ff-erbrechen","titel":"Robartinas Pflegebericht: Herr K. hat erbrochen","bericht":"10:15 Uhr: Herr K. hat einmal erbrochen. Ich habe ihn sofort flach in Rückenlage gebracht, damit er sich ausruhen kann. Seine Zahnprothese habe ich entfernt und ihm eine Nierenschale und Zellstoff gereicht. Danach habe ich ihm Mundpflege angeboten und die Bettwäsche gewechselt. Damit er wieder zu Kräften kommt, habe ich ihm gleich ein Brötchen gebracht. Das Erbrochene habe ich entsorgt, ohne etwas zu notieren. Frau Abda hat mir erklärt, dass der saure Magensaft von den Hauptzellen gebildet wird.","fehler":[{"links":"flach in Rückenlage gebracht","rechts":"aufrecht|sitz|seitenlage","loesung":"aufrecht sitzen lassen oder in Seitenlage gebracht (Aspirationsgefahr)"},{"links":"gleich ein Brötchen gebracht","rechts":"nüchtern|nichts zu essen|kein essen","loesung":"bis zur Klärung des weiteren Vorgehens nüchtern gelassen"},{"links":"entsorgt, ohne etwas zu notieren","rechts":"dokument|notier|aufgeschrieben","loesung":"Uhrzeit, Menge, Art, Aussehen und Geruch dokumentiert"},{"links":"Hauptzellen","rechts":"belegzell|parietalzell","loesung":"Belegzellen"}]}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-06deb0","vorne":"Was bedeutet [[Gaster]]?","hinten":"Magen."},{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-cc057a","vorne":"Welche Aufgaben hat der Magen?","hinten":"Er vermischt die Nahrung mit Magensaft zum Speisebrei ([[Chymus]]), speichert ihn und gibt ihn portionsweise an den Dünndarm ab. Der saure Magensaft tötet außerdem Keime ab."},{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-f39378","vorne":"Wo liegt der Magen?","hinten":"Im linken Oberbauch."},{"typ":"karteikarte","quelle":["MKK S. 354","i-care S. 205"],"erklaerung":"","id":"magen-kk-c28592","vorne":"Nenne die Abschnitte des Magens.","hinten":"[[Kardia]] (Mageneingang), [[Fundus]] (Magengrund), [[Korpus]] (Magenkörper), [[Antrum]] und [[Pylorus]] (Magenpförtner)."},{"typ":"karteikarte","quelle":["i-care S. 205","MKK S. 359"],"erklaerung":"","id":"magen-kk-40fcd2","vorne":"Was ist der [[Pylorus]]?","hinten":"Der Magenpförtner. Hier sitzt ein Schließmuskel, der den Magen zum Dünndarm hin verschließt."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-483ded","vorne":"Warum bildet die Magenschleimhaut Falten?","hinten":"Die Falten ermöglichen, dass sich die Magenwand dehnen kann. Im gefüllten Magen sind sie verstrichen."},{"typ":"karteikarte","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-kk-4dffd5","vorne":"Was ist das Besondere an der Muskelschicht des Magens?","hinten":"Sie besteht aus drei Schichten. So kann sich der Magen vielfältig zusammenziehen und den Speisebrei gut durchmischen."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-f74707","vorne":"Was bilden die Belegzellen der Magendrüsen?","hinten":"Salzsäure und den Intrinsic Factor."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-5a6c95","vorne":"Was bilden die Hauptzellen der Magendrüsen?","hinten":"[[Pepsinogen]], die Vorstufe des eiweißspaltenden Enzyms Pepsin."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-b35644","vorne":"Was bilden die Nebenzellen der Magendrüsen?","hinten":"Schützenden Schleim."},{"typ":"karteikarte","quelle":["i-care S. 205, 209"],"erklaerung":"","id":"magen-kk-0825ad","vorne":"Wie ist der Magensaft beschaffen?","hinten":"Er ist sehr sauer. Seine wichtigsten Bestandteile sind Salzsäure und Pepsinogen."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-8b90a2","vorne":"Welche Aufgaben hat die Salzsäure im Magen?","hinten":"Sie wandelt [[Pepsinogen]] in [[Pepsin]] um, verändert die Struktur der Eiweiße ([[Denaturierung]]) und wirkt gegen Bakterien."},{"typ":"karteikarte","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-kk-f07df3","vorne":"Warum verdaut sich der Magen nicht selbst?","hinten":"Ein zäher Schleimfilm kleidet den Magen aus und schützt die Schleimhaut vor Salzsäure und Pepsin."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-663dd8","vorne":"Wofür wird der Intrinsic Factor gebraucht?","hinten":"Für die Aufnahme von Vitamin B12 aus der Nahrung."},{"typ":"karteikarte","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-kk-5dadd9","vorne":"Was regt die Bildung von Magensaft schon vor dem Essen an?","hinten":"Geruchs- und Geschmacksreize. Der Magen wird so auf die Nahrung vorbereitet."},{"typ":"karteikarte","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-kk-0ea980","vorne":"Welche Speisen bleiben am längsten im Magen?","hinten":"Fettreiche Speisen. Kohlenhydratreiche Speisen verlassen den Magen am schnellsten, Flüssigkeiten noch schneller."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-50e7db","vorne":"Wie gelangt der Speisebrei aus dem Magen in den Dünndarm?","hinten":"Portionsweise: Wellenbewegungen laufen zum Magenausgang, der Pylorus öffnet sich kurz und eine kleine Menge tritt in den Zwölffingerdarm über."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-0ead49","vorne":"Wie wirken Protonenpumpenhemmer?","hinten":"Sie sorgen dafür, dass weniger Salzsäure gebildet wird. Dadurch wird die Magenschleimhaut geschont."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-c5a5c9","vorne":"Was ist die wichtigste Ursache für Magengeschwüre?","hinten":"Das Bakterium Helicobacter pylori."},{"typ":"karteikarte","quelle":["i-care S. 205, 210"],"erklaerung":"","id":"magen-kk-5a4581","vorne":"Wo findet die Aufnahme der Nährstoffe (Resorption) hauptsächlich statt – im Magen oder im Dünndarm?","hinten":"Im Dünndarm. Der Magen bereitet die Nahrung vor und gibt sie portionsweise weiter."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-op-schleimhaut","operator":"beschreiben","afb":"I","fall":"Robartina hospitiert in der Endoskopie. Frau Abda zeigt ihr auf dem Bildschirm die Magenschleimhaut eines Patienten. Alaa fragt später: „Was machen eigentlich die ganzen Drüsen in der Magenschleimhaut?“","auftrag":"Beschreibe für Alaa, welche Zellarten die Magendrüsen enthalten und was sie jeweils bilden.","mindestlaenge":250,"kriterien":["Ich nenne die Belegzellen und die Salzsäure.","Ich nenne die Hauptzellen und das Pepsinogen.","Ich nenne die Nebenzellen und den schützenden Schleim.","Ich verwende die Fachbegriffe korrekt."],"musterloesung":"Die Magendrüsen bestehen aus verschiedenen Zellarten. Die **Belegzellen** bilden die Salzsäure, die den Magensaft sauer macht, und den Intrinsic Factor, der für die Aufnahme von Vitamin B12 nötig ist. Die **Hauptzellen** bilden Pepsinogen, die Vorstufe des eiweißspaltenden Pepsins. Die **Nebenzellen** stellen den schützenden Schleim her."},{"typ":"operator","quelle":["MKK S. 354–355"],"erklaerung":"","id":"magen-op-selbstschutz","operator":"erläutern","afb":"II","fall":"Ein Patient fragt Robartina beim Frühstück: „Wenn im Magen so starke Säure ist, dass sie sogar Eiweiße zerlegt – warum verdaut sich mein Magen dann nicht selbst?“ Robartina möchte ihm eine fachlich richtige Antwort geben.","auftrag":"Erläutere, wie sich die Magenschleimhaut vor Salzsäure und Pepsin schützt.","mindestlaenge":350,"kriterien":["Ich nenne den zähen Schleim als Schutzfilm.","Ich nenne die Zellen, die den Schleim bilden.","Ich erkläre, dass das Bikarbonat im Schleim die Säure abpuffert.","Ich erkläre, dass Salzsäure und Pepsin die Schleimhaut sonst angreifen würden (Selbstverdauung).","Ich nenne die ausreichende Durchblutung als Voraussetzung."],"musterloesung":"Der Magensaft enthält Salzsäure und das eiweißspaltende Pepsin. Beide würden auch die Zellen der Magenschleimhaut angreifen. Davor schützt ein zäher **Magenschleim**, den die Oberflächenzellen und besonders die **Nebenzellen** bilden. Er bildet einen geschlossenen Film, der den ganzen Magen auskleidet. Im Schleim befindet sich **Bikarbonat**, das die Säure abpuffert. So wird eine **Selbstverdauung** verhindert. Voraussetzung ist neben der intakten Schleimschicht eine **ausreichende Durchblutung** der Schleimhaut."},{"typ":"operator","quelle":["MKK S. 356–357","i-care S. 209"],"erklaerung":"","id":"magen-op-ulkus","operator":"beurteilen","afb":"III","fall":"Herr S. (58) liegt mit einem Magengeschwür auf Robartinas Station. Der Test auf Helicobacter pylori war positiv. Herr S. raucht und nimmt wegen Rückenschmerzen regelmäßig Schmerzmittel. Er sagt zu Robartina: „Ich nehme jetzt einfach den Säureblocker, dann ist alles wieder gut. Rauchen und meine Schmerztabletten lasse ich mir nicht nehmen.“ Frau Abda bittet Robartina, darüber nachzudenken.","auftrag":"Beurteile, ob die alleinige Einnahme eines Säureblockers (Protonenpumpenhemmers) ausreicht, damit das Magengeschwür von Herrn S. abheilt.","mindestlaenge":400,"kriterien":["Ich erkläre die Wirkung des Protonenpumpenhemmers (weniger Salzsäure).","Ich nenne Helicobacter pylori als wichtige Ursache.","Ich nenne Rauchen und bestimmte Schmerzmittel als weitere Faktoren, die ein Geschwür begünstigen.","Ich nenne die Behandlung gegen Helicobacter (Protonenpumpenhemmer plus zwei Antibiotika).","Ich komme zu einem begründeten Urteil und beziehe mich auf Herrn S."],"musterloesung":"Ein Protonenpumpenhemmer sorgt dafür, dass weniger Salzsäure gebildet wird. Die Schleimhaut wird geschont und kann besser abheilen. Ein Geschwür entsteht aber durch ein Ungleichgewicht zwischen schädigenden Faktoren und dem Schutz der Schleimhaut. Bei Herrn S. liegen mehrere schädigende Faktoren vor: Er ist mit **Helicobacter pylori** besiedelt, er **raucht** und nimmt regelmäßig **Schmerzmittel**, die ein Geschwür begünstigen können (nichtsteroidale Antiphlogistika). Bei Helicobacter wird eine Behandlung mit einem Protonenpumpenhemmer **und zwei Antibiotika** durchgeführt. Außerdem sollen auslösende Medikamente und Zigaretten abgesetzt werden. **Urteil:** Der Säureblocker allein reicht nicht aus. Herr S. braucht zusätzlich die Antibiotika und sollte auf das Rauchen und die Schmerzmittel verzichten – sonst drohen neue Geschwüre und Komplikationen wie Blutungen."}],"status":"aktiv"},{"id":"duenndarm","titel":"Dünndarm","block":2,"nr":3,"organ":"","beschreibung":"Zotten, Mikrovilli und Resorption.","quellen":"i-care S. 210–214; MKK S. 357–358","icon":"darm","farbe":"#2A473B","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-sc-aufgabe","frage":"Wo findet die Aufnahme der Nährstoffe hauptsächlich statt?","optionen":[{"text":"im Dünndarm","richtig":true},{"text":"im Magen","richtig":false},{"text":"in der Speiseröhre","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 212"],"erklaerung":"","id":"duenndarm-sc-erster","frage":"Welcher Abschnitt des Dünndarms folgt direkt auf den Magen?","optionen":[{"text":"[[Duodenum]]","richtig":true},{"text":"[[Jejunum]]","richtig":false},{"text":"[[Ileum]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 212–213"],"erklaerung":"","id":"duenndarm-sc-letzter","frage":"Welcher Abschnitt des Dünndarms mündet in den Dickdarm?","optionen":[{"text":"[[Ileum]]","richtig":true},{"text":"[[Duodenum]]","richtig":false},{"text":"[[Jejunum]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 210"],"erklaerung":"Krypten sind die Vertiefungen zwischen den Zotten.","id":"duenndarm-sc-zotten","frage":"Wie heißen die fingerförmigen Ausstülpungen der Dünndarmschleimhaut?","optionen":[{"text":"Zotten","richtig":true},{"text":"Krypten","richtig":false},{"text":"Falten","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-sc-oberflaeche","frage":"Warum hat der Dünndarm Falten, Zotten und Mikrovilli?","optionen":[{"text":"um die Oberfläche für die Aufnahme der Nährstoffe zu vergrößern","richtig":true},{"text":"um die Nahrung zu zerkleinern","richtig":false},{"text":"um Salzsäure zu bilden","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 213"],"erklaerung":"Nicht verwechseln: Das Ileum ist der letzte Abschnitt des Dünndarms.","id":"duenndarm-sc-ileus","frage":"Was ist ein [[Ileus]]?","optionen":[{"text":"ein Darmverschluss","richtig":true},{"text":"ein Abschnitt des Dünndarms","richtig":false},{"text":"ein Verdauungsenzym","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 212"],"erklaerung":"","id":"duenndarm-sc-saefte","frage":"Welche Verdauungssäfte münden in das Duodenum?","optionen":[{"text":"Galle und Pankreassaft","richtig":true},{"text":"Speichel und Magensaft","richtig":false},{"text":"nur Magensaft","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 213"],"erklaerung":"","id":"duenndarm-sc-klappe","frage":"Was verhindert die Klappe zwischen Dünndarm und Dickdarm?","optionen":[{"text":"dass Keime aus dem Dickdarm in den Dünndarm aufsteigen","richtig":true},{"text":"dass Nahrung in den Magen zurückfließt","richtig":false},{"text":"dass Galle in den Darm gelangt","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-sc-buerstensaum","frage":"Was bilden die [[Mikrovilli]] der Darmzellen zusammen?","optionen":[{"text":"den Bürstensaum","richtig":true},{"text":"die Zotten","richtig":false},{"text":"das Gekröse","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 358"],"erklaerung":"","id":"duenndarm-sc-enteritis","frage":"Was ist das typische Zeichen einer Dünndarmentzündung ([[Enteritis]])?","optionen":[{"text":"wässrige Durchfälle","richtig":true},{"text":"Sodbrennen","richtig":false},{"text":"Zahnschmerzen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-sc-ballast","frage":"Was geschieht mit Ballaststoffen im Dünndarm?","optionen":[{"text":"Sie können nicht verdaut werden und gelangen weiter in den Dickdarm.","richtig":true},{"text":"Sie werden vollständig aufgenommen.","richtig":false},{"text":"Sie werden in Aminosäuren gespalten.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-sc-speed","frage":"Welcher Speisebrei wird am schnellsten durch den Dünndarm transportiert?","optionen":[{"text":"kohlenhydratreicher Speisebrei","richtig":true},{"text":"fettreicher Speisebrei","richtig":false},{"text":"Jeder Speisebrei ist gleich schnell.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-mc-abschnitte","frage":"Welche Abschnitte gehören zum Dünndarm?","optionen":[{"text":"Duodenum","richtig":true},{"text":"Jejunum","richtig":true},{"text":"Ileum","richtig":true},{"text":"Kolon","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 210","MKK S. 358"],"erklaerung":"","id":"duenndarm-mc-oberflaeche","frage":"Was vergrößert die Oberfläche der Dünndarmschleimhaut?","optionen":[{"text":"Falten","richtig":true},{"text":"Zotten","richtig":true},{"text":"Mikrovilli","richtig":true},{"text":"Zähne","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-mc-aufnahme","frage":"Was wird im Dünndarm aufgenommen?","optionen":[{"text":"die Bausteine der Nährstoffe","richtig":true},{"text":"Vitamine","richtig":true},{"text":"Wasser","richtig":true},{"text":"Ballaststoffe","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-mc-bewegung","frage":"Welche Bewegungen führt die Dünndarmwand aus?","optionen":[{"text":"Mischbewegungen","richtig":true},{"text":"Pendelbewegungen","richtig":true},{"text":"Transportbewegungen","richtig":true},{"text":"Kaubewegungen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 212"],"erklaerung":"","id":"duenndarm-mc-neutral","frage":"Was neutralisiert den sauren Speisebrei im Duodenum?","optionen":[{"text":"das basische Sekret der Drüsen im Duodenum","richtig":true},{"text":"die Galle","richtig":true},{"text":"der Pankreassaft","richtig":true},{"text":"die Salzsäure","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-mc-enzyme","frage":"Wo werden die Nährstoffe im Dünndarm gespalten?","optionen":[{"text":"im Darmlumen durch die Enzyme des Pankreassafts","richtig":true},{"text":"am Bürstensaum durch Enzyme der Darmschleimhaut","richtig":true},{"text":"in der Gallenblase","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-zu-namen","frage":"Ordne jedem Abschnitt den deutschen Namen zu.","paare":[{"links":"[[Duodenum]]","rechts":"Zwölffingerdarm"},{"links":"[[Jejunum]]","rechts":"Leerdarm"},{"links":"[[Ileum]]","rechts":"Krummdarm"}]},{"typ":"zuordnung","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-zu-strukturen","frage":"Ordne jeder Struktur ihre Beschreibung zu.","paare":[{"links":"Zotten","rechts":"fingerförmige Ausstülpungen der Schleimhaut"},{"links":"[[Krypten]]","rechts":"Vertiefungen zwischen den Zotten"},{"links":"[[Mikrovilli]]","rechts":"feine Fortsätze der Darmzellen"}]},{"typ":"zuordnung","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-zu-bausteine","frage":"Welche Bausteine entstehen im Dünndarm aus den Nährstoffen?","paare":[{"links":"Kohlenhydrate","rechts":"Einfachzucker"},{"links":"Eiweiße","rechts":"Aminosäuren"},{"links":"Fette","rechts":"Fettsäuren"}]},{"typ":"reihenfolge","quelle":["i-care S. 210, 212–213"],"erklaerung":"","id":"duenndarm-rf-abschnitte","frage":"Bring die Stationen in die Reihenfolge, die der Speisebrei durchläuft.","schritte":["Magen","[[Duodenum]]","[[Jejunum]]","[[Ileum]]","Dickdarm"]},{"typ":"reihenfolge","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-rf-groesse","frage":"Ordne die Strukturen der Dünndarmschleimhaut von groß nach klein.","schritte":["Falten","Zotten","Mikrovilli"]},{"typ":"reihenfolge","quelle":["i-care S. 189, 210, 214"],"erklaerung":"","id":"duenndarm-rf-resorption","frage":"Wie gelangt ein Nährstoff aus dem Darm ins Blut? Bring die Schritte in die richtige Reihenfolge.","schritte":["Enzyme spalten den Nährstoff in kleine Bausteine.","Die Darmzellen der Zotten nehmen die Bausteine auf.","Die Bausteine gehen in die Blutgefäße der Zotte über.","Das Blut transportiert sie zur Leber."]},{"typ":"lückentext","quelle":["i-care S. 212"],"erklaerung":"","id":"duenndarm-lt-abschnitte","text":"Der erste Abschnitt des Dünndarms ist das {{Duodenum|Zwölffingerdarm}}. Dort werden die {{Galle}} und der Pankreassaft abgegeben."},{"typ":"lückentext","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-lt-zotten","text":"Die Schleimhaut des Dünndarms bildet fingerförmige {{Zotten}}. Dadurch wird die {{Oberfläche}} für die Aufnahme der Nährstoffe vergrößert."},{"typ":"lückentext","quelle":["i-care S. 213"],"erklaerung":"","id":"duenndarm-lt-ileum","text":"Der letzte Abschnitt des Dünndarms heißt {{Ileum|Krummdarm}}. Ein Darmverschluss heißt dagegen {{Ileus}}."}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 210","MKK S. 357"],"erklaerung":"","id":"duenndarm-kk-df6a22","vorne":"Welche Hauptaufgaben hat der Dünndarm?","hinten":"Er verdaut den Speisebrei zu Ende und nimmt die Nährstoffe auf ([[Resorption]])."},{"typ":"karteikarte","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-kk-1602c2","vorne":"Aus welchen drei Abschnitten besteht der Dünndarm?","hinten":"[[Duodenum]] (Zwölffingerdarm), [[Jejunum]] (Leerdarm) und [[Ileum]] (Krummdarm)."},{"typ":"karteikarte","quelle":["i-care S. 212"],"erklaerung":"","id":"duenndarm-kk-dd6de9","vorne":"Woher hat der Zwölffingerdarm seinen Namen?","hinten":"Seine Länge entspricht etwa der Breite von zwölf aneinandergelegten Fingern."},{"typ":"karteikarte","quelle":["i-care S. 212"],"erklaerung":"","id":"duenndarm-kk-e4d226","vorne":"Welche Verdauungssäfte werden in das [[Duodenum]] abgegeben?","hinten":"Die Galle und der Pankreassaft. Ihre Ausführungsgänge münden gemeinsam im Duodenum."},{"typ":"karteikarte","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-kk-d3bd74","vorne":"Woher stammen die meisten Verdauungsenzyme im Dünndarm?","hinten":"Aus der Bauchspeicheldrüse. Für die Aufnahme der Fette ist außerdem die Galle notwendig."},{"typ":"karteikarte","quelle":["i-care S. 210","MKK S. 357"],"erklaerung":"","id":"duenndarm-kk-23fe3c","vorne":"Warum ist die Schleimhaut des Dünndarms so stark gefaltet?","hinten":"Damit eine möglichst große Oberfläche für die Aufnahme der Nährstoffe zur Verfügung steht."},{"typ":"karteikarte","quelle":["i-care S. 210","MKK S. 358"],"erklaerung":"","id":"duenndarm-kk-49b47a","vorne":"Wodurch wird die Oberfläche des Dünndarms vergrößert?","hinten":"Durch ringförmige Falten, fingerförmige Zotten, [[Krypten]] und die [[Mikrovilli]] der Darmzellen."},{"typ":"karteikarte","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-kk-8c1e4b","vorne":"Was sind Zotten?","hinten":"Kleine, fingerförmige Ausstülpungen der Dünndarmschleimhaut. Jede Zotte hat eigene Blut- und Lymphgefäße, über die die aufgenommenen Nährstoffe abtransportiert werden."},{"typ":"karteikarte","quelle":["i-care S. 212","MKK S. 358"],"erklaerung":"","id":"duenndarm-kk-c75a18","vorne":"Was sind [[Enterozyten]]?","hinten":"Die Zellen der Dünndarmschleimhaut, die die Nährstoffe aufnehmen. Ihre [[Mikrovilli]] bilden den Bürstensaum."},{"typ":"karteikarte","quelle":["i-care S. 210"],"erklaerung":"","id":"duenndarm-kk-09d2bc","vorne":"Welche zwei Aufgaben hat der Bürstensaum?","hinten":"Er vergrößert die Oberfläche, und an ihm sitzen Verdauungsenzyme."},{"typ":"karteikarte","quelle":["i-care S. 212"],"erklaerung":"","id":"duenndarm-kk-1a7ff6","vorne":"Welche Aufgabe haben die Becherzellen im Dünndarm?","hinten":"Sie bilden Schleim. Er schützt die Schleimhaut und lässt den Speisebrei besser gleiten."},{"typ":"karteikarte","quelle":["i-care S. 212"],"erklaerung":"","id":"duenndarm-kk-a72f9f","vorne":"Welche Aufgabe hat das Sekret der Drüsen im Duodenum (Brunner-Drüsen)?","hinten":"Es ist basisch und hilft, den sauren Speisebrei aus dem Magen zu neutralisieren. So schützt es die Dünndarmschleimhaut."},{"typ":"karteikarte","quelle":["i-care S. 213"],"erklaerung":"","id":"duenndarm-kk-8100f4","vorne":"Welche Aufgabe hat die Klappe zwischen Dünndarm und Dickdarm (Bauhin-Klappe)?","hinten":"Sie wirkt wie ein Ventil und verhindert, dass Keime aus dem Dickdarm in den Dünndarm aufsteigen."},{"typ":"karteikarte","quelle":["i-care S. 213"],"erklaerung":"","id":"duenndarm-kk-4d8e79","vorne":"Was ist der Unterschied zwischen [[Ileum]] und [[Ileus]]?","hinten":"Das Ileum ist ein Abschnitt des Dünndarms. Der Ileus ist ein Darmverschluss."},{"typ":"karteikarte","quelle":["i-care S. 213"],"erklaerung":"","id":"duenndarm-kk-3055ff","vorne":"Wozu dient das [[Mesenterium]]?","hinten":"Es hängt Jejunum und Ileum beweglich an der hinteren Bauchwand auf. So können sich die Darmschlingen bei der Verdauung bewegen."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-kk-90fcdc","vorne":"Welche Bewegungen macht der Dünndarm?","hinten":"Misch- und Pendelbewegungen durchmischen den Speisebrei mit den Verdauungssäften. Transportbewegungen befördern ihn in Richtung Dickdarm."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-kk-cf39c7","vorne":"Was nimmt der Dünndarm außer Zucker, Aminosäuren und Fetten noch auf?","hinten":"Vitamine, Elektrolyte und Wasser."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"duenndarm-kk-c047d9","vorne":"Was passiert mit den Gallensäuren am Ende des Dünndarms?","hinten":"Sie werden wieder aufgenommen, gelangen über das Blut zurück zur Leber und werden wiederverwendet (enterohepatischer Kreislauf)."},{"typ":"karteikarte","quelle":["i-care S. 213"],"erklaerung":"","id":"duenndarm-kk-7b1402","vorne":"Welche Aufgabe hat das lymphatische Gewebe in der Dünndarmwand?","hinten":"Es gehört zum Immunsystem und hilft bei der Abwehr von Krankheitserregern, die mit der Nahrung aufgenommen wurden."},{"typ":"karteikarte","quelle":["MKK S. 358"],"erklaerung":"","id":"duenndarm-kk-f8fb2e","vorne":"Was ist eine [[Enteritis]], und woran erkennt man sie?","hinten":"Eine Dünndarmentzündung. Typisch sind wässrige Durchfälle."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 210, 212"],"erklaerung":"","id":"duenndarm-op-aufbau","operator":"beschreiben","afb":"I","fall":"Robartina soll in der Schule ein kurzes Referat über den Dünndarm halten. Alaa hört zur Probe zu.","auftrag":"Beschreibe die drei Abschnitte des Dünndarms und die Hauptaufgaben des Dünndarms.","mindestlaenge":250,"kriterien":["Ich nenne Duodenum, Jejunum und Ileum in der richtigen Reihenfolge.","Ich nenne, dass Galle und Pankreassaft ins Duodenum abgegeben werden.","Ich nenne die Verdauung der Nahrung als Aufgabe.","Ich nenne die Aufnahme der Nährstoffe (Resorption) als Aufgabe."],"musterloesung":"Der Dünndarm beginnt am Magenpförtner und mündet in den Dickdarm. Er besteht aus drei Abschnitten: dem **Duodenum** (Zwölffingerdarm), dem **Jejunum** (Leerdarm) und dem **Ileum** (Krummdarm). In das Duodenum werden **Galle und Pankreassaft** abgegeben. Im Dünndarm wird die Nahrung **verdaut**, also in ihre einzelnen Bestandteile zerlegt. Außerdem findet hier hauptsächlich die **Aufnahme der Nährstoffe** (Resorption) statt."},{"typ":"operator","quelle":["i-care S. 210","MKK S. 358"],"erklaerung":"","id":"duenndarm-op-oberflaeche","operator":"erläutern","afb":"II","fall":"Im Unterricht zeigt die Lehrerin ein Bild der Dünndarmschleimhaut. Alaa wundert sich: „Warum ist die Wand innen nicht einfach glatt? Das wäre doch viel einfacher.“","auftrag":"Erläutere, warum die Dünndarmschleimhaut Falten, Zotten und Mikrovilli besitzt.","mindestlaenge":300,"kriterien":["Ich nenne Falten, Zotten und Mikrovilli.","Ich erkläre, dass sie die Oberfläche stark vergrößern.","Ich erkläre, dass so mehr Schleimhaut mit dem Speisebrei in Kontakt kommt.","Ich erkläre den Zusammenhang mit der Aufnahme der Nährstoffe.","Ich nenne die Blut- und Lymphgefäße der Zotten für den Abtransport."],"musterloesung":"Der Dünndarm hat die Aufgabe, die Nährstoffe aufzunehmen. Dafür braucht er eine sehr große Oberfläche. Die Schleimhaut ist deshalb in ringförmige **Falten** gelegt. Auf ihnen sitzen kleine, fingerförmige **Zotten**. Die Darmzellen der Zotten tragen wiederum feine Fortsätze, die **Mikrovilli**, die zusammen den Bürstensaum bilden. Falten, Zotten und Mikrovilli **vergrößern die Oberfläche** stark, sodass möglichst viel Schleimhaut mit dem Speisebrei in Kontakt kommt und viele Nährstoffe aufgenommen werden können. Jede Zotte besitzt eigene **Blut- und Lymphgefäße**, über die die aufgenommenen Nährstoffe abtransportiert werden."},{"typ":"operator","quelle":["i-care S. 210","MKK S. 362"],"erklaerung":"","id":"duenndarm-op-zotten","operator":"beurteilen","afb":"III","fall":"Bei einer Patientin sind durch eine Erkrankung des Dünndarms die Zotten stark zurückgebildet. Sie isst normal, nimmt aber trotzdem ab und fühlt sich schwach. Alaa sagt: „Wenn sie genug isst, kann das doch nicht am Darm liegen.“","auftrag":"Beurteile Alaas Aussage.","mindestlaenge":300,"kriterien":["Ich erkläre die Aufgabe der Zotten (Oberflächenvergrößerung, Aufnahme der Nährstoffe).","Ich leite ab, dass bei verkümmerten Zotten weniger Nährstoffe aufgenommen werden.","Ich erkläre, dass die Patientin deshalb trotz normaler Ernährung abnehmen kann.","Ich komme zu einem begründeten Urteil über Alaas Aussage."],"musterloesung":"Die **Zotten** vergrößern die Oberfläche des Dünndarms und nehmen mit ihren Darmzellen die Nährstoffe auf. Über ihre Blut- und Lymphgefäße werden die Nährstoffe abtransportiert. Sind die Zotten zurückgebildet, ist die **Oberfläche viel kleiner**. Dann können **weniger Nährstoffe aufgenommen** werden, auch wenn genug gegessen wird. Die Nährstoffe bleiben im Darm und werden ausgeschieden. Die Folge können Gewichtsverlust und Mangelerscheinungen sein. **Urteil:** Alaas Aussage ist falsch. Es kommt nicht nur darauf an, wie viel jemand isst, sondern auch darauf, ob der Dünndarm die Nährstoffe aufnehmen kann."}],"status":"aktiv"},{"id":"dickdarm","titel":"Dickdarm","block":2,"nr":4,"organ":"","beschreibung":"Kolon, Rektum und Stuhlentleerung.","quellen":"i-care S. 215–220; MKK S. 362","icon":"darm","farbe":"#2A473B","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-sc-aufgabe","frage":"Was passiert im Dickdarm vor allem?","optionen":[{"text":"Dem Darminhalt wird Wasser entzogen, es entsteht der Stuhl.","richtig":true},{"text":"Die Eiweiße werden in Aminosäuren gespalten.","richtig":false},{"text":"Die Nahrung wird mit Salzsäure vermischt.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 215, 220"],"erklaerung":"","id":"dickdarm-sc-vitamin","frage":"Welches Vitamin bilden Bakterien der Darmflora?","optionen":[{"text":"Vitamin K","richtig":true},{"text":"Vitamin C","richtig":false},{"text":"Vitamin A","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-sc-erster","frage":"Welcher Abschnitt ist der erste Teil des Dickdarms?","optionen":[{"text":"der Blinddarm ([[Zäkum]])","richtig":true},{"text":"das [[Rektum]]","richtig":false},{"text":"das [[Ileum]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-sc-appendix","frage":"Was ist bei einer „Blinddarmentzündung“ tatsächlich entzündet?","optionen":[{"text":"der Wurmfortsatz","richtig":true},{"text":"das gesamte Kolon","richtig":false},{"text":"das Rektum","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-sc-zotten","frage":"Was fehlt in der Schleimhaut des Dickdarms im Vergleich zum Dünndarm?","optionen":[{"text":"die Zotten","richtig":true},{"text":"die Schleimhaut","richtig":false},{"text":"die Muskulatur","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 218"],"erklaerung":"","id":"dickdarm-sc-speicher","frage":"Wo wird der Stuhl bis zum nächsten Stuhlgang gespeichert?","optionen":[{"text":"im [[Rektum]]","richtig":true},{"text":"im Blinddarm","richtig":false},{"text":"im Dünndarm","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 219"],"erklaerung":"","id":"dickdarm-sc-schliessmuskel","frage":"Welchen Schließmuskel des Afters kann man willentlich steuern?","optionen":[{"text":"den äußeren Schließmuskel","richtig":true},{"text":"den inneren Schließmuskel","richtig":false},{"text":"keinen von beiden","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-sc-obstipation","frage":"Was bedeutet [[Obstipation]]?","optionen":[{"text":"Verstopfung","richtig":true},{"text":"Durchfall","richtig":false},{"text":"Blähungen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-sc-ballast","frage":"Wie wirkt sich ballaststoffreiche Nahrung auf den Dickdarm aus?","optionen":[{"text":"Der Darminhalt bleibt kürzer im Dickdarm.","richtig":true},{"text":"Der Darminhalt bleibt länger im Dickdarm.","richtig":false},{"text":"Sie hat keinen Einfluss.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-sc-lage","frage":"In welchem Bereich des Bauches liegt der Blinddarm?","optionen":[{"text":"im rechten Unterbauch","richtig":true},{"text":"im linken Oberbauch","richtig":false},{"text":"in der Mitte des Oberbauchs","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-sc-drang","frage":"Wodurch wird der Stuhldrang ausgelöst?","optionen":[{"text":"durch die Dehnung der Rektumwand","richtig":true},{"text":"durch die Füllung des Magens","richtig":false},{"text":"durch die Bildung von Galle","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 218"],"erklaerung":"","id":"dickdarm-sc-einlauf","frage":"Auf welcher Seite sollte ein Patient bei einem Einlauf möglichst liegen?","optionen":[{"text":"auf der linken Seite","richtig":true},{"text":"auf der rechten Seite","richtig":false},{"text":"auf dem Bauch","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-mc-abschnitte","frage":"Welche Abschnitte gehören zum Dickdarm?","optionen":[{"text":"Blinddarm","richtig":true},{"text":"Kolon","richtig":true},{"text":"Rektum","richtig":true},{"text":"Jejunum","richtig":false},{"text":"Duodenum","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-mc-aufgaben","frage":"Welche Aufgaben hat der Dickdarm?","optionen":[{"text":"dem Darminhalt Wasser entziehen","richtig":true},{"text":"den Stuhl speichern","richtig":true},{"text":"den Stuhl ausscheiden","richtig":true},{"text":"die Nahrung mit Enzymen des Pankreas vermischen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-mc-flora","frage":"Was leistet die Darmflora?","optionen":[{"text":"Sie spaltet einige Ballaststoffe auf.","richtig":true},{"text":"Sie bildet Vitamin K.","richtig":true},{"text":"Sie bildet Salzsäure.","richtig":false},{"text":"Sie spaltet Eiweiße im Magen.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-mc-obstipation","frage":"Was begünstigt eine Verstopfung?","optionen":[{"text":"wenig Bewegung","richtig":true},{"text":"wenig Trinken","richtig":true},{"text":"ballaststoffarme Ernährung","richtig":true},{"text":"ballaststoffreiche Ernährung","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-mc-stuhl","frage":"Woraus besteht der Stuhl?","optionen":[{"text":"aus unverdaulichen Nahrungsbestandteilen","richtig":true},{"text":"aus abgestoßenen Zellen der Darmschleimhaut","richtig":true},{"text":"aus Bakterien der Darmflora","richtig":true},{"text":"aus Magensäure","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 219"],"erklaerung":"","id":"dickdarm-mc-kontinenz","frage":"Was sorgt dafür, dass der Stuhl nicht ungewollt austritt?","optionen":[{"text":"der innere Schließmuskel","richtig":true},{"text":"der äußere Schließmuskel","richtig":true},{"text":"die Muskulatur des Beckenbodens","richtig":true},{"text":"der Magenpförtner","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-zu-namen","frage":"Ordne jedem Fachbegriff den deutschen Namen zu.","paare":[{"links":"[[Zäkum]]","rechts":"Blinddarm"},{"links":"[[Kolon]]","rechts":"Grimmdarm"},{"links":"[[Rektum]]","rechts":"Mastdarm"},{"links":"[[Appendix vermiformis]]","rechts":"Wurmfortsatz"}]},{"typ":"zuordnung","quelle":["i-care S. 213, 220"],"erklaerung":"","id":"dickdarm-zu-begriffe","frage":"Ordne jedem Begriff seine Bedeutung zu.","paare":[{"links":"[[Obstipation]]","rechts":"Verstopfung"},{"links":"[[Diarrhö]]","rechts":"Durchfall"},{"links":"[[Flatulenz]]","rechts":"Blähungen"},{"links":"[[Ileus]]","rechts":"Darmverschluss"}]},{"typ":"zuordnung","quelle":["i-care S. 205, 219"],"erklaerung":"","id":"dickdarm-zu-muskeln","frage":"Ordne jedem Schließmuskel seine Eigenschaft zu.","paare":[{"links":"innerer Schließmuskel","rechts":"arbeitet unbewusst"},{"links":"äußerer Schließmuskel","rechts":"kann willentlich gesteuert werden"},{"links":"Magensphinkter","rechts":"verschließt den Magen zum Dünndarm"}]},{"typ":"reihenfolge","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-rf-abschnitte","frage":"Bring die Abschnitte in die Reihenfolge, die der Darminhalt durchläuft.","schritte":["[[Ileum]]","Blinddarm","[[Kolon]]","[[Rektum]]","Analkanal"]},{"typ":"reihenfolge","quelle":["i-care S. 216"],"erklaerung":"","id":"dickdarm-rf-kolon","frage":"Bring die Teile des Kolons in die richtige Reihenfolge.","schritte":["aufsteigender Teil","quer verlaufender Teil","absteigender Teil","gebogener (S-förmiger) Teil"]},{"typ":"reihenfolge","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-rf-stuhlgang","frage":"Wie läuft die Stuhlentleerung ab? Bring die Schritte in die richtige Reihenfolge.","schritte":["Das Rektum füllt sich mit Stuhl.","Die Wand des Rektums wird gedehnt.","Der Stuhldrang wird im Gehirn bewusst.","Der innere Schließmuskel entspannt sich unbewusst.","Der äußere Schließmuskel wird willentlich entspannt."]},{"typ":"lückentext","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-lt-wasser","text":"Im Dickdarm wird dem Darminhalt {{Wasser}} entzogen. So entsteht der {{Stuhl|Fäzes}}."},{"typ":"lückentext","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-lt-appendix","text":"Am Blinddarm sitzt der {{Wurmfortsatz|Appendix}}. Seine Entzündung heißt {{Appendizitis}}."},{"typ":"lückentext","quelle":["i-care S. 215, 220"],"erklaerung":"","id":"dickdarm-lt-flora","text":"Die Bakterien im Dickdarm nennt man {{Darmflora|Dickdarmflora}}. Einige von ihnen bilden das Vitamin {{K}}."},{"typ":"fehlerfahndung","quelle":["i-care S. 218–220"],"erklaerung":"Bei einem Einlauf liegt der Patient möglichst auf der linken Seite. Geringe Flüssigkeitszufuhr begünstigt eine Verstopfung. Der Stuhl wird im Rektum gespeichert. Willentlich steuerbar ist nur der äußere Schließmuskel.","id":"dickdarm-ff-einlauf","titel":"Robartinas Pflegebericht: Einlauf bei Herrn W.","bericht":"Herr W. hat seit Tagen Verstopfung. Für den Einlauf habe ich ihn auf die rechte Seite gelagert. Ich habe ihm erklärt, dass er künftig weniger trinken soll, damit der Stuhl weicher wird. Frau Abda hat mir gezeigt, dass der Stuhl im Blinddarm gespeichert wird, bis man zur Toilette geht. Den inneren Schließmuskel kann Herr W. übrigens willentlich steuern.","fehler":[{"links":"rechte Seite","rechts":"link","loesung":"linke Seite"},{"links":"weniger trinken","rechts":"mehr|viel|ausreichend","loesung":"mehr trinken"},{"links":"im Blinddarm gespeichert","rechts":"rektum|mastdarm|enddarm","loesung":"im Rektum gespeichert"},{"links":"Den inneren Schließmuskel","rechts":"äußer","loesung":"Den äußeren Schließmuskel"}]}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-kk-d44f1f","vorne":"Welche Aufgaben hat der Dickdarm?","hinten":"Er entzieht dem Speisebrei Wasser, sodass der Stuhl ([[Fäzes]]) entsteht. Bakterien zersetzen den Darminhalt. Der Stuhl wird gespeichert und dann ausgeschieden."},{"typ":"karteikarte","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-kk-418cff","vorne":"Aus welchen Abschnitten besteht der Dickdarm?","hinten":"Blinddarm ([[Zäkum]]) mit Wurmfortsatz, [[Kolon]] (Grimmdarm), [[Rektum]] (Mastdarm) und Analkanal."},{"typ":"karteikarte","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-kk-2c4853","vorne":"Was ist die Darmflora?","hinten":"Die vielen Mikroorganismen, vor allem Bakterien, die die Schleimhaut des Dickdarms besiedeln."},{"typ":"karteikarte","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-kk-235db0","vorne":"Was leistet die Darmflora?","hinten":"Sie spaltet einige Ballaststoffe auf, die aus dem Dünndarm kommen. Einige Bakterien bilden außerdem Vitamin K."},{"typ":"karteikarte","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-kk-0b26e6","vorne":"Was unterscheidet die Schleimhaut des Dickdarms von der des Dünndarms?","hinten":"Im Dickdarm fehlen die Zotten und die ringförmigen Falten."},{"typ":"karteikarte","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-kk-a409ae","vorne":"Wo liegt der Blinddarm, und was hängt an ihm?","hinten":"Im rechten Unterbauch. An seinem unteren Ende sitzt der Wurmfortsatz ([[Appendix vermiformis]])."},{"typ":"karteikarte","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-kk-b06c36","vorne":"Was ist bei einer „Blinddarmentzündung“ eigentlich entzündet?","hinten":"Der Wurmfortsatz. Die Entzündung heißt deshalb [[Appendizitis]]."},{"typ":"karteikarte","quelle":["i-care S. 215"],"erklaerung":"","id":"dickdarm-kk-1e1cb4","vorne":"Warum wird ein entzündeter Wurmfortsatz in der Regel operativ entfernt?","hinten":"Unbehandelt kann es zu einem Darmdurchbruch mit Bauchfellentzündung ([[Peritonitis]]) kommen."},{"typ":"karteikarte","quelle":["i-care S. 216, 218"],"erklaerung":"","id":"dickdarm-kk-04ce52","vorne":"Wie verläuft das [[Kolon]] im Bauchraum?","hinten":"Wie ein Rahmen um den Dünndarm: rechts aufsteigend, quer nach links, links absteigend und dann S-förmig zur Mitte, wo es ins Rektum übergeht."},{"typ":"karteikarte","quelle":["i-care S. 218"],"erklaerung":"","id":"dickdarm-kk-98223b","vorne":"Welche Aufgabe hat das [[Rektum]]?","hinten":"In seinem dehnbaren Abschnitt wird der Stuhl bis zum nächsten Stuhlgang gespeichert."},{"typ":"karteikarte","quelle":["i-care S. 219"],"erklaerung":"","id":"dickdarm-kk-0bebe3","vorne":"Welche zwei Schließmuskeln verschließen den After?","hinten":"Der innere Schließmuskel arbeitet unbewusst. Den äußeren Schließmuskel kann man willentlich anspannen und entspannen."},{"typ":"karteikarte","quelle":["i-care S. 219"],"erklaerung":"","id":"dickdarm-kk-5aee9a","vorne":"Was bedeutet [[Kontinenz]]?","hinten":"Die Fähigkeit, den Stuhl zu halten, sodass er nicht ungewollt austritt."},{"typ":"karteikarte","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-kk-fe2db5","vorne":"Wie entsteht der Stuhldrang?","hinten":"Füllt sich das Rektum mit Stuhl, wird seine Wand gedehnt. Dehnungssensoren melden das über das Rückenmark an das Gehirn."},{"typ":"karteikarte","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-kk-a9d4c2","vorne":"Woraus besteht der Stuhl?","hinten":"Aus unverdaulichen Nahrungsbestandteilen, abgestoßenen Zellen der Darmschleimhaut und Bakterien der Darmflora."},{"typ":"karteikarte","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-kk-ce0974","vorne":"Was begünstigt eine Verstopfung ([[Obstipation]])?","hinten":"Mangelnde Bewegung, geringe Flüssigkeitszufuhr und ballaststoffarme Ernährung."},{"typ":"karteikarte","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-kk-36d881","vorne":"Warum bekommen manche Menschen von Antibiotika Durchfall?","hinten":"Antibiotika töten auch Bakterien der Darmflora ab. Dadurch gerät die Besiedlung des Darms aus dem Gleichgewicht, und der Stuhl wird flüssiger."},{"typ":"karteikarte","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-kk-041801","vorne":"Warum ist ein Darmdurchbruch ([[Perforation]]) so gefährlich?","hinten":"Bakterien der Darmflora gelangen in die Bauchhöhle und können dort eine schwere Bauchfellentzündung verursachen."},{"typ":"karteikarte","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-kk-2f640c","vorne":"Was ist ein [[Ileus]]?","hinten":"Der Darminhalt kann nicht weitertransportiert werden – entweder weil der Darm verschlossen ist (Darmverschluss) oder weil die Darmmuskulatur stillsteht (Darmlähmung)."},{"typ":"karteikarte","quelle":["i-care S. 218"],"erklaerung":"","id":"dickdarm-kk-2303b4","vorne":"Auf welcher Seite sollte ein Patient bei einem Einlauf liegen?","hinten":"Möglichst auf der linken Seite. Dann kann die Flüssigkeit der Schwerkraft folgend ins Kolon laufen."},{"typ":"karteikarte","quelle":["i-care S. 219"],"erklaerung":"","id":"dickdarm-kk-8a4c80","vorne":"Warum sollte man mit hellrotem Blut am Toilettenpapier früh zum Arzt gehen?","hinten":"Oft sind es Hämorrhoiden. Blutungen aus dem After können aber auch schwerwiegendere Ursachen haben, z. B. einen Darmtumor."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 215, 220"],"erklaerung":"","id":"dickdarm-op-aufgaben","operator":"beschreiben","afb":"I","fall":"Robartina erklärt Alaa nach dem Unterricht den Unterschied zwischen Dünn- und Dickdarm. Alaa fragt: „Und was macht der Dickdarm dann noch, wenn die Nährstoffe schon aufgenommen sind?“","auftrag":"Beschreibe die Abschnitte und die Aufgaben des Dickdarms.","mindestlaenge":250,"kriterien":["Ich nenne Blinddarm mit Wurmfortsatz, Kolon und Rektum.","Ich nenne den Wasserentzug und die Entstehung des Stuhls.","Ich nenne die Darmflora und eine ihrer Leistungen.","Ich nenne das Speichern und Ausscheiden des Stuhls."],"musterloesung":"Der Dickdarm besteht aus dem **Blinddarm** mit dem Wurmfortsatz, dem **Kolon** und dem **Rektum** mit dem Analkanal. Im Dickdarm wird dem Speisebrei **Wasser entzogen**; so entsteht der **Stuhl**. Die Bakterien der **Darmflora** zersetzen den Darminhalt, spalten einige Ballaststoffe auf und bilden Vitamin K. Der Stuhl wird im Rektum **gespeichert** und schließlich **ausgeschieden**."},{"typ":"operator","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-op-antibiotika","operator":"erläutern","afb":"II","fall":"Eine Patientin bekommt seit drei Tagen ein Antibiotikum. Jetzt hat sie Durchfall und fragt Robartina besorgt: „Ich nehme das doch gegen meine Blasenentzündung. Was hat das mit meinem Darm zu tun?“","auftrag":"Erläutere, warum Antibiotika als Nebenwirkung Durchfall auslösen können.","mindestlaenge":300,"kriterien":["Ich erkläre, was die Darmflora ist.","Ich erkläre, dass Antibiotika nicht zwischen krankmachenden Bakterien und der Darmflora unterscheiden.","Ich erkläre, dass dadurch weniger Ballaststoffe abgebaut werden.","Ich erkläre, dass weniger Wasser aufgenommen wird und der Stuhl flüssiger wird."],"musterloesung":"Die Schleimhaut des Dickdarms ist von vielen Bakterien besiedelt, der **Darmflora**. Sie spaltet unter anderem Ballaststoffe auf. **Antibiotika** können nicht zwischen krankmachenden Bakterien und den Bakterien der Darmflora unterscheiden. Deshalb werden auch einige Bakterien der Darmflora abgetötet, und die Besiedlung des Darms gerät aus dem Gleichgewicht. Dann werden **weniger Ballaststoffe abgebaut**. Sie bleiben im Darm, und es wird **weniger Wasser** aus dem Dickdarm aufgenommen. Der Stuhl wird flüssiger – es kommt zu **Durchfall**."},{"typ":"operator","quelle":["i-care S. 220"],"erklaerung":"","id":"dickdarm-op-obstipation","operator":"beurteilen","afb":"III","fall":"Herr W. (74) klagt über Verstopfung. Er trinkt wenig, isst am liebsten Weißbrot und sitzt fast den ganzen Tag im Sessel. Er bittet Robartina: „Besorgen Sie mir einfach ein starkes Abführmittel, dann ist das Problem gelöst.“","auftrag":"Beurteile den Wunsch von Herrn W. mithilfe der Informationen aus dem Buch.","mindestlaenge":350,"kriterien":["Ich nenne die Faktoren, die bei Herrn W. die Verstopfung begünstigen (wenig Bewegung, wenig Flüssigkeit, ballaststoffarme Kost).","Ich erkläre, dass sich die Behandlung nach den Ursachen richtet.","Ich nenne die Änderung der Lebens- und Ernährungsgewohnheiten als ersten Schritt.","Ich ordne Abführmittel als Möglichkeit ein, wenn das nicht gelingt.","Ich komme zu einem begründeten Urteil."],"musterloesung":"Eine Verstopfung wird durch **mangelnde Bewegung**, **geringe Flüssigkeitszufuhr** und **ballaststoffarme Ernährung** begünstigt. Alle drei Faktoren treffen auf Herrn W. zu. Laut Buch richtet sich die Behandlung nach den **Ursachen**: Einfache Verstopfungen lassen sich meist durch eine **Änderung der Lebensumstände und der Ernährungsgewohnheiten** bessern, also mehr Bewegung, mehr Trinken und ballaststoffreichere Kost. Erst wenn das nicht gelingt, können abführende Medikamente eingesetzt werden. **Urteil:** Der Wunsch von Herrn W. ist verständlich, löst aber die Ursachen nicht. Sinnvoller ist es, zuerst seine Gewohnheiten zu ändern. Über ein Abführmittel entscheidet der Arzt."}],"status":"aktiv"},{"id":"pankreas","titel":"Pankreas","block":2,"nr":5,"organ":"","beschreibung":"Die Bauchspeicheldrüse und ihre Verdauungsenzyme.","quellen":"i-care S. 221–224; MKK S. 359, 367–368","icon":"pankreas","farbe":"#2A473B","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-sc-name","frage":"Welches Organ ist mit „Pankreas“ gemeint?","optionen":[{"text":"die Bauchspeicheldrüse","richtig":true},{"text":"die Gallenblase","richtig":false},{"text":"die Ohrspeicheldrüse","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-sc-wohin","frage":"Wohin gibt das Pankreas seinen Verdauungssaft ab?","optionen":[{"text":"in den Zwölffingerdarm","richtig":true},{"text":"in den Magen","richtig":false},{"text":"in den Dickdarm","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 223"],"erklaerung":"Er enthält Bikarbonat und neutralisiert so den sauren Speisebrei aus dem Magen.","id":"pankreas-sc-basisch","frage":"Wie ist der Pankreassaft beschaffen?","optionen":[{"text":"basisch","richtig":true},{"text":"stark sauer","richtig":false},{"text":"fettig","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 367"],"erklaerung":"","id":"pankreas-sc-insulin","frage":"Welches Hormon des Pankreas senkt den Blutzucker?","optionen":[{"text":"[[Insulin]]","richtig":true},{"text":"[[Glukagon]]","richtig":false},{"text":"Gastrin","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-sc-vorstufen","frage":"Warum bildet das Pankreas seine eiweißspaltenden Enzyme als inaktive Vorstufen?","optionen":[{"text":"damit es sich nicht selbst verdaut","richtig":true},{"text":"damit der Saft besser schmeckt","richtig":false},{"text":"damit die Enzyme im Magen wirken können","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-sc-inseln","frage":"Wie heißen die Zellgruppen des Pankreas, die Hormone bilden?","optionen":[{"text":"Langerhans-Inseln","richtig":true},{"text":"Zotten","richtig":false},{"text":"Belegzellen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-sc-exokrin","frage":"Was bildet der [[exokrin|exokrine]] Teil des Pankreas?","optionen":[{"text":"den Verdauungssaft","richtig":true},{"text":"die Hormone","richtig":false},{"text":"die Galle","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-sc-lage","frage":"Wo liegt das Pankreas?","optionen":[{"text":"im Oberbauch hinter dem Magen","richtig":true},{"text":"im rechten Unterbauch","richtig":false},{"text":"im Becken","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 224"],"erklaerung":"","id":"pankreas-sc-pankreatitis","frage":"Was passiert bei einer [[Pankreatitis]]?","optionen":[{"text":"Die Verdauungsenzyme greifen das Pankreas selbst an.","richtig":true},{"t
