<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'">
<title>Verdauung lernen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c9820f'/%3E%3Cpath d='M11 9c6-2 11 1 10 6s-8 3-8 8 5 2 8 1' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Farben, Schriften, Hell/Dunkel – Palette aus dem Prototyp übernommen */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f3f5f8; --line:#d3d9e2;
  --fg:#141b25; --muted:#556275; --accent:#a8680a; --accent-fg:#ffffff; --accent-soft:#f8e7c6;
  --ok:#17784e; --ok-soft:#dcf1e6; --bad:#b3312f; --bad-soft:#f8dfdf; --info-soft:#e2ecfa;
  --shadow:0 1px 2px rgba(20,27,37,.06),0 6px 20px rgba(20,27,37,.07);
  --f-display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:16px; --leiste-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d26; --surface-2:#1d2631; --line:#2c3845;
  --fg:#e7ecf2; --muted:#9aa7b8; --accent:#f2b544; --accent-fg:#1b1305; --accent-soft:#3a2e17;
  --ok:#4cc38a; --ok-soft:#173327; --bad:#ef6b6b; --bad-soft:#3a1d1f; --info-soft:#1a2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d26; --surface-2:#1d2631; --line:#2c3845;
  --fg:#e7ecf2; --muted:#9aa7b8; --accent:#f2b544; --accent-fg:#1b1305; --accent-soft:#3a2e17;
  --ok:#4cc38a; --ok-soft:#173327; --bad:#ef6b6b; --bad-soft:#3a1d1f; --info-soft:#1a2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-bottom:calc(var(--leiste-h) + env(safe-area-inset-bottom) + 24px)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,5.5vw,2.6rem)}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.muted{color:var(--muted)}
.klein{font-size:.88rem}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.stapel{display:flex;flex-direction:column;gap:14px}
.reihe{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reihe.zw{justify-content:space-between}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* Kopf, Hauptbereich, untere Navigationsleiste */
.kopf{position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.kopf-innen{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-decoration:none;letter-spacing:.01em;margin-right:auto}
.logo span{color:var(--accent);margin-left:.25em}
.rang-chip{display:flex;align-items:center;gap:8px;font-size:.85rem;min-width:0}
.rang-chip b{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.rang-chip .xpz{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

main:focus,main:focus-visible{outline:none}
main{max-width:980px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:24px;outline:none}

.leiste{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(var(--leiste-h) + env(safe-area-inset-bottom))}
.leiste a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--muted)}
.leiste a[aria-current="page"]{color:var(--accent)}
.leiste .ni svg{width:24px;height:24px}
@media (min-width:900px){
  body{padding-bottom:24px}
  .leiste{position:sticky;top:61px;bottom:auto;height:auto;max-width:980px;margin:0 auto;display:flex;gap:4px;background:var(--bg);border:0;padding:8px 16px;z-index:19}
  .leiste a{flex-direction:row;gap:8px;padding:8px 14px;border-radius:10px;font-size:.95rem}
  .leiste a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
  .leiste .ni svg{width:20px;height:20px}
}
@media (max-width:440px){
  .logo{font-size:1.05rem}
  .rang-chip b{max-width:none;font-size:.95rem}
  .rang-chip .xpz{display:none}
}

/* Wiederverwendbare Bausteine */
.kopf{background:var(--bg)}
@supports (background:color-mix(in srgb,red 50%,blue)){.kopf{background:color-mix(in srgb,var(--bg) 88%,transparent)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:.55rem 1rem;font-weight:600;text-decoration:none;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primaer{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primaer:hover{filter:brightness(1.07)}
.btn.gefahr{color:var(--bad);border-color:var(--bad)}
.btn.klein{min-height:36px;padding:.3rem .75rem;font-size:.9rem}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,3vw,24px);box-shadow:var(--shadow)}
.karte.flach{box-shadow:none}
.hinweis{border-radius:12px;padding:12px 14px;background:var(--info-soft);font-size:.95rem}
.hinweis.gold{background:var(--accent-soft)}
.hinweis.ok{background:var(--ok-soft)}
.hinweis.nein{background:var(--bad-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:.18rem .6rem;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--fg)}
.chip.gold{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
.chip svg{width:14px;height:14px}

.balken{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.balken i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}

/* Kopf einer Seite */
.seitenkopf{display:flex;flex-direction:column;gap:6px}
.zurueck{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--muted);text-decoration:none;font-size:.95rem;width:max-content}
.zurueck svg{width:18px;height:18px}

/* Rangkarte auf der Startseite */
.rangkarte{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.rangkarte .stufe{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.rangkarte .balken{grid-column:1/-1}

/* Blöcke und Modulkarten */
.block-kopf{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.module{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.modul{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0}
a.modul:hover{border-color:var(--accent)}
.modul.zu{opacity:.6;border-style:dashed;background:transparent}
.modul .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.modul .ic svg{width:26px;height:26px}
.modul h3{font-size:1.12rem}
.modul .fuss{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Übungsmodi auf der Modulseite */
.modi{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.modus{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none}
.modus:hover{border-color:var(--accent)}
.modus svg{width:26px;height:26px;flex:none;color:var(--accent)}
.modus b{display:block;font-family:var(--f-display);font-size:1.08rem}
.modus span{font-size:.88rem;color:var(--muted)}

/* Fachbegriffe */
.begriff{border:0;background:none;padding:0;font-weight:600;text-decoration:underline dotted 2px;text-underline-offset:3px;color:inherit;cursor:help}
.begriff:hover{color:var(--accent)}
.lies{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.lies svg{width:16px;height:16px;flex:none}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--fg);max-width:min(560px,calc(100vw - 32px));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog .d-innen{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow:auto}
dialog .d-kopf{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

/* Formulare */
.feld{display:flex;flex-direction:column;gap:6px}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%;min-height:44px}
textarea{min-height:200px;resize:vertical;line-height:1.55}
.wahl{display:grid;gap:10px}
.wahl label{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;background:var(--surface-2);cursor:pointer}
.wahl input{width:20px;height:20px;accent-color:var(--accent)}

/* Tabelle (Nachweis) */
table.liste{width:100%;border-collapse:collapse;font-size:.95rem}
table.liste th,table.liste td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.liste th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pruefcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;letter-spacing:.12em;font-weight:700}

/* Award-Wand, Plaketten, Feier-Animation, Glossar */
.wand{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.award{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.award:hover{background:var(--surface-2)}
.award .plakette{width:88px;height:88px;transition:transform .25s ease}
.award:hover .plakette{transform:scale(1.05) rotate(-3deg)}
.award.zu .plakette{filter:grayscale(1) brightness(.8);opacity:.38}
.award .schloss{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.award .schloss svg{width:16px;height:16px}
.award .n{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15}
.award .d{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{width:70%;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.mini i{display:block;height:100%;background:var(--muted)}

.feier{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.plakette.gross{width:150px;height:150px}
.plakette.grau{filter:grayscale(1);opacity:.5}
.feier .fakt{max-width:44ch}
dialog[open] .feier .plakette.gross:not(.grau){animation:plakette-rein .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes plakette-rein{
  0%{transform:scale(.2) rotate(-40deg);opacity:0;filter:drop-shadow(0 0 0 transparent)}
  60%{transform:scale(1.12) rotate(6deg);opacity:1;filter:drop-shadow(0 0 18px var(--accent))}
  100%{transform:scale(1) rotate(0);filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
}
@media (prefers-reduced-motion: reduce){
  dialog[open] .feier .plakette.gross:not(.grau){animation:plakette-sanft .4s ease both}
  @keyframes plakette-sanft{from{opacity:0}to{opacity:1}}
}

.glossar{margin:0;display:grid;gap:10px}
.g-eintrag{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.g-eintrag dt{font-weight:700}
.g-eintrag dd{margin:4px 0 0;display:flex;flex-direction:column;gap:4px}

@media print{.nachweis{display:none}.nachweis-druck::after{content:"Der Nachweis wird nur auf dem Bildschirm angezeigt."}}

/* Aufgaben: Auswahl, Zuordnung, Reihenfolge, Lückentext, Rückmeldung, Karteikarten, Quiz */
.aufgabe{max-width:760px;width:100%;margin:0 auto}
.frage{font-size:1.15rem;font-weight:600;max-width:62ch}
.kennung{display:block;font-size:.85rem;font-weight:700;color:var(--accent);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
fieldset.optionen{border:0;padding:0;margin:0;display:grid;gap:8px}
fieldset.optionen legend{padding:0;margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.75rem .9rem;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{width:20px;height:20px;margin-top:.15rem;flex:none;accent-color:var(--accent)}

/* Markierung nach dem Prüfen: Farbe UND Symbol */
.richtig{background:var(--ok-soft)!important;border-color:var(--ok)!important}
.falsch{background:var(--bad-soft)!important;border-color:var(--bad)!important}
.fehlt{border-color:var(--ok)!important;border-style:dashed!important}
.opt.richtig::after,.zrow.richtig::after,.reihenfolge li.richtig::after{content:"✓";margin-left:auto;font-weight:800;color:var(--ok)}
.opt.falsch::after,.zrow.falsch::after,.reihenfolge li.falsch::after{content:"✗";margin-left:auto;font-weight:800;color:var(--bad)}
.opt.fehlt::after{content:"fehlt";margin-left:auto;font-size:.8rem;font-weight:700;color:var(--ok)}

.zuordnung{display:grid;gap:8px}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.55rem .8rem}
.zrow label{font-weight:600}
@media (max-width:540px){.zrow{grid-template-columns:1fr auto}.zrow select{grid-column:1}}

.reihenfolge{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reihenfolge li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.45rem .5rem .45rem .8rem}
.reihenfolge li:focus-visible{outline:3px solid var(--accent)}
.reihenfolge .nr{font-family:var(--f-display);font-weight:700;color:var(--muted);width:1.3rem;font-variant-numeric:tabular-nums}
.reihenfolge .t{flex:1;min-width:0}
.reihenfolge .icon-btn{width:40px;height:40px}
.reihenfolge .icon-btn:disabled{opacity:.3}

.lueckentext{line-height:2.4;font-size:1.05rem}
.luecke{display:inline-block;width:auto;min-height:38px;padding:.2rem .5rem;margin:0 .15rem;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);max-width:100%}
.korrektur{font-weight:700;color:var(--ok)}

.rueck{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rueck.ok{background:var(--ok-soft)}
.rueck.nein{background:var(--bad-soft)}
.rueck > b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.2rem}
.rueck > b svg{width:22px;height:22px}
.loesung{margin:0;padding-left:1.3rem}

.ergebnis{align-items:flex-start}
.prozent{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1}
.prozent.ok{color:var(--ok)}
.prozent.nein{color:var(--bad)}
.wiederholen{margin:0;padding-left:1.2rem;display:grid;gap:10px}

/* Karteikarten */
.faecher{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fach{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;display:flex;flex-direction:column}
.fach b{font-family:var(--f-display);font-size:1.3rem}
.kk{max-width:640px;width:100%;margin:0 auto}
.kk-text{font-size:1.15rem}
.kk-hinten{border-top:1px dashed var(--line);padding-top:12px}

/* Quiz auf Zeit */
.quiz-opts{display:grid;gap:8px;margin-top:10px}
.opt-btn{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.8rem 1rem;font-weight:500;min-height:48px}
.opt-btn:hover:not(:disabled){border-color:var(--accent)}
.opt-btn:disabled{cursor:default}
.aufstieg .stufe{font-family:var(--f-display);font-size:1.6rem;font-weight:700}

/* Operatoraufgaben, Fallarbeit, Spiele, Bildzuordnung */
.fall{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-style:italic;max-width:70ch;display:flex;flex-direction:column;gap:8px}
.fall .eyebrow{font-style:normal}
.auftrag{display:flex;flex-direction:column;gap:4px}
.muster{background:var(--info-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#datenschutz-op{display:inline-flex;gap:6px;align-items:center}
#datenschutz-op svg{width:16px;height:16px;flex:none}

/* Fehlerfahndung */
.bericht{background:var(--surface-2);border-radius:12px;padding:14px;line-height:1.9}
.satz{display:inline;border:0;background:none;padding:2px 3px;border-radius:6px;text-align:left;line-height:1.9;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.satz:hover:not(:disabled){background:var(--accent-soft)}
.satz[aria-pressed="true"]{background:var(--accent-soft);outline:2px solid var(--accent)}
.satz.richtig,.satz.falsch,.satz.fehlt{outline:2px solid}
.satz.fehlt{background:var(--ok-soft);outline-style:dashed;outline-color:var(--ok)}
.satz:disabled{cursor:default;color:inherit}
mark{background:var(--accent-soft);color:inherit;padding:0 3px;border-radius:4px}
.korr{margin-top:6px}

/* Diagnose */
.hinweise{margin:0;padding-left:1.3rem;display:grid;gap:8px}
.hinweise li{background:var(--surface-2);border-radius:10px;padding:8px 10px}

/* Enzym-Spiel */
.spielfeld{position:relative;height:min(58vh,440px);min-height:300px;background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.teil{position:absolute;transform:translateY(-50%);white-space:nowrap;border:2px solid var(--accent);background:var(--surface);color:var(--fg);
  border-radius:999px;padding:.5rem .95rem;font-weight:700;min-height:44px;box-shadow:var(--shadow)}
.teil:hover{background:var(--accent-soft)}
.teil.weg{transform:translateY(-50%) scale(.2);opacity:0;transition:transform .25s ease,opacity .25s ease}
.teil.falsch{border-color:var(--bad)}
.spielfeld.ruhig{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;padding:14px;height:auto;min-height:200px}
.spielfeld.ruhig .teil{position:static;transform:none}

/* Brötchen-Reise */
.route{list-style:none;margin:0;padding:0;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.route li{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);min-width:70px;text-align:center}
.route .punkt{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.route li.vorbei .punkt{background:var(--ok);border-color:var(--ok)}
.route li.jetzt{color:var(--fg);font-weight:700}
.route li.jetzt .punkt{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* Bildzuordnung */
.bildbox{position:relative;margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.bildbox img{display:block;width:100%;height:auto}
.marker{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font-weight:800;font-size:.9rem;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}

</style>

us (Speisebrei)!","quelle":["i-care S. 240"]},"Chymus":{"deutsch":"Speisebrei","erklaerung":"Entsteht im Magen durch Vermischung der Nahrung mit dem Magensaft. Nicht verwechseln mit Chylus (fetthaltige Lymphe)!","quelle":["i-care S. 205, 240"]},"Denaturierung":{"deutsch":"Strukturveränderung der Eiweiße","erklaerung":"Die Salzsäure des Magensafts zerstört die räumliche Struktur von Eiweißen, damit Enzyme sie leichter angreifen können.","quelle":["i-care S. 209, 239"]},"Disaccharide":{"deutsch":"Zweifachzucker","erklaerung":"Zucker aus zwei Bausteinen, z. B. Maltose, Laktose und Saccharose. Sie werden am Bürstensaum in Einfachzucker gespalten.","quelle":["MKK S. 361","i-care S. 238"]},"Duodenum":{"deutsch":"Zwölffingerdarm","erklaerung":"Erster Abschnitt des Dünndarms. Hier fließen Chymus, Pankreassaft und Galle zusammen.","quelle":["i-care S. 188, 214"]},"Emulgierung":{"deutsch":"feine Verteilung der Fette","erklaerung":"Fette werden durch Kauen, Magen- und Darmbewegungen und die Gallensäuren möglichst fein im Nahrungsbrei verteilt, damit Enzyme sie erreichen.","quelle":["i-care S. 240"]},"Enterozyten":{"deutsch":"Zellen der Dünndarmschleimhaut","erklaerung":"Die resorbierenden Epithelzellen des Dünndarms. Ihre Mikrovilli bilden den Bürstensaum.","quelle":["i-care S. 212","MKK S. 358"]},"essenziell":{"deutsch":"lebensnotwendig, muss mit der Nahrung aufgenommen werden","erklaerung":"Essenzielle Nahrungsbestandteile kann der Körper nicht oder nicht ausreichend selbst herstellen: Vitamine, Mineralstoffe, bestimmte Fett- und Aminosäuren.","quelle":["i-care S. 241"]},"Fundus":{"deutsch":"Magengrund","erklaerung":"Kuppelförmige Erweiterung des Magens unter dem Zwerchfell. Beim stehenden Menschen die höchstgelegene Region des Magens.","quelle":["MKK S. 354"]},"Gaster":{"deutsch":"Magen","erklaerung":"Auch Ventriculus genannt.","quelle":["i-care S. 205"]},"Glukoneogenese":{"deutsch":"Zuckerneubildung","erklaerung":"Die Leber bildet neue Glukose, z. B. aus Aminosäuren oder Laktat – nicht aber aus Fettsäuren.","quelle":["MKK S. 370–371","i-care S. 241"]},"Glukose":{"deutsch":"Traubenzucker","erklaerung":"Einfachzucker. Wichtigste Energiequelle des Körpers.","quelle":["MKK S. 370","i-care S. 241"]},"Glykogen":{"deutsch":"Speicherform der Glukose","erklaerung":"Bei Energieüberschuss wird Glukose in Leber und Muskulatur als Glykogen eingelagert.","quelle":["i-care S. 239","MKK S. 370"]},"Hypovitaminose":{"deutsch":"Vitaminmangelerkrankung","erklaerung":"Entsteht, wenn die Nahrung zu wenige Vitamine enthält oder ihre Aufnahme gestört ist. In Europa eher selten.","quelle":["i-care S. 243"]},"Kachexie":{"deutsch":"starke Abmagerung","erklaerung":"Bei unzureichender Ernährung älterer Menschen können hochkalorische Nahrungsergänzungen angeboten werden.","quelle":["i-care S. 247"]},"Kardia":{"deutsch":"Mageneingang","erklaerung":"Übergang von der Speiseröhre zum Magen, auch Magenmund genannt.","quelle":["i-care S. 205","MKK S. 354"]},"Korpus":{"deutsch":"Magenkörper","erklaerung":"Größter Teil des Magens.","quelle":["i-care S. 205","MKK S. 354"]},"Kurvatur":{"deutsch":"Krümmung","erklaerung":"Die große Kurvatur ist die nach außen gewölbte, die kleine Kurvatur die nach innen gewölbte Seite des Magens.","quelle":["MKK S. 354","i-care S. 208"]},"Laktose":{"deutsch":"Milchzucker","erklaerung":"Zweifachzucker, der durch die Laktase in Galaktose und Glukose gespalten wird.","quelle":["i-care S. 238"]},"Lipase":{"deutsch":"fettspaltendes Enzym","erklaerung":"Die Magenlipase spaltet 15–30 % der Nahrungsfette, die wichtigere Pankreaslipase den Rest.","quelle":["i-care S. 240","MKK S. 359"]},"Malabsorption":{"deutsch":"gestörte Aufnahme","erklaerung":"Die Aufnahme von Nährstoffen, z. B. Vitaminen, im Darm ist gestört.","quelle":["i-care S. 243"]},"Maltose":{"deutsch":"Malzzucker","erklaerung":"Zweifachzucker, der bei der Spaltung der Stärke durch die Amylase entsteht. Die Maltase spaltet ihn in zwei Glukosemoleküle.","quelle":["i-care S. 238"]},"Mikrovilli":{"deutsch":"Bürstensaum","erklaerung":"Dicht stehende Fortsätze der Enterozyten. Sie vergrößern die Oberfläche und tragen Verdauungsenzyme.","quelle":["i-care S. 210","MKK S. 358"]},"Mizellen":{"deutsch":"Gallensäure-Hüllen um Fettbestandteile","erklaerung":"Winzige Partikel aus Gallensäuren und Fettbestandteilen. Sie stellen den Kontakt zur Darmschleimhaut her.","quelle":["i-care S. 240–241","MKK S. 359"]},"Monosaccharide":{"deutsch":"Einfachzucker","erklaerung":"Glukose, Fruktose und Galaktose. Nur in dieser Form können Kohlenhydrate resorbiert werden.","quelle":["MKK S. 361","i-care S. 238"]},"Mukosa":{"deutsch":"Schleimhautschicht","erklaerung":"Innerste Schicht der Wand von Speiseröhre, Magen und Darm (Tunica mucosa).","quelle":["i-care S. 192"]},"Muskularis":{"deutsch":"Muskelschicht","erklaerung":"Schicht aus glatter Muskulatur (Tunica muscularis). Beim Magen besteht sie aus drei Schichten.","quelle":["i-care S. 192","MKK S. 354"]},"Pepsin":{"deutsch":"eiweißspaltendes Enzym des Magens","erklaerung":"Entsteht aus Pepsinogen. Spaltet Eiweiße in gröbere Bruchstücke.","quelle":["MKK S. 354–355"]},"Pepsinogen":{"deutsch":"Vorstufe von Pepsin","erklaerung":"Wird von den Hauptzellen gebildet und durch die Magensäure in Pepsin umgewandelt.","quelle":["i-care S. 209"]},"Peristaltik":{"deutsch":"wellenförmige Muskelbewegung","erklaerung":"Wiederkehrende Wellenbewegungen der Muskulatur, die den Inhalt weitertransportieren. Im Magen etwa alle 20 Sekunden in Richtung Pylorus.","quelle":["i-care S. 209","MKK S. 355"]},"Polysaccharide":{"deutsch":"Vielfachzucker","erklaerung":"Zucker aus vielen Bausteinen, z. B. Stärke. Sie müssen erst zerlegt werden, bevor sie resorbiert werden können.","quelle":["MKK S. 361","i-care S. 238"]},"Proteasen":{"deutsch":"eiweißspaltende Enzyme","erklaerung":"Enzyme des Pankreassafts wie Trypsin und Chymotrypsin. Sie werden als inaktive Vorstufen gebildet.","quelle":["i-care S. 223"]},"Pylorus":{"deutsch":"Magenpförtner","erklaerung":"Absch nung","quelle":["i-care S. 243–244"],"erklaerung":"","id":"naehrstoffe-zu-mineral","frage":"Ordne jedem Mineralstoff eine seiner Funktionen zu.","paare":[{"links":"Kalzium","rechts":"Baustein von Knochen und Zähnen"},{"links":"Kalium","rechts":"wichtigstes Kation in der Zelle"},{"links":"Natrium","rechts":"wichtigstes Kation außerhalb der Zellen"},{"links":"Jod","rechts":"Bestandteil der Schilddrüsenhormone"},{"links":"Eisen","rechts":"Bestandteil des roten Blutfarbstoffs"}]},{"typ":"zuordnung","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-zu-hormone","frage":"Ordne jedem Hormon seine Rolle bei Hunger und Sättigung zu.","paare":[{"links":"Cholecystokinin","rechts":"„Sättigungshormon“ aus dem Dünndarm"},{"links":"Ghrelin","rechts":"„Hungerhormon“, aktiviert das Hungerzentrum"},{"links":"Leptin","rechts":"aus dem Fettgewebe, wirkt langfristig"}]},{"typ":"reihenfolge","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-rf-wertigkeit","frage":"Ordne die Lebensmittel nach der biologischen Wertigkeit ihres Eiweißes – vom höchsten zum niedrigsten Wert.","schritte":["Vollei","Kartoffeln","Rindfleisch","Kuhmilch","Reis","Bohnen"]},{"typ":"reihenfolge","quelle":["i-care S. 245"],"erklaerung":"","id":"naehrstoffe-rf-taetigkeit","frage":"Ordne die Tätigkeiten nach ihrem ungefähren Energieverbrauch pro Stunde – vom niedrigsten zum höchsten.","schritte":["Schlafen","Spazierengehen (3 km/h)","Schwimmen (30 m/min)","Radfahren im Flachland (20 km/h)","gemächliches Laufen (8 km/h)","schnelles Laufen (15 km/h)"]},{"typ":"lückentext","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-lt-bmi","text":"Bei einem BMI über {{25|fünfundzwanzig}} spricht man von Übergewicht, bei einem BMI über {{30|dreißig}} von Fettleibigkeit ([[Adipositas]])."},{"typ":"lückentext","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-lt-edeka","text":"Die fettlöslichen Vitamine merkt man sich mit dem Namen einer Supermarktkette: {{EDeKA|Edeka}}. Der Körper kann sie nur resorbieren, wenn sie gleichzeitig mit {{fettreicher|fetthaltiger}} Nahrung aufgenommen werden."},{"typ":"lückentext","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-lt-mengen","text":"Täglich sollte man mindestens {{30|dreißig}} g Ballaststoffe zu sich nehmen. Die optimale Proteinzufuhr liegt bei {{1|einem|ein}} g pro Kilogramm Körpergewicht. Schwangere sollten täglich ungefähr {{300|dreihundert}} kcal zusätzlich zu sich nehmen."},{"typ":"fehlerfahndung","quelle":["i-care S. 242, 246, 248"],"erklaerung":"Im Alter sinkt der Energiebedarf, ältere Menschen benötigen aber genauso viele Nährstoffe. Unter normalen Umständen sollten täglich ungefähr 1,5 l getrunken werden. Vitamin C ist ein wasserlösliches Vitamin; es kommt in Obst, Gemüse und Kartoffeln vor.","id":"naehrstoffe-ff-frau-m","titel":"Robartinas Pflegebericht: Ernährung von Frau M.","bericht":"Frau M. (82) isst seit einigen Tagen sehr wenig. Ich habe ihr erklärt, dass ältere Menschen weniger Nährstoffe brauchen als jüngere. Sie soll täglich ungefähr 0,5 l trinken. Wegen ihrer starken Abmagerung habe ich mit Frau Abda besprochen, ob wir hochkalorische Nahrungsergänzungen anbieten. Als Quelle für Vitamin C habe ich ihr Butter empfohlen, weil Vitamin C fettlöslich ist.","fehler":[{"links":"weniger Nährstoffe","rechts":"genauso viel|gleich viel|genau so viel|die gleichen","loesung":"genauso viele Nährstoffe (nur weniger Energie)"},{"links":"0,5 l","rechts":"1,5|anderthalb|eineinhalb|1.5","loesung":"ungefähr 1,5 l"},{"links":"fettlöslich","rechts":"wasserlöslich","loesung":"wasserlöslich"}]}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-kk-e84ce5","vorne":"Was sind die Hauptbestandteile der Nahrung, und warum heißen sie „Brennstoffe“?","hinten":"Kohlenhydrate, Proteine und Fette. Der Körper kann aus ihnen Energie in Form von ATP gewinnen. Außerdem liefern sie Bausteine für körpereigene Stoffe."},{"typ":"karteikarte","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-kk-18b6ff","vorne":"Welche Nahrungsbestandteile sind [[essenziell]]?","hinten":"Vitamine, Mineralstoffe (Mengen- und Spurenelemente), bestimmte Fettsäuren und bestimmte Aminosäuren."},{"typ":"karteikarte","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-kk-0c863c","vorne":"Welche Vitamine sind fettlöslich, und wie kann man sie sich merken?","hinten":"Die Vitamine E, D, K und A – Merkhilfe: die Supermarktkette „EDeKA“."},{"typ":"karteikarte","quelle":["i-care S. 242","MKK S. 362"],"erklaerung":"","id":"naehrstoffe-kk-7cdf68","vorne":"Warum sollten fettlösliche Vitamine mit fetthaltiger Nahrung aufgenommen werden?","hinten":"Der Körper kann sie nur dann resorbieren. Im Darm sind sie nur über die Mizellenbildung in Gegenwart anderer Fette aufnehmbar."},{"typ":"karteikarte","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-kk-ae03a9","vorne":"Welches Vitamin kann der Körper als einziges in ausreichender Menge selbst herstellen?","hinten":"Vitamin D3. Sein Ausgangsstoff wird bei ausreichender Sonneneinstrahlung in der Haut aus Cholesterin gebildet."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-119cfe","vorne":"Warum müssen Veganer besonders auf Vitamin B12 achten?","hinten":"Vitamin B12 ist nur in tierischen Produkten enthalten. Veganer müssen es ggf. über Nahrungsergänzungsmittel aufnehmen."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-45c694","vorne":"Wer hat einen erhöhten Bedarf an Folsäure (Vitamin B9), und was kann ein Mangel bewirken?","hinten":"Schwangere. Ein Folsäuremangel kann beim Kind zu einem offenen Rücken (Spina bifida) führen."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-642446","vorne":"Welche Krankheit entsteht bei einem Mangel an Vitamin C?","hinten":"Skorbut. Durch die gestörte Kollagensynthese kommt es u. a. zu Zahnausfall."},{"typ":"karteikarte","quelle":["i-care S. 243–244"],"erklaerung":"","id":"naehrstoffe-kk-621b49","vorne":"Was ist der Unterschied zwischen Mengen- und Spurenelementen?","hinten":"Mengenelemente kommen in größerer Menge im Körper vor (z. B. Kalzium, Kalium, Natrium). Spurenelemente nur in geringen Mengen (z. B. Eisen, Jod, Fluor)."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-dad3cd","vorne":"Welche Fettsäuren sind vor allem [[essenziell]], und wo kommen sie vor?","hinten":"Die Omega-6-Fettsäure Linolsäure und die Omega-3-Fettsäure Linolensäure. Sie kommen v. a. in pflanzlichen Ölen (Raps-, Oliven-, Nussöl) und in Fisch vor."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-0ce18f","vorne":"Wie viele der 20 Aminosäuren sind [[essenziell]]?","hinten":"8 Aminosäuren, z. B. Valin, Leucin und Tryptophan."},{"typ":"karteikarte","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-kk-0814b2","vorne":"Was ist der Grundumsatz, und unter welchen Bedingungen wird er bestimmt?","hinten":"Die Energie, die ein gesunder Erwachsener für seine lebenswichtigen Organfunktionen braucht. Bestimmung: liegend, in völliger Ruhe, bei normaler Körpertemperatur und 27–31 °C Außentemperatur, morgens 12–14 Stunden nach der letzten Mahlzeit."},{"typ":"karteikarte","quelle":["i-care S. 245"],"erklaerung":"","id":"naehrstoffe-kk-37c2f6","vorne":"Was ist der Arbeitsumsatz?","hinten":"Grundumsatz plus die Energie für alle Aktivitäten und für das Wachstum. Bei schwerer körperlicher Arbeit kann er bis auf das 3-Fache des Grundumsatzes ansteigen."},{"typ":"karteikarte","quelle":["i-care S. 245"],"erklaerung":"","id":"naehrstoffe-kk-e877ff","vorne":"Welche Brennwerte haben 1 g Kohlenhydrate, Fett, Eiweiß und Alkohol?","hinten":"Kohlenhydrate 17 kJ (4 kcal), Fett 39 kJ (9 kcal), Eiweiß 17 kJ (4 kcal), Alkohol 30 kJ (7 kcal)."},{"typ":"karteikarte","quelle":["i-care S. 245"],"erklaerung":"","id":"naehrstoffe-kk-938b81","vorne":"Wie rechnet man Kilokalorien in Kilojoule um?","hinten":"1 kcal entspricht 4,2 kJ."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-5c2d98","vorne":"Wie viele Ballaststoffe sollte man täglich mindestens zu sich nehmen?","hinten":"Mindestens 30 g."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-bda0b7","vorne":"Was gibt die biologische Wertigkeit eines Nahrungseiweißes an?","hinten":"Wie viel körpereigenes Protein aus 100 g des Nahrungseiweißes gebildet werden kann. Vergleichseiweiß ist das Hühnereiweiß mit dem Wert 100."},{"typ":"karteikarte","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-kk-42dc17","vorne":"Wie viel Flüssigkeit sollte man unter normalen Umständen täglich trinken?","hinten":"Ungefähr 1,5 l – bei Hitze oder großer Anstrengung entsprechend mehr."},{"typ":"karteikarte","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-kk-8a171d","vorne":"Welche Hormone steuern Hunger und Sättigung?","hinten":"Cholecystokinin gilt als „Sättigungshormon“, Ghrelin als „Hungerhormon“. Langfristig wirkt Leptin aus dem Fettgewebe: Es hemmt das Hungerzentrum."},{"typ":"karteikarte","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-kk-e2ebe5","vorne":"Wie berechnet man den Body-Mass-Index (BMI)?","hinten":"Körpergewicht in kg geteilt durch das Quadrat der Körpergröße in m. Über 25: Übergewicht, über 30: [[Adipositas]]."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 241, 243–244"],"erklaerung":"","id":"naehrstoffe-op-essenziell","operator":"beschreiben","afb":"I","fall":"Alaa liest auf einer Müslipackung „mit essenziellen Nährstoffen“. Er fragt Robartina in der Pause: „Was heißt eigentlich essenziell – und welche Stoffe sind das?“","auftrag":"Beschreibe, was essenzielle Nahrungsbestandteile sind, und nenne die vier Gruppen mit je einem Beispiel aus dem Buch.","mindestlaenge":300,"kriterien":["Ich erkläre, dass der Körper diese Stoffe nicht oder nicht ausreichend selbst herstellen kann.","Ich erkläre, dass sie deshalb mit der Nahrung aufgenommen werden müssen.","Ich nenne Vitamine und Mineralstoffe (Mengen- und Spurenelemente).","Ich nenne bestimmte Fettsäuren und bestimmte Aminosäuren.","Ich nenne zu jeder Gruppe ein passendes Beispiel."],"musterloesung":"Essenzielle Nahrungsbestandteile sind Stoffe, die der Körper nicht oder nicht in ausreichender Menge selbst herstellen kann. Weil sie lebensnotwendig sind, müssen sie mit der Nahrung aufgenommen werden. Dazu gehören: **Vitamine** (z. B. Vitamin C), **Mineralstoffe**, also Mengenelemente (z. B. Kalzium) und Spurenelemente (z. B. Eisen), **bestimmte Fettsäuren** (z. B. die Omega-3-Fettsäure Linolensäure) und **bestimmte Aminosäuren** (z. B. Tryptophan – 8 der 20 Aminosäuren sind essenziell)."},{"typ":"operator","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-op-vegan","operator":"erläutern","afb":"II","fall":"Robartinas Mitschüler Alaa ernährt sich seit Kurzem vegan, also ohne Fleisch, Fisch, Milchprodukte und Eier. Frau Abda sagt zu ihm: „Das kann man gut machen – aber du musst bei zwei Dingen besonders aufpassen.“","auftrag":"Erläutere, worauf Alaa bei einer veganen Ernährung laut Buch besonders achten muss und warum.","mindestlaenge":400,"kriterien":["Ich nenne Vitamin B12 und erkläre, dass es nur in tierischen Produkten enthalten ist.","Ich nenne mögliche Nahrungsergänzungsmittel.","Ich nenne die essenziellen Aminosäuren und dass sie vor allem in tierischen Produkten vorkommen.","Ich erkläre, dass der Bedarf durch eine geeignete Zusammenstellung pflanzlicher Lebensmittel gedeckt werden kann.","Ich verwende die Fachbegriffe korrekt."],"musterloesung":"**Vitamin B12:** Vitamin B12 (Cobalamin) ist nur in tierischen Produkten enthalten. Veganer müssen deshalb besonders darauf achten, dass sie – ggf. über Nahrungsergänzungsmittel – genügend Vitamin B12 aufnehmen. **Essenzielle Aminosäuren:** 8 der 20 Aminosäuren kann der Körper nicht selbst bilden. Sie kommen vor allem in tierischen Produkten (Fleisch, Milchprodukte, Eier) vor. Der Bedarf lässt sich aber bei einer geeigneten Zusammenstellung auch über pflanzliche Lebensmittel decken. Veganer müssen ihre Mahlzeiten deshalb sorgfältig zusammenstellen, damit kein Mangel an essenziellen Aminosäuren entsteht."},{"typ":"operator","quelle":["i-care S. 246–247"],"erklaerung":"","id":"naehrstoffe-op-alter","operator":"beurteilen","afb":"III","fall":"Frau M. (82) liegt auf Robartinas Station. Sie isst seit Tagen sehr wenig, weil ihre Zahnprothese drückt, und hat sichtbar abgenommen. Robartina meint zu Alaa: „Ältere Menschen verbrauchen doch sowieso weniger Energie. Dann ist es nicht so schlimm, wenn sie wenig isst.“","auftrag":"Beurteile Robartinas Aussage mithilfe der Informationen aus dem Buch.","mindestlaenge":500,"kriterien":["Ich bestätige, dass der Energiebedarf im Alter sinkt, und begründe das mit dem geringeren Muskelanteil und Grundumsatz.","Ich erkläre, dass ältere Menschen trotzdem genauso viele Nährstoffe benötigen.","Ich nenne Probleme wie Zahnprothesen oder schwierige Selbstversorgung, die zu Untergewicht oder Mangelerscheinungen führen können.","Ich nenne mögliche Maßnahmen (z. B. hochkalorische Nahrungsergänzungen bei Kachexie).","Ich komme zu einem begründeten Urteil über Robartinas Aussage."],"musterloesung":"Robartina hat teilweise recht: Im Alter **sinkt der Energiebedarf**, weil der Muskelanteil abnimmt und sich dadurch der Grundumsatz verringert. Ältere Menschen kommen deshalb mit weniger Kalorien aus. Sie benötigen aber **genauso viele Nährstoffe** wie jüngere, deshalb ist eine abwechslungsreiche und vollwertige Kost wichtig. Viele ältere Menschen haben zudem Schwierigkeiten bei der Selbstversorgung oder **wegen Zahnprothesen beim Essen**. Das kann zu **Untergewicht oder Mangelerscheinungen** führen – genau das zeichnet sich bei Frau M. ab. Pflegende sollen gute Voraussetzungen für eine ausgewogene Ernährung und ausreichende Energie- und Flüssigkeitszufuhr schaffen. Bei unzureichender Ernährung und starker Abmagerung ([[Kachexie]]) können hochkalorische Nahrungsergänzungen angeboten werden. **Urteil:** Robartinas Schlussfolgerung ist falsch. Der geringere Energiebedarf rechtfertigt nicht, dass Frau M. kaum isst. Ihr drohen eine Mangelernährung und weiterer Gewichtsverlust, deshalb sollte das Problem mit der Prothese gelöst und ihre Ernährung beobachtet werden."}],"status":"aktiv"},{"id":"aufbau","titel":"Aufgaben und Aufbau des Verdauungssystems","block":1,"nr":2,"organ":"","beschreibung":"Vom Mund bis zum After: der Weg der Nahrung im Überblick.","quellen":"i-care S. 188–192; MKK S. 344–347","icon":"verdauungstrakt","farbe":"#3b7dd8","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"mundhoehle","titel":"Mundhöhle und Speiseröhre","block":2,"nr":1,"organ":"","beschreibung":"Zähne, Zunge, Speichel und Schlucken.","quellen":"i-care S. 193–205; MKK S. 347–354","icon":"mund","farbe":"#d8573b","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"magen","titel":"Magen","block":2,"nr":2,"organ":"","beschreibung":"Magensaft, Magenschleimhaut und Magenentleerung.","quellen":"i-care S. 205–209; MKK S. 353–357","icon":"magen","farbe":"#c9820f","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 207"],"erklaerung":"Die Belegzellen (Parietalzellen) bilden die Salzsäure und den Intrinsic Factor. Die Hauptzellen bilden Pepsinogen und Magenlipase.","id":"magen-sc-belegzellen","frage":"Welche Zellen der Magendrüsen bilden die Salzsäure?","optionen":[{"text":"Hauptzellen","richtig":false},{"text":"Belegzellen","richtig":true},{"text":"Nebenzellen","richtig":false},{"text":"ECL-Zellen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-sc-lage","frage":"Wo liegt der Magen?","optionen":[{"text":"intraperitoneal im linken Oberbauch","richtig":true},{"text":"retroperitoneal im linken Oberbauch","richtig":false},{"text":"intraperitoneal im rechten Oberbauch","richtig":false},{"text":"retroper
