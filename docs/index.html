<style>
/* Farben, Schriften, Hell/Dunkel – Palette aus dem Prototyp übernommen */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f3f5f8; --line:#d3d9e2;
  --fg:#141b25; --muted:#556275; --accent:#a8680a; --accent-fg:#ffffff; --accent-soft:#f8e7c6;
  --ok:#17784e; --ok-soft:#dcf1e6; --bad:#b3312f; --bad-soft:#f8dfdf; --info-soft:#e2ecfa;
  --shadow:0 1px 2px rgba(20,27,37,.06),0 6px 20px rgba(20,27,37,.07);
  --f-display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:16px; --leiste-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d26; --surface-2:#1d2631; --line:#2c3845;
  --fg:#e7ecf2; --muted:#9aa7b8; --accent:#f2b544; --accent-fg:#1b1305; --accent-soft:#3a2e17;
  --ok:#4cc38a; --ok-soft:#173327; --bad:#ef6b6b; --bad-soft:#3a1d1f; --info-soft:#1a2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d26; --surface-2:#1d2631; --line:#2c3845;
  --fg:#e7ecf2; --muted:#9aa7b8; --accent:#f2b544; --accent-fg:#1b1305; --accent-soft:#3a2e17;
  --ok:#4cc38a; --ok-soft:#173327; --bad:#ef6b6b; --bad-soft:#3a1d1f; --info-soft:#1a2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-bottom:calc(var(--leiste-h) + env(safe-area-inset-bottom) + 24px)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,5.5vw,2.6rem)}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.muted{color:var(--muted)}
.klein{font-size:.88rem}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.stapel{display:flex;flex-direction:column;gap:14px}
.reihe{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reihe.zw{justify-content:space-between}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* Kopf, Hauptbereich, untere Navigationsleiste */
.kopf{position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.kopf-innen{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-decoration:none;letter-spacing:.01em;margin-right:auto}
.logo span{color:var(--accent);margin-left:.25em}
.rang-chip{display:flex;align-items:center;gap:8px;font-size:.85rem;min-width:0}
.rang-chip b{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.rang-chip .xpz{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

main{max-width:980px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:24px;outline:none}

.leiste{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(var(--leiste-h) + env(safe-area-inset-bottom))}
.leiste a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--muted)}
.leiste a[aria-current="page"]{color:var(--accent)}
.leiste .ni svg{width:24px;height:24px}
@media (min-width:900px){
  body{padding-bottom:24px}
  .leiste{position:sticky;top:61px;bottom:auto;height:auto;max-width:980px;margin:0 auto;display:flex;gap:4px;background:transparent;border:0;padding:8px 16px 0}
  .leiste a{flex-direction:row;gap:8px;padding:8px 14px;border-radius:10px;font-size:.95rem}
  .leiste a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
  .leiste .ni svg{width:20px;height:20px}
}

/* Wiederverwendbare Bausteine */
.kopf{background:var(--bg)}
@supports (background:color-mix(in srgb,red 50%,blue)){.kopf{background:color-mix(in srgb,var(--bg) 88%,transparent)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:.55rem 1rem;font-weight:600;text-decoration:none;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primaer{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primaer:hover{filter:brightness(1.07)}
.btn.gefahr{color:var(--bad);border-color:var(--bad)}
.btn.klein{min-height:36px;padding:.3rem .75rem;font-size:.9rem}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,3vw,24px);box-shadow:var(--shadow)}
.karte.flach{box-shadow:none}
.hinweis{border-radius:12px;padding:12px 14px;background:var(--info-soft);font-size:.95rem}
.hinweis.gold{background:var(--accent-soft)}
.hinweis.ok{background:var(--ok-soft)}
.hinweis.nein{background:var(--bad-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:.18rem .6rem;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--fg)}
.chip.gold{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
.chip svg{width:14px;height:14px}

.balken{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.balken i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}

/* Kopf einer Seite */
.seitenkopf{display:flex;flex-direction:column;gap:6px}
.zurueck{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--muted);text-decoration:none;font-size:.95rem;width:max-content}
.zurueck svg{width:18px;height:18px}

/* Rangkarte auf der Startseite */
.rangkarte{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.rangkarte .stufe{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.rangkarte .balken{grid-column:1/-1}

/* Blöcke und Modulkarten */
.block-kopf{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.module{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.modul{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0}
a.modul:hover{border-color:var(--accent)}
.modul.zu{opacity:.6;border-style:dashed;background:transparent}
.modul .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.modul .ic svg{width:26px;height:26px}
.modul h3{font-size:1.12rem}
.modul .fuss{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Übungsmodi auf der Modulseite */
.modi{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.modus{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none}
.modus:hover{border-color:var(--accent)}
.modus svg{width:26px;height:26px;flex:none;color:var(--accent)}
.modus b{display:block;font-family:var(--f-display);font-size:1.08rem}
.modus span{font-size:.88rem;color:var(--muted)}

/* Fachbegriffe */
.begriff{border:0;background:none;padding:0;font-weight:600;text-decoration:underline dotted 2px;text-underline-offset:3px;color:inherit;cursor:help}
.begriff:hover{color:var(--accent)}
.lies{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.lies svg{width:16px;height:16px;flex:none}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--fg);max-width:min(560px,calc(100vw - 32px));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog .d-innen{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow:auto}
dialog .d-kopf{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

/* Formulare */
.feld{display:flex;flex-direction:column;gap:6px}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%;min-height:44px}
textarea{min-height:200px;resize:vertical;line-height:1.55}
.wahl{display:grid;gap:10px}
.wahl label{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;background:var(--surface-2);cursor:pointer}
.wahl input{width:20px;height:20px;accent-color:var(--accent)}

/* Tabelle (Nachweis) */
table.liste{width:100%;border-collapse:collapse;font-size:.95rem}
table.liste th,table.liste td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.liste th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pruefcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;letter-spacing:.12em;font-weight:700}

/* Award-Wand, Plaketten, Feier-Animation, Glossar */
.wand{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.award{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.award:hover{background:var(--surface-2)}
.award .plakette{width:88px;height:88px;transition:transform .25s ease}
.award:hover .plakette{transform:scale(1.05) rotate(-3deg)}
.award.zu .plakette{filter:grayscale(1) brightness(.8);opacity:.38}
.award .schloss{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.award .schloss svg{width:16px;height:16px}
.award .n{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15}
.award .d{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{width:70%;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.mini i{display:block;height:100%;background:var(--muted)}

.feier{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.plakette.gross{width:150px;height:150px}
.plakette.grau{filter:grayscale(1);opacity:.5}
.feier .fakt{max-width:44ch}
dialog[open] .feier .plakette.gross:not(.grau){animation:plakette-rein .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes plakette-rein{
  0%{transform:scale(.2) rotate(-40deg);opacity:0;filter:drop-shadow(0 0 0 transparent)}
  60%{transform:scale(1.12) rotate(6deg);opacity:1;filter:drop-shadow(0 0 18px var(--accent))}
  100%{transform:scale(1) rotate(0);filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
}
@media (prefers-reduced-motion: reduce){
  dialog[open] .feier .plakette.gross:not(.grau){animation:plakette-sanft .4s ease both}
  @keyframes plakette-sanft{from{opacity:0}to{opacity:1}}
}

.glossar{margin:0;display:grid;gap:10px}
.g-eintrag{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.g-eintrag dt{font-weight:700}
.g-eintrag dd{margin:4px 0 0;display:flex;flex-direction:column;gap:4px}

@media print{.nachweis{display:none}.nachweis-druck::after{content:"Der Nachweis wird nur auf dem Bildschirm angezeigt."}}

</style>
</head>

/* ---- js/20-speicher.js ---- */
/* Speicher: localStorage + Spielstand-Datei. Es werden KEINE personenbezogenen Daten
   und KEINE Freitexte aus Operatoraufgaben gespeichert. */
(function () {
  var SCHLUESSEL = 'verdauung-lerntool';
  var FORMATVERSION = 1;
  // „Salz“ für die Prüfsumme. Schützt nur gegen Handänderungen in der Datei, nicht gegen
  // jemanden, der den Quelltext liest. Nicht ändern, sonst werden alte Dateien abgelehnt.
  var SALZ = 'PEBK-Verdauung-2026';

  function leer() {
    return {
      v: FORMATVERSION,
      form: null,            // 'w' | 'm' | 'n' – nur für die Anrede der Ränge und Awards
      xp: 0,
      erstellt: LT.iso(),
      geaendert: LT.iso(),
      laeufe: [],            // Modulchecks: {m: Modul-ID, t: Zeitpunkt, p: Prozent}
      leitner: {},           // Karten-ID → {f: Fach 1–5, t: Tag der letzten Wiederholung}
      falsch: {},            // Aufgaben-ID → Modul-ID („Meine Fehler“)
      awards: {},            // Award-ID → Zeitpunkt
      tage: [],              // Tage, an denen geübt wurde (JJJJ-MM-TT)
      serie: 0, serieMax: 0, // richtige Antworten in Folge
      quizSerieMax: 0,
      reihenfolgeOk: 0,      // fehlerfrei gelöste Reihenfolgeaufgaben
      operatoren: {},        // Operator-ID → Zeitpunkt des Bestehens (kein Text!)
      diagnosen: [],         // IDs richtig gelöster Diagnosefälle
      enzymBest: 0,
      aprilscherz: false,
      gesichert: null        // Zeitpunkt der letzten Sicherung als Datei
    };
  }

  /** Alte Formate schrittweise auf das aktuelle heben. Neue Version → neuen Schritt ergänzen. */
  var MIGRATIONEN = {
    // 1: function (d) { d.neuesFeld = ...; d.v = 2; return d; }
  };
  function migrieren(d) {
    while (d.v < FORMATVERSION) {
      if (!MIGRATIONEN[d.v]) throw new Error('Keine Migration von Version ' + d.v);
      d = MIGRATIONEN[d.v](d);
    }
    // fehlende Felder mit Standardwerten auffüllen
    var basis = leer();
    Object.keys(basis).forEach(function (k) { if (d[k] === undefined) d[k] = basis[k]; });
    return d;
  }

  function gueltig(d) {
    return d && typeof d === 'object' && typeof d.v === 'number' && Array.isArray(d.laeufe) &&
      typeof d.awards === 'object' && typeof d.xp === 'number';
  }

  LT.speicherOk = true;
  LT.laden = function () {
    try {
      var roh = localStorage.getItem(SCHLUESSEL);
      if (roh) {
        var d = JSON.parse(roh);
        if (gueltig(d)) return migrieren(d);
      }
    } catch (e) { LT.speicherOk = false; }
    return leer();
  };

  LT.S = LT.laden();

  LT.speichern = function () {
    LT.S.geaendert = LT.iso();
    try { localStorage.setItem(SCHLUESSEL, JSON.stringify(LT.S)); LT.speicherOk = true; }
    catch (e) { LT.speicherOk = false; }
  };

  LT.zuruecksetzen = function () {
    LT.S = leer();
    try { localStorage.removeItem(SCHLUESSEL); } catch (e) { /* egal */ }
  };

  function pruefsumme(daten) { return LT.hash(JSON.stringify(daten) + SALZ, 7); }

  /** Spielstand als JSON-Datei herunterladen */
  LT.exportieren = function () {
    var daten = JSON.parse(JSON.stringify(LT.S));
    var datei = {
      app: 'verdauung-lerntool', formatversion: FORMATVERSION, gespeichert: LT.iso(),
      daten: daten, pruefsumme: pruefsumme(daten)
    };
    var blob = new Blob([JSON.stringify(datei, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'verdauung-spielstand-' + LT.tag() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    LT.S.gesichert = LT.iso();
    LT.speichern();
  };

  /** Datei prüfen. Liefert {ok, meldung, daten, gespeichert} – übernimmt noch nichts. */
  LT.dateiPruefen = function (text) {
    var datei;
    try { datei = JSON.parse(text); } catch (e) { return { ok: false, meldung: 'Das ist keine gültige Spielstand-Datei.' }; }
    if (!datei || datei.app !== 'verdauung-lerntool' || !datei.daten) {
      return { ok: false, meldung: 'Diese Datei gehört nicht zu diesem Lerntool.' };
    }
    if (datei.formatversion > FORMATVERSION) {
      return { ok: false, meldung: 'Die Datei stammt aus einer neueren Version des Lerntools. Bitte nutze die aktuelle Version.' };
    }
    if (pruefsumme(datei.daten) !== datei.pruefsumme) {
      return { ok: false, meldung: 'Die Prüfsumme stimmt nicht. Die Datei wurde verändert oder ist beschädigt.' };
    }
    if (!gueltig(datei.daten)) return { ok: false, meldung: 'Die Datei ist unvollständig.' };
    var daten;
    try { daten = migrieren(datei.daten); } catch (e) { return { ok: false, meldung: 'Die Datei kann nicht umgewandelt werden.' }; }
    return { ok: true, daten: daten, gespeichert: datei.gespeichert };
  };

  LT.uebernehmen = function (daten) { LT.S = daten; LT.speichern(); };

  /** Prüfcode für die Nachweis-Ansicht: 8 Zeichen aus Rang-relevanten Daten */
  LT.pruefcode = function (S) {
    S = S || LT.S;
    var kern = JSON.stringify({ xp: S.xp, a: S.awards, l: S.laeufe.map(function (l) { return [l.m, l.t, l.p]; }) });
    var h = LT.hash(kern + SALZ, 21).toUpperCase().replace(/[01]/g, function (c) { return c === '0' ? 'Q' : 'L'; });
    return h.slice(0, 4) + '-' + h.slice(4, 8);
  };
})();

/* ---- js/25-text.js ---- */
/* Text aus den Inhaltsdateien darstellen.
   [[Begriff]] bzw. [[Begriff|Anzeige]] → antippbarer Fachbegriff. Beim ERSTEN Auftreten
   im aktuellen Modul wird der deutsche Begriff in Klammern ergänzt (Fachbegriff-Regel). */
(function () {
  var glossarIndex = {};
  Object.keys(LT.D.glossar).forEach(function (k) { glossarIndex[k.toLowerCase()] = k; });

  LT.kontext = { modul: null, gesehen: {} };
  /** Beim Betreten eines Moduls aufrufen: Fachbegriffe gelten wieder als „neu“. */
  LT.modulKontext = function (modulId) { LT.kontext = { modul: modulId, gesehen: {} }; };

  LT.glossarEintrag = function (begriff) {
    var k = glossarIndex[String(begriff).toLowerCase()];
    return k ? { begriff: k, eintrag: LT.D.glossar[k] } : null;
  };

  /** Inline-Text (ohne Absätze) */
  LT.txt = function (roh, optionen) {
    optionen = optionen || {};
    var s = LT.esc(roh || '');
    s = s.replace(/\[\[(.+?)\]\]/g, function (_, innen) {
      var teile = innen.split('|');
      var g = LT.glossarEintrag(teile[0].trim());
      var anzeige = (teile[1] || teile[0]).trim();
      if (!g) return anzeige;
      var zusatz = '';
      if (!optionen.ohneKlammer && !LT.kontext.gesehen[g.begriff]) {
        LT.kontext.gesehen[g.begriff] = true;
        zusatz = ' (' + LT.esc(g.eintrag.deutsch) + ')';
      }
      return '<button type="button" class="begriff" data-begriff="' + LT.esc(g.begriff) + '">' + anzeige + '</button>' + zusatz;
    });
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return s;
  };

  /** Mehrzeiliger Text: Leerzeile = neuer Absatz */
  LT.absaetze = function (roh, optionen) {
    return String(roh || '').split(/\n\s*\n/).map(function (a) {
      return '<p>' + LT.txt(a.trim(), optionen).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  };

  /** „Lies nach: I care Anatomie, Physiologie, S. 205“ */
  LT.quelleText = function (quellen) {
    return (quellen || []).map(function (q) {
      var m = /^(i-care|MKK) (S\. .+)$/.exec(q);
      return m ? LT.D.buecher[m[1]] + ', ' + m[2] : q;
    }).join('; ');
  };
  LT.liesNach = function (quellen) {
    if (!quellen || !quellen.length) return '';
    return '<p class="lies">' + LT.icon('buch') + '<span>Lies nach: ' + LT.esc(LT.quelleText(quellen)) + '</span></p>';
  };

  /* ---------- Dialog (Glossar, Bestätigungen, Award-Details) ---------- */
  LT.dialog = function (titel, html, knoepfe) {
    var d = LT.$('#dialog');
    d.innerHTML = '<div class="d-innen"><div class="d-kopf"><h2 id="dialog-titel">' + titel + '</h2>' +
      '<button type="button" class="icon-btn" data-schliessen aria-label="Schließen">' + LT.icon('kreuz') + '</button></div>' +
      html + '<div class="reihe" data-knoepfe></div></div>';
    var leiste = LT.$('[data-knoepfe]', d);
    (knoepfe || []).forEach(function (k) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + (k.klasse || ''); b.textContent = k.text;
      b.addEventListener('click', function () { if (k.aktion() !== false) LT.dialogZu(); });
      leiste.appendChild(b);
    });
    LT.$('[data-schliessen]', d).addEventListener('click', LT.dialogZu);
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
  };
  LT.dialogZu = function () {
    var d = LT.$('#dialog');
    if (typeof d.close === 'function' && d.open) d.close(); else d.removeAttribute('open');
  };

  LT.glossarZeigen = function (begriff) {
    var g = LT.glossarEintrag(begriff);
    if (!g) return;
    LT.dialog(LT.esc(g.begriff),
      '<p><b>Deutsch:</b> ' + LT.esc(g.eintrag.deutsch) + '</p>' +
      (g.eintrag.erklaerung ? '<p>' + LT.txt(g.eintrag.erklaerung, { ohneKlammer: true }) + '</p>' : '') +
      LT.liesNach(g.eintrag.quelle));
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.begriff');
    if (b) { e.preventDefault(); LT.glossarZeigen(b.getAttribute('data-begriff')); }
  });
})();

/* ---- js/30-fortschritt.js ---- */
/* Fortschritt: XP, Ränge, bestandene Module, Freischaltung */
(function () {
  var E = LT.E = LT.D.einstellungen;

  LT.form = function () { return LT.S.form || 'n'; };

  /** Aktueller Rang, nächster Rang und Fortschritt dazwischen (0–1) */
  LT.rang = function (xp) {
    xp = xp == null ? LT.S.xp : xp;
    var r = E.raenge, i = 0;
    while (i + 1 < r.length && xp >= r[i + 1].xp) i++;
    var naechster = r[i + 1] || null;
    var anteil = naechster ? (xp - r[i].xp) / (naechster.xp - r[i].xp) : 1;
    return { stufe: i, name: r[i][LT.form()], naechster: naechster && naechster[LT.form()], naechsterXp: naechster && naechster.xp, anteil: anteil };
  };

  /** XP gutschreiben. aktion = Name aus einstellungen.md (xp:) */
  LT.xpDazu = function (aktion, anzahl) {
    var n = (E.xp[aktion] || 0) * (anzahl == null ? 1 : anzahl);
    LT.S.xp += Math.round(n);
    return Math.round(n);
  };

  LT.modul = function (id) {
    for (var i = 0; i < LT.D.module.length; i++) if (LT.D.module[i].id === id) return LT.D.module[i];
    return null;
  };
  LT.moduleImBlock = function (nr) { return LT.D.module.filter(function (m) { return m.block === nr; }); };
  LT.blockTitel = function (nr) {
    var b = E.bloecke.filter(function (x) { return x.nr === nr; })[0];
    return b ? b.titel : 'Block ' + nr;
  };

  LT.laeufeVon = function (id) { return LT.S.laeufe.filter(function (l) { return l.m === id; }); };
  LT.bestes = function (id) {
    return LT.laeufeVon(id).reduce(function (a, l) { return Math.max(a, l.p); }, -1);
  };
  LT.bestanden = function (id) { return LT.bestes(id) >= E.bestehensgrenze; };

  /** Block 1 ist immer offen. Jeder weitere öffnet sich, wenn alle VORHANDENEN Module
      (Status aktiv) des vorherigen Blocks bestanden sind. */
  LT.blockOffen = function (nr) {
    if (nr <= 1) return true;
    if (!LT.blockOffen(nr - 1)) return false;
    return LT.moduleImBlock(nr - 1).every(function (m) { return m.status !== 'aktiv' || LT.bestanden(m.id); });
  };

  /** Organmodule, die für eine Erkrankung noch fehlen */
  LT.fehlendeOrgane = function (m) {
    if (!m.organ) return [];
    return m.organ.split(',').map(function (s) { return s.trim(); })
      .filter(function (id) { return !LT.bestanden(id); })
      .map(function (id) { var o = LT.modul(id); return o ? o.titel : id; });
  };

  LT.modulOffen = function (m) {
    return m.status === 'aktiv' && LT.blockOffen(m.block) && LT.fehlendeOrgane(m).length === 0;
  };

  /** Heute als Übungstag vermerken */
  LT.uebungstag = function () {
    var t = LT.tag();
    if (LT.S.tage.indexOf(t) < 0) { LT.S.tage.push(t); if (LT.S.tage.length > 400) LT.S.tage.shift(); }
  };

  /** Nach jeder bewerteten Aufgabe aufrufen. anteil: 0–1 (1 = vollständig richtig). */
  LT.antwortErfassen = function (aufgabe, modulId, anteil) {
    var richtig = anteil >= 1;
    LT.uebungstag();
    if (richtig) {
      LT.S.serie += 1;
      LT.S.serieMax = Math.max(LT.S.serieMax, LT.S.serie);
      delete LT.S.falsch[aufgabe.id];
    } else {
      LT.S.serie = 0;
      LT.S.falsch[aufgabe.id] = modulId;
    }
    if (aufgabe.typ === 'reihenfolge' && richtig) LT.S.reihenfolgeOk += 1;
    return richtig;
  };

  /** Modulcheck abschließen. Liefert {prozent, bestanden, erstmals, xp} */
  LT.laufBeenden = function (modulId, prozent) {
    var warBestanden = LT.bestanden(modulId);
    LT.S.laeufe.push({ m: modulId, t: LT.iso(), p: prozent });
    var bestanden = prozent >= E.bestehensgrenze;
    var xp = 0;
    if (bestanden) xp += LT.xpDazu(warBestanden ? 'modul_bestanden' : 'modul_erstmals_bestanden');
    return { prozent: prozent, bestanden: bestanden, erstmals: bestanden && !warBestanden, xp: xp };
  };

  /** Längste Serie aufeinanderfolgender Übungstage */
  LT.laengsteTagesserie = function () {
    var tage = LT.S.tage.slice().sort(), best = 0, lauf = 0, vorher = null;
    tage.forEach(function (t) {
      var d = new Date(t + 'T12:00:00');
      lauf = (vorher && Math.round((d - vorher) / 864e5) === 1) ? lauf + 1 : 1;
      best = Math.max(best, lauf);
      vorher = d;
    });
    return best;
  };
})();

/* ---- js/40-awards.js ---- */
/* Awards: Regeln, Plakettengrafik, Prüfung, Animation.
   Die Regeln stehen in inhalte/awards.md (Feld „regel:“). Jede Regel liefert
   {ok: erreicht?, f: Fortschritt 0–1}. Alles wird nur auf dem Gerät geprüft. */
(function () {
  var S = function () { return LT.S; };
  var grenze = function () { return LT.E.bestehensgrenze; };
  var anteil = function (ist, soll) { return Math.max(0, Math.min(1, soll ? ist / soll : 0)); };
  var stunde = function (l) { return new Date(l.t).getHours(); };

  function alleOperatoren() {
    var liste = [];
    LT.D.module.forEach(function (m) { m.operatoren.forEach(function (o) { liste.push(o); }); });
    return liste;
  }

  var REGELN = {
    modul_uhrzeit: function (von, bis) {
      var ok = S().laeufe.some(function (l) { var h = stunde(l); return h >= +von && h < +bis; });
      return { ok: ok, f: ok ? 1 : 0 };
    },
    operatoren_afb: function (afb) {
      var ops = alleOperatoren().filter(function (o) { return o.afb === afb; });
      var geschafft = ops.filter(function (o) { return S().operatoren[o.id]; }).length;
      return { ok: ops.length > 0 && geschafft === ops.length, f: anteil(geschafft, ops.length) };
    },
    modul_mehrfach: function (ids, anzahl, prozent) {
      var teile = ids.split(',').map(function (id) {
        return Math.min(+anzahl, LT.laeufeVon(id).filter(function (l) { return l.p >= +prozent; }).length);
      });
      var summe = teile.reduce(function (a, b) { return a + b; }, 0);
      return { ok: teile.every(function (n) { return n >= +anzahl; }), f: anteil(summe, teile.length * anzahl) };
    },
    bloecke_bestanden: function (nr) {
      var ms = LT.moduleImBlock(+nr);  // ALLE Module des Blocks, auch die in Vorbereitung
      var n = ms.filter(function (m) { return LT.bestanden(m.id); }).length;
      return { ok: ms.length > 0 && n === ms.length, f: anteil(n, ms.length) };
    },
    serie_richtig: function (n) { return { ok: S().serieMax >= +n, f: anteil(S().serieMax, +n) }; },
    verbesserung: function (pp) {
      var best = 0;
      LT.D.module.forEach(function (m) {
        var min = Infinity;
        LT.laeufeVon(m.id).forEach(function (l) { best = Math.max(best, l.p - min); min = Math.min(min, l.p); });
      });
      return { ok: best >= +pp, f: anteil(best, +pp) };
    },
    tage_in_folge: function (n) { var t = LT.laengsteTagesserie(); return { ok: t >= +n, f: anteil(t, +n) }; },
    unter_dann_ueber: function (unter, ueber) {
      var ok = LT.D.module.some(function (m) {
        var tief = false;
        return LT.laeufeVon(m.id).some(function (l) { if (tief && l.p > +ueber) return true; if (l.p < +unter) tief = true; return false; });
      });
      return { ok: ok, f: ok ? 1 : 0 };
    },
    modul_prozent: function (id, p) { var b = LT.bestes(id); return { ok: b >= +p, f: anteil(Math.max(b, 0), +p) }; },
    enzym_punkte: function (n) { return { ok: S().enzymBest >= +n, f: anteil(S().enzymBest, +n) }; },
    karten_fach5: function (n) {
      var k = Object.keys(S().leitner).filter(function (id) { return S().leitner[id].f >= 5; }).length;
      return { ok: k >= +n, f: anteil(k, +n) };
    },
    diagnosen: function (n) { return { ok: S().diagnosen.length >= +n, f: anteil(S().diagnosen.length, +n) }; },
    block_frei: function (nr) {
      // mindestens ein echt bestandenes Modul im Block davor – sonst wäre ein leerer Block „geschafft“
      var vorher = LT.moduleImBlock(+nr - 1).filter(function (m) { return m.status === 'aktiv'; });
      var n = vorher.filter(function (m) { return LT.bestanden(m.id); }).length;
      var ok = LT.blockOffen(+nr) && n > 0;
      return { ok: ok, f: ok ? 1 : anteil(n, vorher.length) };
    },
    modul_abschluesse: function (n) {
      var max = 0;
      LT.D.module.forEach(function (m) { max = Math.max(max, LT.laeufeVon(m.id).length); });
      return { ok: max >= +n, f: anteil(max, +n) };
    },
    reihenfolge_fehlerfrei: function (n) { return { ok: S().reihenfolgeOk >= +n, f: anteil(S().reihenfolgeOk, +n) }; },
    xp: function (n) { return { ok: S().xp >= +n, f: anteil(S().xp, +n) }; },
    quiz_serie: function (n) { return { ok: S().quizSerieMax >= +n, f: anteil(S().quizSerieMax, +n) }; },
    freitag13: function (p) {
      var ok = S().laeufe.some(function (l) { var d = new Date(l.t); return d.getDay() === 5 && d.getDate() === 13 && l.p >= +p; });
      return { ok: ok, f: ok ? 1 : 0 };
    },
    aprilscherz: function () { return { ok: !!S().aprilscherz, f: S().aprilscherz ? 1 : 0 }; }
  };

  LT.awardStand = function (a) {
    var fn = REGELN[a.regel[0]];
    if (!fn) return { ok: false, f: 0 };
    return fn.apply(null, a.regel.slice(1));
  };
  LT.awardName = function (a) { return a.name[LT.form()]; };

  /** Neue Awards vergeben. Liefert die Liste der neu erreichten Awards. */
  LT.neueAwards = [];
  LT.awardsPruefen = function () {
    var neu = [], weiter = true;
    while (weiter) {           // mehrfach, weil Award-XP weitere Awards auslösen kann
      weiter = false;
      LT.D.awards.forEach(function (a) {
        if (LT.S.awards[a.id]) return;
        if (LT.awardStand(a).ok) {
          LT.S.awards[a.id] = LT.iso();
          LT.xpDazu('award');
          neu.push(a); weiter = true;
        }
      });
    }
    LT.neueAwards = LT.neueAwards.concat(neu);
    LT.speichern();
    return neu;
  };

  /* ---------- Plakette als SVG (Stil der Garmin-Abzeichen) ---------- */
  var gid = 0;
  function formPfad(form) {
    var pkte = [], i, n, r1, r2, w;
    if (form === 'sechseck') {
      for (i = 0; i < 6; i++) { w = Math.PI / 3 * i - Math.PI / 2; pkte.push([60 + 56 * Math.cos(w), 60 + 56 * Math.sin(w)]); }
    } else if (form === 'zacken') {
      n = 16; r1 = 57; r2 = 49;
      for (i = 0; i < n * 2; i++) { w = Math.PI / n * i - Math.PI / 2; var r = i % 2 ? r2 : r1; pkte.push([60 + r * Math.cos(w), 60 + r * Math.sin(w)]); }
    } else if (form === 'schild') {
      return 'M60 4 L108 18 L108 58 C108 88 86 106 60 116 C34 106 12 88 12 58 L12 18 Z';
    } else {
      return null;
    }
    return 'M' + pkte.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('L') + 'Z';
  }

  LT.plakette = function (a, klasse) {
    var id = 'pl' + (gid++), p = formPfad(a.form);
    var aussen = p ? '<path d="' + p + '" fill="url(#' + id + 'a)" stroke="url(#' + id + 'a)" stroke-width="4" stroke-linejoin="round"/>'
                   : '<circle cx="60" cy="60" r="57" fill="url(#' + id + 'a)"/>';
    return '<svg class="' + (klasse || 'plakette') + '" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><defs>' +
      '<linearGradient id="' + id + 'a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a.farbe1 + '"/><stop offset="1" stop-color="' + a.farbe2 + '"/></linearGradient>' +
      '<linearGradient id="' + id + 'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a.farbe2 + '"/><stop offset="1" stop-color="' + a.farbe1 + '"/></linearGradient></defs>' +
      aussen +
      '<circle cx="60" cy="60" r="41" fill="url(#' + id + 'b)" stroke="rgba(255,255,255,.65)" stroke-width="2.5"/>' +
      '<circle cx="60" cy="60" r="36" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1" stroke-dasharray="2 3"/>' +
      '<path d="M26 50a35 35 0 0 1 68 0c-19-8-49-8-68 0z" fill="#fff" opacity=".15"/>' +
      '<g transform="translate(60 60) scale(1.9) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      (LT.ICONS[a.icon] || LT.ICONS.stern) + '</g></svg>';
  };

  /* ---------- Animation für neue Awards ---------- */
  LT.awardsFeiern = function (fertig) {
    var liste = LT.neueAwards.slice();
    LT.neueAwards = [];
    if (!liste.length) { if (fertig) fertig(); return; }
    var a = liste.shift();
    LT.neueAwards = liste;
    LT.dialog('Neuer Award!',
      '<div class="feier">' + LT.plakette(a, 'plakette gross') +
      '<h3>' + LT.esc(LT.awardName(a)) + '</h3>' +
      (a.fakt ? '<p class="fakt">' + LT.txt(a.fakt, { ohneKlammer: true }) + '</p>' + LT.liesNach(a.quelle) : '') +
      '<p class="chip gold">+' + LT.E.xp.award + ' XP</p></div>',
      [{ text: liste.length ? 'Nächster Award' : 'Weiter', klasse: 'primaer', aktion: function () { setTimeout(function () { LT.awardsFeiern(fertig); }, 50); } }]);
    LT.ansage('Neuer Award: ' + LT.awardName(a));
  };
})();

      '<section class="karte stapel" aria-labelledby="form-t"><h2 id="form-t">Anrede der Ränge</h2><div class="wahl">' +
      [['w', 'weiblich (Praktikantin …)'], ['m', 'männlich (Praktikant …)'], ['n', 'neutral (Praktikant:in …)']].map(function (f) {
        return '<label><input type="radio" name="form" value="' + f[0] + '"' + (s.form === f[0] ? ' checked' : '') + '> ' + f[1] + '</label>';
      }).join('') + '</div></section>' +
      '<section class="karte stapel" aria-labelledby="rs-t"><h2 id="rs-t">Neu anfangen</h2>' +
      '<p class="muted">Löscht deinen gesamten Fortschritt in diesem Browser. Eine gesicherte Datei bleibt erhalten.</p>' +
      '<div><button class="btn gefahr" id="reset" type="button">Fortschritt löschen</button></div></section>' +
      '<p class="muted klein">Version vom ' + LT.datum(LT.D.erstellt) + (LT.D.variante === 'kurs' ? ' · Kursversion' : '') + '</p>');
    LT.$('#export').addEventListener('click', function () {
      LT.exportieren();
      LT.ansage('Spielstand wurde als Datei gespeichert.');
      LT.navigieren();
    });
    LT.$$('input[name=form]').forEach(function (r) {
      r.addEventListener('change', function () { LT.S.form = r.value; LT.speichern(); LT.kopfAktualisieren(); LT.ansage('Anrede geändert.'); });
    });
    LT.$('#reset').addEventListener('click', function () {
      LT.dialog('Wirklich alles löschen?', '<p>Dein Rang, deine XP, Awards und Karteikarten-Fächer werden in diesem Browser gelöscht. Das kann nicht rückgängig gemacht werden.</p>', [
        { text: 'Abbrechen', aktion: function () {} },
        { text: 'Ja, alles löschen', klasse: 'gefahr', aktion: function () { LT.zuruecksetzen(); LT.gehe('/'); } }
      ]);
    });
  }, 'mehr');

  /* ---------- Spielstand laden ---------- */
  LT.route(/^\/mehr\/laden$/, function () {
    var h = LT.zeige(LT.seitenkopf('Spielstand laden', { pfad: LT.S.form ? '/mehr' : '/willkommen', text: 'Zurück' }) +
      '<section class="karte stapel"><p>Wähle deine Spielstand-Datei aus (<code>verdauung-spielstand-….json</code>). ' +
      'Du siehst vorher, was darin steht, und entscheidest dann.</p>' +
      '<div class="feld"><label for="datei">Datei auswählen</label><input type="file" id="datei" accept=".json,application/json"></div>' +
      '<div id="vorschau" aria-live="polite"></div></section>' + ANLEITUNG);
    LT.$('#datei', h).addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var leser = new FileReader();
      leser.onload = function () { vorschau(LT.dateiPruefen(String(leser.result))); };
      leser.readAsText(f);
    });
  }, 'mehr');

  function vorschau(erg) {
    var ziel = LT.$('#vorschau');
    if (!erg.ok) { ziel.innerHTML = '<div class="hinweis nein">' + esc(erg.meldung) + '</div>'; return; }
    var d = erg.daten, aktuell = LT.S;
    var aelter = aktuell.laeufe.length && new Date(erg.gespeichert) < new Date(aktuell.geaendert);
    ziel.innerHTML = '<div class="karte flach stapel"><h2>Vorschau</h2><table class="liste"><tbody>' +
      '<tr><th scope="row">Gespeichert am</th><td>' + LT.datum(erg.gespeichert) + ', ' + LT.uhrzeit(erg.gespeichert) + ' Uhr</td></tr>' +
      '<tr><th scope="row">Rang</th><td>' + esc(rangName(d)) + ' (' + LT.zahl(d.xp) + ' XP)</td></tr>' +
      '<tr><th scope="row">Awards</th><td>' + Object.keys(d.awards).length + '</td></tr>' +
      '<tr><th scope="row">Abgeschlossene Modulchecks</th><td>' + d.laeufe.length + '</td></tr></tbody></table>' +
      (aelter ? '<div class="hinweis nein"><b>Achtung:</b> Diese Datei ist älter als dein aktueller Stand in diesem Browser (' +
        LT.datum(aktuell.geaendert) + ', ' + LT.uhrzeit(aktuell.geaendert) + ' Uhr). Wenn du sie lädst, geht neuerer Fortschritt verloren.</div>' : '') +
      (aktuell.laeufe.length ? '<p class="muted klein">Dein aktueller Stand: ' + esc(LT.rang().name) + ', ' + LT.zahl(aktuell.xp) + ' XP, ' +
        Object.keys(aktuell.awards).length + ' Awards. Er wird ersetzt.</p>' : '') +
      '<div class="reihe"><button class="btn primaer" id="uebernehmen" type="button">Spielstand übernehmen</button>' +
      '<button class="btn" id="abbrechen" type="button">Abbrechen</button></div></div>';
    LT.$('#uebernehmen').addEventListener('click', function () {
      LT.uebernehmen(d);
      LT.awardsPruefen(); LT.neueAwards = [];
      LT.ansage('Spielstand geladen.');
      LT.gehe('/');
    });
    LT.$('#abbrechen').addEventListener('click', function () { ziel.innerHTML = ''; LT.$('#datei').value = ''; });
  }

  /* ---------- Erinnerung ans Sichern (nach jedem Modulabschluss) ---------- */
  LT.sichernErinnerung = function () {
    return '<div class="hinweis gold stapel"><p><b>Denk ans Sichern!</b> Speichere deinen Spielstand als Datei, damit nichts verloren geht.</p>' +
      '<div><button class="btn klein" type="button" data-export>' + icon('download') + 'Spielstand speichern</button></div></div>';
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-export]');
    if (b) { LT.exportieren(); b.outerHTML = '<span class="chip ok">' + icon('haken') + 'gespeichert</span>'; }
  });

  /* ---------- Nachweis für die Lehrkraft (nur Bildschirm) ---------- */
  LT.route(/^\/nachweis$/, function () {
    var s = LT.S, r = LT.rang();
    var erreichte = LT.D.awards.filter(function (a) { return s.awards[a.id]; })
      .sort(function (a, b) { return s.awards[a.id] < s.awards[b.id] ? -1 : 1; });
    var module = LT.D.module.filter(function (m) { return LT.laeufeVon(m.id).length; });
    LT.zeige(LT.seitenkopf('Nachweis', { pfad: '/mehr', text: 'Mehr' }, 'Für die Lehrkraft') +
      '<section class="karte stapel nachweis">' +
      '<div class="reihe zw"><div><p class="eyebrow">Rang</p><p class="stufe" style="font-family:var(--f-display);font-size:1.6rem;font-weight:700">' + esc(r.name) + '</p>' +
      '<p class="muted">' + LT.zahl(s.xp) + ' XP</p></div>' +
      '<div style="text-align:right"><p class="eyebrow">Prüfcode</p><p class="pruefcode">' + LT.pruefcode() + '</p>' +
      '<p class="muted klein">Stand: ' + LT.datum(LT.iso()) + ', ' + LT.uhrzeit(LT.iso()) + ' Uhr</p></div></div>' +
      '<h2>Awards (' + erreichte.length + ')</h2>' +
      (erreichte.length ? '<table class="liste"><thead><tr><th>Award</th><th>erreicht am</th></tr></thead><tbody>' +
        erreichte.map(function (a) { return '<tr><td>' + esc(LT.awardName(a)) + '</td><td>' + LT.datum(s.awards[a.id]) + '</td></tr>'; }).join('') +
        '</tbody></table>' : '<p class="muted">Noch keine Awards.</p>') +
      '<h2>Module</h2>' +
      (module.length ? '<table class="liste"><thead><tr><th>Modul</th><th>bestes Ergebnis</th><th>Durchgänge</th></tr></thead><tbody>' +
        module.map(function (m) {
          return '<tr><td>' + esc(m.titel) + '</td><td>' + LT.bestes(m.id) + ' %' + (LT.bestanden(m.id) ? ' ✓' : '') + '</td><td>' + LT.laeufeVon(m.id).length + '</td></tr>';
        }).join('') + '</tbody></table>' : '<p class="muted">Noch kein Modulcheck abgeschlossen.</p>') +
      '<p class="muted klein">Der Prüfcode wird aus Rang, Awards und Modulergebnissen berechnet. Ändert sich etwas daran, ändert sich auch der Code.</p>' +
      '</section>');
  }, 'mehr');

  /* ---------- Datenschutz ---------- */
  LT.route(/^\/datenschutz$/, function () {
    LT.zeige(LT.seitenkopf('Datenschutz', { pfad: LT.S.form ? '/mehr' : '/willkommen', text: 'Zurück' }) +
      '<section class="karte stapel">' +
      '<h2>Kurz gesagt</h2><ul>' +
      '<li>Du brauchst <b>kein Konto</b> und gibst <b>keinen Namen, keine Klasse und keinen Standort</b> an.</li>' +
      '<li>Das Lerntool <b>sendet nichts ins Internet</b>. Es lädt keine Schriften, keine Bilder und keine Statistik-Dienste nach.</li>' +
      '<li>Dein Fortschritt liegt <b>nur in diesem Browser</b> (localStorage) und in Dateien, die du selbst speicherst.</li>' +
      '<li><b>Texte, die du in Operatoraufgaben schreibst, werden nie gespeichert.</b> Sie sind weg, sobald du die Aufgabe verlässt.</li>' +
      '<li>Uhrzeit und Datum für manche Awards werden nur auf deinem Gerät geprüft.</li></ul>' +
      '<h2>Was genau gespeichert wird</h2><ul>' +
      '<li>deine gewählte Anrede (weiblich / männlich / neutral)</li>' +
      '<li>XP, Ergebnisse der Modulchecks (Datum, Uhrzeit, Prozent)</li>' +
      '<li>Fächer deiner Karteikarten, Kennungen falsch beantworteter Aufgaben („Meine Fehler“)</li>' +
      '<li>erreichte Awards mit Datum, Übungstage, Bestwerte in den Spielen</li></ul>' +
      '<p class="muted">Alles löschen kannst du unter „Mehr → Neu anfangen“.</p></section>');
  }, 'mehr');
})();

/* ---- js/90-start.js ---- */
/* Start: Thema (hell/dunkel), Navigation, erste Anzeige */
(function () {
  var THEMA = 'verdauung-thema';
  function themaSetzen(t) {
    if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    var dunkel = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var b = LT.$('#thema-btn');
    b.innerHTML = LT.icon(dunkel ? 'sonne' : 'mond');
    b.setAttribute('aria-label', dunkel ? 'Hellen Modus einschalten' : 'Dunklen Modus einschalten');
  }
  var gespeichert = null;
  try { gespeichert = localStorage.getItem(THEMA); } catch (e) { /* egal */ }
  themaSetzen(gespeichert);
  LT.$('#thema-btn').addEventListener('click', function () {
    var dunkel = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var neu = dunkel ? 'light' : 'dark';
    try { localStorage.setItem(THEMA, neu); } catch (e) { /* egal */ }
    themaSetzen(neu);
  });

  LT.$$('.leiste .ni').forEach(function (s) { s.innerHTML = LT.icon(s.getAttribute('data-icon')); });

  // Klick auf den abgedunkelten Hintergrund schließt den Dialog
  LT.$('#dialog').addEventListener('click', function (e) { if (e.target === this) LT.dialogZu(); });

  window.addEventListener('hashchange', LT.navigieren);
  LT.navigieren();
})();

</script>
</body>
</html>
