darf an essenziellen Aminosäuren decken?","optionen":[{"text":"Ja, wenn sie ihre pflanzlichen Lebensmittel sorgfältig zusammenstellen.","richtig":true},{"text":"Nein, das ist ohne tierische Produkte unmöglich.","richtig":false},{"text":"Ja, der Körper bildet alle Aminosäuren selbst.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-mc-essenziell","frage":"Welche Nahrungsbestandteile sind essenziell?","optionen":[{"text":"Vitamine","richtig":true},{"text":"Mineralstoffe","richtig":true},{"text":"bestimmte Fettsäuren","richtig":true},{"text":"bestimmte Aminosäuren","richtig":true},{"text":"Ballaststoffe","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-mc-fettloeslich","frage":"Welche Vitamine sind fettlöslich?","optionen":[{"text":"Vitamin A","richtig":true},{"text":"Vitamin D","richtig":true},{"text":"Vitamin E","richtig":true},{"text":"Vitamin K","richtig":true},{"text":"Vitamin C","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 243–244"],"erklaerung":"","id":"naehrstoffe-mc-spuren","frage":"Welche Mineralstoffe sind Spurenelemente?","optionen":[{"text":"Eisen","richtig":true},{"text":"Jod","richtig":true},{"text":"Natrium","richtig":false},{"text":"Kalzium","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 245–246"],"erklaerung":"Im Alter sinkt der Energiebedarf. Ältere brauchen aber genauso viele Nährstoffe.","id":"naehrstoffe-mc-bedarf","frage":"Wer hat einen erhöhten Energiebedarf?","optionen":[{"text":"Schwangere","richtig":true},{"text":"stillende Frauen","richtig":true},{"text":"Menschen, die schwer körperlich arbeiten","richtig":true},{"text":"ältere Menschen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-mc-bmi","frage":"Welche Aussagen zum BMI stimmen?","optionen":[{"text":"Er gibt das Gewicht im Verhältnis zur Körpergröße an.","richtig":true},{"text":"Er ist nur für Erwachsene geeignet.","richtig":true},{"text":"Muskulöse Menschen können einen hohen BMI haben, ohne übergewichtig zu sein.","richtig":true},{"text":"Er misst den Fettanteil des Körpers genau.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-mc-hunger","frage":"Was macht satt, hemmt also das Hungergefühl?","optionen":[{"text":"ein gefüllter, gedehnter Magen","richtig":true},{"text":"das „Sättigungshormon“ Cholecystokinin","richtig":true},{"text":"das „Hungerhormon“ Ghrelin","richtig":false},{"text":"ein leerer Magen","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-zu-mangel","frage":"Ordne jedem Vitaminmangel seine mögliche Folge zu.","paare":[{"links":"Vitamin-A-Mangel","rechts":"Nachtblindheit"},{"links":"Vitamin-C-Mangel","rechts":"Skorbut"},{"links":"Vitamin-K-Mangel","rechts":"erhöhte Blutungsneigung"}]},{"typ":"zuordnung","quelle":["i-care S. 242–243"],"erklaerung":"","id":"naehrstoffe-zu-vorkommen","frage":"Ordne jedem Vitamin zu, wo es vorkommt.","paare":[{"links":"Vitamin C","rechts":"Obst, Gemüse, Kartoffeln"},{"links":"Vitamin B12","rechts":"nur tierische Lebensmittel"},{"links":"Vitamin D","rechts":"bildet der Körper mithilfe von Sonnenlicht"}]},{"typ":"zuordnung","quelle":["i-care S. 243–244"],"erklaerung":"","id":"naehrstoffe-zu-mineral","frage":"Ordne jedem Mineralstoff eine seiner Aufgaben zu.","paare":[{"links":"Kalzium","rechts":"Baustein von Knochen und Zähnen"},{"links":"Jod","rechts":"Bestandteil der Schilddrüsenhormone"},{"links":"Eisen","rechts":"Bestandteil des roten Blutfarbstoffs"}]},{"typ":"zuordnung","quelle":["i-care S. 243–244, 247"],"erklaerung":"","id":"naehrstoffe-zu-begriffe","frage":"Ordne jedem Begriff seine Bedeutung zu.","paare":[{"links":"[[Adipositas]]","rechts":"Fettleibigkeit"},{"links":"[[Kachexie]]","rechts":"starke Abmagerung"},{"links":"[[Hypovitaminose]]","rechts":"Vitaminmangelerkrankung"}]},{"typ":"reihenfolge","quelle":["i-care S. 245"],"erklaerung":"","id":"naehrstoffe-rf-taetigkeit","frage":"Ordne die Tätigkeiten nach ihrem Energieverbrauch – vom niedrigsten zum höchsten.","schritte":["Schlafen","Spazierengehen","gemächliches Laufen","schnelles Laufen"]},{"typ":"reihenfolge","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-rf-satt","frage":"Wie entsteht das Sättigungsgefühl beim Essen? Bring die Schritte in die richtige Reihenfolge.","schritte":["Die Nahrung füllt den Magen.","Die Magenwand wird gedehnt.","Dehnungsrezeptoren in der Magenwand werden erregt.","Über den N. vagus wird das Hungerzentrum im Gehirn gehemmt."]},{"typ":"lückentext","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-lt-bmi","text":"Der BMI gibt das Körpergewicht im Verhältnis zur {{Körpergröße|Größe}} an. Starkes Übergewicht nennt man Fettleibigkeit oder {{Adipositas}}."},{"typ":"lückentext","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-lt-edeka","text":"Die fettlöslichen Vitamine merkt man sich mit dem Namen einer Supermarktkette: {{EDeKA|Edeka}}. Der Körper kann sie nur aufnehmen, wenn gleichzeitig {{Fett|Fette}} in der Nahrung ist."},{"typ":"lückentext","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-lt-b12","text":"Vitamin {{B12|B 12}} ist nur in tierischen Produkten enthalten. Deshalb müssen {{Veganer|Veganerinnen}} besonders darauf achten."},{"typ":"fehlerfahndung","quelle":["i-care S. 242, 246, 248"],"erklaerung":"Im Alter sinkt der Energiebedarf, ältere Menschen benötigen aber genauso viele Nährstoffe. Zum Durstlöschen eignen sich Wasser und ungesüßte Tees; Limonaden enthalten viel Zucker. Vitamin C ist wasserlöslich und kommt in Obst, Gemüse und Kartoffeln vor.","id":"naehrstoffe-ff-frau-m","titel":"Robartinas Pflegebericht: Ernährung von Frau M.","bericht":"Frau M. (82) isst seit einigen Tagen sehr wenig. Ich habe ihr erklärt, dass ältere Menschen weniger Nährstoffe brauchen als jüngere. Zum Trinken habe ich ihr Limonade gebracht, weil sie den Durst am besten löscht. Wegen ihrer starken Abmagerung habe ich mit Frau Abda besprochen, ob wir hochkalorische Nahrungsergänzungen anbieten. Als Quelle für Vitamin C habe ich ihr Butter empfohlen, weil Vitamin C fettlöslich ist.","fehler":[{"links":"weniger Nährstoffe","rechts":"genauso viel|gleich viel|genau so viel|die gleichen","loesung":"genauso viele Nährstoffe (nur weniger Energie)"},{"links":"Limonade","rechts":"wasser|tee","loesung":"Wasser oder ungesüßter Tee"},{"links":"fettlöslich","rechts":"wasserlöslich","loesung":"wasserlöslich"}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-sc-kh-glukose","frage":"Zu welcher Gruppe gehört Glukose (Traubenzucker)?","optionen":[{"text":"Einfachzucker ([[Monosaccharide]])","richtig":true},{"text":"Zweifachzucker ([[Disaccharide]])","richtig":false},{"text":"Vielfachzucker ([[Polysaccharide]])","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"Stärke kommt z. B. in Kartoffeln und Reis vor.","id":"naehrstoffe-sc-kh-staerke","frage":"Zu welcher Gruppe gehört Stärke?","optionen":[{"text":"Vielfachzucker ([[Polysaccharide]])","richtig":true},{"text":"Zweifachzucker ([[Disaccharide]])","richtig":false},{"text":"Einfachzucker ([[Monosaccharide]])","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"Laktose besteht aus Galaktose und Glukose.","id":"naehrstoffe-sc-kh-laktose","frage":"Milchzucker (Laktose) ist ein …","optionen":[{"text":"Zweifachzucker ([[Disaccharide|Disaccharid]])","richtig":true},{"text":"Einfachzucker ([[Monosaccharide|Monosaccharid]])","richtig":false},{"text":"Vielfachzucker ([[Polysaccharide|Polysaccharid]])","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"Zweifach- und Vielfachzucker müssen deshalb erst in Einfachzucker zerlegt werden.","id":"naehrstoffe-sc-kh-aufnahme","frage":"In welcher Form können Kohlenhydrate aus dem Darm ins Blut aufgenommen werden?","optionen":[{"text":"nur als Einfachzucker","richtig":true},{"text":"nur als Zweifachzucker","richtig":false},{"text":"nur als Vielfachzucker","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 246, 248"],"erklaerung":"Glukose ist ein Einfachzucker und lässt den Blutzucker rasch ansteigen. Stärke muss erst verdaut werden.","id":"naehrstoffe-sc-kh-sport","frage":"Einer Läuferin geht kurz vor dem Ziel die Kraft aus. Was hilft am schnellsten?","optionen":[{"text":"ein Getränk mit Traubenzucker (Glukose)","richtig":true},{"text":"eine Portion Kartoffeln (Stärke)","richtig":false},{"text":"ein Vollkornbrot (Ballaststoffe)","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"naehrstoffe-mc-kh-einfach","frage":"Welche dieser Zucker sind Einfachzucker?","optionen":[{"text":"Glukose","richtig":true},{"text":"Fruktose","richtig":true},{"text":"Galaktose","richtig":true},{"text":"Saccharose","richtig":false},{"text":"Stärke","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-mc-kh-zweifach","frage":"Welche dieser Zucker sind Zweifachzucker?","optionen":[{"text":"Maltose","richtig":true},{"text":"Laktose","richtig":true},{"text":"Saccharose","richtig":true},{"text":"Glukose","richtig":false},{"text":"Stärke","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-zu-kh-gruppe","frage":"Ordne jedem Zucker seine Gruppe zu.","paare":[{"links":"Glukose","rechts":"Einfachzucker"},{"links":"Fruktose","rechts":"Einfachzucker"},{"links":"Saccharose","rechts":"Zweifachzucker"},{"links":"Laktose","rechts":"Zweifachzucker"},{"links":"Stärke","rechts":"Vielfachzucker"}]},{"typ":"zuordnung","quelle":["i-care S. 238","MKK S. 362, 370"],"erklaerung":"","id":"naehrstoffe-zu-kh-namen","frage":"Ordne jedem Fachbegriff den deutschen Namen zu.","paare":[{"links":"Glukose","rechts":"Traubenzucker"},{"links":"Fruktose","rechts":"Fruchtzucker"},{"links":"Laktose","rechts":"Milchzucker"},{"links":"Maltose","rechts":"Malzzucker"}]},{"typ":"zuordnung","quelle":["MKK S. 361","i-care S. 238"],"erklaerung":"","id":"naehrstoffe-zu-kh-fachbegriff","frage":"Ordne jedem Fachbegriff die deutsche Bezeichnung zu.","paare":[{"links":"[[Monosaccharide]]","rechts":"Einfachzucker"},{"links":"[[Disaccharide]]","rechts":"Zweifachzucker"},{"links":"[[Polysaccharide]]","rechts":"Vielfachzucker"}]},{"typ":"reihenfolge","quelle":["i-care S. 238"],"erklaerung":"","id":"naehrstoffe-rf-kh-abbau","frage":"Stärke wird bei der Verdauung schrittweise zerlegt. Bring die Stufen in die richtige Reihenfolge.","schritte":["Vielfachzucker (Stärke)","Zweifachzucker (Maltose)","Einfachzucker (Glukose)"]},{"typ":"lückentext","quelle":["i-care S. 238, 246","MKK S. 370"],"erklaerung":"","id":"naehrstoffe-lt-kh","text":"Stärke ist ein {{Vielfachzucker|Polysaccharid}}. Milchzucker ist ein {{Zweifachzucker|Disaccharid}}. Traubenzucker ist ein {{Einfachzucker|Monosaccharid}} und gelangt sehr schnell ins Blut."},{"typ":"lückentext","quelle":["i-care S. 214"],"erklaerung":"","id":"naehrstoffe-lt-ballast","text":"Ballaststoffe sind meistens unverdauliche {{Vielfachzucker|Polysaccharide}}. Sie kommen vor allem in {{pflanzlichen}} Lebensmitteln vor, z. B. in Getreide und Gemüse."}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-kk-07f1b9","vorne":"Was sind die drei Hauptbestandteile der Nahrung?","hinten":"Kohlenhydrate, Proteine (Eiweiße) und Fette. Sie heißen auch „Brennstoffe“, weil der Körper aus ihnen Energie gewinnt."},{"typ":"karteikarte","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-kk-2d6fab","vorne":"Was bedeutet [[essenziell]]?","hinten":"Lebensnotwendig: Der Körper kann den Stoff nicht oder nicht ausreichend selbst herstellen. Er muss deshalb mit der Nahrung aufgenommen werden."},{"typ":"karteikarte","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-kk-18b6ff","vorne":"Welche Nahrungsbestandteile sind [[essenziell]]?","hinten":"Vitamine, Mineralstoffe, bestimmte Fettsäuren und bestimmte Aminosäuren."},{"typ":"karteikarte","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-kk-0c863c","vorne":"Welche Vitamine sind fettlöslich, und wie kann man sie sich merken?","hinten":"Die Vitamine E, D, K und A – Merkhilfe: die Supermarktkette „EDeKA“."},{"typ":"karteikarte","quelle":["i-care S. 242","MKK S. 362"],"erklaerung":"","id":"naehrstoffe-kk-ec60e8","vorne":"Warum sollte man fettlösliche Vitamine zusammen mit etwas Fett essen?","hinten":"Der Körper kann sie nur dann aufnehmen, wenn gleichzeitig Fett in der Nahrung ist."},{"typ":"karteikarte","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-kk-dff223","vorne":"Welches Vitamin kann der Körper mithilfe von Sonnenlicht selbst herstellen?","hinten":"Vitamin D. Sein Ausgangsstoff wird bei ausreichender Sonneneinstrahlung in der Haut gebildet."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-119cfe","vorne":"Warum müssen Veganer besonders auf Vitamin B12 achten?","hinten":"Vitamin B12 ist nur in tierischen Produkten enthalten."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-495919","vorne":"Warum ist Folsäure in der Schwangerschaft besonders wichtig?","hinten":"Der Bedarf ist erhöht. Ein Mangel kann beim Kind zu einem offenen Rücken (Spina bifida) führen."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-642446","vorne":"Welche Krankheit entsteht bei einem Mangel an Vitamin C?","hinten":"Skorbut. Früher waren häufig Matrosen betroffen, die lange keine frischen Lebensmittel hatten."},{"typ":"karteikarte","quelle":["i-care S. 243–244"],"erklaerung":"","id":"naehrstoffe-kk-621b49","vorne":"Was ist der Unterschied zwischen Mengen- und Spurenelementen?","hinten":"Mengenelemente kommen in größerer Menge im Körper vor (z. B. Kalzium, Natrium). Spurenelemente nur in geringen Mengen (z. B. Eisen, Jod)."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-634a9b","vorne":"Wo kommen die wichtigen [[essenziell|essenziellen]] Fettsäuren vor?","hinten":"Vor allem in pflanzlichen Ölen (z. B. Raps-, Oliven- oder Nussöl) und in Fisch."},{"typ":"karteikarte","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-kk-884aee","vorne":"Was ist der Grundumsatz?","hinten":"Die Energie, die der Körper in völliger Ruhe braucht, um seine lebenswichtigen Organfunktionen aufrechtzuerhalten."},{"typ":"karteikarte","quelle":["i-care S. 245"],"erklaerung":"","id":"naehrstoffe-kk-37c2f6","vorne":"Was ist der Arbeitsumsatz?","hinten":"Grundumsatz plus die Energie für alle Aktivitäten, z. B. Bewegung und körperliche Arbeit."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-f81c0e","vorne":"Welcher Nährstoff liefert pro Gramm am meisten Energie?","hinten":"Fett. Es liefert bei gleicher Menge mehr als doppelt so viel Energie wie Kohlenhydrate oder Eiweiß."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"naehrstoffe-kk-c1d24d","vorne":"Was sind Ballaststoffe, und warum sind sie nützlich?","hinten":"Stoffe, die im Dünndarm nicht verdaut werden können, meist unverdauliche Vielfachzucker aus Getreide und Gemüse. Sie quellen auf und tragen zum Sättigungsgefühl bei."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-0e55a4","vorne":"Was bedeutet eine hohe biologische Wertigkeit eines Nahrungseiweißes?","hinten":"Das Eiweiß ähnelt dem menschlichen Körpereiweiß stark. Der Körper kann daraus viel körpereigenes Protein bilden."},{"typ":"karteikarte","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-kk-a2825b","vorne":"Welche Getränke eignen sich am besten zum Durstlöschen?","hinten":"Wasser und ungesüßte Tees. Unverdünnte Säfte und Limonaden enthalten meist viel Zucker und damit Kalorien."},{"typ":"karteikarte","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-kk-8a171d","vorne":"Welche Hormone steuern Hunger und Sättigung?","hinten":"Cholecystokinin gilt als „Sättigungshormon“, Ghrelin als „Hungerhormon“."},{"typ":"karteikarte","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-kk-7094e3","vorne":"Was gibt der Body-Mass-Index (BMI) an?","hinten":"Das Körpergewicht im Verhältnis zur Körpergröße. Ein sehr hoher BMI spricht für Fettleibigkeit ([[Adipositas]])."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-4ac263","vorne":"Wie verändert sich der Energiebedarf im Alter?","hinten":"Er sinkt, weil der Muskelanteil abnimmt. Ältere Menschen brauchen aber genauso viele Nährstoffe wie jüngere."},{"typ":"karteikarte","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-kk-d80222","vorne":"Welche drei Gruppen von Kohlenhydraten unterscheidet man?","hinten":"Einfachzucker ([[Monosaccharide]]), Zweifachzucker ([[Disaccharide]]) und Vielfachzucker ([[Polysaccharide]])."},{"typ":"karteikarte","quelle":["i-care S. 238","MKK S. 361–362, 370"],"erklaerung":"","id":"naehrstoffe-kk-3e640d","vorne":"Nenne drei Einfachzucker ([[Monosaccharide]]).","hinten":"Glukose (Traubenzucker), Fruktose (Fruchtzucker) und Galaktose."},{"typ":"karteikarte","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-kk-14c3cc","vorne":"Nenne drei Zweifachzucker ([[Disaccharide]]).","hinten":"Maltose (Malzzucker), Laktose (Milchzucker) und Saccharose (Rohr- bzw. Rübenzucker)."},{"typ":"karteikarte","quelle":["MKK S. 361","i-care S. 238"],"erklaerung":"","id":"naehrstoffe-kk-36138b","vorne":"Nenne einen wichtigen Vielfachzucker ([[Polysaccharide|Polysaccharid]]) und wo er vorkommt.","hinten":"Stärke, z. B. in Kartoffeln und Reis. Sie ist die häufigste Form der Kohlenhydrate in unserer Nahrung."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-b3bc2f","vorne":"Warum lassen Vielfachzucker den Blutzucker langsamer ansteigen als Einfachzucker?","hinten":"Vielfachzucker müssen erst verdaut und zu Einfachzuckern abgebaut werden, bevor sie ins Blut gelangen. Einfachzucker wie Glukose gelangen sehr schnell ins Blut."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"naehrstoffe-kk-710293","vorne":"Aus welchen Einfachzuckern bestehen Maltose, Laktose und Saccharose?","hinten":"Maltose: Glukose + Glukose. Laktose: Galaktose + Glukose. Saccharose: Glukose + Fruktose."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 241, 243–244"],"erklaerung":"","id":"naehrstoffe-op-essenziell","operator":"beschreiben","afb":"I","fall":"Alaa liest auf einer Müslipackung „mit essenziellen Nährstoffen“. Er fragt Robartina in der Pause: „Was heißt eigentlich essenziell – und welche Stoffe sind das?“","auftrag":"Beschreibe, was essenzielle Nahrungsbestandteile sind, und nenne die vier Gruppen.","mindestlaenge":250,"kriterien":["Ich erkläre, dass der Körper diese Stoffe nicht oder nicht ausreichend selbst herstellen kann.","Ich erkläre, dass sie deshalb mit der Nahrung aufgenommen werden müssen.","Ich nenne Vitamine und Mineralstoffe.","Ich nenne bestimmte Fettsäuren und bestimmte Aminosäuren."],"musterloesung":"Essenzielle Nahrungsbestandteile sind Stoffe, die der Körper nicht oder nicht in ausreichender Menge selbst herstellen kann. Weil sie lebensnotwendig sind, müssen sie mit der Nahrung aufgenommen werden. Dazu gehören **Vitamine** (z. B. Vitamin C), **Mineralstoffe** (z. B. Kalzium oder Eisen), **bestimmte Fettsäuren** (z. B. aus pflanzlichen Ölen und Fisch) und **bestimmte Aminosäuren**."},{"typ":"operator","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-op-vegan","operator":"erläutern","afb":"II","fall":"Robartinas Mitschüler Alaa ernährt sich seit Kurzem vegan, also ohne Fleisch, Fisch, Milchprodukte und Eier. Frau Abda sagt zu ihm: „Das kann man gut machen – aber du musst bei zwei Dingen besonders aufpassen.“","auftrag":"Erläutere, worauf Alaa bei einer veganen Ernährung laut Buch besonders achten muss und warum.","mindestlaenge":350,"kriterien":["Ich nenne Vitamin B12 und erkläre, dass es nur in tierischen Produkten enthalten ist.","Ich nenne mögliche Nahrungsergänzungsmittel.","Ich nenne die essenziellen Aminosäuren und dass sie vor allem in tierischen Produkten vorkommen.","Ich erkläre, dass der Bedarf durch eine geeignete Zusammenstellung pflanzlicher Lebensmittel gedeckt werden kann."],"musterloesung":"**Vitamin B12** ist nur in tierischen Produkten enthalten. Veganer müssen deshalb darauf achten, dass sie – ggf. über Nahrungsergänzungsmittel – genügend Vitamin B12 aufnehmen. **Essenzielle Aminosäuren** kann der Körper nicht selbst bilden. Sie kommen vor allem in tierischen Produkten vor. Der Bedarf lässt sich aber auch über pflanzliche Lebensmittel decken, wenn man sie geeignet kombiniert. Veganer müssen ihre Mahlzeiten deshalb sorgfältig zusammenstellen."},{"typ":"operator","quelle":["i-care S. 246–247"],"erklaerung":"","id":"naehrstoffe-op-alter","operator":"beurteilen","afb":"III","fall":"Frau M. (82) liegt auf Robartinas Station. Sie isst seit Tagen sehr wenig, weil ihre Zahnprothese drückt, und hat sichtbar abgenommen. Robartina meint zu Alaa: „Ältere Menschen verbrauchen doch sowieso weniger Energie. Dann ist es nicht so schlimm, wenn sie wenig isst.“","auftrag":"Beurteile Robartinas Aussage mithilfe der Informationen aus dem Buch.","mindestlaenge":400,"kriterien":["Ich bestätige, dass der Energiebedarf im Alter sinkt.","Ich erkläre, dass ältere Menschen trotzdem genauso viele Nährstoffe benötigen.","Ich nenne Probleme wie Zahnprothesen, die zu Untergewicht oder Mangelerscheinungen führen können.","Ich nenne mögliche Maßnahmen (z. B. hochkalorische Nahrungsergänzungen bei starker Abmagerung).","Ich komme zu einem begründeten Urteil über Robartinas Aussage."],"musterloesung":"Robartina hat teilweise recht: Im Alter **sinkt der Energiebedarf**, weil der Muskelanteil abnimmt. Ältere Menschen benötigen aber **genauso viele Nährstoffe** wie jüngere. Viele haben zudem Schwierigkeiten beim Essen, z. B. **wegen Zahnprothesen**. Das kann zu **Untergewicht oder Mangelerscheinungen** führen – genau das zeichnet sich bei Frau M. ab. Bei starker Abmagerung ([[Kachexie]]) können hochkalorische Nahrungsergänzungen angeboten werden. **Urteil:** Robartinas Schlussfolgerung ist falsch. Frau M. drohen Mangelernährung und weiterer Gewichtsverlust. Das Problem mit der Prothese sollte gelöst und ihre Ernährung beobachtet werden."}],"status":"aktiv"},{"id":"aufbau","titel":"Aufgaben und Aufbau des Verdauungssystems","block":1,"nr":2,"organ":"","beschreibung":"Vom Mund bis zum After: der Weg der Nahrung im Überblick.","quellen":"i-care S. 188–192; MKK S. 344–347","icon":"verdauungstrakt","farbe":"#1b8a69","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"mundhoehle","titel":"Mundhöhle und Speiseröhre","block":2,"nr":1,"organ":"","beschreibung":"Zähne, Zunge, Speichel und Schlucken.","quellen":"i-care S. 193–205; MKK S. 347–354","icon":"mund","farbe":"#2A473B","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"magen","titel":"Magen","block":2,"nr":2,"organ":"","beschreibung":"Magensaft, Magenschleimhaut und Magenentleerung.","quellen":"i-care S. 205–210; MKK S. 353–357","icon":"magen","farbe":"#2A473B","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 207"],"erklaerung":"Die Belegzellen bilden die Salzsäure. Die Hauptzellen bilden Pepsinogen, die Nebenzellen Schleim.","id":"magen-sc-belegzellen","frage":"Welche Zellen der Magendrüsen bilden die Salzsäure?","optionen":[{"text":"Hauptzellen","richtig":false},{"text":"Belegzellen","richtig":true},{"text":"Nebenzellen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-sc-lage","frage":"Wo liegt der Magen?","optionen":[{"text":"im linken Oberbauch","richtig":true},{"text":"im rechten Oberbauch","richtig":false},{"text":"im rechten Unterbauch","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 354"],"erklaerung":"Die Kardia ist der Mageneingang, der Fundus der Magengrund.","id":"magen-sc-pylorus","frage":"Wie heißt der Abschnitt, mit dem der Magen in den Dünndarm übergeht?","optionen":[{"text":"[[Pylorus]]","richtig":true},{"text":"[[Kardia]]","richtig":false},{"text":"[[Fundus]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 205"],"erklaerung":"Weil er so sauer ist, tötet der Magensaft auch Keime ab.","id":"magen-sc-sauer","frage":"Wie ist der Magensaft beschaffen?","optionen":[{"text":"sehr sauer","richtig":true},{"text":"neutral","richtig":false},{"text":"basisch","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-sc-pepsinogen","frage":"Wodurch wird Pepsinogen in das aktive Enzym [[Pepsin]] umgewandelt?","optionen":[{"text":"durch die Salzsäure","richtig":true},{"text":"durch den Schleim","richtig":false},{"text":"durch den Intrinsic Factor","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 209"],"erklaerung":"Dadurch wird die Magenschleimhaut geschont, z. B. bei einer Magenschleimhautentzündung.","id":"magen-sc-ppi","frage":"Was bewirken Protonenpumpenhemmer?","optionen":[{"text":"Es wird weniger Salzsäure gebildet.","richtig":true},{"text":"Es wird mehr Salzsäure gebildet.","richtig":false},{"text":"Der Magen entleert sich schneller.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 205, 240"],"erklaerung":"Achtung Verwechslungsgefahr: Die fetthaltige Lymphe heißt [[Chylus]].","id":"magen-sc-chymus","frage":"Was ist der [[Chymus]]?","optionen":[{"text":"der Speisebrei aus Nahrung und Magensaft","richtig":true},{"text":"der Schleim der Nebenzellen","richtig":false},{"text":"die Galle","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 355"],"erklaerung":"Fettreiche Speisen passieren den Magen am langsamsten.","id":"magen-sc-verweildauer","frage":"Welche Speisen verlassen den Magen am schnellsten?","optionen":[{"text":"kohlenhydratreiche Speisen, z. B. das Frühstücksbrötchen","richtig":true},{"text":"fettreiche Speisen, z. B. die Weihnachtsgans","richtig":false},{"text":"Alle Speisen bleiben gleich lange im Magen.","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-sc-entleerung","frage":"Wie wird der Magen entleert?","optionen":[{"text":"in kleinen Portionen: Der Pylorus öffnet sich immer wieder kurz.","richtig":true},{"text":"auf einmal, sobald der Magen voll ist","richtig":false},{"text":"nur über Nacht","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-sc-intrinsic","frage":"Wofür ist der Intrinsic Factor notwendig?","optionen":[{"text":"für die Aufnahme von Vitamin B12","richtig":true},{"text":"für die Aufnahme von Vitamin C","richtig":false},{"text":"für die Bildung des Magenschleims","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-sc-helicobacter","frage":"Was ist laut Buch die wichtigste Ursache für Magengeschwüre?","optionen":[{"text":"das Bakterium Helicobacter pylori","richtig":true},{"text":"zu wenig Salzsäure","richtig":false},{"text":"zu wenig Vitamin B12","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-sc-falten","frage":"Wozu dienen die Falten der Magenschleimhaut?","optionen":[{"text":"Sie ermöglichen die Dehnung der Magenwand.","richtig":true},{"text":"Sie bilden die Salzsäure.","richtig":false},{"text":"Sie nehmen die Nährstoffe auf.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-mc-salzsaeure","frage":"Welche Aufgaben hat die Salzsäure des Magensafts?","optionen":[{"text":"Sie wandelt Pepsinogen in Pepsin um.","richtig":true},{"text":"Sie verändert die Struktur der Eiweiße.","richtig":true},{"text":"Sie wirkt gegen Bakterien.","richtig":true},{"text":"Sie spaltet Fette.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 205, 210"],"erklaerung":"Die Galle bildet die Leber, die Nährstoffe werden hauptsächlich im Dünndarm aufgenommen.","id":"magen-mc-aufgaben","frage":"Welche Aufgaben hat der Magen?","optionen":[{"text":"Er vermischt die Nahrung mit Magensaft zum Speisebrei.","richtig":true},{"text":"Er speichert den Speisebrei und gibt ihn portionsweise weiter.","richtig":true},{"text":"Sein saurer Magensaft tötet Keime ab.","richtig":true},{"text":"Er bildet die Galle.","richtig":false},{"text":"Er nimmt den Großteil der Nährstoffe ins Blut auf.","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 354–355"],"erklaerung":"","id":"magen-mc-magensaft","frage":"Welche Bestandteile enthält der Magensaft?","optionen":[{"text":"Salzsäure","richtig":true},{"text":"Pepsinogen bzw. Pepsin","richtig":true},{"text":"Schleim","richtig":true},{"text":"Galle","richtig":false},{"text":"Insulin","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-mc-schutz","frage":"Was schützt die Magenschleimhaut vor der Selbstverdauung?","optionen":[{"text":"ein zäher Schleimfilm","richtig":true},{"text":"Bikarbonat im Schleim, das die Säure abpuffert","richtig":true},{"text":"eine gute Durchblutung der Schleimhaut","richtig":true},{"text":"besonders viel Pepsin","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 356"],"erklaerung":"Eine gute Durchblutung schützt vor Geschwüren.","id":"magen-mc-ulkus","frage":"Was kann die Entstehung eines Magengeschwürs begünstigen?","optionen":[{"text":"eine Besiedlung mit Helicobacter pylori","richtig":true},{"text":"Rauchen","richtig":true},{"text":"Stress","richtig":true},{"text":"eine gute Durchblutung der Schleimhaut","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-mc-dyspepsie","frage":"Welche Beschwerden zählen zu den typischen Magenbeschwerden (Dyspepsie)?","optionen":[{"text":"Völlegefühl","richtig":true},{"text":"Sodbrennen","richtig":true},{"text":"Übelkeit","richtig":true},{"text":"Fieber","richtig":false},{"text":"Durchfall","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-zu-zellen","frage":"Ordne jeder Zellart ihr Produkt zu.","paare":[{"links":"Belegzellen","rechts":"Salzsäure"},{"links":"Hauptzellen","rechts":"Pepsinogen"},{"links":"Nebenzellen","rechts":"Schleim"}]},{"typ":"zuordnung","quelle":["i-care S. 205","MKK S. 354"],"erklaerung":"","id":"magen-zu-abschnitte","frage":"Ordne jedem Magenabschnitt den deutschen Namen zu.","paare":[{"links":"[[Kardia]]","rechts":"Mageneingang"},{"links":"[[Fundus]]","rechts":"Magengrund"},{"links":"[[Korpus]]","rechts":"Magenkörper"},{"links":"[[Pylorus]]","rechts":"Magenpförtner"}]},{"typ":"zuordnung","quelle":["i-care S. 205, 209"],"erklaerung":"","id":"magen-zu-begriffe","frage":"Ordne jedem Begriff seine Bedeutung zu.","paare":[{"links":"[[Gaster]]","rechts":"Magen"},{"links":"[[Chymus]]","rechts":"Speisebrei"},{"links":"[[Denaturierung]]","rechts":"Strukturveränderung der Eiweiße"}]},{"typ":"reihenfolge","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-rf-weg","frage":"Bring die Stationen in die Reihenfolge, die der Speisebrei durchläuft.","schritte":["Speiseröhre","[[Kardia]]","[[Korpus]]","[[Pylorus]]","Zwölffingerdarm"]},{"typ":"reihenfolge","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-rf-entleerung","frage":"Bring die Vorgänge vom Essen bis zur Magenentleerung in die richtige Reihenfolge.","schritte":["Der Speisebrei gelangt nach dem Schlucken in den Magen.","Die Magenwand erschlafft und macht Platz für die Nahrung.","Wellenbewegungen durchmischen den Speisebrei.","Der Pylorus öffnet sich kurz, eine kleine Portion tritt in den Zwölffingerdarm über."]},{"typ":"reihenfolge","quelle":["i-care S. 207, 209"],"erklaerung":"","id":"magen-rf-eiweiss","frage":"Was passiert mit dem Eiweiß im Magen? Bring die Schritte in die richtige Reihenfolge.","schritte":["Die Hauptzellen geben Pepsinogen ab.","Die Salzsäure wandelt Pepsinogen in Pepsin um.","Pepsin spaltet die Eiweiße."]},{"typ":"lückentext","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-lt-zellen","text":"Die Belegzellen bilden die {{Salzsäure|HCl}}. Die Hauptzellen bilden {{Pepsinogen}}, die Vorstufe des Enzyms {{Pepsin}}."},{"typ":"lückentext","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-lt-magensaft","text":"Der Magensaft ist sehr {{sauer}}. Dadurch tötet er auch {{Keime|Bakterien}} ab."},{"typ":"lückentext","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-lt-chymus","text":"Im Magen wird die Nahrung mit dem Magensaft zum Speisebrei vermischt. Erreicht eine Welle den Magenausgang, öffnet sich der Schließmuskel kurz, und eine kleine Menge gelangt in den {{Zwölffingerdarm|Duodenum}}. Größere Nahrungsbestandteile werden im Magen {{zurückgehalten|zurück gehalten}}."},{"typ":"fehlerfahndung","quelle":["MKK S. 355","i-care S. 207"],"erklaerung":"Bei Erbrechen besteht Aspirationsgefahr. Betroffene sollen deshalb aufrecht sitzen oder – wenn das nicht möglich ist – in Seitenlage liegen. Bis zur Klärung bleiben sie nüchtern. Uhrzeit, Menge, Art, Aussehen und Geruch des Erbrochenen werden dokumentiert. Die Salzsäure des Magensafts bilden die Belegzellen, nicht die Hauptzellen.","id":"magen-ff-erbrechen","titel":"Robartinas Pflegebericht: Herr K. hat erbrochen","bericht":"10:15 Uhr: Herr K. hat einmal erbrochen. Ich habe ihn sofort flach in Rückenlage gebracht, damit er sich ausruhen kann. Seine Zahnprothese habe ich entfernt und ihm eine Nierenschale und Zellstoff gereicht. Danach habe ich ihm Mundpflege angeboten und die Bettwäsche gewechselt. Damit er wieder zu Kräften kommt, habe ich ihm gleich ein Brötchen gebracht. Das Erbrochene habe ich entsorgt, ohne etwas zu notieren. Frau Abda hat mir erklärt, dass der saure Magensaft von den Hauptzellen gebildet wird.","fehler":[{"links":"flach in Rückenlage gebracht","rechts":"aufrecht|sitz|seitenlage","loesung":"aufrecht sitzen lassen oder in Seitenlage gebracht (Aspirationsgefahr)"},{"links":"gleich ein Brötchen gebracht","rechts":"nüchtern|nichts zu essen|kein essen","loesung":"bis zur Klärung des weiteren Vorgehens nüchtern gelassen"},{"links":"entsorgt, ohne etwas zu notieren","rechts":"dokument|notier|aufgeschrieben","loesung":"Uhrzeit, Menge, Art, Aussehen und Geruch dokumentiert"},{"links":"Hauptzellen","rechts":"belegzell|parietalzell","loesung":"Belegzellen"}]}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-06deb0","vorne":"Was bedeutet [[Gaster]]?","hinten":"Magen."},{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-cc057a","vorne":"Welche Aufgaben hat der Magen?","hinten":"Er vermischt die Nahrung mit Magensaft zum Speisebrei ([[Chymus]]), speichert ihn und gibt ihn portionsweise an den Dünndarm ab. Der saure Magensaft tötet außerdem Keime ab."},{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-f39378","vorne":"Wo liegt der Magen?","hinten":"Im linken Oberbauch."},{"typ":"karteikarte","quelle":["MKK S. 354","i-care S. 205"],"erklaerung":"","id":"magen-kk-c28592","vorne":"Nenne die Abschnitte des Magens.","hinten":"[[Kardia]] (Mageneingang), [[Fundus]] (Magengrund), [[Korpus]] (Magenkörper), [[Antrum]] und [[Pylorus]] (Magenpförtner)."},{"typ":"karteikarte","quelle":["i-care S. 205","MKK S. 359"],"erklaerung":"","id":"magen-kk-40fcd2","vorne":"Was ist der [[Pylorus]]?","hinten":"Der Magenpförtner. Hier sitzt ein Schließmuskel, der den Magen zum Dünndarm hin verschließt."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-483ded","vorne":"Warum bildet die Magenschleimhaut Falten?","hinten":"Die Falten ermöglichen, dass sich die Magenwand dehnen kann. Im gefüllten Magen sind sie verstrichen."},{"typ":"karteikarte","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-kk-4dffd5","vorne":"Was ist das Besondere an der Muskelschicht des Magens?","hinten":"Sie besteht aus drei Schichten. So kann sich der Magen vielfältig zusammenziehen und den Speisebrei gut durchmischen."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-f74707","vorne":"Was bilden die Belegzellen der Magendrüsen?","hinten":"Salzsäure und den Intrinsic Factor."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-5a6c95","vorne":"Was bilden die Hauptzellen der Magendrüsen?","hinten":"[[Pepsinogen]], die Vorstufe des eiweißspaltenden Enzyms Pepsin."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-b35644","vorne":"Was bilden die Nebenzellen der Magendrüsen?","hinten":"Schützenden Schleim."},{"typ":"karteikarte","quelle":["i-care S. 205, 209"],"erklaerung":"","id":"magen-kk-0825ad","vorne":"Wie ist der Magensaft beschaffen?","hinten":"Er ist sehr sauer. Seine wichtigsten Bestandteile sind Salzsäure und Pepsinogen."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-8b90a2","vorne":"Welche Aufgaben hat die Salzsäure im Magen?","hinten":"Sie wandelt [[Pepsinogen]] in [[Pepsin]] um, verändert die Struktur der Eiweiße ([[Denaturierung]]) und wirkt gegen Bakterien."},{"typ":"karteikarte","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-kk-f07df3","vorne":"Warum verdaut sich der Magen nicht selbst?","hinten":"Ein zäher Schleimfilm kleidet den Magen aus und schützt die Schleimhaut vor Salzsäure und Pepsin."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-663dd8","vorne":"Wofür wird der Intrinsic Factor gebraucht?","hinten":"Für die Aufnahme von Vitamin B12 aus der Nahrung."},{"typ":"karteikarte","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-kk-5dadd9","vorne":"Was regt die Bildung von Magensaft schon vor dem Essen an?","hinten":"Geruchs- und Geschmacksreize. Der Magen wird so auf die Nahrung vorbereitet."},{"typ":"karteikarte","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-kk-0ea980","vorne":"Welche Speisen bleiben am längsten im Magen?","hinten":"Fettreiche Speisen. Kohlenhydratreiche Speisen verlassen den Magen am schnellsten, Flüssigkeiten noch schneller."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-50e7db","vorne":"Wie gelangt der Speisebrei aus dem Magen in den Dünndarm?","hinten":"Portionsweise: Wellenbewegungen laufen zum Magenausgang, der Pylorus öffnet sich kurz und eine kleine Menge tritt in den Zwölffingerdarm über."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-0ead49","vorne":"Wie wirken Protonenpumpenhemmer?","hinten":"Sie sorgen dafür, dass weniger Salzsäure gebildet wird. Dadurch wird die Magenschleimhaut geschont."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-c5a5c9","vorne":"Was ist die wichtigste Ursache für Magengeschwüre?","hinten":"Das Bakterium Helicobacter pylori."},{"typ":"karteikarte","quelle":["i-care S. 205, 210"],"erklaerung":"","id":"magen-kk-5a4581","vorne":"Wo findet die Aufnahme der Nährstoffe (Resorption) hauptsächlich statt – im Magen oder im Dünndarm?","hinten":"Im Dünndarm. Der Magen bereitet die Nahrung vor und gibt sie portionsweise weiter."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-op-schleimhaut","operator":"beschreiben","afb":"I","fall":"Robartina hospitiert in der Endoskopie. Frau Abda zeigt ihr auf dem Bildschirm die Magenschleimhaut eines Patienten. Alaa fragt später: „Was machen eigentlich die ganzen Drüsen in der Magenschleimhaut?“","auftrag":"Beschreibe für Alaa, welche Zellarten die Magendrüsen enthalten und was sie jeweils bilden.","mindestlaenge":250,"kriterien":["Ich nenne die Belegzellen und die Salzsäure.","Ich nenne die Hauptzellen und das Pepsinogen.","Ich nenne die Nebenzellen und den schützenden Schleim.","Ich verwende die Fachbegriffe korrekt."],"musterloesung":"Die Magendrüsen bestehen aus verschiedenen Zellarten. Die **Belegzellen** bilden die Salzsäure, die den Magensaft sauer macht, und den Intrinsic Factor, der für die Aufnahme von Vitamin B12 nötig ist. Die **Hauptzellen** bilden Pepsinogen, die Vorstufe des eiweißspaltenden Pepsins. Die **Nebenzellen** stellen den schützenden Schleim her."},{"typ":"operator","quelle":["MKK S. 354–355"],"erklaerung":"","id":"magen-op-selbstschutz","operator":"erläutern","afb":"II","fall":"Ein Patient fragt Robartina beim Frühstück: „Wenn im Magen so starke Säure ist, dass sie sogar Eiweiße zerlegt – warum verdaut sich mein Magen dann nicht selbst?“ Robartina möchte ihm eine fachlich richtige Antwort geben.","auftrag":"Erläutere, wie sich die Magenschleimhaut vor Salzsäure und Pepsin schützt.","mindestlaenge":350,"kriterien":["Ich nenne den zähen Schleim als Schutzfilm.","Ich nenne die Zellen, die den Schleim bilden.","Ich erkläre, dass das Bikarbonat im Schleim die Säure abpuffert.","Ich erkläre, dass Salzsäure und Pepsin die Schleimhaut sonst angreifen würden (Selbstverdauung).","Ich nenne die ausreichende Durchblutung als Voraussetzung."],"musterloesung":"Der Magensaft enthält Salzsäure und das eiweißspaltende Pepsin. Beide würden auch die Zellen der Magenschleimhaut angreifen. Davor schützt ein zäher **Magenschleim**, den die Oberflächenzellen und besonders die **Nebenzellen** bilden. Er bildet einen geschlossenen Film, der den ganzen Magen auskleidet. Im Schleim befindet sich **Bikarbonat**, das die Säure abpuffert. So wird eine **Selbstverdauung** verhindert. Voraussetzung ist neben der intakten Schleimschicht eine **ausreichende Durchblutung** der Schleimhaut."},{"typ":"operator","quelle":["MKK S. 356–357","i-care S. 209"],"erklaerung":"","id":"magen-op-ulkus","operator":"beurteilen","afb":"III","fall":"Herr S. (58) liegt mit einem Magengeschwür auf Robartinas Station. Der Test auf Helicobacter pylori war positiv. Herr S. raucht und nimmt wegen Rückenschmerzen regelmäßig Schmerzmittel. Er sagt zu Robartina: „Ich nehme jetzt einfach den Säureblocker, dann ist alles wieder gut. Rauchen und meine Schmerztabletten lasse ich mir nicht nehmen.“ Frau Abda bittet Robartina, darüber nachzudenken.","auftrag":"Beurteile, ob die alleinige Einnahme eines Säureblockers (Protonenpumpenhemmers) ausreicht, damit das Magengeschwür von Herrn S. abheilt.","mindestlaenge":400,"kriterien":["Ich erkläre die Wirkung des Protonenpumpenhemmers (weniger Salzsäure).","Ich nenne Helicobacter pylori als wichtige Ursache.","Ich nenne Rauchen und bestimmte Schmerzmittel als weitere Faktoren, die ein Geschwür begünstigen.","Ich nenne die Behandlung gegen Helicobacter (Protonenpumpenhemmer plus zwei Antibiotika).","Ich komme zu einem begründeten Urteil und beziehe mich auf Herrn S."],"musterloesung":"Ein Protonenpumpenhemmer sorgt dafür, dass weniger Salzsäure gebildet wird. Die Schleimhaut wird geschont und kann besser abheilen. Ein Geschwür entsteht aber durch ein Ungleichgewicht zwischen schädigenden Faktoren und dem Schutz der Schleimhaut. Bei Herrn S. liegen mehrere schädigende Faktoren vor: Er ist mit **Helicobacter pylori** besiedelt, er **raucht** und nimmt regelmäßig **Schmerzmittel**, die ein Geschwür begünstigen können (nichtsteroidale Antiphlogistika). Bei Helicobacter wird eine Behandlung mit einem Protonenpumpenhemmer **und zwei Antibiotika** durchgeführt. Außerdem sollen auslösende Medikamente und Zigaretten abgesetzt werden. **Urteil:** Der Säureblocker allein reicht nicht aus. Herr S. braucht zusätzlich die Antibiotika und sollte auf das Rauchen und die Schmerzmittel verzichten – sonst drohen neue Geschwüre und Komplikationen wie Blutungen."}],"status":"aktiv"},{"id":"duenndarm","titel":"Dünndarm","block":2,"nr":3,"organ":"","beschreibung":"Zotten, Mikrovilli und Resorption.","quellen":"i-care S. 210–214; MKK S. 357–359","icon":"darm","farbe":"#2A473B","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"dickdarm","titel":"Dickdarm","block":2,"nr":4,"organ":"","beschreibung":"Kolon, Rektum und Stuhlentleerung.","quellen":"i-care S. 215–220; MKK S. 362–367","icon":"darm","farbe":"#2A473B","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"pankreas","titel":"Pankreas","block":2,"nr":5,"organ":"","beschreibung":"Die Bauchspeicheldrüse und ihre Verdauungsenzyme.","quellen":"i-care S. 221–223; MKK S. 359, 367–368","icon":"pankreas","farbe":"#2A473B","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"leber","titel":"Leber und Gallenblase","block":2,"nr":6,"organ":"","beschreibung":"Stoffwechselzentrale und Galle.","quellen":"i-care S. 224–237; MKK S. 359–361, 368–372","icon":"leber","farbe":"#2A473B","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"verdauung","titel":"Verdauung der Nährstoffe","block":3,"nr":1,"organ":"","beschreibung":"Wie Enzyme Kohlenhydrate, Eiweiße und Fette zerlegen.","quellen":"i-care S. 197, 214, 223, 238–241; MKK S. 359, 361–362","icon":"enzym","farbe":"#3d8f74","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-staerke","frage":"Welches Enzym spaltet Stärke?","optionen":[{"text":"[[Amylase]]","richtig":true},{"text":"[[Pepsin]]","richtig":false},{"text":"[[Lipase]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-form","frage":"In welcher Form können Kohlenhydrate aufgenommen werden?","optionen":[{"text":"als Einfachzucker","richtig":true},{"text":"als Zweifachzucker","richtig":false},{"text":"als Vielfachzucker","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239"],"erklaerung":"Die Salzsäure des Magensafts verändert die Eiweiße. Der Hauptteil der Eiweißverdauung findet aber im Dünndarm statt.","id":"verdauung-sc-eiweiss-beginn","frage":"Wo beginnt die Eiweißverdauung?","optionen":[{"text":"im Magen","richtig":true},{"text":"in der Mundhöhle","richtig":false},{"text":"im Dickdarm","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-sc-eiweiss-haupt","frage":"Wo findet der Hauptteil der Eiweißverdauung statt?","optionen":[{"text":"im Dünndarm","richtig":true},{"text":"im Magen","richtig":false},{"text":"in der Mundhöhle","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-sc-fett-enzym","frage":"Welches Enzym spaltet Fette?","optionen":[{"text":"[[Lipase]]","richtig":true},{"text":"[[Amylase]]","richtig":false},{"text":"Laktase","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-sc-chylomikronen","frage":"Wie gelangen die meisten Fettbausteine in den Blutkreislauf?","optionen":[{"text":"über die Lymphe","richtig":true},{"text":"über die Galle","richtig":false},{"text":"über den Urin","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 359"],"erklaerung":"Die Gallenblase speichert und dickt die Galle nur ein.","id":"verdauung-sc-galle","frage":"Welches Organ bildet die Galle?","optionen":[{"text":"die Leber","richtig":true},{"text":"die Gallenblase","richtig":false},{"text":"der Magen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-sc-pankreassaft","frage":"Wie ist der Pankreassaft beschaffen?","optionen":[{"text":"basisch – er neutralisiert den sauren Speisebrei","richtig":true},{"text":"sehr sauer – wie der Magensaft","richtig":false},{"text":"fettig – wie die Galle","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-sc-laktose","frage":"Welches Enzym fehlt bei einer Laktoseintoleranz?","optionen":[{"text":"Laktase","richtig":true},{"text":"Amylase","richtig":false},{"text":"Lipase","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-sc-leber","frage":"Wohin gelangen Einfachzucker und Aminosäuren zuerst, nachdem sie aufgenommen wurden?","optionen":[{"text":"über die Pfortader zur Leber","richtig":true},{"text":"direkt ins Gehirn","richtig":false},{"text":"in den Dickdarm","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-mundamylase","frage":"Welche Bedeutung hat die Stärkeverdauung im Mund?","optionen":[{"text":"Sie beginnt dort, spielt aber insgesamt nur eine kleine Rolle.","richtig":true},{"text":"Dort wird die gesamte Stärke verdaut.","richtig":false},{"text":"Im Mund wird keine Stärke gespalten.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-staerke-haeufig","frage":"In welcher Form kommen Kohlenhydrate in der Nahrung am häufigsten vor?","optionen":[{"text":"als Stärke","richtig":true},{"text":"als Milchzucker","richtig":false},{"text":"als Traubenzucker","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 209, 223"],"erklaerung":"","id":"verdauung-mc-eiweiss-enzyme","frage":"Welche Enzyme spalten Eiweiße?","optionen":[{"text":"Pepsin","richtig":true},{"text":"Trypsin","richtig":true},{"text":"Amylase","richtig":false},{"text":"Lipase","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-mc-zucker-enzyme","frage":"Welche Enzyme spalten Zucker?","optionen":[{"text":"Amylase","richtig":true},{"text":"Laktase","richtig":true},{"text":"Maltase","richtig":true},{"text":"Pepsin","richtig":false},{"text":"Lipase","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-mc-emulgierung","frage":"Was hilft, Fette fein zu verteilen?","optionen":[{"text":"das Kauen","richtig":true},{"text":"die Bewegungen von Magen und Darm","richtig":true},{"text":"die Gallensäuren","richtig":true},{"text":"die Salzsäure","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 239–240"],"erklaerung":"Chylomikronen gelangen über die Lymphe in den Blutkreislauf.","id":"verdauung-mc-pfortader","frage":"Welche Stoffe gelangen nach der Aufnahme über die Pfortader zur Leber?","optionen":[{"text":"Einfachzucker","richtig":true},{"text":"Aminosäuren","richtig":true},{"text":"Chylomikronen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-mc-laktose","frage":"Welche Beschwerden können bei einer Laktoseintoleranz auftreten?","optionen":[{"text":"Blähungen","richtig":true},{"text":"Bauchschmerzen","richtig":true},{"text":"Durchfall","richtig":true},{"text":"Fieber","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-mc-pankreassaft","frage":"Welche Aussagen zum Pankreassaft stimmen?","optionen":[{"text":"Er enthält Enzyme für Eiweiße, Kohlenhydrate und Fette.","richtig":true},{"text":"Er neutralisiert den sauren Speisebrei.","richtig":true},{"text":"Er wird in der Gallenblase gespeichert.","richtig":false},{"text":"Er enthält Salzsäure.","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 238–240"],"erklaerung":"","id":"verdauung-zu-enzym","frage":"Ordne jedem Enzym zu, was es spaltet.","paare":[{"links":"[[Amylase]]","rechts":"Stärke"},{"links":"[[Pepsin]]","rechts":"Eiweiße"},{"links":"[[Lipase]]","rechts":"Fette"},{"links":"Laktase","rechts":"Milchzucker"}]},{"typ":"zuordnung","quelle":["i-care S. 214"],"erklaerung":"","id":"verdauung-zu-bausteine","frage":"Ordne jedem Nährstoff die Bausteine zu, die am Ende der Verdauung entstehen.","paare":[{"links":"Kohlenhydrate","rechts":"Einfachzucker"},{"links":"Eiweiße","rechts":"Aminosäuren"},{"links":"Fette","rechts":"Fettsäuren"}]},{"typ":"zuordnung","quelle":["i-care S. 188, 209"],"erklaerung":"","id":"verdauung-zu-organe","frage":"Ordne jedem Verdauungssaft das Organ zu, das ihn bildet.","paare":[{"links":"Speichel","rechts":"Speicheldrüsen"},{"links":"Magensaft","rechts":"Magen"},{"links":"Pankreassaft","rechts":"Bauchspeicheldrüse"},{"links":"Galle","rechts":"Leber"}]},{"typ":"reihenfolge","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-rf-staerke","frage":"Bring die Schritte der Stärkeverdauung in die richtige Reihenfolge.","schritte":["Die Amylase im Speichel beginnt, Stärke zu spalten.","Die Amylase des Pankreassafts spaltet die Stärke im Dünndarm in Zweifachzucker.","Enzyme der Darmschleimhaut spalten die Zweifachzucker in Einfachzucker.","Die Einfachzucker gelangen mit dem Pfortaderblut zur Leber."]},{"typ":"reihenfolge","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-rf-eiweiss","frage":"Bring die Schritte der Eiweißverdauung in die richtige Reihenfolge.","schritte":["Die Salzsäure des Magens verändert die Struktur der Eiweiße.","Pepsin beginnt im Magen, die Eiweiße zu spalten.","Enzyme aus dem Pankreas spalten die Eiweiße im Dünndarm weiter.","Die Aminosäuren gelangen über die Pfortader zur Leber."]},{"typ":"reihenfolge","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-rf-fett","frage":"Bring die Schritte der Fettverdauung in die richtige Reihenfolge.","schritte":["Kauen und Magenbewegungen verteilen die Fette.","Gallensäuren verteilen die Fette im Dünndarm noch feiner.","Die Lipase aus dem Pankreas spaltet die Fette.","Die Fettbausteine gelangen in Chylomikronen über die Lymphe ins Blut."]},{"typ":"lückentext","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-lt-zucker","text":"Stärke wird von der {{Amylase}} gespalten. Kohlenhydrate können nur als {{Einfachzucker|Monosaccharide}} aufgenommen werden."},{"typ":"lückentext","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-lt-eiweiss","text":"Im Magen verändert die {{Salzsäure|HCl}} die Struktur der Eiweiße. Danach beginnt das Enzym {{Pepsin}}, die Eiweiße zu spalten."},{"typ":"lückentext","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-lt-fett","text":"Fette werden vom Enzym {{Lipase}} gespalten. Die {{Galle|Gallensäuren}} hilft dabei, die Fette fein zu verteilen."}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-b0809e","vorne":"In welcher Form können Kohlenhydrate vom Darm aufgenommen werden?","hinten":"Nur als Einfachzucker ([[Monosaccharide]]), z. B. Glukose."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-7ff157","vorne":"In welcher Form kommen Kohlenhydrate in der Nahrung am häufigsten vor?","hinten":"Als Stärke, einem Vielfachzucker."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-11c49f","vorne":"Welches Enzym spaltet Stärke, und wo kommt es vor?","hinten":"Die [[Amylase]]. Sie kommt im Mundspeichel und im Pankreassaft vor. Die Amylase des Pankreassafts ist wichtiger."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-11844a","vorne":"Was spaltet die Laktase?","hinten":"[[Laktose]] (Milchzucker) in Einfachzucker."},{"typ":"karteikarte","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-kk-0179bc","vorne":"Was passiert bei einer Laktoseintoleranz?","hinten":"Es wird zu wenig Laktase gebildet. Der Milchzucker gelangt unverdaut in den Dickdarm und wird dort von Bakterien abgebaut. Das kann Blähungen, Bauchschmerzen und Durchfall verursachen."},{"typ":"karteikarte","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-kk-7b4d86","vorne":"Was ist der erste Schritt der Eiweißverdauung?","hinten":"Die Salzsäure im Magen verändert die Struktur der Eiweiße ([[Denaturierung]])."},{"typ":"karteikarte","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-kk-ca3ca7","vorne":"Wo findet der Hauptteil der Eiweißverdauung statt?","hinten":"Im Dünndarm, mithilfe der eiweißspaltenden Enzyme ([[Proteasen]]) aus dem Pankreassaft."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-f6a852","vorne":"Welche Bausteine entstehen am Ende der Eiweißverdauung?","hinten":"Aminosäuren (und sehr kurze Ketten aus zwei oder drei Aminosäuren)."},{"typ":"karteikarte","quelle":["i-care S. 223","MKK S. 359"],"erklaerung":"","id":"verdauung-kk-ce852f","vorne":"Warum bildet das Pankreas seine eiweißspaltenden Enzyme zunächst als inaktive Vorstufen?","hinten":"Damit sich die Bauchspeicheldrüse nicht selbst verdaut. Erst im Dünndarm werden die Enzyme aktiv."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-372423","vorne":"Warum müssen Fette fein verteilt (emulgiert) werden?","hinten":"Fette sind nicht wasserlöslich und klumpen zusammen. Dann erreichen die Enzyme sie nur schlecht."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-25b028","vorne":"Welche Lipase ist für die Fettverdauung wichtiger – die des Magens oder die des Pankreas?","hinten":"Die [[Lipase]] aus dem Pankreas. Die Magenlipase spaltet nur einen kleinen Teil der Fette."},{"typ":"karteikarte","quelle":["i-care S. 240","MKK S. 359"],"erklaerung":"","id":"verdauung-kk-209fb6","vorne":"Welche Rolle spielen die Gallensäuren bei der Fettverdauung?","hinten":"Sie legen sich um die Fetttröpfchen, verteilen das Fett fein und verpacken die Fettbausteine in [[Mizellen]]. So können die Fette verdaut und aufgenommen werden."},{"typ":"karteikarte","quelle":["MKK S. 359"],"erklaerung":"","id":"verdauung-kk-c62d2a","vorne":"Wo wird die Galle gebildet und wo gespeichert?","hinten":"Die Leber bildet die Galle. In der Gallenblase wird sie gespeichert und eingedickt."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-51ffaa","vorne":"Wie gelangen die meisten Fettbausteine ins Blut?","hinten":"In den Darmzellen werden sie zu Fett-Eiweiß-Tröpfchen ([[Chylomikronen]]) verpackt und über die Lymphe in den Blutkreislauf transportiert."},{"typ":"karteikarte","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-kk-85db0a","vorne":"Wie gelangen Einfachzucker und Aminosäuren nach der Aufnahme weiter?","hinten":"Mit dem Blut der Pfortader direkt zur Leber."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-efa544","vorne":"Was ist der Unterschied zwischen [[Chymus]] und [[Chylus]]?","hinten":"Chymus ist der Speisebrei, Chylus die fetthaltige Lymphe."},{"typ":"karteikarte","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-kk-aaf287","vorne":"Warum ist der Pankreassaft basisch?","hinten":"Er enthält Bikarbonat. So wird der saure Speisebrei aus dem Magen im Dünndarm neutralisiert."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"verdauung-kk-96cb94","vorne":"Wo wird der Speisebrei mit Pankreassaft und Galle vermischt?","hinten":"Im Zwölffingerdarm ([[Duodenum]])."},{"typ":"karteikarte","quelle":["i-care S. 197"],"erklaerung":"","id":"verdauung-kk-604c53","vorne":"Warum schmeckt Brot süßlich, wenn man es lange kaut?","hinten":"Die [[Amylase]] im Speichel spaltet Malzzucker (Maltose) von der Stärke im Brot ab."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"verdauung-kk-58c7d0","vorne":"Was geschieht mit Ballaststoffen im Dünndarm?","hinten":"Sie können dort nicht verdaut werden und gelangen weiter in den Dickdarm."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-op-pommes","operator":"beschreiben","afb":"I","fall":"Robartina isst in der Mittagspause Pommes und trinkt eine Cola. Alaa fragt: „Was passiert eigentlich mit der Stärke aus den Kartoffeln in deinem Körper?“","auftrag":"Beschreibe, wie die Stärke aus den Pommes verdaut und aufgenommen wird.","mindestlaenge":300,"kriterien":["Ich beschreibe, dass die Amylase im Mund beginnt, die Stärke zu spalten.","Ich beschreibe, dass die Amylase des Pankreassafts im Dünndarm den Hauptteil übernimmt.","Ich beschreibe, dass Enzyme der Darmschleimhaut die Zweifachzucker in Einfachzucker spalten.","Ich beschreibe den Weg der Einfachzucker über das Pfortaderblut zur Leber."],"musterloesung":"**Stärke** ist ein Vielfachzucker. Die **Amylase** des Mundspeichels beginnt, sie zu spalten; wichtiger ist aber die Amylase des **Pankreassafts** im Dünndarm. Sie spaltet die Stärke in den Zweifachzucker Maltose. Enzyme am **Bürstensaum** der Dünndarmschleimhaut spalten die Maltose in **Glukose**, einen Einfachzucker. Die Einfachzucker werden in die Darmzellen aufgenommen und gelangen mit dem **Pfortaderblut** direkt zur **Leber**."},{"typ":"operator","quelle":["i-care S. 240","MKK S. 359, 362"],"erklaerung":"","id":"verdauung-op-galle","operator":"erläutern","afb":"II","fall":"Ein Patient auf Robartinas Station hat eine Abflussstörung der Galle. Frau Abda erklärt, dass bei ihm Fettstühle auftreten können. Robartina fragt nach: „Was hat die Galle denn mit dem Fett im Stuhl zu tun?“","auftrag":"Erläutere, warum die Galle für die Fettverdauung wichtig ist und warum ein Mangel an Galle zu Fettstühlen führen kann.","mindestlaenge":350,"kriterien":["Ich erkläre, dass Fette nicht wasserlöslich sind und zusammenklumpen.","Ich erkläre, dass die Gallensäuren die Fette fein verteilen.","Ich erkläre, dass die Lipasen die Fette dadurch besser spalten können.","Ich leite ab, dass bei Gallenmangel Fett schlechter verdaut wird und mit dem Stuhl ausgeschieden wird."],"musterloesung":"Fette sind **nicht wasserlöslich** und klumpen zusammen. Dort erreichen die Verdauungsenzyme sie nur schlecht. Die **Gallensäuren** verbinden sich sowohl mit Wasser als auch mit Fett und verteilen die Fette deshalb sehr fein. Dabei entstehen winzige Teilchen (**Mizellen**). So können die fettspaltenden **Lipasen** gut angreifen, und die Fettbausteine können von der Darmschleimhaut aufgenommen werden. Fehlt die Galle, z. B. bei einer Abflussstörung, werden die Fette schlechter verdaut und aufgenommen. Das Fett bleibt im Darm und wird mit dem Stuhl ausgeschieden – es entstehen **Fettstühle**."},{"typ":"operator","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-op-laktose","operator":"beurteilen","afb":"III","fall":"Alaa hat nach Milchprodukten oft Blähungen und Bauchschmerzen. Beim Arzt wurde eine Laktoseintoleranz festgestellt. Er sagt zu Robartina: „Dann darf ich ab jetzt nie wieder irgendein Milchprodukt essen.“","auftrag":"Beurteile Alaas Aussage auf der Grundlage der Informationen im Buch.","mindestlaenge":350,"kriterien":["Ich erkläre die Ursache der Laktoseintoleranz (zu wenig Laktase).","Ich erkläre, warum Beschwerden entstehen (Milchzucker gelangt unverdaut in den Dickdarm).","Ich nenne lange gereiften Käse sowie Schaf- und Ziegenmilch als besser verträglich.","Ich komme zu einem begründeten Urteil über Alaas Aussage."],"musterloesung":"Bei einer Laktoseintoleranz wird zu wenig oder **keine Laktase** gebildet. Der Milchzucker (Laktose) kann deshalb nicht gespalten werden. Er gelangt **unverdaut in den Dickdarm** und wird dort von Bakterien abgebaut. Das verursacht Blähungen, Bauchschmerzen und Durchfall. Laut Buch müssen Betroffene aber **nicht komplett auf Milchprodukte verzichten**: **Lange gereifter Käse** enthält meist keinen oder nur wenig Milchzucker, und **Schaf- und Ziegenmilch** sind oft besser verträglich als Kuhmilch. **Urteil:** Alaas Aussage ist zu streng. Er sollte laktosereiche Produkte meiden, kann aber laktosearme Milchprodukte oft vertragen."}],"status":"aktiv"},{"id":"crohn","titel":"Morbus Crohn","block":4,"nr":1,"organ":"duenndarm, dickdarm","beschreibung":"Chronisch-entzündliche Darmerkrankung.","quellen":"MKK S. 366","icon":"darm","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"adipositas","titel":"Adipositas","block":4,"nr":2,"organ":"naehrstoffe","beschreibung":"Übergewicht und Body-Mass-Index.","quellen":"i-care S. 244–247","icon":"ernaehrung","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"hepatitis","titel":"Hepatitis","block":4,"nr":3,"organ":"leber","beschreibung":"Entzündung der Leber.","quellen":"MKK S. 371; i-care S. 229–231","icon":"leber","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"diabetes","titel":"Diabetes mellitus","bloc links":"🥩 Fleisch","rechts":"Fleisch liefert vor allem Eiweiß – das spalten Pepsin und Trypsin."},{"links":"🥤 Cola","rechts":"Cola enthält Kristallzucker (Saccharose), aber keine Stärke. Den Zucker spaltet die Saccharase."},{"links":"🥛 Milch","rechts":"Milch enthält Milchzucker (Laktose), aber keine Stärke. Den Milchzucker spaltet die Laktase."}]},{"name":"Pepsin","id":"pepsin","ort":"Magen","info":"Spaltet Eiweiße im Magen.","quelle":["i-care S. 209, 243, 246, 249","MKK S. 362"],"spaltet":[{"links":"🥩 Fleisch","rechts":"Fleisch enthält Eiweiß. Pepsin beginnt im Magen, es zu spalten."},{"links":"🥚 Ei","rechts":"Eier enthalten Eiweiß. Pepsin beginnt im Magen, es zu spalten."},{"links":"🫘 Bohnen","rechts":"Bohnen enthalten Eiweiß. Pepsin beginnt im Magen, es zu spalten."},{"links":"🥛 Milch","rechts":"Milch enthält Eiweiß. Pepsin beginnt im Magen, es zu spalten."}],"nicht":[{"links":"🫒 Öl","rechts":"Öl liefert Fett – das spaltet die Lipase."},{"links":"🥤 Cola","rechts":"Cola enthält Kristallzucker (Saccharose) – den spaltet die Saccharase."},{"links":"🍬 Kristallzucker","rechts":"Kristallzucker ist Saccharose – die spaltet die Saccharase."}]},{"name":"Trypsin","id":"trypsin","ort":"Pankreassaft (aktiv erst im Dünndarm)","info":"Spaltet Eiweiße im Dünndarm.","quelle":["i-care S. 223, 238, 240, 243, 246, 249","MKK S. 362"],"spaltet":[{"links":"🥩 Fleisch","rechts":"Fleisch enthält Eiweiß. Trypsin spaltet es im Dünndarm weiter."},{"links":"🥚 Ei","rechts":"Eier enthalten Eiweiß. Trypsin spaltet es im Dünndarm weiter."},{"links":"🫘 Bohnen","rechts":"Bohnen enthalten Eiweiß. Trypsin spaltet es im Dünndarm weiter."},{"links":"🥛 Milch","rechts":"Milch enthält Eiweiß. Trypsin spaltet es im Dünndarm weiter."}],"nicht":[{"links":"🫒 Öl","rechts":"Öl liefert Fett – das spaltet die Lipase."},{"links":"🥤 Cola","rechts":"Cola enthält Kristallzucker (Saccharose) – den spaltet die Saccharase."},{"links":"🍬 Kristallzucker","rechts":"Kristallzucker ist Saccharose – die spaltet die Saccharase."}]},{"name":"Lipase","id":"lipase","ort":"Magen und Pankreassaft","info":"Spaltet Fette.","quelle":["MKK S. 361, 362","i-care S. 238, 240, 249"],"spaltet":[{"links":"🧈 Butter","rechts":"Butter enthält Fett. Die Lipase spaltet es."},{"links":"🫒 Öl","rechts":"Öl enthält Fett. Die Lipase spaltet es."},{"links":"🥜 Nüsse","rechts":"Nüsse enthalten Fett. Die Lipase spaltet es."},{"links":"🌭 Wurst","rechts":"Wurst enthält Fett. Die Lipase spaltet es."},{"links":"🥚 Ei","rechts":"Eier enthalten Fett. Die Lipase spaltet es."},{"links":"🥛 Milch","rechts":"Milch enthält Fett. Die Lipase spaltet es."}],"nicht":[{"links":"🥤 Cola","rechts":"Cola enthält Kristallzucker (Saccharose), aber kein Fett. Den Zucker spaltet die Saccharase."},{"links":"🍬 Kristallzucker","rechts":"Kristallzucker ist Saccharose und enthält kein Fett. Ihn spaltet die Saccharase."},{"links":"🥔 Kartoffeln","rechts":"Kartoffeln liefern vor allem Stärke – die spaltet die Amylase."}]},{"name":"Laktase","id":"laktase","ort":"Dünndarmschleimhaut","info":"Spaltet Milchzucker (Laktose). Fehlt sie, entsteht eine Laktoseintoleranz.","quelle":["i-care S. 238, 239, 243, 249","MKK S. 361, 362"],"spaltet":[{"links":"🥛 Milch","rechts":"Milch enthält Milchzucker (Laktose). Die Laktase spaltet ihn in Einfachzucker."}],"nicht":[{"links":"🧀 lange gereifter Käse","rechts":"Lange gereifter Käse enthält meist keinen oder nur sehr wenig Milchzucker. Deshalb vertragen ihn viele Menschen mit Laktoseintoleranz."},{"links":"🥤 Cola","rechts":"Cola enthält Kristallzucker (Saccharose), keinen Milchzucker. Den spaltet die Saccharase."},{"links":"🥔 Kartoffeln","rechts":"Kartoffeln liefern Stärke, keinen Milchzucker. Die Stärke spaltet die Amylase."},{"links":"🫒 Öl","rechts":"Öl liefert Fett, keinen Milchzucker. Das Fett spaltet die Lipase."},{"links":"🥩 Fleisch","rechts":"Fleisch liefert Eiweiß, keinen Milchzucker. Das Eiweiß spalten Pepsin und Trypsin."}]},{"name":"Saccharase","id":"saccharase","ort":"Dünndarmschleimhaut","info":"Spaltet
