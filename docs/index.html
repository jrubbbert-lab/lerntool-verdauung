ext":"um pH 7","richtig":false},{"text":"um pH 8","richtig":false},{"text":"über pH 10","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 205, 240"],"erklaerung":"Achtung Verwechslungsgefahr: Die fetthaltige Lymphe heißt [[Chylus]].","id":"magen-sc-chymus","frage":"Was ist der [[Chymus]]?","optionen":[{"text":"der Speisebrei aus Nahrung und Magensaft","richtig":true},{"text":"die fetthaltige Lymphe im Milchbrustgang","richtig":false},{"text":"der Schleim der Nebenzellen","richtig":false},{"text":"die in der Gallenblase eingedickte Galle","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 355"],"erklaerung":"Fettreiche Speisen passieren den Magen am langsamsten. Flüssigkeiten verlassen ihn in sehr kurzer Zeit.","id":"magen-sc-verweildauer","frage":"Welche Speisen verweilen am kürzesten im Magen?","optionen":[{"text":"kohlenhydratreiche Speisen, z. B. das Frühstücksbrötchen","richtig":true},{"text":"fettreiche Speisen, z. B. die Weihnachtsgans","richtig":false},{"text":"Alle festen Speisen bleiben gleich lange im Magen.","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 355"],"erklaerung":"Der Pylorus öffnet sich dabei kurz, und ein kleiner Anteil des Speisebreis tritt in den Zwölffingerdarm über.","id":"magen-sc-vagus","frage":"Über welchen Nerv werden die starken peristaltischen Wellen vermittelt, die vom Antrum ausgehen und den Magen entleeren?","optionen":[{"text":"N. vagus","richtig":true},{"text":"N. facialis","richtig":false},{"text":"N. glossopharyngeus","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-sc-intrinsic","frage":"Wofür ist der Intrinsic Factor notwendig?","optionen":[{"text":"für die Aufnahme von Vitamin B12","richtig":true},{"text":"für die Aufnahme von Vitamin C","richtig":false},{"text":"für die Umwandlung von Pepsinogen in Pepsin","richtig":false},{"text":"für die Bildung des Magenschleims","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-sc-helicobacter","frage":"Was ist laut Buch die wichtigste Ursache für Magengeschwüre?","optionen":[{"text":"das Bakterium Helicobacter pylori","richtig":true},{"text":"ein Mangel an Salzsäure","richtig":false},{"text":"ein Mangel an Vitamin B12","richtig":false},{"text":"eine angeborene Pylorusstenose","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-mc-salzsaeure","frage":"Welche Aufgaben hat die Salzsäure des Magensafts?","optionen":[{"text":"Sie wandelt Pepsinogen in Pepsin um.","richtig":true},{"text":"Sie zerstört die räumliche Struktur von Eiweißen.","richtig":true},{"text":"Sie wirkt gegen Bakterien.","richtig":true},{"text":"Sie spaltet Fette in Fettsäuren.","richtig":false},{"text":"Sie bildet den Intrinsic Factor.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 209"],"erklaerung":"Somatostatin und Sekretin hemmen die Salzsäurefreisetzung.","id":"magen-mc-foerderung","frage":"Was fördert die Freisetzung der Salzsäure?","optionen":[{"text":"der Parasympathikus","richtig":true},{"text":"Gastrin","richtig":true},{"text":"Histamin","richtig":true},{"text":"Somatostatin","richtig":false},{"text":"Sekretin","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-mc-hauptzellen","frage":"Welche Stoffe bilden die Hauptzellen?","optionen":[{"text":"Pepsinogen","richtig":true},{"text":"Magenlipase","richtig":true},{"text":"Salzsäure","richtig":false},{"text":"Intrinsic Factor","richtig":false},{"text":"Histamin","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-mc-schutz","frage":"Was schützt die Magenschleimhaut vor der Selbstverdauung?","optionen":[{"text":"ein geschlossener Schleimfilm aus Muzin","richtig":true},{"text":"puffernde Bikarbonat-Ionen","richtig":true},{"text":"eine ausreichende Durchblutung der Schleimhaut","richtig":true},{"text":"eine besonders hohe Pepsinbildung","richtig":false},{"text":"ein möglichst niedriger pH-Wert","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 209"],"erklaerung":"Sinkt der pH-Wert unter 3, wird die Gastrinfreisetzung gehemmt.","id":"magen-mc-gastrin","frage":"Wann geben die Pylorusdrüsen vermehrt Gastrin ins Blut ab?","optionen":[{"text":"wenn die Magenwand gedehnt wird","richtig":true},{"text":"wenn der Mageninhalt sehr eiweißreich ist","richtig":true},{"text":"wenn der pH-Wert im Magen steigt","richtig":true},{"text":"wenn der pH-Wert im Magen unter 3 sinkt","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-mc-dyspepsie","frage":"Welche Beschwerden werden unter dem Begriff Dyspepsie zusammengefasst?","optionen":[{"text":"Völlegefühl","richtig":true},{"text":"Sodbrennen","richtig":true},{"text":"Übelkeit","richtig":true},{"text":"Aufstoßen","richtig":true},{"text":"Fieber","richtig":false},{"text":"Durchfall","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 207","MKK S. 354"],"erklaerung":"","id":"magen-zu-zellen","frage":"Ordne jeder Zellart ihr Produkt zu.","paare":[{"links":"Belegzellen","rechts":"Salzsäure"},{"links":"Hauptzellen","rechts":"Pepsinogen"},{"links":"Nebenzellen","rechts":"Schleim"},{"links":"ECL-Zellen","rechts":"Histamin"},{"links":"G-Zellen","rechts":"Gastrin"}]},{"typ":"zuordnung","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-zu-abschnitte","frage":"Ordne jedem Magenabschnitt die passende Beschreibung zu.","paare":[{"links":"[[Kardia]]","rechts":"Übergang von der Speiseröhre zum Magen"},{"links":"[[Fundus]]","rechts":"kuppelförmige Erweiterung unter dem Zwerchfell"},{"links":"[[Korpus]]","rechts":"größter Teil des Magens"},{"links":"[[Antrum]]","rechts":"Vorraum des Pförtners"},{"links":"[[Pylorus]]","rechts":"Übergang zum Dünndarm"}]},{"typ":"zuordnung","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-zu-phasen","frage":"Ordne jeder Phase der Magensaftbildung ihren Auslöser zu.","paare":[{"links":"nervale (kephale) Phase","rechts":"Geruchs- und Geschmacksreize"},{"links":"Magenphase (gastrische Phase)","rechts":"Dehnung der Magenwand"},{"links":"intestinale Phase","rechts":"Hormone des Dünndarms"}]},{"typ":"reihenfolge","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-rf-weg","frage":"Bring die Stationen in die Reihenfolge, die der Speisebrei durchläuft.","schritte":["Speiseröhre","[[Kardia]]","[[Korpus]]","[[Antrum]]","[[Pylorus]]","Zwölffingerdarm"]},{"typ":"reihenfolge","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-rf-muskeln","frage":"Ordne die Muskelschichten der Magenwand von außen nach innen.","schritte":["Längsmuskelfasern","ringförmig verlaufende Muskelfasern","schräg verlaufende Muskelfasern"]},{"typ":"reihenfolge","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-rf-entleerung","frage":"Bring die Vorgänge von der Füllung bis zur Entleerung des Magens in die richtige Reihenfolge.","schritte":["Speisebrei gelangt nach dem Schlucken in den Magen.","Der Füllungsdruck führt zur reflektorischen Erschlaffung der Magenwand.","Peristaltische Wellen durchmischen den Speisebrei etwa alle 20 Sekunden.","Vom Antrum gehen starke Kontraktionswellen aus.","Der Pylorus öffnet sich kurz, ein kleiner Anteil tritt in den Zwölffingerdarm über."]},{"typ":"lückentext","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-lt-zellen","text":"Die Belegzellen bilden {{Salzsäure|HCl}} und den {{Intrinsic Factor|Intrinsic-Faktor}}. Die Hauptzellen bilden {{Pepsinogen}}, die Vorstufe des eiweißspaltenden Enzyms {{Pepsin}}."},{"typ":"lückentext","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-lt-magensaft","text":"Pro Tag bilden die Magendrüsen etwa {{2|zwei}} l Magensaft. Sein pH-Wert liegt zwischen 1 und {{4|vier}}. Hauptbestandteil ist die {{Salzsäure|HCl}}."},{"typ":"lückentext","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-lt-chymus","text":"Durch die Bewegungen der Magenwand entsteht der Speisebrei, der [[Chymus]]. Die Nahrung wird dabei bis auf eine Teilchengröße von 1–2 {{mm|Millimeter}} zerkleinert. Erreicht eine Welle den Magensphinkter, öffnet er sich kurz, und eine kleine Menge gelangt in den {{Zwölffingerdarm|Duodenum}}."},{"typ":"fehlerfahndung","quelle":["MKK S. 355","i-care S. 207"],"erklaerung":"Bei Erbrechen besteht Aspirationsgefahr. Betroffene sollen deshalb aufrecht sitzen oder – wenn das nicht möglich ist – in Seitenlage liegen. Bis zur Klärung bleiben sie nüchtern. Uhrzeit, Menge, Art, Aussehen und Geruch des Erbrochenen werden dokumentiert. Die Salzsäure des Magensafts bilden die Belegzellen, nicht die Hauptzellen.","id":"magen-ff-erbrechen","titel":"Robartinas Pflegebericht: Herr K. hat erbrochen","bericht":"10:15 Uhr: Herr K. hat einmal erbrochen. Ich habe ihn sofort flach in Rückenlage gebracht, damit er sich ausruhen kann. Seine Zahnprothese habe ich entfernt und ihm eine Nierenschale und Zellstoff gereicht. Danach habe ich ihm Mundpflege angeboten und die Bettwäsche gewechselt. Damit er wieder zu Kräften kommt, habe ich ihm gleich ein Brötchen gebracht. Das Erbrochene habe ich entsorgt, ohne etwas zu notieren. Frau Abda hat mir erklärt, dass der saure Magensaft von den Hauptzellen gebildet wird.","fehler":[{"links":"flach in Rückenlage gebracht","rechts":"aufrecht|sitz|seitenlage","loesung":"aufrecht sitzen lassen oder in Seitenlage gebracht (Aspirationsgefahr)"},{"links":"gleich ein Brötchen gebracht","rechts":"nüchtern|nichts zu essen|kein essen","loesung":"bis zur Klärung des weiteren Vorgehens nüchtern gelassen"},{"links":"entsorgt, ohne etwas zu notieren","rechts":"dokument|notier|aufgeschrieben","loesung":"Uhrzeit, Menge, Art, Aussehen und Geruch dokumentiert"},{"links":"Hauptzellen","rechts":"belegzell|parietalzell","loesung":"Belegzellen"}]}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-06deb0","vorne":"Was bedeutet [[Gaster]]?","hinten":"Magen. Ein weiterer Fachbegriff für den Magen ist Ventriculus."},{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-cc057a","vorne":"Welche Aufgaben hat der Magen?","hinten":"Er vermischt die Nahrung mit Magensaft zum Speisebrei ([[Chymus]]), speichert ihn und gibt ihn portionsweise an den Dünndarm ab. Der Magensaft enthält Enzyme für die Eiweißverdauung und tötet Keime ab."},{"typ":"karteikarte","quelle":["i-care S. 205","MKK S. 353"],"erklaerung":"","id":"magen-kk-267c2b","vorne":"Wie viel Nahrung kann der Magen eines Erwachsenen ungefähr fassen?","hinten":"Etwa 1,5 l."},{"typ":"karteikarte","quelle":["i-care S. 205"],"erklaerung":"","id":"magen-kk-f39378","vorne":"Wo liegt der Magen?","hinten":"Intraperitoneal im linken Oberbauch."},{"typ":"karteikarte","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-kk-37fed4","vorne":"Nenne die fünf Abschnitte des Magens.","hinten":"[[Kardia]], [[Fundus]], [[Korpus]], [[Antrum]] und [[Pylorus]]."},{"typ":"karteikarte","quelle":["MKK S. 354","i-care S. 205"],"erklaerung":"","id":"magen-kk-5e5777","vorne":"Wo sammelt sich beim stehenden Menschen die beim Essen mitgeschluckte Luft?","hinten":"Im [[Fundus]]. Er ist beim Stehen die höchstgelegene Region des Magens. Im Röntgenbild heißt dieser Bereich deshalb auch „Magenblase“."},{"typ":"karteikarte","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-kk-d6df2e","vorne":"Aus welchen drei Schichten besteht die [[Muskularis]] des Magens (von außen nach innen)?","hinten":"Längsmuskelfasern, ringförmige Muskelfasern und schräg verlaufende Muskelfasern."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-f74707","vorne":"Was bilden die Belegzellen der Magendrüsen?","hinten":"Salzsäure und den Intrinsic Factor."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-5a6c95","vorne":"Was bilden die Hauptzellen der Magendrüsen?","hinten":"[[Pepsinogen]], die Vorstufe des Pepsins, und die Magenlipase zur Fettverdauung."},{"typ":"karteikarte","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-kk-b35644","vorne":"Was bilden die Nebenzellen der Magendrüsen?","hinten":"Den muzinhaltigen Magenschleim und Bikarbonat. Beides schützt die Magenoberfläche vor der Salzsäure."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-840d0b","vorne":"Welche Aufgabe haben die ECL-Zellen?","hinten":"Sie bilden Histamin, das die Belegzellen zur Salzsäureproduktion anregt."},{"typ":"karteikarte","quelle":["MKK S. 354"],"erklaerung":"","id":"magen-kk-a21a09","vorne":"Wo wird Gastrin gebildet und was bewirkt es?","hinten":"In den G-Zellen von [[Antrum]] und [[Pylorus]]. Gastrin regt Haupt- und Belegzellen zur Sekretion an und steigert die Magenbeweglichkeit."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-2b2c39","vorne":"Wie viel Magensaft wird pro Tag gebildet und welchen pH-Wert hat er?","hinten":"Etwa 2 l pro Tag. Der pH-Wert liegt zwischen 1 und 4."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-77e306","vorne":"Welche drei Aufgaben hat die Salzsäure im Magen?","hinten":"Sie wandelt [[Pepsinogen]] in [[Pepsin]] um, zerstört die räumliche Struktur der Eiweiße ([[Denaturierung]]) und wirkt gegen Bakterien."},{"typ":"karteikarte","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-kk-f07df3","vorne":"Warum verdaut sich der Magen nicht selbst?","hinten":"Ein zäher Schleimfilm mit puffernden Bikarbonat-Ionen kleidet den Magen aus und schützt die Schleimhautzellen vor Salzsäure und Pepsin. Dazu ist auch eine ausreichende Durchblutung der Schleimhaut nötig."},{"typ":"karteikarte","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-kk-663dd8","vorne":"Wofür wird der Intrinsic Factor gebraucht?","hinten":"Für die Aufnahme von Vitamin B12 aus der Nahrung. Fehlt er, entsteht ein Vitamin-B12-Mangel mit Blutarmut (Anämie) und neurologischen Störungen."},{"typ":"karteikarte","quelle":["MKK S. 355"],"erklaerung":"","id":"magen-kk-27a496","vorne":"Nenne die drei Phasen der Magensaftbildung.","hinten":"Nervale (kephale) Phase, Magenphase (gastrische Phase) und intestinale Phase."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-3756ac","vorne":"Wie lange bleibt Nahrung im Magen?","hinten":"Feste Nahrung ca. 1–3 Stunden, sehr fettige Nahrung bis zu 7 Stunden. Flüssigkeiten gelangen wesentlich schneller in den Darm."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-0ead49","vorne":"Wie wirken Protonenpumpenhemmer?","hinten":"Sie hemmen die Protonenpumpen der Belegzellen. Dadurch entsteht weniger Salzsäure, und die Magenschleimhaut wird geschont."},{"typ":"karteikarte","quelle":["i-care S. 209"],"erklaerung":"","id":"magen-kk-c5a5c9","vorne":"Was ist die wichtigste Ursache für Magengeschwüre?","hinten":"Das Bakterium Helicobacter pylori."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 207"],"erklaerung":"","id":"magen-op-schleimhaut","operator":"beschreiben","afb":"I","fall":"Robartina hospitiert in der Endoskopie. Frau Abda zeigt ihr auf dem Bildschirm die Magenschleimhaut eines Patienten. Alaa fragt später: „Was machen eigentlich die ganzen Drüsen in der Magenschleimhaut?“","auftrag":"Beschreibe für Alaa, welche Zellarten die Drüsen in Korpus und Fundus enthalten und was sie jeweils bilden.","mindestlaenge":300,"kriterien":["Ich nenne die Belegzellen und ihre Produkte Salzsäure und Intrinsic Factor.","Ich nenne die Hauptzellen und ihre Produkte Pepsinogen und Magenlipase.","Ich nenne die Nebenzellen und den schützenden Schleim.","Ich nenne die ECL-Zellen und das Histamin.","Ich verwende die Fachbegriffe korrekt."],"musterloesung":"Die Magendrüsen in Korpus und Fundus bestehen aus verschiedenen Zellarten. Die **Belegzellen** (Parietalzellen) bilden die Salzsäure, die den Magensaft sauer macht, und den Intrinsic Factor, der für die Aufnahme von Vitamin B12 nötig ist. Die **Hauptzellen** liegen vor allem am Grund der Drüsen und bilden Pepsinogen, die Vorstufe des eiweißspaltenden Pepsins, sowie die Magenlipase zur Fettverdauung. Die **Nebenzellen** stellen – wie die Oberflächenzellen – den schützenden Schleim her. Die **ECL-Zellen** sind endokrine Zellen und bilden Histamin, das die Belegzellen zur Salzsäureproduktion anregt."},{"typ":"operator","quelle":["MKK S. 354–355"],"erklaerung":"","id":"magen-op-selbstschutz","operator":"erläutern","afb":"II","fall":"Ein Patient fragt Robartina beim Frühstück: „Wenn im Magen so starke Säure ist, dass sie sogar Eiweiße zerlegt – warum verdaut sich mein Magen dann nicht selbst?“ Robartina möchte ihm eine fachlich richtige Antwort geben.","auftrag":"Erläutere, wie sich die Magenschleimhaut vor Salzsäure und Pepsin schützt.","mindestlaenge":400,"kriterien":["Ich nenne den zähen, muzinhaltigen Schleim als Schutzfilm.","Ich nenne die Nebenzellen und die Oberflächenzellen als Schleimbildner.","Ich erkläre die puffernde Wirkung der Bikarbonat-Ionen.","Ich erkläre, dass Salzsäure und Pepsin die Schleimhaut sonst angreifen würden (Selbstverdauung).","Ich nenne die ausreichende Durchblutung als Voraussetzung."],"musterloesung":"Der Magensaft enthält Salzsäure und das eiweißspaltende Pepsin. Beide würden auch die Zellen der Magenschleimhaut angreifen. Davor schützt ein zäher, muzinhaltiger **Magenschleim**, den alle Oberflächenzellen und besonders die **Nebenzellen** bilden. Das Muzin haftet fest auf der Oberfläche und bildet einen geschlossenen Film, der den ganzen Magen auskleidet. Im Schleim befinden sich **Bikarbonat-Ionen**, die die Säure abpuffern. So werden die Schleimhautzellen vor Salzsäure und Pepsin geschützt, und eine **Selbstverdauung** wird verhindert. Voraussetzung ist neben der intakten Schleimschicht eine **ausreichende Durchblutung** der Schleimhaut."},{"typ":"operator","quelle":["MKK S. 356–357","i-care S. 209"],"erklaerung":"","id":"magen-op-ulkus","operator":"beurteilen","afb":"III","fall":"Herr S. (58) liegt mit einem Magengeschwür (Ulcus ventriculi) auf Robartinas Station. Der Test auf Helicobacter pylori war positiv. Herr S. raucht und nimmt wegen Rückenschmerzen regelmäßig ein nichtsteroidales Schmerzmittel (NSAID). Er sagt zu Robartina: „Ich nehme jetzt einfach den Säureblocker, dann ist alles wieder gut. Rauchen und meine Schmerztabletten lasse ich mir nicht nehmen.“ Frau Abda bittet Robartina, darüber nachzudenken.","auftrag":"Beurteile, ob die alleinige Einnahme eines Protonenpumpenhemmers ausreicht, damit das Magengeschwür von Herrn S. abheilt.","mindestlaenge":500,"kriterien":["Ich erkläre die Wirkung des Protonenpumpenhemmers (weniger Salzsäure).","Ich nenne Helicobacter pylori als wichtigen aggressiven Faktor.","Ich nenne Rauchen und NSAID als weitere Faktoren, die ein Ulkus begünstigen.","Ich beschreibe die Eradikationstherapie (Protonenpumpenhemmer plus zwei Antibiotika).","Ich komme zu einem begründeten Urteil.","Ich beziehe mich auf den Fall von Herrn S."],"musterloesung":"Ein Protonenpumpenhemmer hemmt die Protonenpumpen der Belegzellen. Dadurch entsteht weniger Salzsäure, die Schleimhaut wird geschont und kann besser abheilen. Ein Ulkus entsteht aber durch ein gestörtes Gleichgewicht zwischen aggressiven Faktoren und dem Schutz der Schleimhaut. Bei Herrn S. liegen gleich mehrere aggressive Faktoren vor: Er ist mit **Helicobacter pylori** besiedelt, er **raucht** und nimmt regelmäßig **NSAID**. Bei nachgewiesenem Helicobacter wird eine **Eradikationstherapie** durchgeführt: ein bis zwei Wochen ein Protonenpumpenhemmer zusammen mit zwei Antibiotika. Außerdem müssen ulkusauslösende Medikamente und Zigaretten „abgesetzt“ werden. **Urteil:** Der Protonenpumpenhemmer allein reicht nicht aus. Damit das Geschwür dauerhaft abheilt, braucht Herr S. zusätzlich die Antibiotika gegen Helicobacter pylori und sollte auf das Rauchen und die NSAID verzichten. Sonst drohen neue Ulzera und Komplikationen wie Blutungen oder ein Durchbruch."}],"status":"aktiv"},{"id":"duenndarm","titel":"Dünndarm","block":2,"nr":3,"organ":"","beschreibung":"Zotten, Mikrovilli und Resorption.","quellen":"i-care S. 210–214; MKK S. 357–359","icon":"darm","farbe":"#b8478a","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"dickdarm","titel":"Dickdarm","block":2,"nr":4,"organ":"","beschreibung":"Kolon, Rektum und Stuhlentleerung.","quellen":"i-care S. 215–220; MKK S. 362–367","icon":"darm","farbe":"#7a52c7","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"pankreas","titel":"Pankreas","block":2,"nr":5,"organ":"","beschreibung":"Die Bauchspeicheldrüse und ihre Verdauungsenzyme.","quellen":"i-care S. 221–223; MKK S. 359, 367–368","icon":"pankreas","farbe":"#d0a21a","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"leber","titel":"Leber und Gallenblase","block":2,"nr":6,"organ":"","beschreibung":"Stoffwechselzentrale und Galle.","quellen":"i-care S. 224–237; MKK S. 359–361, 368–372","icon":"leber","farbe":"#9c4a2f","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"verdauung","titel":"Verdauung der Nährstoffe","block":3,"nr":1,"organ":"","beschreibung":"Wie Enzyme Kohlenhydrate, Eiweiße und Fette zerlegen.","quellen":"i-care S. 197, 223, 238–241; MKK S. 354–355, 359, 361–362","icon":"enzym","farbe":"#1f8fa3","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-staerke","frage":"Welches Enzym spaltet Stärke?","optionen":[{"text":"[[Amylase]]","richtig":true},{"text":"[[Pepsin]]","richtig":false},{"text":"[[Lipase]]","richtig":false},{"text":"Laktase","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"verdauung-sc-form","frage":"In welcher Form können Kohlenhydrate resorbiert werden?","optionen":[{"text":"als Einfachzucker","richtig":true},{"text":"als Zweifachzucker","richtig":false},{"text":"als Vielfachzucker","richtig":false},{"text":"als Oligosaccharide","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239–240"],"erklaerung":"Die Salzsäure des Magensafts denaturiert die Proteine. Der Hauptanteil der Eiweißverdauung findet aber im Dünndarm statt.","id":"verdauung-sc-eiweiss-beginn","frage":"Wo findet der erste Schritt der Eiweißverdauung statt?","optionen":[{"text":"im Magen","richtig":true},{"text":"in der Mundhöhle","richtig":false},{"text":"im Dünndarm","richtig":false},{"text":"im Dickdarm","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-sc-pepsin-stopp","frage":"Wodurch wird [[Pepsin]] im Dünndarm inaktiviert?","optionen":[{"text":"durch den hohen pH-Wert des Pankreassafts","richtig":true},{"text":"durch die Gallensäuren","richtig":false},{"text":"durch die Laktase","richtig":false},{"text":"durch die Salzsäure","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 359"],"erklaerung":"","id":"verdauung-sc-enteropeptidase","frage":"Welches Enzym wandelt Trypsinogen in Trypsin um?","optionen":[{"text":"die Enteropeptidase aus der Dünndarmschleimhaut","richtig":true},{"text":"das Pepsin aus dem Magen","richtig":false},{"text":"die Amylase aus dem Speichel","richtig":false},{"text":"die Lipase aus dem Pankreas","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 240"],"erklaerung":"Langkettige Fettsäuren gelangen also – anders als die übrigen Nährstoffe – zuerst in den großen Blutkreislauf und dann in die Leber.","id":"verdauung-sc-chylomikronen","frage":"Wie gelangen die [[Chylomikronen]] in den Blutkreislauf?","optionen":[{"text":"über das Lymphsystem und den Milchbrustgang in die obere Hohlvene","richtig":true},{"text":"über die Pfortader direkt zur Leber","richtig":false},{"text":"über die Galle zurück in den Darm","richtig":false},{"text":"über den Urin","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-sc-mizellen","frage":"Welche Stoffe verpacken langkettige Fettsäuren in [[Mizellen]]?","optionen":[{"text":"die Gallensäuren","richtig":true},{"text":"das Bikarbonat","richtig":false},{"text":"die Proteasen","richtig":false},{"text":"die Salzsäure","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 223"],"erklaerung":"Das Bikarbonat macht den Pankreassaft basisch. So wird der saure Chymus neutralisiert.","id":"verdauung-sc-pankreas-ph","frage":"Welchen pH-Wert hat der Pankreassaft ungefähr?","optionen":[{"text":"etwa 8","richtig":true},{"text":"zwischen 1 und 4","richtig":false},{"text":"etwa 5","richtig":false},{"text":"etwa 11","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"Galaktose und Glukose entstehen aus Laktose, zwei Glukosemoleküle aus Maltose.","id":"verdauung-sc-saccharose","frage":"In welche Einfachzucker spaltet die Saccharase die [[Saccharose]]?","optionen":[{"text":"Glukose und Fruktose","richtig":true},{"text":"Galaktose und Glukose","richtig":false},{"text":"zwei Glukosemoleküle","richtig":false},{"text":"Fruktose und Galaktose","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 240"],"erklaerung":"Die „saure“ Lipase des Magens wird von den Hauptzellen gebildet und spaltet 15–30 % der Nahrungsfette.","id":"verdauung-sc-magenlipase","frage":"Welches Enzym des Magens spaltet Fette?","optionen":[{"text":"die Magenlipase","richtig":true},{"text":"das Pepsin","richtig":false},{"text":"die Amylase","richtig":false},{"text":"das Trypsin","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 361"],"erklaerung":"","id":"verdauung-sc-ptyalin","frage":"Warum stoppt die Kohlenhydratverdauung im Magen?","optionen":[{"text":"Die Speichelamylase (Ptyalin) wird durch den sauren Magensaft inaktiviert.","richtig":true},{"text":"Die Salzsäure spaltet die Stärke sofort vollständig.","richtig":false},{"text":"Im Magen werden alle Kohlenhydrate resorbiert.","richtig":false},{"text":"Die Galle hemmt die Amylase.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-staerke-anteil","frage":"In welcher Form liegen die Kohlenhydrate in der Nahrung zu etwa 60 % vor?","optionen":[{"text":"als Stärke","richtig":true},{"text":"als Laktose","richtig":false},{"text":"als Glukose","richtig":false},{"text":"als Fruktose","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-mc-buerstensaum","frage":"Welche Enzyme sitzen am Bürstensaum des Dünndarms?","optionen":[{"text":"Laktase","richtig":true},{"text":"Maltase","richtig":true},{"text":"Saccharase","richtig":true},{"text":"Isomaltase","richtig":true},{"text":"Pepsin","richtig":false},{"text":"Trypsin","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-mc-proteasen","frage":"Welche Enzyme gehören laut Tabelle zu den Proteasen des Pankreassafts?","optionen":[{"text":"Trypsin","richtig":true},{"text":"Chymotrypsin","richtig":true},{"text":"Elastase","richtig":true},{"text":"Carboxypeptidasen","richtig":true},{"text":"Amylase","richtig":false},{"text":"Lipase","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-mc-emulgierung","frage":"Was trägt zur Emulgierung der Fette bei?","optionen":[{"text":"das Kauen","richtig":true},{"text":"die Bewegungen der Magen- und Dünndarmwand","richtig":true},{"text":"die Gallensäuren","richtig":true},{"text":"das Pepsin","richtig":false},{"text":"die Salzsäure","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 239–240","MKK S. 362"],"erklaerung":"Chylomikronen werden über das Lymphsystem an der Leber vorbei in den Blutkreislauf geleitet.","id":"verdauung-mc-pfortader","frage":"Welche Stoffe gelangen nach der Resorption über die Pfortader zur Leber?","optionen":[{"text":"Einfachzucker","richtig":true},{"text":"Aminosäuren","richtig":true},{"text":"kurz- und mittelkettige Fettsäuren","richtig":true},{"text":"Chylomikronen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-mc-laktose","frage":"Welche Beschwerden können bei einer Laktoseintoleranz auftreten?","optionen":[{"text":"Blähungen","richtig":true},{"text":"Bauchschmerzen","richtig":true},{"text":"Durchfall","richtig":true},{"text":"Sodbrennen","richtig":false},{"text":"Fieber","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-mc-pankreassaft","frage":"Welche Aussagen zum Pankreassaft stimmen?","optionen":[{"text":"Er enthält Bikarbonat und ist deshalb basisch.","richtig":true},{"text":"Er neutralisiert den sauren Chymus.","richtig":true},{"text":"Das exokrine Pankreas bildet etwa 1,5–2 l pro Tag.","richtig":true},{"text":"Er enthält Pepsin.","richtig":false},{"text":"Er wird in der Gallenblase gespeichert.","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 238–240"],"erklaerung":"","id":"verdauung-zu-enzym","frage":"Ordne jedem Enzym das Substrat zu, das es spaltet.","paare":[{"links":"[[Amylase]]","rechts":"Stärke"},{"links":"[[Pepsin]]","rechts":"Eiweiße"},{"links":"[[Lipase]]","rechts":"Fette"},{"links":"Laktase","rechts":"Laktose"},{"links":"Saccharase","rechts":"Saccharose"}]},{"typ":"zuordnung","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-zu-zucker","frage":"Ordne jedem Zweifachzucker seine Spaltprodukte zu.","paare":[{"links":"[[Laktose]]","rechts":"Galaktose + Glukose"},{"links":"[[Maltose]]","rechts":"Glukose + Glukose"},{"links":"[[Saccharose]]","rechts":"Glukose + Fruktose"}]},{"typ":"zuordnung","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-zu-gruppen","frage":"Ordne jeder Enzymgruppe des Pankreassafts ihre Aufgabe zu.","paare":[{"links":"[[Proteasen]]","rechts":"spalten Proteine"},{"links":"Glykosidasen","rechts":"spalten Kohlenhydrate"},{"links":"Lipasen","rechts":"spalten Fette"},{"links":"Nukleasen","rechts":"spalten Nukleinsäuren"}]},{"typ":"reihenfolge","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-rf-staerke","frage":"Bring die Schritte der Stärkeverdauung in die richtige Reihenfolge.","schritte":["Die Amylase des Mundspeichels beginnt, Stärke zu spalten.","Die Amylase des Pankreassafts spaltet Stärke in Maltose.","Die Maltase des Bürstensaums spaltet Maltose in Glukose.","Transportproteine nehmen die Glukose in die Enterozyten auf.","Die Glukose gelangt mit dem Pfortaderblut zur Leber."]},{"typ":"reihenfolge","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-rf-eiweiss","frage":"Bring die Schritte der Eiweißverdauung in die richtige Reihenfolge.","schritte":["Die Salzsäure des Magens denaturiert die Proteine.","Pepsin greift die denaturierten Proteine an.","Die Proteasen des Pankreassafts spalten Oligopeptide ab.","Die Oligopeptidasen des Bürstensaums bilden Aminosäuren, Di- und Tripeptide.","Die Aminosäuren gelangen über die Pfortader zur Leber."]},{"typ":"reihenfolge","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-rf-fett","frage":"Bring die Schritte der Fettverdauung in die richtige Reihenfolge.","schritte":["Kauen und Magenbewegungen emulgieren die Fette.","Die Magenlipase spaltet 15–30 % der Fette.","Die Pankreaslipase spaltet das restliche Nahrungsfett.","Die Gallensäuren verpacken langkettige Fettsäuren in Mizellen.","Die Enterozyten setzen daraus wieder Triglyzeride zusammen.","Die Chylomikronen gelangen über das Lymphsystem ins Blut."]},{"typ":"lückentext","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-lt-zucker","text":"Die {{Laktase}} spaltet Laktose in Galaktose und Glukose. Die {{Maltase}} spaltet Maltose in zwei Glukosemoleküle. Kohlenhydrate können nur als {{Einfachzucker|Monosaccharide}} resorbiert werden."},{"typ":"lückentext","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-lt-eiweiss","text":"Die Salzsäure verändert die Struktur der Proteine. Diesen Vorgang nennt man {{Denaturierung}}. Die Proteasen des Pankreassafts zerlegen die Proteine in {{Oligopeptide}} aus etwa {{8|acht}} Aminosäuren."},{"typ":"lückentext","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-lt-fett","text":"In den Enterozyten werden die langkettigen Fettsäuren wieder zu {{Triglyzeriden|Triglyzeride}} zusammengesetzt. Sie werden als {{Chylomikronen}} verpackt und ins {{Lymphsystem|Lymphe}} abgegeben."}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-5ab728","vorne":"In welcher Form können Kohlenhydrate vom Dünndarmepithel aufgenommen werden?","hinten":"Nur als Einfachzucker ([[Monosaccharide]]): Glukose, Fruktose und Galaktose."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-f4a140","vorne":"In welcher Form liegen die Kohlenhydrate in der Nahrung überwiegend vor?","hinten":"Zu etwa 60 % als Stärke (Vielfachzucker), zu rund 30 % als Zweifachzucker (Saccharose, Laktose) und zu 10 % als Einfachzucker."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-9dbb4a","vorne":"Wo findet die wichtigste Kohlenhydratverdauung statt?","hinten":"Im Dünndarm durch die [[Amylase]] des Pankreassafts. Die Amylase des Mundspeichels spielt nur eine geringe Rolle."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-50bb29","vorne":"Was spalten die Enzyme des Bürstensaums Laktase, Maltase und Saccharase?","hinten":"Laktase: [[Laktose]] → Galaktose + Glukose. Maltase: [[Maltose]] → 2 Glukose. Saccharase: [[Saccharose]] → Glukose + Fruktose."},{"typ":"karteikarte","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-kk-0179bc","vorne":"Was passiert bei einer Laktoseintoleranz?","hinten":"Es wird wenig oder keine Laktase gebildet. Die Laktose gelangt unverdaut in den Dickdarm und wird dort von Bakterien abgebaut. Die Abbauprodukte können Blähungen, Bauchschmerzen und Durchfall verursachen."},{"typ":"karteikarte","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-kk-7b4d86","vorne":"Was ist der erste Schritt der Eiweißverdauung?","hinten":"Die [[Denaturierung]] der Proteine durch die Salzsäure des Magensafts."},{"typ":"karteikarte","quelle":["i-care S. 240","MKK S. 361"],"erklaerung":"","id":"verdauung-kk-e36ea6","vorne":"Warum wirkt [[Pepsin]] im Dünndarm nicht mehr?","hinten":"Es wird durch den hohen pH-Wert des Pankreassafts inaktiviert."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-da7383","vorne":"Wie zerlegen Pankreas und Bürstensaum die Eiweiße?","hinten":"Die [[Proteasen]] des Pankreassafts spalten die Proteine in Oligopeptide aus etwa 8 Aminosäuren. Die Oligopeptidasen des Bürstensaums zerlegen diese in Aminosäuren, Di- und Tripeptide."},{"typ":"karteikarte","quelle":["i-care S. 223","MKK S. 359"],"erklaerung":"","id":"verdauung-kk-7f937f","vorne":"Warum bildet das Pankreas die Proteasen als inaktive Vorstufen?","hinten":"So wird verhindert, dass sich die Bauchspeicheldrüse selbst verdaut. Erst im Dünndarm werden die Vorstufen aktiviert."},{"typ":"karteikarte","quelle":["MKK S. 359"],"erklaerung":"","id":"verdauung-kk-d63a09","vorne":"Wie wird Trypsinogen aktiviert?","hinten":"Die Enteropeptidase aus der Dünndarmschleimhaut wandelt Trypsinogen in Trypsin um. Trypsin aktiviert dann seine eigene Vorstufe und Chymotrypsinogen."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-c7d833","vorne":"Warum müssen Fette emulgiert werden?","hinten":"Triglyzeride sind nicht wasserlöslich und klumpen zusammen. Die Enzyme erreichen sie dann nur schlecht. Durch die [[Emulgierung]] verteilen sie sich fein im Nahrungsbrei."},{"typ":"karteikarte","quelle":["i-care S. 240–241"],"erklaerung":"","id":"verdauung-kk-e480d8","vorne":"Welcher Anteil der Nahrungsfette wird von der Magenlipase bzw. der Pankreaslipase gespalten?","hinten":"Magenlipase: 15–30 %. Pankreaslipase: 70–85 %."},{"typ":"karteikarte","quelle":["i-care S. 240","MKK S. 359"],"erklaerung":"","id":"verdauung-kk-7e7835","vorne":"Was sind [[Mizellen]], und wozu dienen sie?","hinten":"Winzige Partikel, in denen die Gallensäuren langkettige Fettsäuren und andere Fettspaltprodukte verpacken. Sie kommen leicht mit den Enterozyten in Kontakt."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-7f8239","vorne":"Wie gelangen langkettige Fettsäuren in den Blutkreislauf?","hinten":"In den Enterozyten werden sie wieder zu Triglyzeriden zusammengesetzt, als [[Chylomikronen]] ins Lymphsystem abgegeben und erreichen über den Milchbrustgang (Ductus thoracicus) die obere Hohlvene."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-c2afed","vorne":"Wie gelangen kurz- und mittelkettige Fettsäuren zur Leber?","hinten":"Sie sind wasserlöslich, werden direkt ins Blut abgegeben, an Albumin gebunden und erreichen über die Pfortader die Leber."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-efa544","vorne":"Was ist der Unterschied zwischen [[Chymus]] und [[Chylus]]?","hinten":"Chymus ist der Speisebrei im Darm, Chylus die fetthaltige Lymphe des Milchbrustgangs."},{"typ":"karteikarte","quelle":["MKK S. 359"],"erklaerung":"","id":"verdauung-kk-b3a159","vorne":"Wie viel Galle bildet die Leber, und wo wird sie gespeichert?","hinten":"Etwa 0,5 l pro Tag. In der Gallenblase wird sie auf etwa 30–60 ml Blasengalle eingedickt."},{"typ":"karteikarte","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-kk-69a1a3","vorne":"Welche Aufgabe hat das Bikarbonat im Pankreassaft?","hinten":"Es macht den Pankreassaft basisch (pH ca. 8) und neutralisiert so den sauren pH-Wert des Chymus im Dünndarm."},{"typ":"karteikarte","quelle":["MKK S. 359"],"erklaerung":"","id":"verdauung-kk-6bb641","vorne":"Was ist der enterohepatische Kreislauf?","hinten":"Etwa 90 % der Gallensäuren werden im terminalen Ileum rückresorbiert, gelangen mit dem Pfortaderblut zur Leber und werden erneut in die Galle abgegeben."},{"typ":"karteikarte","quelle":["i-care S. 197"],"erklaerung":"","id":"verdauung-kk-604c53","vorne":"Warum schmeckt Brot süßlich, wenn man es lange kaut?","hinten":"Die [[Amylase]] des Speichels spaltet den Zweifachzucker Maltose (Malzzucker) von der Stärke im Brot ab."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-op-pommes","operator":"beschreiben","afb":"I","fall":"Robartina isst in der Mittagspause Pommes und trinkt eine Cola. Alaa fragt: „Was passiert eigentlich mit der Stärke aus den Kartoffeln und dem Zucker aus der Cola in deinem Körper?“ Die Kartoffeln enthalten Stärke, das Getränk Kristallzucker (Saccharose).","auftrag":"Beschreibe, wie Stärke und Saccharose verdaut und resorbiert werden.","mindestlaenge":400,"kriterien":["Ich beschreibe die Spaltung der Stärke durch die Amylase (Speichel und vor allem Pankreassaft) zu Maltose.","Ich beschreibe die Spaltung der Maltose durch die Maltase des Bürstensaums in Glukose.","Ich beschreibe die Spaltung der Saccharose durch die Saccharase in Glukose und Fruktose.","Ich beschreibe die Aufnahme der Einfachzucker über Transportproteine in die Enterozyten.","Ich beschreibe den Weg über das Pfortaderblut zur Leber."],"musterloesung":"**Stärke** ist ein Vielfachzucker. Die Amylase des Mundspeichels beginnt, sie zu spalten; wesentlich wichtiger ist aber die Amylase des Pankreassafts im Dünndarm. Sie spaltet die Stärke in den Zweifachzucker Maltose. Am Bürstensaum des Dünndarmepithels spaltet die **Maltase** die Maltose in zwei Glukosemoleküle. Die **Saccharose** aus der Cola ist ein Zweifachzucker. Sie wird am Bürstensaum von der **Saccharase** in Glukose und Fruktose gespalten. Die Einfachzucker werden über **Transportproteine** in die Enterozyten aufgenommen und ins **Pfortaderblut** abgegeben, mit dem sie direkt zur **Leber** gelangen."},{"typ":"operator","quelle":["i-care S. 240","MKK S. 359, 362"],"erklaerung":"","id":"verdauung-op-galle","operator":"erläutern","afb":"II","fall":"Ein Patient auf Robartinas Station hat eine Abflussstörung der Galle. Frau Abda erklärt, dass bei ihm Fettstühle auftreten können. Robartina fragt nach: „Was hat die Galle denn mit dem Fett im Stuhl zu tun?“","auftrag":"Erläutere die Bedeutung der Gallensäuren für die Fettverdauung und warum ein Mangel an Gallensäuren zu Fettstühlen führen kann.","mindestlaenge":450,"kriterien":["Ich erkläre, dass Fette nicht wasserlöslich sind und zusammenklumpen.","Ich erkläre die Emulgierung durch die Gallensäuren (feine Verteilung).","Ich erkläre die Mizellenbildung und den Kontakt zur Darmschleimhaut.","Ich erkläre, dass die Lipasen dadurch besser angreifen können.","Ich leite ab, dass bei Gallensäuremangel Fett schlechter verdaut und resorbiert wird und mit dem Stuhl ausgeschieden wird."],"musterloesung":"Nahrungsfette bestehen größtenteils aus Triglyzeriden, die **nicht wasserlöslich** sind und zu einer eigenen Schicht zusammenklumpen. Dort erreichen die Verdauungsenzyme sie nur schlecht. Die **Gallensäuren** setzen die Oberflächenspannung zwischen Fett und Wasser herab, weil sie sich sowohl mit Wasser als auch mit Fetten verbinden. So werden die Fette sehr fein verteilt (**Emulgierung**). Im Dünndarm entstehen dabei winzige **Mizellen**. Sie bieten den fettspaltenden **Lipasen** eine gute Angriffsfläche und stellen den Kontakt zur Darmschleimhaut her, sodass die Fettbestandteile aufgenommen werden können. Fehlen Gallensäuren, z. B. bei einer Abflussstörung der Galle, werden die Fette schlechter verdaut und resorbiert. Es kommt zu einer verminderten Nährstoffausnutzung (Malassimilation); das Fett bleibt im Darm und wird mit dem Stuhl ausgeschieden – es entstehen **Fettstühle**."},{"typ":"operator","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-op-laktose","operator":"beurteilen","afb":"III","fall":"Alaa hat nach Milchprodukten oft Blähungen und Bauchschmerzen. Beim Arzt wurde eine Laktoseintoleranz festgestellt. Er sagt zu Robartina: „Dann darf ich ab jetzt nie wieder irgendein Milchprodukt essen.“","auftrag":"Beurteile Alaas Aussage auf der Grundlage der Informationen im Buch.","mindestlaenge":450,"kriterien":["Ich erkläre die Ursache der Laktoseintoleranz (zu wenig oder keine Laktase).","Ich erkläre, warum Beschwerden entstehen (Laktose gelangt unverdaut in den Dickdarm, bakterieller Abbau).","Ich nenne lange gereiften Käse als meist laktosefrei bzw. laktosearm.","Ich nenne Schaf- und Ziegenmilch als laktoseärmer als Kuhmilch.","Ich komme zu einem begründeten Urteil über Alaas Aussage."],"musterloesung":"Bei einer Laktoseintoleranz bilden die Enterozyten nur wenig oder **keine Laktase**. Milchzucker (Laktose) kann deshalb nicht in Galaktose und Glukose gespalten werden. Er gelangt **unverdaut in den Dickdarm** und wird dort von Darmbakterien abgebaut. Die Abbauprodukte verursachen Blähungen, Bauchschmerzen und Durchfall – genau die Beschwerden, die Alaa hat. Laut Buch müssen Betroffene aber **nicht komplett auf Milchprodukte verzichten**: **Lange gereifter Käse** enthält meist keinen oder nur sehr wenig Milchzucker. Auch **Schaf- und Ziegenmilch** sind laktoseärmer als Kuhmilch und daher meist bekömmlicher. **Urteil:** Alaas Aussage ist zu streng. Er sollte laktosereiche Produkte meiden, kann aber laktosearme Milchprodukte wie lange gereiften Käse oft vertragen."}],"status":"aktiv"},{"id":"crohn","titel":"Morbus Crohn","block":4,"nr":1,"organ":"duenndarm, dickdarm","beschreibung":"Chronisch-entzündliche Darmerkrankung.","quellen":"MKK S. 366","icon":"darm","farbe":"#7a52c7","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"adipositas","titel":"Adipositas","block":4,"nr":2,"organ":"naehrstoffe","beschreibung":"Übergewicht und Body-Mass-Index.","quellen":"i-care S. 244–247","icon":"ernaehrung","farbe":"#2f9e6b","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"hepatitis","titel":"Hepatitis","block":4,"nr":3,"organ":"leber","beschreibung":"Entzündung der Leber.","quellen":"MKK S. 371; i-care S. 229–231","icon":"leber","farbe":"#9c4a2f","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"diabetes","titel":"Diabetes mellitus","block":4,"nr":4,"organ":"pankreas","beschreibung":"Zuckerkrankheit.","quellen":"MKK S. 367; i-care S. 223, 231","icon":"pankreas","farbe":"#d0a21a","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"leberzirrhose","titel":"Leberzirrhose","block":4,"nr":5,"organ":"leber","beschreibung":"Der narbige Umbau der Leber.","quellen":"MKK S. 371–372; i-care S. 228","icon":"leber","farbe":"#9c4a2f","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"pankreatitis","titel":"Pankreatitis","block":4,"nr":6,"organ":"pankreas","beschreibung":"Entzündung der Bauchspeicheldrüse.","quellen":"MKK S. 367; i-care S. 222","icon":"pankreas","farbe":"#d0a21a","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"magenkarzinom","titel":"Magenkarzinom","block":4,"nr":7,"organ":"magen","beschreibung":"Bösartiger Tumor des Magens.","quellen":"MKK S. 356–357","icon":"magen","farbe":"#c9820f","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"}],"bilder":{},"spiele":{"enzym":{"modul":"verdauung","einleitung":"Du bist ein Verdauungsenzym! Wähle dein Enzym und tippe nur die Stoffe an, die du spalten kannst. Pass auf: Einige Stoffe sind schon so klein, dass sie gar nicht mehr gespalten werden müssen.","enzyme":[{"name":"Amylase","id":"amylase","ort":"Mundspeichel und Pankreassaft","info":"Spaltet Stärke in den Zweifachzucker Maltose.","quelle":["i-care S. 214, 223, 238"],"spaltet":[{"links":"Stärke","rechts":"Die Amylase spaltet den Vielfachzucker Stärke in den Zweifachzucker Maltose."},{"links":"Glykogen","rechts":"Laut Tabelle spaltet die Amylase als Glykosidase Kohlenhydrate wie Stärke und Glykogen."}],"nicht":[{"links":"Glukose","rechts":"Glukose ist schon ein Einfachzucker und kann direkt resorbiert werden."},{"links":"Zellulose","rechts":"Zellulose ist ein Ballaststoff: ein Kohlenhydrat, das im Dünndarm nicht aufgeschlossen werden kann."}]},{"name":"Pepsin","id":"pepsin","ort":"Magen","info":"Spaltet Eiweiße – aber erst, nachdem die Salzsäure sie denaturiert hat.","quelle":["i-care S. 209, 239"],"spaltet":[{"links":"Eiweiße","rechts":"Das Enzym Pepsin spaltet Eiweiße und spielt so in der Proteinverdauung eine Rolle."},{"links":"Pepsinogen","rechts":"Pepsin kann Pepsinogen spalten und fördert so seine eigene Entstehung."}],"nicht":[{"links":"Aminosäuren","rechts":"Aminosäuren sind die kleinsten Eiweißbausteine und werden direkt resorbiert."}]},{"name":"Trypsin","id":"trypsin","ort":"Pankreassaft (aktiv erst im Dünndarm)","info":"Wichtigstes eiweißspaltendes Enzym des Pankreas. Es aktiviert auch die anderen Protease-Vorstufen.","quelle":["i-care S. 223","MKK S. 359"],"spaltet":[{"links":"Eiweiße","rechts":"Trypsin spaltet Peptidbindungen im Inneren des Eiweißmoleküls, dadurch entstehen kleinere Peptide."},{"links":"Trypsinogen","rechts":"Trypsin überführt seine eigene Vorstufe Trypsinogen in die aktive Form."},{"links":"Chymotrypsinogen","rechts":"Trypsin überführt Chymotrypsinogen in das aktive Chymotrypsin."}],"nicht":[{"links":"Aminosäuren","rechts":"Aminosäuren sind die kleinsten Eiweißbausteine und werden direkt resorbiert."}]},{"name":"Lipase","id":"lipase","ort":"Magen (Magenlipase) und Pankreassaft (Pankreaslipase)","info":"Spaltet Fette. Die Pankreaslipase ist wichtiger als die Magenlipase.","quelle":["i-care S. 240","MKK S. 359"],"spaltet":[{"links":"Triglyzeride","rechts":"Die Lipase spaltet von den Neutralfetten (Triglyzeriden) Fettsäuren ab."},{"links":"Milchfett","rechts":"Aus Milchfetten setzt die Magenlipase kurzkettige Fettsäuren frei."}],"nicht":[{"links":"Fettsäuren","rechts":"Fettsäuren sind bereits Spaltprodukte der Fette und werden von den Enterozyten aufgenommen."},{"links":"Gallensäuren","rechts":"Gallensäuren sind kein Nährstoff: Sie verteilen die Fette fein und bilden Mizellen."}]},{"name":"Laktase","id":"laktase","ort":"Bürstensaum des Dünndarms","info":"Spaltet Milchzucker. Fehlt sie, entsteht eine Laktoseintoleranz.","quelle":["i-care S. 238–239"],"spaltet":[{"links":"Laktose","rechts":"Die Laktase spaltet den Zweifachzucker Laktose („Milchzucker“) in Galaktose und Glukose."}],"nicht":[{"links":"Galaktose","rechts":"Galaktose ist schon ein Einfachzucker und kann direkt resorbiert werden."}]},{"name":"Maltase","id":"maltase","ort":"Bürstensaum des Dünndarms","info":"Spaltet den Malzzucker, der beim Stärkeabbau entsteht.","quelle":["i-care S. 238"],"spaltet":[{"links":"Maltose","rechts":"Die Maltase spaltet den Zweifachzucker Maltose („Malzzucker“) in 2 Glukosemoleküle."}],"nicht":[{"links":"Glukose","rechts":"Glukose ist schon ein Einfachzucker und kann direkt resorbiert werden."}]},{"name":"Saccharase","id":"saccharase","ort":"Bürstensaum des Dünndarms","info":"Spaltet den Haushaltszucker.","quelle":["i-care S. 238"],"spaltet":[{"links":"Saccharose","rechts":"Die Saccharase spaltet den Zweifachzucker Saccharose („Rohrzucker“ oder „Rübenzucker“) in Glukose und Fruktose."}],"nicht":[{"links":"Fruktose","rechts":"Fruktose ist schon ein Einfachzucker und kann direkt resorbiert werden."}]}]},"reise":{"modul":"verdauung","einleitung":"Robartina frühstückt vor ihrer Frühschicht ein Brötchen mit Butter und Ei. Das Brötchen liefert vor allem **Stärke**, die Butter **Fett** und das Ei **Eiweiß**. Begleite einen dieser Nährstoffe auf seiner Reise durch den Verdauungstrakt und entscheide an jeder Station, was passiert.","stationen":[{"typ":"single-choice","id":"reise-a13326","naehrstoff":"Stärke aus dem Brötchen","ort":"Mundhöhle","frage":"Robartina kaut das Brötchen lange. Was passiert mit der Stärke?","optionen":[{"text":"Die Amylase des Speichels spaltet Maltose von der Stärke ab – deshalb schmeckt das Brötchen süßlich.","richtig":true},{"text":"Pepsin spaltet die Stärke in Aminosäuren.","richtig":false},{"text":"Die Stärke wird schon im Mund als Glukose resorbiert.","richtig":false}],"erklaerung":"Die Aufspaltung durch die Speichelamylase spielt in der Gesamtverdauung aber nur eine untergeordnete Rolle.","quelle":["i-care S. 197"]},{"typ":"single-choice","id":"reise-4d2179","naehrstoff":"Stärke aus dem Brötchen","ort":"Magen","frage":"Der Bissen erreicht den Magen. Was passiert jetzt mit der Stärke?","optionen":[{"text":"Die Kohlenhydratverdauung stoppt, weil die Speichelamylase durch den sauren Magensaft inaktiviert wird.","richtig":true},{"text":"Die Salzsäure spaltet die Stärke vollständig in Glukose.","richtig":false},{"text":"Die Magenlipase spaltet die Stärke.","richtig":false}],"erklaerung":"Kohlenhydratreiche Speisen wie das Frühstücksbrötchen verweilen am kürzesten im Magen.","quelle":["MKK S. 355, 361"]},{"typ":"single-choice","id":"reise-5c8490","naehrstoff":"Stärke aus dem Brötchen","ort":"Dünndarm","frage":"Im Zwölffingerdarm kommt der Pankreassaft dazu. Was geschieht jetzt mit der Stärke?","optionen":[{"text":"Die Amylase des Pankreassafts spaltet die Stärke in den Zweifachzucker Maltose.","richtig":true},{"text":"Das Trypsin spaltet die Stärke in Oligopeptide.","richtig":false},{"text":"Die Laktase spaltet die Stärke in Galaktose.","richtig":false}],"erklaerung":"Die Kohlenhydratverdauung durch die Amylase des Pankreassafts ist wesentlich wichtiger als die im Mund.","quelle":["i-care S. 238"]},{"typ":"single-choice","id":"reise-8557ed","naehrstoff":"Stärke aus dem Brötchen","ort":"Bürstensaum","frage":"Die Maltose kommt mit dem Bürstensaum des Dünndarmepithels in Kontakt. Was passiert?","optionen":[{"text":"Die Maltase spaltet die Maltose in zwei Glukosemoleküle.","richtig":true},{"text":"Die Saccharase spaltet die Maltose in Glukose und Fruktose.","richtig":false},{"text":"Die Maltose wird unverändert resorbiert.","richtig":false}],"erklaerung":"Vom Dünndarmepithel können nur Einfachzucker aufgenommen werden.","quelle":["i-care S. 238"]},{"typ":"single-choice","id":"reise-98d6c5","naehrstoff":"Stärke aus dem Brötchen","ort":"Blut","frage":"Wie geht es für die Glukose weiter?","optionen":[{"text":"Transportproteine nehmen sie in die Enterozyten auf; mit dem Pfortaderblut gelangt sie zur Leber.","richtig":true},{"text":"Sie wird in Chylomikronen verpackt und ins Lymphsystem abgegeben.","richtig":false},{"text":"Sie bleibt im Darm und wird mit dem Stuhl ausgeschieden.","richtig":false}],"erklaerung":"Einfachzucker können frei im Blut transportiert werden.","quelle":["i-care S. 239"]},{"typ":"single-choice","id":"reise-ab2ad9","naehrstoff":"Eiweiß aus dem Ei","ort":"Mundhöhle","frage":"Robartina kaut das Ei. Wo beginnt die Verdauung des Eiweißes?","optionen":[{"text":"erst im Magen","richtig":true},{"text":"schon im Mund durch die Amylase","richtig":false},{"text":"erst im Dickdarm","richtig":false}],"erklaerung":"Der erste Schritt der Eiweißverdauung findet im Magen statt.","quelle":["i-care S. 239"]},{"typ":"single-choice","id":"reise-287438","naehrstoff":"Eiweiß aus dem Ei","ort":"Magen: Salzsäure","frage":"Was macht die Salzsäure des Magensafts mit dem Eiweiß?","optionen":[{"text":"Sie denaturiert es: Seine räumliche Struktur wird zerstört, sodass Enzyme es leichter angreifen können.","richtig":true},{"text":"Sie spaltet es vollständig in Aminosäuren.","richtig":false},{"text":"Sie verpackt es in Mizellen.","richtig":false}],"erklaerung":"Beim gekochten Ei ist das Eiweiß schon teilweise denaturiert – Proteine verändern ihre Struktur auch bei der Zubereitung, z. B. durch Kochen.","quelle":["i-care S. 209, 239"]},{"typ":"single-choice","id":"reise-f7e4f9","naehrstoff":"Eiweiß aus dem Ei","ort":"Magen: Enzym","frage":"Welches Enzym greift im Magen die denaturierten Proteine an?","optionen":[{"text":"Pepsin, das durch die Magensäure aus Pepsinogen entsteht","richtig":true},{"text":"Trypsin aus dem Pankreas","richtig":false},{"text":"Amylase aus dem Speichel","richtig":false}],"erklaerung":"Die Proteinverdauung durch Pepsin im Magen ist insgesamt weniger wichtig als die im Dünndarm.","quelle":["i-care S. 209, 239"]},{"typ":"single-choice","id":"reise-66523e","naehrstoff":"Eiweiß aus dem Ei","ort":"Dünndarm","frage":"Der Speisebrei erreicht den Dünndarm. Was passiert jetzt mit dem Eiweiß?","optionen":[{"text":"Pepsin wird durch den hohen pH-Wert des Pankreassafts inaktiviert; die Proteasen des Pankreas spalten die Proteine in Oligopeptide.","richtig":true},{"text":"Pepsin arbeitet im Dünndarm am stärksten weiter.","richtig":false},{"text":"Die Gallensäuren spalten die Proteine in Aminosäuren.","richtig":false}],"erklaerung":"","quelle":["i-care S. 240"]},{"typ":"single-choice","id":"reise-95aaaf","naehrstoff":"Eiweiß aus dem Ei","ort":"Bürstensaum","frage":"Die Oligopeptide gelangen an den Bürstensaum. Was passiert dort?","optionen":[{"text":"Oligopeptidasen zerlegen sie in Aminosäuren, Di- und Tripeptide.","richtig":true},{"text":"Die Laktase spaltet sie in Galaktose und Glukose.","richtig":false},{"text":"Die Lipase spaltet sie in Fettsäuren.","richtig":false}],"erklaerung":"","quelle":["i-care S. 240"]},{"typ":"single-choice","id":"reise-3ef656","naehrstoff":"Eiweiß aus dem Ei","ort":"Blut","frage":"Wie geht es für die Aminosäuren weiter?","optionen":[{"text":"Sie werden ins Blut abgegeben und über die Pfortader zur Leber transportiert.","richtig":true},{"text":"Sie werden als Chylomikronen über das Lymphsystem transportiert.","richtig":false},{"text":"Sie werden in der Gallenblase gespeichert.","richtig":false}],"erklaerung":"Aminosäuren dienen dem Körper in erster Linie als Bausteine für Proteine.","quelle":["i-care S. 240"]},{"typ":"single-choice","id":"reise-da0cf6","naehrstoff":"Fett aus der Butter","ort":"Mund und Magen","frage":"Wie wird das Fett aus der Butter auf die Verdauung vorbereitet?","optionen":[{"text":"Durch das Kauen und die Bewegungen der Magenwand wird es fein im Nahrungsbrei verteilt (emulgiert).","richtig":true},{"text":"Die Salzsäure macht es wasserlöslich.","richtig":false},{"text":"Die Amylase spaltet es schon im Mund vollständig.","richtig":false}],"erklaerung":"Fette sind nicht wasserlöslich und klumpen sonst zusammen – dann erreichen die Enzyme sie nur schlecht.","quelle":["i-care S. 240","MKK S. 362"]},{"typ":"single-choice","id":"reise-9df014","naehrstoff":"Fett aus der Butter","ort":"Magen","frage":"Was passiert mit dem Fett im Magen?","optionen":[{"text":"Die Magenlipase spaltet 15–30 % der Nahrungsfette.","richtig":true},{"text":"Pepsin spaltet das gesamte Fett.","richtig":false},{"text":"Im Magen passiert mit dem Fett gar nichts.","richtig":false}],"erklaerung":"Fettreiche Speisen passieren den Magen am langsamsten.","quelle":["i-care S. 240","MKK S. 355"]},{"typ":"single-choice","id":"reise-c763b1","naehrstoff":"Fett aus der Butter","ort":"Dünndarm: Galle","frage":"Im Dünndarm kommt die Galle dazu. Was bewirken die Gallensäuren?","optionen":[{"text":"Sie binden an die Fetttröpfchen, erhöhen deren Wasserlöslichkeit und verteilen das Fett fein im Chymus.","richtig":true},{"text":"Sie spalten das Fett in Glukose.","richtig":false},{"text":"Sie aktivieren das Pepsin.","richtig":false}],"erklaerung":"","quelle":["i-care S. 240"]},{"typ":"single-choice","id":"reise-59c9d3","naehrstoff":"Fett aus der Butter","ort":"Dünndarm: Enzym","frage":"Welches Enzym spaltet den größten Teil der Nahrungsfette?","optionen":[{"text":"die Lipase aus der Bauchspeicheldrüse (Pankreaslipase)","richtig":true},{"text":"die Magenlipase","richtig":false},{"text":"die Laktase","richtig":false}],"erklaerung":"Die Pankreaslipase spaltet 70–85 % der Fette.","quelle":["i-care S. 240–241"]},{"typ":"single-choice","id":"reise-148aab","naehrstoff":"Fett aus der Butter","ort":"Enterozyt","frage":"Die langkettigen Fettsäuren werden – in Mizellen verpackt – von den Enterozyten aufgenommen. Was passiert dort?","optionen":[{"text":"Sie werden wieder zu Triglyzeriden zusammengesetzt und als Chylomikronen verpackt.","richtig":true},{"text":"Sie werden in Glukose umgewandelt.","richtig":false},{"text":"Sie werden sofort wieder ins Darmlumen abgegeben.","richtig":false}],"erklaerung":"","quelle":["i-care S. 240"]},{"typ":"single-choice","id":"reise-a290e5","naehrstoff":"Fett aus der Butter","ort":"Lymphe","frage":"Wie gelangen die Chylomikronen in den Blutkreislauf?","optionen":[{"text":"über das Lymphsystem und den Milchbrustgang (Ductus thoracicus) in die obere Hohlvene","richtig":true},{"text":"über die Pfortader direkt zur Leber","richtig":false},{"text":"über die Gallenwege zurück in den Darm","richtig":false}],"erklaerung":"Die fetthaltige Lymphe im Milchbrustgang heißt Chylus.","quelle":["i-care S. 240"]}]},"aprilscherz":{"typ":"single-choice","quelle":["MKK S. 355"],"erklaerung":"Gut durchschaut! Der zähe Muzin-Schleim bildet einen geschlossenen Film, der den gesamten Binnenraum des Magens auskleidet. Zusammen mit den puffernden Bikarbonat-Ionen verhindert er eine Selbstverdauung.","id":"aprilscherz","frage":"🃏 **Achtung, Eilmeldung!** Alaa hat gelesen: „Weil die Magensäure so stark ist, verdaut sich der Magen jede Nacht komplett selbst und wächst bis zum Frühstück neu nach.“ Was stimmt?","optionen":[{"text":"Stimmt – deshalb soll man nachts nichts essen.","richtig":false},{"text":"Stimmt – aber nur am Wochenende.","richtig":false},{"text":"April, April! Schleimfilm und Bikarbonat schützen die Schleimhaut vor Salzsäure und Pepsin und verhindern so eine Selbstverdauung.","richtig":true}]}}};

/** Einfacher, schneller 53-Bit-Hash (cyrb53). Kein Krypto – reicht gegen Handänderungen. */
LT.hash = function (str, seed) {
  var h1 = 0xdeadbeef ^ (seed || 0), h2 = 0x41c6ce57 ^ (seed || 0);
  for (var i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);

  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
};
