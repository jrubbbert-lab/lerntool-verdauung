ext":"Das Pankreas bildet zu viel Galle.","richtig":false},{"text":"Der Magen bildet keine Säure mehr.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-sc-lipase","frage":"Welches Enzym des Pankreassafts spaltet Fette?","optionen":[{"text":"[[Lipase]]","richtig":true},{"text":"[[Amylase]]","richtig":false},{"text":"Trypsin","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 367"],"erklaerung":"","id":"pankreas-sc-schmerz","frage":"Welcher Schmerz ist typisch für eine akute Pankreatitis?","optionen":[{"text":"heftige Oberbauchschmerzen, die gürtelförmig in den Rücken ausstrahlen","richtig":true},{"text":"leichtes Brennen hinter dem Brustbein","richtig":false},{"text":"Schmerzen im rechten Unterbauch","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-sc-wann","frage":"Wann bildet das Pankreas den größten Teil seines Verdauungssafts?","optionen":[{"text":"nach den Mahlzeiten","richtig":true},{"text":"nachts im Schlaf","richtig":false},{"text":"beim Sport","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-mc-aufgaben","frage":"Welche Aufgaben hat das Pankreas?","optionen":[{"text":"Es bildet Verdauungsenzyme.","richtig":true},{"text":"Es bildet Insulin und Glukagon.","richtig":true},{"text":"Es bildet die Galle.","richtig":false},{"text":"Es speichert den Stuhl.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 221, 223"],"erklaerung":"","id":"pankreas-mc-spalten","frage":"Welche Nährstoffe können die Enzyme des Pankreassafts spalten?","optionen":[{"text":"Eiweiße","richtig":true},{"text":"Kohlenhydrate","richtig":true},{"text":"Fette","richtig":true},{"text":"Vitamine","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-mc-teile","frage":"Welche Teile hat das Pankreas?","optionen":[{"text":"Kopf","richtig":true},{"text":"Körper","richtig":true},{"text":"Schwanz","richtig":true},{"text":"Fundus","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 367"],"erklaerung":"","id":"pankreas-mc-ursachen","frage":"Was sind häufige Ursachen einer akuten Pankreatitis?","optionen":[{"text":"Gallensteine","richtig":true},{"text":"Alkoholmissbrauch","richtig":true},{"text":"zu viel Bewegung","richtig":false},{"text":"zu viel Trinkwasser","richtig":false}]},{"typ":"multiple-choice","quelle":["MKK S. 367"],"erklaerung":"","id":"pankreas-mc-symptome","frage":"Welche Beschwerden gehören zu einer akuten Pankreatitis?","optionen":[{"text":"heftige Oberbauchschmerzen","richtig":true},{"text":"Übelkeit","richtig":true},{"text":"Erbrechen","richtig":true},{"text":"Zahnschmerzen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 221","MKK S. 367"],"erklaerung":"","id":"pankreas-mc-hormone","frage":"Welche Hormone bildet das Pankreas?","optionen":[{"text":"Insulin","richtig":true},{"text":"Glukagon","richtig":true},{"text":"Gastrin","richtig":false},{"text":"Pepsin","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-zu-enzyme","frage":"Ordne jedem Enzym des Pankreassafts zu, was es spaltet.","paare":[{"links":"Trypsin","rechts":"Eiweiße"},{"links":"[[Amylase]]","rechts":"Stärke"},{"links":"[[Lipase]]","rechts":"Fette"}]},{"typ":"zuordnung","quelle":["MKK S. 367","i-care S. 223"],"erklaerung":"","id":"pankreas-zu-hormone","frage":"Ordne jedem Stoff aus dem Pankreas seine Wirkung zu.","paare":[{"links":"[[Insulin]]","rechts":"senkt den Blutzucker"},{"links":"[[Glukagon]]","rechts":"steigert den Blutzucker"},{"links":"Bikarbonat","rechts":"neutralisiert den sauren Speisebrei"}]},{"typ":"zuordnung","quelle":["i-care S. 221, 224"],"erklaerung":"","id":"pankreas-zu-begriffe","frage":"Ordne jedem Begriff seine Bedeutung zu.","paare":[{"links":"[[exokrin]]","rechts":"gibt Stoffe nach außen ab, z. B. in den Darm"},{"links":"[[endokrin]]","rechts":"gibt Hormone ins Blut ab"},{"links":"[[Pankreatitis]]","rechts":"Entzündung der Bauchspeicheldrüse"}]},{"typ":"reihenfolge","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-rf-teile","frage":"Ordne die Teile des Pankreas vom Zwölffingerdarm bis zur Milz.","schritte":["Pankreaskopf","Pankreaskörper","Pankreasschwanz"]},{"typ":"reihenfolge","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-rf-aktivierung","frage":"Wie werden die eiweißspaltenden Enzyme des Pankreas aktiv? Bring die Schritte in die richtige Reihenfolge.","schritte":["Das Pankreas bildet inaktive Vorstufen der Enzyme.","Die Vorstufen gelangen mit dem Pankreassaft in den Zwölffingerdarm.","Dort wird die Vorstufe des Trypsins in Trypsin umgewandelt.","Trypsin aktiviert die anderen Vorstufen."]},{"typ":"reihenfolge","quelle":["i-care S. 224"],"erklaerung":"","id":"pankreas-rf-pankreatitis","frage":"Wie kann ein Gallenstein eine Pankreatitis auslösen? Bring die Schritte in die richtige Reihenfolge.","schritte":["Ein Gallenstein verstopft den gemeinsamen Ausgang von Gallengang und Pankreasgang.","Der Pankreassaft kann nicht mehr abfließen und staut sich zurück.","Die Enzyme greifen die Zellen des Pankreas an.","Die Bauchspeicheldrüse entzündet sich."]},{"typ":"lückentext","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-lt-aufgaben","text":"Das Pankreas bildet den {{Pankreassaft|Verdauungssaft}} und die Hormone {{Insulin}} und Glukagon."},{"typ":"lückentext","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-lt-saft","text":"Der Pankreassaft ist {{basisch|alkalisch}}. Er neutralisiert den {{sauren|saure}} Speisebrei aus dem Magen."},{"typ":"lückentext","quelle":["MKK S. 367"],"erklaerung":"","id":"pankreas-lt-entzuendung","text":"Eine Entzündung der Bauchspeicheldrüse heißt {{Pankreatitis}}. Häufige Ursachen sind {{Gallensteine}} und Alkoholmissbrauch."}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-kk-c9ffdd","vorne":"Wie heißt die Bauchspeicheldrüse in der Fachsprache?","hinten":"[[Pankreas]]."},{"typ":"karteikarte","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-kk-62f573","vorne":"Welche zwei Hauptaufgaben hat das [[Pankreas]]?","hinten":"Es bildet den Pankreassaft mit Verdauungsenzymen, und es bildet die Hormone Insulin und Glukagon, die den Blutzuckerspiegel steuern."},{"typ":"karteikarte","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-kk-cc267a","vorne":"Wo liegt das Pankreas?","hinten":"Im Oberbauch hinter dem Magen. Sein Kopf liegt im Bogen des Zwölffingerdarms, sein Schwanz reicht bis zur Milz."},{"typ":"karteikarte","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-kk-c07d95","vorne":"In welche drei Teile gliedert sich das Pankreas?","hinten":"Pankreaskopf, Pankreaskörper und Pankreasschwanz."},{"typ":"karteikarte","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-kk-2592c7","vorne":"Was bedeutet [[exokrin]]?","hinten":"Die Drüse gibt ihre Stoffe nach außen ab, z. B. in den Verdauungstrakt. Der exokrine Teil des Pankreas bildet den Verdauungssaft."},{"typ":"karteikarte","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-kk-204b18","vorne":"Was bedeutet [[endokrin]]?","hinten":"Die Drüse gibt ihre Hormone nach innen, also ins Blut, ab. Der endokrine Teil des Pankreas bildet die Hormone."},{"typ":"karteikarte","quelle":["i-care S. 221, 223"],"erklaerung":"","id":"pankreas-kk-e508f1","vorne":"Wohin wird der Pankreassaft abgegeben?","hinten":"In den Zwölffingerdarm ([[Duodenum]])."},{"typ":"karteikarte","quelle":["i-care S. 221, 223"],"erklaerung":"","id":"pankreas-kk-60034c","vorne":"Welche Nährstoffe können die Enzyme des Pankreassafts spalten?","hinten":"Eiweiße, Kohlenhydrate und Fette."},{"typ":"karteikarte","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-kk-8d48f0","vorne":"Warum ist der Pankreassaft basisch, und wozu ist das gut?","hinten":"Er enthält Bikarbonat. So wird der saure Speisebrei aus dem Magen im Dünndarm neutralisiert."},{"typ":"karteikarte","quelle":["MKK S. 359"],"erklaerung":"","id":"pankreas-kk-9a0425","vorne":"Warum muss der saure Speisebrei im Dünndarm neutralisiert werden?","hinten":"Die Enzyme des Pankreassafts können bei saurem pH-Wert nicht arbeiten."},{"typ":"karteikarte","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-kk-013b8d","vorne":"Warum gibt das Pankreas die eiweißspaltenden Enzyme als inaktive Vorstufen ab?","hinten":"Damit sich die Bauchspeicheldrüse nicht selbst verdaut. Erst im Dünndarm werden die Enzyme aktiv."},{"typ":"karteikarte","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-kk-5b74b3","vorne":"Welches eiweißspaltende Enzym des Pankreas ist besonders wichtig?","hinten":"Das Trypsin. Es entsteht im Dünndarm aus seiner Vorstufe und aktiviert dann die anderen Vorstufen."},{"typ":"karteikarte","quelle":["i-care S. 223","MKK S. 359"],"erklaerung":"","id":"pankreas-kk-f55cef","vorne":"Welche Enzyme des Pankreassafts spalten Kohlenhydrate und Fette?","hinten":"Die [[Amylase]] spaltet Stärke, die [[Lipase]] spaltet Fette."},{"typ":"karteikarte","quelle":["i-care S. 223"],"erklaerung":"","id":"pankreas-kk-40150b","vorne":"Wie heißen die hormonbildenden Zellgruppen des Pankreas?","hinten":"Langerhans-Inseln. Sie liegen verstreut im Gewebe, das den Verdauungssaft bildet."},{"typ":"karteikarte","quelle":["MKK S. 367"],"erklaerung":"","id":"pankreas-kk-213e23","vorne":"Wie wirken [[Insulin]] und [[Glukagon]]?","hinten":"Insulin senkt den Blutzucker, Glukagon steigert ihn."},{"typ":"karteikarte","quelle":["i-care S. 223–224"],"erklaerung":"","id":"pankreas-kk-7ec0d2","vorne":"Was fördert die Bildung des Pankreassafts?","hinten":"Der Parasympathikus und Hormone aus dem Dünndarm. Das meiste wird nach den Mahlzeiten gebildet."},{"typ":"karteikarte","quelle":["i-care S. 224","MKK S. 367"],"erklaerung":"","id":"pankreas-kk-345dae","vorne":"Was passiert bei einer [[Pankreatitis]]?","hinten":"Die Verdauungsenzyme werden schon im Pankreas aktiv und greifen das Organ an. Es verdaut sich quasi selbst."},{"typ":"karteikarte","quelle":["MKK S. 367"],"erklaerung":"","id":"pankreas-kk-52794b","vorne":"Was sind die häufigsten Ursachen einer akuten Pankreatitis?","hinten":"Gallensteine und Alkoholmissbrauch."},{"typ":"karteikarte","quelle":["i-care S. 224"],"erklaerung":"","id":"pankreas-kk-659430","vorne":"Warum können Gallensteine eine Pankreatitis auslösen?","hinten":"Das letzte Stück des Gallengangs und der Ausführungsgang des Pankreas verlaufen gemeinsam. Ein Stein kurz vor der Mündung staut den Pankreassaft zurück."},{"typ":"karteikarte","quelle":["MKK S. 368"],"erklaerung":"","id":"pankreas-kk-5ef8ac","vorne":"Welche Folgen hat es, wenn das Pankreas kaum noch arbeitet?","hinten":"Es fehlen Verdauungsenzyme, sodass die Nahrung schlechter verwertet wird. Außerdem fehlt Insulin, es entsteht ein Diabetes mellitus."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 221"],"erklaerung":"","id":"pankreas-op-aufgaben","operator":"beschreiben","afb":"I","fall":"Alaa lernt für eine Klassenarbeit und sagt zu Robartina: „Die Bauchspeicheldrüse ist doch nur für den Zucker da, oder?“","auftrag":"Beschreibe die beiden Hauptaufgaben des Pankreas.","mindestlaenge":250,"kriterien":["Ich nenne die Bildung des Pankreassafts mit Verdauungsenzymen.","Ich nenne, dass die Enzyme Eiweiße, Kohlenhydrate und Fette spalten.","Ich nenne die Bildung der Hormone Insulin und Glukagon.","Ich nenne, dass diese Hormone den Blutzuckerspiegel steuern."],"musterloesung":"Das Pankreas (die Bauchspeicheldrüse) hat zwei Hauptaufgaben. Erstens bildet es den **Pankreassaft**, der in den Zwölffingerdarm abgegeben wird. Er enthält **Enzyme**, die Eiweiße, Kohlenhydrate und Fette spalten. Dieser Teil heißt exokrines Pankreas. Zweitens bildet das Pankreas die **Hormone Insulin und Glukagon**, die ins Blut abgegeben werden und den **Blutzuckerspiegel** steuern. Dieser Teil heißt endokrines Pankreas."},{"typ":"operator","quelle":["i-care S. 223","MKK S. 359"],"erklaerung":"","id":"pankreas-op-selbstschutz","operator":"erläutern","afb":"II","fall":"Im Unterricht fragt Alaa: „Wenn die Bauchspeicheldrüse Enzyme bildet, die Eiweiß zerlegen – warum zerlegt sie sich dann nicht selbst? Sie besteht doch auch aus Eiweiß.“","auftrag":"Erläutere, wie sich das Pankreas vor seinen eigenen Enzymen schützt.","mindestlaenge":300,"kriterien":["Ich erkläre, dass die eiweißspaltenden Enzyme als inaktive Vorstufen gebildet werden.","Ich erkläre, dass sie erst im Dünndarm aktiv werden.","Ich nenne das Trypsin, das die anderen Vorstufen aktiviert.","Ich erkläre, dass so eine Selbstverdauung verhindert wird."],"musterloesung":"Die eiweißspaltenden Enzyme des Pankreas werden nicht in ihrer aktiven Form gebildet, sondern als **inaktive Vorstufen**. In dieser Form können sie das Pankreas nicht angreifen. Sie gelangen mit dem Pankreassaft in den Zwölffingerdarm und werden **erst dort aktiv**: Zuerst wird die Vorstufe des **Trypsins** in Trypsin umgewandelt. Trypsin aktiviert dann die anderen Vorstufen. So wird verhindert, dass sich die Bauchspeicheldrüse **selbst verdaut**."},{"typ":"operator","quelle":["MKK S. 367"],"erklaerung":"","id":"pankreas-op-alkohol","operator":"beurteilen","afb":"III","fall":"Herr D. wird mit heftigen Oberbauchschmerzen, die gürtelförmig in den Rücken ziehen, aufgenommen. Er hat Übelkeit und erbricht. Die Ärztin vermutet eine akute Pankreatitis. Herr D. trinkt seit Jahren viel Alkohol und sagt: „Mit dem Alkohol hat das nichts zu tun. Der geht doch auf die Leber, nicht auf die Bauchspeicheldrüse.“","auftrag":"Beurteile die Aussage von Herrn D. mithilfe der Informationen aus dem Buch.","mindestlaenge":350,"kriterien":["Ich ordne die Beschwerden einer akuten Pankreatitis zu.","Ich erkläre, was bei einer Pankreatitis im Organ passiert (Selbstverdauung).","Ich nenne Alkoholmissbrauch als eine der Hauptursachen.","Ich nenne Gallensteine als weitere häufige Ursache.","Ich komme zu einem begründeten Urteil."],"musterloesung":"Heftige, konstante Oberbauchschmerzen mit **gürtelförmiger Ausstrahlung in den Rücken**, Übelkeit und Erbrechen sind typisch für eine **akute Pankreatitis**. Dabei werden die Verdauungsenzyme schon im Pankreas freigesetzt und aktiviert. Sie greifen das Organ an, es kommt zu einer **Selbstverdauung**, die lebensbedrohlich sein kann. Als Ursachen stehen laut Buch **Gallensteine** und **Alkoholmissbrauch** im Vordergrund. **Urteil:** Die Aussage von Herrn D. ist falsch. Alkohol schädigt nicht nur die Leber, sondern ist eine der häufigsten Ursachen einer Pankreatitis. Sein Alkoholkonsum kommt als Auslöser sehr wohl infrage."}],"status":"aktiv"},{"id":"leber","titel":"Leber und Gallenblase","block":2,"nr":6,"organ":"","beschreibung":"Stoffwechselzentrale und Galle.","quellen":"i-care S. 224–237; MKK S. 359–361, 368–372","icon":"leber","farbe":"#2A473B","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-sc-name","frage":"Welches Organ ist mit „Hepar“ gemeint?","optionen":[{"text":"die Leber","richtig":true},{"text":"die Gallenblase","richtig":false},{"text":"die Milz","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-sc-lage","frage":"Wo liegt der größte Teil der Leber?","optionen":[{"text":"im rechten Oberbauch unter dem Zwerchfell","richtig":true},{"text":"im linken Unterbauch","richtig":false},{"text":"im Brustraum über dem Zwerchfell","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 234"],"erklaerung":"Die Gallenblase bildet keine Galle. Sie speichert sie nur und dickt sie ein.","id":"leber-sc-gallebildung","frage":"Welches Organ bildet die Galle?","optionen":[{"text":"die Leber","richtig":true},{"text":"die Gallenblase","richtig":false},{"text":"das Pankreas","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 228"],"erklaerung":"","id":"leber-sc-pfortader","frage":"Welches Gefäß bringt das nährstoffreiche Blut aus dem Darm zur Leber?","optionen":[{"text":"die Pfortader","richtig":true},{"text":"die Leberarterie","richtig":false},{"text":"die untere Hohlvene","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 234"],"erklaerung":"","id":"leber-sc-ammoniak","frage":"In welchen ungiftigen Stoff wandelt die Leber das giftige Ammoniak um?","optionen":[{"text":"Harnstoff","richtig":true},{"text":"Bilirubin","richtig":false},{"text":"Glykogen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-sc-glykogen","frage":"In welcher Form speichert die Leber Glukose?","optionen":[{"text":"als Glykogen","richtig":true},{"text":"als Harnstoff","richtig":false},{"text":"als Galle","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 234"],"erklaerung":"","id":"leber-sc-gallefunktion","frage":"Bei der Verdauung welches Nährstoffs hilft die Galle?","optionen":[{"text":"Fett","richtig":true},{"text":"Stärke","richtig":false},{"text":"Vitamine","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 236"],"erklaerung":"","id":"leber-sc-gallenblase","frage":"Was macht die Gallenblase mit der Galle?","optionen":[{"text":"Sie speichert die Galle und dickt sie ein.","richtig":true},{"text":"Sie bildet die Galle.","richtig":false},{"text":"Sie verdünnt die Galle mit Wasser.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 235"],"erklaerung":"","id":"leber-sc-ikterus","frage":"Die Haut und die Augen eines Patienten sind gelblich verfärbt. Wie heißt das in der Fachsprache?","optionen":[{"text":"Ikterus","richtig":true},{"text":"Cholelithiasis","richtig":false},{"text":"Aszites","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 235"],"erklaerung":"","id":"leber-sc-stuhlfarbe","frage":"Woher hat der Stuhl seine braune Farbe?","optionen":[{"text":"von Abbauprodukten des Gallenfarbstoffs Bilirubin","richtig":true},{"text":"vom Pankreassaft","richtig":false},{"text":"von der Magensäure","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 234"],"erklaerung":"Das nennt man First-Pass-Effekt. Bei einer Injektion gelangt der Wirkstoff zuerst in den Körperkreislauf und erst danach in die Leber.","id":"leber-sc-firstpass","frage":"Alaa fragt, warum manche Medikamente gespritzt und nicht geschluckt werden. Welche Antwort passt?","optionen":[{"text":"Geschluckte Wirkstoffe gelangen zuerst in die Leber und werden dort teilweise abgebaut.","richtig":true},{"text":"Geschluckte Wirkstoffe gelangen gar nicht ins Blut.","richtig":false},{"text":"Gespritzte Wirkstoffe erreichen die Leber nie.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 237"],"erklaerung":"","id":"leber-sc-kolik","frage":"Eine Patientin mit Gallensteinen bekommt plötzlich krampfartige Schmerzen im Oberbauch. Wie nennt man das?","optionen":[{"text":"Gallenkolik","richtig":true},{"text":"Ikterus","richtig":false},{"text":"Leberzirrhose","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-mc-aufgaben","frage":"Welche Aufgaben hat die Leber?","optionen":[{"text":"Sie entgiftet den Körper.","richtig":true},{"text":"Sie bildet die Galle.","richtig":true},{"text":"Sie speichert Glukose als Glykogen.","richtig":true},{"text":"Sie bildet Insulin.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 225, 228"],"erklaerung":"Die Lebervenen verlassen die Leber nicht an der Leberpforte. Sie münden in die untere Hohlvene.","id":"leber-mc-leberpforte","frage":"Welche Strukturen ziehen durch die Leberpforte?","optionen":[{"text":"die Leberarterie","richtig":true},{"text":"die Pfortader","richtig":true},{"text":"die Gallengänge","richtig":true},{"text":"die Lebervenen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 231, 234"],"erklaerung":"","id":"leber-mc-bildet","frage":"Was bildet die Leber?","optionen":[{"text":"Albumin","richtig":true},{"text":"Gerinnungsfaktoren","richtig":true},{"text":"Galle","richtig":true},{"text":"Pepsin","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 224, 235"],"erklaerung":"","id":"leber-mc-speicher","frage":"Was speichert die Leber?","optionen":[{"text":"Glykogen","richtig":true},{"text":"Eisen","richtig":true},{"text":"Vitamine","richtig":true},{"text":"Pankreassaft","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 235","MKK S. 370"],"erklaerung":"","id":"leber-mc-ikterus","frage":"Wodurch kann ein Ikterus entstehen?","optionen":[{"text":"Es zerfallen in kurzer Zeit sehr viele rote Blutkörperchen.","richtig":true},{"text":"Die Leber arbeitet nur noch eingeschränkt.","richtig":true},{"text":"Ein Gallenstein verschließt den Gallengang.","richtig":true},{"text":"Der Patient trinkt zu viel Wasser.","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 237"],"erklaerung":"","id":"leber-mc-gallensteine","frage":"Was trifft auf Gallensteine zu?","optionen":[{"text":"Sie können entstehen, wenn die Galle zu viel Cholesterin enthält.","richtig":true},{"text":"Sie verursachen meist keine Beschwerden.","richtig":true},{"text":"Ein eingeklemmter Stein kann eine Gallenkolik auslösen.","richtig":true},{"text":"Sie kommen häufiger bei Männern vor als bei Frauen.","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 225, 227–228"],"erklaerung":"","id":"leber-zu-gefaesse","frage":"Ordne jedem Blutgefäß der Leber seine Aufgabe zu.","paare":[{"links":"Leberarterie","rechts":"bringt sauerstoffreiches Blut zur Leber"},{"links":"Pfortader","rechts":"bringt nährstoffreiches Blut aus den Verdauungsorganen"},{"links":"Lebervenen","rechts":"leiten das Blut aus der Leber zur unteren Hohlvene"}]},{"typ":"zuordnung","quelle":["i-care S. 224, 234–235"],"erklaerung":"","id":"leber-zu-stoffe","frage":"Ordne jedem Stoff die passende Aussage zu.","paare":[{"links":"Ammoniak","rechts":"wird in der Leber zu Harnstoff entgiftet"},{"links":"Bilirubin","rechts":"entsteht beim Abbau des roten Blutfarbstoffs"},{"links":"Glykogen","rechts":"Speicherform der Glukose"},{"links":"Gallensäuren","rechts":"verteilen das Fett fein im Speisebrei"}]},{"typ":"zuordnung","quelle":["i-care S. 224–225, 235, 237"],"erklaerung":"","id":"leber-zu-begriffe","frage":"Ordne jedem Fachbegriff seine Bedeutung zu.","paare":[{"links":"Hepar","rechts":"Leber"},{"links":"Hepatozyten","rechts":"Leberzellen"},{"links":"Ikterus","rechts":"Gelbsucht"},{"links":"Cholelithiasis","rechts":"Gallensteinleiden"}]},{"typ":"reihenfolge","quelle":["i-care S. 236–237"],"erklaerung":"","id":"leber-rf-galle","frage":"Welchen Weg nimmt die Galle, die in der Gallenblase gespeichert wird? Bring die Schritte in die richtige Reihenfolge.","schritte":["Die Leberzellen bilden die Galle.","Die Galle verlässt die Leber über die Gallengänge.","Über den Gallenblasengang gelangt sie in die Gallenblase und wird dort eingedickt.","Bei Bedarf zieht sich die Gallenblase zusammen.","Die Galle fließt in den Zwölffingerdarm."]},{"typ":"reihenfolge","quelle":["i-care S. 231, 234"],"erklaerung":"","id":"leber-rf-ammoniak","frage":"Wie wird Ammoniak aus dem Körper entfernt? Bring die Schritte in die richtige Reihenfolge.","schritte":["Beim Abbau von Aminosäuren entsteht giftiges Ammoniak.","Die Leber wandelt das Ammoniak in Harnstoff um.","Der Harnstoff gelangt mit dem Blut zur Niere.","Der Harnstoff wird mit dem Urin ausgeschieden."]},{"typ":"reihenfolge","quelle":["i-care S. 235"],"erklaerung":"","id":"leber-rf-bilirubin","frage":"Wie kommt der Stuhl zu seiner braunen Farbe? Bring die Schritte in die richtige Reihenfolge.","schritte":["Rote Blutkörperchen werden abgebaut, dabei wird der rote Blutfarbstoff frei.","Aus dem Blutfarbstoff entsteht Bilirubin.","Die Leber gibt das Bilirubin mit der Galle in den Darm ab.","Darmbakterien bauen das Bilirubin weiter ab.","Das Abbauprodukt färbt den Stuhl braun."]},{"typ":"lückentext","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-lt-lage","text":"Die Leber liegt überwiegend im {{rechten|rechts}} Oberbauch direkt unter dem {{Zwerchfell}}."},{"typ":"lückentext","quelle":["i-care S. 234"],"erklaerung":"","id":"leber-lt-entgiftung","text":"Die Leber wandelt das giftige {{Ammoniak}} in ungiftigen {{Harnstoff}} um. Dieser wird über die Niere ausgeschieden."},{"typ":"lückentext","quelle":["i-care S. 234, 236"],"erklaerung":"","id":"leber-lt-galle","text":"Die {{Leber}} bildet die Galle. Die {{Gallenblase}} speichert sie und dickt sie ein. Die Galle hilft bei der Verdauung von {{Fett|Fetten|Fette}}."},{"typ":"fehlerfahndung","quelle":["i-care S. 234–237","MKK S. 360"],"erklaerung":"Eine Gallenkolik verursacht krampfartige Schmerzen im rechten Mittel- und Oberbauch. Ein Ikterus ist eine gelbliche Verfärbung von Haut und Augen. Die Galle wird von der Leber gebildet, die Gallenblase speichert sie nur. Vor einem Bauchultraschall bleiben Patienten nüchtern, damit die Gallenblase gefüllt und gut zu sehen ist.","id":"leber-ff-gallenkolik","titel":"Robartinas Pflegebericht: Frau K. mit Gallensteinen","bericht":"Frau K. hat bekannte Gallensteine. Nach einem fettreichen Abendessen klagt sie über krampfartige Schmerzen im linken Oberbauch. Ihre Haut und ihre Augen sind bläulich verfärbt, Frau Abda spricht von einem Ikterus. Ich habe Frau K. erklärt, dass die Gallenblase die Galle bildet. Vor dem Bauchultraschall morgen früh soll sie reichlich frühstücken.","fehler":[{"links":"im linken Oberbauch","rechts":"recht","loesung":"im rechten Oberbauch"},{"links":"bläulich verfärbt","rechts":"gelb","loesung":"gelblich verfärbt"},{"links":"die Gallenblase die Galle bildet","rechts":"leber","loesung":"die Leber die Galle bildet"},{"links":"reichlich frühstücken","rechts":"nüchtern|nichts essen","loesung":"nüchtern bleiben"}]}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-kk-fb031a","vorne":"Wie heißt die Leber in der Fachsprache?","hinten":"[[Hepar]]."},{"typ":"karteikarte","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-kk-c219a9","vorne":"Wo liegt die Leber?","hinten":"Überwiegend im rechten Oberbauch, direkt unter dem Zwerchfell und hinter den unteren Rippen."},{"typ":"karteikarte","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-kk-a14e89","vorne":"Welche Hauptaufgaben hat die Leber?","hinten":"Sie steht im Mittelpunkt des Kohlenhydrat-, Eiweiß- und Fettstoffwechsels, entgiftet den Körper, bildet die Galle, bildet Plasmaproteine und dient als Speicherorgan."},{"typ":"karteikarte","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-kk-c20c8e","vorne":"Warum sollen Patienten tief einatmen, wenn die Leber abgetastet wird?","hinten":"Die Leber ist an einer Stelle mit dem Zwerchfell verwachsen. Beim Einatmen sinkt das Zwerchfell ab und die Leber verlagert sich nach unten. Ihr unterer Rand ist dann unter dem Rippenbogen tastbar."},{"typ":"karteikarte","quelle":["i-care S. 225"],"erklaerung":"","id":"leber-kk-c5acf1","vorne":"Was ist die Leberpforte?","hinten":"Eine Stelle an der Unterseite der Leber. Hier treten die Leberarterie und die Pfortader in die Leber ein, und die Gallengänge verlassen sie."},{"typ":"karteikarte","quelle":["i-care S. 225, 227–228"],"erklaerung":"","id":"leber-kk-5caf0b","vorne":"Welches Blut bringt die Pfortader zur Leber?","hinten":"Das Blut aus den Verdauungsorganen und der Milz. Es ist nährstoffreich, aber sauerstoffarm."},{"typ":"karteikarte","quelle":["i-care S. 225, 227"],"erklaerung":"","id":"leber-kk-3d33b9","vorne":"Wozu braucht die Leber zusätzlich die Leberarterie?","hinten":"Die Leberarterie versorgt das Lebergewebe mit sauerstoffreichem Blut."},{"typ":"karteikarte","quelle":["i-care S. 225"],"erklaerung":"","id":"leber-kk-5b9fd5","vorne":"Wie heißen die Leberzellen in der Fachsprache?","hinten":"[[Hepatozyten]]."},{"typ":"karteikarte","quelle":["i-care S. 225"],"erklaerung":"","id":"leber-kk-d87d95","vorne":"Wie ist ein Leberläppchen aufgebaut?","hinten":"Es ist annähernd sechseckig, ähnlich einer Bienenwabe. In der Mitte liegt die Zentralvene, um sie herum sind die Leberzellen strahlenförmig angeordnet."},{"typ":"karteikarte","quelle":["i-care S. 229"],"erklaerung":"","id":"leber-kk-a5d72a","vorne":"Wie verhindert die Leber, dass der Blutzuckerspiegel zwischen den Mahlzeiten zu stark abfällt?","hinten":"Sie baut ihr gespeichertes [[Glykogen]] zu Glukose ab und stellt neue Glukose her ([[Glukoneogenese]]). Die Glukose gibt sie ins Blut ab."},{"typ":"karteikarte","quelle":["i-care S. 230"],"erklaerung":"","id":"leber-kk-c8c664","vorne":"Was macht die Leber mit überschüssiger Glukose, wenn dem Körper mehr Energie zugeführt wird, als er braucht?","hinten":"Sie wandelt die Glukose in Fettsäuren um."},{"typ":"karteikarte","quelle":["i-care S. 231"],"erklaerung":"","id":"leber-kk-dedcbb","vorne":"Welche wichtigen Eiweiße des Blutes bildet die Leber?","hinten":"Plasmaproteine, zum Beispiel [[Albumin]] und die Gerinnungsfaktoren. Für die Gerinnungsfaktoren braucht die Leber Vitamin K."},{"typ":"karteikarte","quelle":["i-care S. 234"],"erklaerung":"","id":"leber-kk-dcad7b","vorne":"Wie macht die Leber das giftige Ammoniak unschädlich?","hinten":"Sie wandelt es in ungiftigen Harnstoff um. Der Harnstoff wird über die Niere mit dem Urin ausgeschieden."},{"typ":"karteikarte","quelle":["i-care S. 234"],"erklaerung":"","id":"leber-kk-c78f61","vorne":"Was bedeutet [[First-Pass-Effekt]]?","hinten":"Geschluckte Medikamente gelangen über die Pfortader zuerst in die Leber und werden dort verändert. Manche Wirkstoffe verlieren dadurch an Wirkung."},{"typ":"karteikarte","quelle":["i-care S. 234"],"erklaerung":"","id":"leber-kk-8e9a5a","vorne":"Wozu dient die Galle?","hinten":"Sie verteilt das Fett aus der Nahrung fein im Speisebrei, sodass die Verdauungsenzyme es besser angreifen können. Außerdem werden mit der Galle Abbauprodukte ausgeschieden."},{"typ":"karteikarte","quelle":["i-care S. 235"],"erklaerung":"","id":"leber-kk-ef44f8","vorne":"Was passiert mit den Gallensäuren, nachdem sie im Darm bei der Fettverdauung geholfen haben?","hinten":"Der größte Teil wird aus dem Darm wieder aufgenommen und gelangt über die Pfortader zurück zur Leber. Dort werden sie erneut für die Galle verwendet ([[enterohepatischer Kreislauf]])."},{"typ":"karteikarte","quelle":["i-care S. 235"],"erklaerung":"","id":"leber-kk-aaa509","vorne":"Was ist [[Bilirubin]]?","hinten":"Ein Abbauprodukt des roten Blutfarbstoffs. Es wird mit der Galle in den Darm abgegeben. Seine Abbauprodukte geben dem Stuhl die braune Farbe."},{"typ":"karteikarte","quelle":["i-care S. 235"],"erklaerung":"","id":"leber-kk-6bea69","vorne":"Was ist ein [[Ikterus]]?","hinten":"Eine gelbliche Verfärbung von Haut, Schleimhäuten und Augen. Sie entsteht, wenn Bilirubin nicht ausgeschieden wird und sich ablagert."},{"typ":"karteikarte","quelle":["i-care S. 236–237"],"erklaerung":"","id":"leber-kk-f8a5c7","vorne":"Welche Aufgaben hat die Gallenblase?","hinten":"Sie speichert einen Teil der Galle und entzieht ihr Wasser, sodass die Galle eindickt. Bei Bedarf gibt sie die Galle in das [[Duodenum]] ab."},{"typ":"karteikarte","quelle":["i-care S. 237"],"erklaerung":"","id":"leber-kk-c7ae94","vorne":"Wann entleert sich die Gallenblase?","hinten":"Wenn fettreicher Speisebrei in den Dünndarm gelangt. Dort wird ein Verdauungshormon (Cholecystokinin) ausgeschüttet, und die Gallenblase zieht sich zusammen."},{"typ":"karteikarte","quelle":["i-care S. 237","MKK S. 360"],"erklaerung":"","id":"leber-kk-d5e101","vorne":"Was ist eine [[Cholelithiasis]] und wie macht sie sich bemerkbar?","hinten":"Das Gallensteinleiden. Meist verursachen Gallensteine keine Beschwerden. Bleibt ein Stein in den Gallenwegen hängen, staut sich die Galle und es kommt zu krampfartigen Oberbauchschmerzen (Gallenkolik)."},{"typ":"karteikarte","quelle":["i-care S. 237"],"erklaerung":"","id":"leber-kk-e29191","vorne":"Warum sollen Patienten vor einem Ultraschall des Bauchs nüchtern sein?","hinten":"Ohne Nahrung findet keine Verdauung statt und die Galle wird in der Gallenblase gespeichert. Die gefüllte Gallenblase ist im Ultraschall besser zu sehen."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 224"],"erklaerung":"","id":"leber-op-aufgaben","operator":"beschreiben","afb":"I","fall":"Frau Abda bittet Robartina, in der nächsten Praxisanleitung kurz vorzustellen, wofür die Leber im Körper zuständig ist.","auftrag":"Beschreibe die Aufgaben der Leber.","mindestlaenge":250,"kriterien":["Ich nenne den Stoffwechsel der Kohlenhydrate, Eiweiße und Fette.","Ich nenne die Entgiftung, zum Beispiel von Ammoniak oder Medikamenten.","Ich nenne die Bildung der Galle.","Ich nenne die Bildung von Plasmaproteinen wie Albumin oder Gerinnungsfaktoren.","Ich nenne die Speicherfunktion, zum Beispiel für Glykogen, Vitamine oder Eisen."],"musterloesung":"Die Leber (Hepar) steht im Mittelpunkt des **Kohlenhydrat-, Eiweiß- und Fettstoffwechsels**, weil die im Darm aufgenommenen Nährstoffe (außer den Fetten) sie als erstes Organ erreichen. Sie **entgiftet** den Körper: Stoffe wie Ammoniak oder Medikamente wandelt sie so um, dass sie über die Niere oder die Galle ausgeschieden werden können. Sie **bildet die Galle** und ist damit an der Fettverdauung beteiligt. Außerdem bildet sie wichtige **Plasmaproteine** wie Albumin und die Gerinnungsfaktoren. Schließlich ist sie ein **Speicherorgan**, zum Beispiel für Glukose in Form von Glykogen, für Vitamine und für Eisen."},{"typ":"operator","quelle":["i-care S. 235, 237","MKK S. 370"],"erklaerung":"","id":"leber-op-ikterus","operator":"erläutern","afb":"II","fall":"Auf Robartinas Station liegt Herr T. Bei ihm hat sich ein Gallenstein im Gallengang eingeklemmt. Seine Haut und seine Augen sind gelb, sein Stuhl ist auffallend hell.","auftrag":"Erläutere, wie der eingeklemmte Gallenstein zur Gelbfärbung der Haut und zum hellen Stuhl führt.","mindestlaenge":300,"kriterien":["Ich erkläre, dass Bilirubin beim Abbau des roten Blutfarbstoffs entsteht.","Ich erkläre, dass die Leber das Bilirubin normalerweise mit der Galle in den Darm abgibt.","Ich erkläre, dass der Stein den Gallengang verschließt und sich die Galle staut.","Ich erkläre, dass das Bilirubin ins Blut übertritt und sich in Haut und Augen ablagert (Ikterus).","Ich erkläre, dass der Stuhl hell ist, weil kein Bilirubin mehr in den Darm gelangt."],"musterloesung":"Beim Abbau der roten Blutkörperchen wird der rote Blutfarbstoff frei, aus ihm entsteht **Bilirubin**. Die Leber gibt das Bilirubin normalerweise **mit der Galle in den Darm** ab. Dort wird es von Darmbakterien weiter abgebaut; die Abbauprodukte geben dem Stuhl seine braune Farbe. Bei Herrn T. **verschließt der Gallenstein den Gallengang**, die Galle staut sich zurück. Das Bilirubin tritt ins Blut über und lagert sich in Haut und Augen ab, sie färben sich gelb (**Ikterus**, hier ein Verschlussikterus). Weil kein Bilirubin mehr in den Darm gelangt, fehlen dort seine Abbauprodukte, und der **Stuhl ist hell** und entfärbt."},{"typ":"operator","quelle":["i-care S. 234, 236–237","MKK S. 361"],"erklaerung":"","id":"leber-op-ohne-gallenblase","operator":"beurteilen","afb":"III","fall":"Einer Patientin wurde wegen Gallensteinen die Gallenblase entfernt. Alaa meint: „Ohne Gallenblase hat sie doch keine Galle mehr. Dann darf sie nie wieder Fett essen.“","auftrag":"Beurteile Alaas Aussage.","mindestlaenge":300,"kriterien":["Ich stelle klar, dass die Leber die Galle bildet und nicht die Gallenblase.","Ich beschreibe, dass die Gallenblase die Galle nur speichert und eindickt.","Ich erkläre, dass die Galle auch ohne Gallenblase von der Leber direkt in den Zwölffingerdarm fließt.","Ich folgere, dass die Fettverdauung weiterhin möglich ist.","Ich komme zu einem begründeten Urteil über Alaas Aussage."],"musterloesung":"Alaas Aussage ist **nicht richtig**. Die Galle wird von den **Leberzellen gebildet**, und zwar unabhängig von der Nahrungsaufnahme. Die Gallenblase **speichert** nur einen Teil der Galle zwischen den Mahlzeiten und **dickt ihn ein**. Auch bei gesunden Menschen fließt ein Teil der Galle direkt von der Leber über den Gallengang in den Zwölffingerdarm. Nach der Entfernung der Gallenblase gelangt die Galle weiterhin auf diesem Weg in den Darm, die **Fettverdauung bleibt also möglich**. Es fehlt lediglich der Vorrat an eingedickter Galle, der sonst bei Bedarf abgegeben wird. Laut Buch können die meisten Menschen nach einer Übergangszeit auch ohne Gallenblase normal essen. Ein lebenslanges Fettverbot lässt sich damit nicht begründen."}],"status":"aktiv"},{"id":"verdauung","titel":"Verdauung der Nährstoffe","block":3,"nr":1,"organ":"","beschreibung":"Wie Enzyme Kohlenhydrate, Eiweiße und Fette zerlegen.","quellen":"i-care S. 197, 214, 223, 238–241; MKK S. 359, 361–362","icon":"enzym","farbe":"#3d8f74","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-staerke","frage":"Welches Enzym spaltet Stärke?","optionen":[{"text":"[[Amylase]]","richtig":true},{"text":"[[Pepsin]]","richtig":false},{"text":"[[Lipase]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-form","frage":"In welcher Form können Kohlenhydrate aufgenommen werden?","optionen":[{"text":"als Einfachzucker","richtig":true},{"text":"als Zweifachzucker","richtig":false},{"text":"als Vielfachzucker","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239"],"erklaerung":"Die Salzsäure des Magensafts verändert die Eiweiße. Der Hauptteil der Eiweißverdauung findet aber im Dünndarm statt.","id":"verdauung-sc-eiweiss-beginn","frage":"Wo beginnt die Eiweißverdauung?","optionen":[{"text":"im Magen","richtig":true},{"text":"in der Mundhöhle","richtig":false},{"text":"im Dickdarm","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-sc-eiweiss-haupt","frage":"Wo findet der Hauptteil der Eiweißverdauung statt?","optionen":[{"text":"im Dünndarm","richtig":true},{"text":"im Magen","richtig":false},{"text":"in der Mundhöhle","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-sc-fett-enzym","frage":"Welches Enzym spaltet Fette?","optionen":[{"text":"[[Lipase]]","richtig":true},{"text":"[[Amylase]]","richtig":false},{"text":"Laktase","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-sc-chylomikronen","frage":"Wie gelangen die meisten Fettbausteine in den Blutkreislauf?","optionen":[{"text":"über die Lymphe","richtig":true},{"text":"über die Galle","richtig":false},{"text":"über den Urin","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 359"],"erklaerung":"Die Gallenblase speichert und dickt die Galle nur ein.","id":"verdauung-sc-galle","frage":"Welches Organ bildet die Galle?","optionen":[{"text":"die Leber","richtig":true},{"text":"die Gallenblase","richtig":false},{"text":"der Magen","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-sc-pankreassaft","frage":"Wie ist der Pankreassaft beschaffen?","optionen":[{"text":"basisch – er neutralisiert den sauren Speisebrei","richtig":true},{"text":"sehr sauer – wie der Magensaft","richtig":false},{"text":"fettig – wie die Galle","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-sc-laktose","frage":"Welches Enzym fehlt bei einer Laktoseintoleranz?","optionen":[{"text":"Laktase","richtig":true},{"text":"Amylase","richtig":false},{"text":"Lipase","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-sc-leber","frage":"Wohin gelangen Einfachzucker und Aminosäuren zuerst, nachdem sie aufgenommen wurden?","optionen":[{"text":"über die Pfortader zur Leber","richtig":true},{"text":"direkt ins Gehirn","richtig":false},{"text":"in den Dickdarm","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-mundamylase","frage":"Welche Bedeutung hat die Stärkeverdauung im Mund?","optionen":[{"text":"Sie beginnt dort, spielt aber insgesamt nur eine kleine Rolle.","richtig":true},{"text":"Dort wird die gesamte Stärke verdaut.","richtig":false},{"text":"Im Mund wird keine Stärke gespalten.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-sc-staerke-haeufig","frage":"In welcher Form kommen Kohlenhydrate in der Nahrung am häufigsten vor?","optionen":[{"text":"als Stärke","richtig":true},{"text":"als Milchzucker","richtig":false},{"text":"als Traubenzucker","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 209, 223"],"erklaerung":"","id":"verdauung-mc-eiweiss-enzyme","frage":"Welche Enzyme spalten Eiweiße?","optionen":[{"text":"Pepsin","richtig":true},{"text":"Trypsin","richtig":true},{"text":"Amylase","richtig":false},{"text":"Lipase","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-mc-zucker-enzyme","frage":"Welche Enzyme spalten Zucker?","optionen":[{"text":"Amylase","richtig":true},{"text":"Laktase","richtig":true},{"text":"Maltase","richtig":true},{"text":"Pepsin","richtig":false},{"text":"Lipase","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-mc-emulgierung","frage":"Was hilft, Fette fein zu verteilen?","optionen":[{"text":"das Kauen","richtig":true},{"text":"die Bewegungen von Magen und Darm","richtig":true},{"text":"die Gallensäuren","richtig":true},{"text":"die Salzsäure","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 239–240"],"erklaerung":"Chylomikronen gelangen über die Lymphe in den Blutkreislauf.","id":"verdauung-mc-pfortader","frage":"Welche Stoffe gelangen nach der Aufnahme über die Pfortader zur Leber?","optionen":[{"text":"Einfachzucker","richtig":true},{"text":"Aminosäuren","richtig":true},{"text":"Chylomikronen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-mc-laktose","frage":"Welche Beschwerden können bei einer Laktoseintoleranz auftreten?","optionen":[{"text":"Blähungen","richtig":true},{"text":"Bauchschmerzen","richtig":true},{"text":"Durchfall","richtig":true},{"text":"Fieber","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-mc-pankreassaft","frage":"Welche Aussagen zum Pankreassaft stimmen?","optionen":[{"text":"Er enthält Enzyme für Eiweiße, Kohlenhydrate und Fette.","richtig":true},{"text":"Er neutralisiert den sauren Speisebrei.","richtig":true},{"text":"Er wird in der Gallenblase gespeichert.","richtig":false},{"text":"Er enthält Salzsäure.","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 238–240"],"erklaerung":"","id":"verdauung-zu-enzym","frage":"Ordne jedem Enzym zu, was es spaltet.","paare":[{"links":"[[Amylase]]","rechts":"Stärke"},{"links":"[[Pepsin]]","rechts":"Eiweiße"},{"links":"[[Lipase]]","rechts":"Fette"},{"links":"Laktase","rechts":"Milchzucker"}]},{"typ":"zuordnung","quelle":["i-care S. 214"],"erklaerung":"","id":"verdauung-zu-bausteine","frage":"Ordne jedem Nährstoff die Bausteine zu, die am Ende der Verdauung entstehen.","paare":[{"links":"Kohlenhydrate","rechts":"Einfachzucker"},{"links":"Eiweiße","rechts":"Aminosäuren"},{"links":"Fette","rechts":"Fettsäuren"}]},{"typ":"zuordnung","quelle":["i-care S. 188, 209"],"erklaerung":"","id":"verdauung-zu-organe","frage":"Ordne jedem Verdauungssaft das Organ zu, das ihn bildet.","paare":[{"links":"Speichel","rechts":"Speicheldrüsen"},{"links":"Magensaft","rechts":"Magen"},{"links":"Pankreassaft","rechts":"Bauchspeicheldrüse"},{"links":"Galle","rechts":"Leber"}]},{"typ":"reihenfolge","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-rf-staerke","frage":"Bring die Schritte der Stärkeverdauung in die richtige Reihenfolge.","schritte":["Die Amylase im Speichel beginnt, Stärke zu spalten.","Die Amylase des Pankreassafts spaltet die Stärke im Dünndarm in Zweifachzucker.","Enzyme der Darmschleimhaut spalten die Zweifachzucker in Einfachzucker.","Die Einfachzucker gelangen mit dem Pfortaderblut zur Leber."]},{"typ":"reihenfolge","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-rf-eiweiss","frage":"Bring die Schritte der Eiweißverdauung in die richtige Reihenfolge.","schritte":["Die Salzsäure des Magens verändert die Struktur der Eiweiße.","Pepsin beginnt im Magen, die Eiweiße zu spalten.","Enzyme aus dem Pankreas spalten die Eiweiße im Dünndarm weiter.","Die Aminosäuren gelangen über die Pfortader zur Leber."]},{"typ":"reihenfolge","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-rf-fett","frage":"Bring die Schritte der Fettverdauung in die richtige Reihenfolge.","schritte":["Kauen und Magenbewegungen verteilen die Fette.","Gallensäuren verteilen die Fette im Dünndarm noch feiner.","Die Lipase aus dem Pankreas spaltet die Fette.","Die Fettbausteine gelangen in Chylomikronen über die Lymphe ins Blut."]},{"typ":"lückentext","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-lt-zucker","text":"Stärke wird von der {{Amylase}} gespalten. Kohlenhydrate können nur als {{Einfachzucker|Monosaccharide}} aufgenommen werden."},{"typ":"lückentext","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-lt-eiweiss","text":"Im Magen verändert die {{Salzsäure|HCl}} die Struktur der Eiweiße. Danach beginnt das Enzym {{Pepsin}}, die Eiweiße zu spalten."},{"typ":"lückentext","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-lt-fett","text":"Fette werden vom Enzym {{Lipase}} gespalten. Die {{Galle|Gallensäuren}} hilft dabei, die Fette fein zu verteilen."}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-b0809e","vorne":"In welcher Form können Kohlenhydrate vom Darm aufgenommen werden?","hinten":"Nur als Einfachzucker ([[Monosaccharide]]), z. B. Glukose."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-7ff157","vorne":"In welcher Form kommen Kohlenhydrate in der Nahrung am häufigsten vor?","hinten":"Als Stärke, einem Vielfachzucker."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-11c49f","vorne":"Welches Enzym spaltet Stärke, und wo kommt es vor?","hinten":"Die [[Amylase]]. Sie kommt im Mundspeichel und im Pankreassaft vor. Die Amylase des Pankreassafts ist wichtiger."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"verdauung-kk-11844a","vorne":"Was spaltet die Laktase?","hinten":"[[Laktose]] (Milchzucker) in Einfachzucker."},{"typ":"karteikarte","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-kk-0179bc","vorne":"Was passiert bei einer Laktoseintoleranz?","hinten":"Es wird zu wenig Laktase gebildet. Der Milchzucker gelangt unverdaut in den Dickdarm und wird dort von Bakterien abgebaut. Das kann Blähungen, Bauchschmerzen und Durchfall verursachen."},{"typ":"karteikarte","quelle":["i-care S. 239"],"erklaerung":"","id":"verdauung-kk-7b4d86","vorne":"Was ist der erste Schritt der Eiweißverdauung?","hinten":"Die Salzsäure im Magen verändert die Struktur der Eiweiße ([[Denaturierung]])."},{"typ":"karteikarte","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-kk-ca3ca7","vorne":"Wo findet der Hauptteil der Eiweißverdauung statt?","hinten":"Im Dünndarm, mithilfe der eiweißspaltenden Enzyme ([[Proteasen]]) aus dem Pankreassaft."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-f6a852","vorne":"Welche Bausteine entstehen am Ende der Eiweißverdauung?","hinten":"Aminosäuren (und sehr kurze Ketten aus zwei oder drei Aminosäuren)."},{"typ":"karteikarte","quelle":["i-care S. 223","MKK S. 359"],"erklaerung":"","id":"verdauung-kk-ce852f","vorne":"Warum bildet das Pankreas seine eiweißspaltenden Enzyme zunächst als inaktive Vorstufen?","hinten":"Damit sich die Bauchspeicheldrüse nicht selbst verdaut. Erst im Dünndarm werden die Enzyme aktiv."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-372423","vorne":"Warum müssen Fette fein verteilt (emulgiert) werden?","hinten":"Fette sind nicht wasserlöslich und klumpen zusammen. Dann erreichen die Enzyme sie nur schlecht."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-25b028","vorne":"Welche Lipase ist für die Fettverdauung wichtiger – die des Magens oder die des Pankreas?","hinten":"Die [[Lipase]] aus dem Pankreas. Die Magenlipase spaltet nur einen kleinen Teil der Fette."},{"typ":"karteikarte","quelle":["i-care S. 240","MKK S. 359"],"erklaerung":"","id":"verdauung-kk-209fb6","vorne":"Welche Rolle spielen die Gallensäuren bei der Fettverdauung?","hinten":"Sie legen sich um die Fetttröpfchen, verteilen das Fett fein und verpacken die Fettbausteine in [[Mizellen]]. So können die Fette verdaut und aufgenommen werden."},{"typ":"karteikarte","quelle":["MKK S. 359"],"erklaerung":"","id":"verdauung-kk-c62d2a","vorne":"Wo wird die Galle gebildet und wo gespeichert?","hinten":"Die Leber bildet die Galle. In der Gallenblase wird sie gespeichert und eingedickt."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-51ffaa","vorne":"Wie gelangen die meisten Fettbausteine ins Blut?","hinten":"In den Darmzellen werden sie zu Fett-Eiweiß-Tröpfchen ([[Chylomikronen]]) verpackt und über die Lymphe in den Blutkreislauf transportiert."},{"typ":"karteikarte","quelle":["i-care S. 239–240"],"erklaerung":"","id":"verdauung-kk-85db0a","vorne":"Wie gelangen Einfachzucker und Aminosäuren nach der Aufnahme weiter?","hinten":"Mit dem Blut der Pfortader direkt zur Leber."},{"typ":"karteikarte","quelle":["i-care S. 240"],"erklaerung":"","id":"verdauung-kk-efa544","vorne":"Was ist der Unterschied zwischen [[Chymus]] und [[Chylus]]?","hinten":"Chymus ist der Speisebrei, Chylus die fetthaltige Lymphe."},{"typ":"karteikarte","quelle":["i-care S. 223"],"erklaerung":"","id":"verdauung-kk-aaf287","vorne":"Warum ist der Pankreassaft basisch?","hinten":"Er enthält Bikarbonat. So wird der saure Speisebrei aus dem Magen im Dünndarm neutralisiert."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"verdauung-kk-96cb94","vorne":"Wo wird der Speisebrei mit Pankreassaft und Galle vermischt?","hinten":"Im Zwölffingerdarm ([[Duodenum]])."},{"typ":"karteikarte","quelle":["i-care S. 197"],"erklaerung":"","id":"verdauung-kk-604c53","vorne":"Warum schmeckt Brot süßlich, wenn man es lange kaut?","hinten":"Die [[Amylase]] im Speichel spaltet Malzzucker (Maltose) von der Stärke im Brot ab."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"verdauung-kk-58c7d0","vorne":"Was geschieht mit Ballaststoffen im Dünndarm?","hinten":"Sie können dort nicht verdaut werden und gelangen weiter in den Dickdarm."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-op-pommes","operator":"beschreiben","afb":"I","fall":"Robartina isst in der Mittagspause Pommes und trinkt eine Cola. Alaa fragt: „Was passiert eigentlich mit der Stärke aus den Kartoffeln in deinem Körper?“","auftrag":"Beschreibe, wie die Stärke aus den Pommes verdaut und aufgenommen wird.","mindestlaenge":300,"kriterien":["Ich beschreibe, dass die Amylase im Mund beginnt, die Stärke zu spalten.","Ich beschreibe, dass die Amylase des Pankreassafts im Dünndarm den Hauptteil übernimmt.","Ich beschreibe, dass Enzyme der Darmschleimhaut die Zweifachzucker in Einfachzucker spalten.","Ich beschreibe den Weg der Einfachzucker über das Pfortaderblut zur Leber."],"musterloesung":"**Stärke** ist ein Vielfachzucker. Die **Amylase** des Mundspeichels beginnt, sie zu spalten; wichtiger ist aber die Amylase des **Pankreassafts** im Dünndarm. Sie spaltet die Stärke in den Zweifachzucker Maltose. Enzyme am **Bürstensaum** der Dünndarmschleimhaut spalten die Maltose in **Glukose**, einen Einfachzucker. Die Einfachzucker werden in die Darmzellen aufgenommen und gelangen mit dem **Pfortaderblut** direkt zur **Leber**."},{"typ":"operator","quelle":["i-care S. 240","MKK S. 359, 362"],"erklaerung":"","id":"verdauung-op-galle","operator":"erläutern","afb":"II","fall":"Ein Patient auf Robartinas Station hat eine Abflussstörung der Galle. Frau Abda erklärt, dass bei ihm Fettstühle auftreten können. Robartina fragt nach: „Was hat die Galle denn mit dem Fett im Stuhl zu tun?“","auftrag":"Erläutere, warum die Galle für die Fettverdauung wichtig ist und warum ein Mangel an Galle zu Fettstühlen führen kann.","mindestlaenge":350,"kriterien":["Ich erkläre, dass Fette nicht wasserlöslich sind und zusammenklumpen.","Ich erkläre, dass die Gallensäuren die Fette fein verteilen.","Ich erkläre, dass die Lipasen die Fette dadurch besser spalten können.","Ich leite ab, dass bei Gallenmangel Fett schlechter verdaut wird und mit dem Stuhl ausgeschieden wird."],"musterloesung":"Fette sind **nicht wasserlöslich** und klumpen zusammen. Dort erreichen die Verdauungsenzyme sie nur schlecht. Die **Gallensäuren** verbinden sich sowohl mit Wasser als auch mit Fett und verteilen die Fette deshalb sehr fein. Dabei entstehen winzige Teilchen (**Mizellen**). So können die fettspaltenden **Lipasen** gut angreifen, und die Fettbausteine können von der Darmschleimhaut aufgenommen werden. Fehlt die Galle, z. B. bei einer Abflussstörung, werden die Fette schlechter verdaut und aufgenommen. Das Fett bleibt im Darm und wird mit dem Stuhl ausgeschieden – es entstehen **Fettstühle**."},{"typ":"operator","quelle":["i-care S. 238–239"],"erklaerung":"","id":"verdauung-op-laktose","operator":"beurteilen","afb":"III","fall":"Alaa hat nach Milchprodukten oft Blähungen und Bauchschmerzen. Beim Arzt wurde eine Laktoseintoleranz festgestellt. Er sagt zu Robartina: „Dann darf ich ab jetzt nie wieder irgendein Milchprodukt essen.“","auftrag":"Beurteile Alaas Aussage auf der Grundlage der Informationen im Buch.","mindestlaenge":350,"kriterien":["Ich erkläre die Ursache der Laktoseintoleranz (zu wenig Laktase).","Ich erkläre, warum Beschwerden entstehen (Milchzucker gelangt unverdaut in den Dickdarm).","Ich nenne lange gereiften Käse sowie Schaf- und Ziegenmilch als besser verträglich.","Ich komme zu einem begründeten Urteil über Alaas Aussage."],"musterloesung":"Bei einer Laktoseintoleranz wird zu wenig oder **keine Laktase** gebildet. Der Milchzucker (Laktose) kann deshalb nicht gespalten werden. Er gelangt **unverdaut in den Dickdarm** und wird dort von Bakterien abgebaut. Das verursacht Blähungen, Bauchschmerzen und Durchfall. Laut Buch müssen Betroffene aber **nicht komplett auf Milchprodukte verzichten**: **Lange gereifter Käse** enthält meist keinen oder nur wenig Milchzucker, und **Schaf- und Ziegenmilch** sind oft besser verträglich als Kuhmilch. **Urteil:** Alaas Aussage ist zu streng. Er sollte laktosereiche Produkte meiden, kann aber laktosearme Milchprodukte oft vertragen."}],"status":"aktiv"},{"id":"crohn","titel":"Morbus Crohn","block":4,"nr":1,"organ":"duenndarm, dickdarm","beschreibung":"Chronisch-entzündliche Darmerkrankung.","quellen":"MKK S. 366","icon":"darm","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"adipositas","titel":"Adipositas","block":4,"nr":2,"organ":"naehrstoffe","beschreibung":"Übergewicht und Body-Mass-Index.","quellen":"i-care S. 244–247","icon":"ernaehrung","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"hepatitis","titel":"Hepatitis","block":4,"nr":3,"organ":"leber","beschreibung":"Entzündung der Leber.","quellen":"MKK S. 371; i-care S. 229–231","icon":"leber","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"diabetes","titel":"Diabetes mellitus","block":4,"nr":4,"organ":"pankreas","beschreibung":"Zuckerkrankheit.","quellen":"MKK S. 367; i-care S. 223, 231","icon":"pankreas","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"leberzirrhose","titel":"Leberzirrhose","block":4,"nr":5,"organ":"leber","beschreibung":"Der narbige Umbau der Leber.","quellen":"MKK S. 371–372; i-care S. 228","icon":"leber","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"pankreatitis","titel":"Pankreatitis","block":4,"nr":6,"organ":"pankreas","beschreibung":"Entzündung der Bauchspeicheldrüse.","quellen":"MKK S. 367; i-care S. 222","icon":"pankreas","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"},{"id":"magenkarzinom","titel":"Magenkarzinom","block":4,"nr":7,"organ":"magen","beschreibung":"Bösartiger Tumor des Magens.","quellen":"MKK S. 356–357","icon":"magen","farbe":"#6C887C","aufgaben":[],"karten":[],"operatoren":[],"status":"vorbereitung"}],"bilder":{},"spiele":{"enzym":{"modul":"verdauung","einleitung":"Du bist ein Verdauungsenzym! Lebensmittel fliegen kreuz und quer über den Bildschirm. Überlege bei jedem: Steckt darin etwas, das du spalten kannst? Dann tippe es an. Wähle zuerst dein Enzym.","enzyme":[{"name":"Amylase","id":"amylase","ort":"Mundspeichel und Pankreassaft","info":"Spaltet Stärke.","quelle":["MKK S. 361, 362","i-care S. 197, 238, 243, 249"],"spaltet":[{"links":"🥔 Kartoffeln","rechts":"Kartoffeln enthalten Stärke. Die Amylase spaltet sie in Malzzucker (Maltose)."},{"links":"🍚 Reis","rechts":"Reis enthält Stärke. Die Amylase spaltet sie in Malzzucker (Maltose)."},{"links":"🍞 Brot","rechts":"Brot enthält Stärke. Deshalb schmeckt es beim langen Kauen süßlich: Die Amylase spaltet Malzzucker ab."}],"nicht":[{"links":"🧈 Butter","rechts":"Butter liefert Fett – das spaltet nicht die Amylase, sondern die Lipase."},{"links":"🫒 Öl","rechts":"Öl liefert Fett – das spaltet nicht die Amylase, sondern die Lipase."},{"links":"🥩 Fleisch","rechts":"Fleisch liefert vor allem Eiweiß – das spalten Pepsin und Trypsin."},{"links":"🥤 Cola","rechts":"Cola enthält Kristallzucker (Saccharose), aber keine Stärke. Den Zucker spaltet die Saccharase."},{"links":"🥛 Milch","rechts":"Milch enthält Milchzucker (Laktose), aber keine Stärke. Den Milchzucker spaltet die Laktase."}]},{"name":"Pepsin","id":"pepsin","ort":"Magen","info":"
