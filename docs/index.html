<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2A473B">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'">
<title>Verdauung lernen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232A473B'/%3E%3Cpath d='M11 9c6-2 11 1 10 6s-8 3-8 8 5 2 8 1' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Farben und Schriften im PEBK-Design (Paul-Ehrlich-Berufskolleg Dortmund).
   Quelle der Werte: offizielle PEBK-PowerPoint-Vorlage (Theme) und Logo.
     Dunkelgrün #2A473B · Mittelgrün #4DAF8E · Hellgrün #CCE4D8 · Graugrün #6C887C · Logo-Grün #1BA57E
     Schrift: Calibri (auf Geräten ohne Calibri: Carlito bzw. Systemschrift) */
:root{
  --bg:#f2f6f4; --surface:#ffffff; --surface-2:#eaf2ee; --line:#cddbd4;
  --fg:#0f1a15; --muted:#4d6157; --accent:#2A473B; --accent-fg:#ffffff; --accent-soft:#CCE4D8; --akzent2:#1BA57E;
  --kopf-bg:#2A473B; --kopf-fg:#ffffff;
  --ok:#17784e; --ok-soft:#dcf1e6; --bad:#b3312f; --bad-soft:#f8dfdf; --info-soft:#e2ecfa;
  --pebk1:#CFE6DA; --pebk2:#BBDDCD; --pebk3:#62B799; --pebk4:#1BA57E;
  --shadow:0 1px 2px rgba(15,26,21,.06),0 6px 20px rgba(15,26,21,.07);
  --f-display:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:14px; --leiste-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1511; --surface:#14211b; --surface-2:#1a2b23; --line:#2b4136;
  --fg:#e8f1ec; --muted:#9db3a8; --accent:#4DAF8E; --accent-fg:#09110E; --accent-soft:#21392e; --akzent2:#4DAF8E;
  --kopf-bg:#1b2f27; --kopf-fg:#ffffff;
  --ok:#5fd09b; --ok-soft:#173a2b; --bad:#ef6b6b; --bad-soft:#3a1d1f; --info-soft:#1a2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1511; --surface:#14211b; --surface-2:#1a2b23; --line:#2b4136;
  --fg:#e8f1ec; --muted:#9db3a8; --accent:#4DAF8E; --accent-fg:#09110E; --accent-soft:#21392e; --akzent2:#4DAF8E;
  --kopf-bg:#1b2f27; --kopf-fg:#ffffff;
  --ok:#5fd09b; --ok-soft:#173a2b; --bad:#ef6b6b; --bad-soft:#3a1d1f; --info-soft:#1a2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.5;
  padding-bottom:calc(var(--leiste-h) + env(safe-area-inset-bottom) + 24px)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,5.5vw,2.6rem)}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.muted{color:var(--muted)}
.klein{font-size:.88rem}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.stapel{display:flex;flex-direction:column;gap:14px}
.reihe{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reihe.zw{justify-content:space-between}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* Kopf, Hauptbereich, untere Navigationsleiste */
.kopf{position:sticky;top:0;z-index:20;background:var(--kopf-bg);color:var(--kopf-fg);border-bottom:3px solid var(--pebk4)}
.kopf-innen{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-decoration:none;margin-right:auto;color:var(--kopf-fg);min-width:0}
.logo span{color:var(--pebk2);margin-left:.25em}
.logo img{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px 6px;flex:none}
.kopf .rang-chip .xpz{color:var(--pebk2)}
.kopf .icon-btn{background:transparent;border-color:rgba(255,255,255,.35);color:var(--kopf-fg)}
.kopf :focus-visible{outline-color:#fff}
.rang-chip{display:flex;align-items:center;gap:8px;font-size:.85rem;min-width:0}
.rang-chip b{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.rang-chip .xpz{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

main:focus,main:focus-visible{outline:none}
main{max-width:980px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:24px;outline:none}

.leiste{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(var(--leiste-h) + env(safe-area-inset-bottom))}
.leiste a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--muted)}
.leiste a[aria-current="page"]{color:var(--accent)}
.leiste .ni svg{width:24px;height:24px}
@media (min-width:900px){
  body{padding-bottom:24px}
  .leiste{position:sticky;top:63px;bottom:auto;height:auto;max-width:980px;margin:0 auto;display:flex;gap:4px;background:var(--bg);border:0;padding:8px 16px;z-index:19}
  .leiste a{flex-direction:row;gap:8px;padding:8px 14px;border-radius:10px;font-size:.95rem}
  .leiste a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
  .leiste .ni svg{width:20px;height:20px}
}
@media (max-width:440px){
  .logo{font-size:1.05rem}
  .logo span{display:none}
  .logo img{height:30px}
  .rang-chip b{max-width:none;font-size:.95rem}
  .rang-chip .xpz{display:none}
}

/* Wiederverwendbare Bausteine */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:.55rem 1rem;font-weight:600;text-decoration:none;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primaer{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primaer:hover{filter:brightness(1.07)}
.btn.gefahr{color:var(--bad);border-color:var(--bad)}
.btn.klein{min-height:36px;padding:.3rem .75rem;font-size:.9rem}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,3vw,24px);box-shadow:var(--shadow)}
.karte.flach{box-shadow:none}
.hinweis{border-radius:12px;padding:12px 14px;background:var(--info-soft);font-size:.95rem}
.hinweis.gold{background:var(--accent-soft)}
.hinweis.ok{background:var(--ok-soft)}
.hinweis.nein{background:var(--bad-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:.18rem .6rem;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--fg)}
.chip.gold{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
.chip svg{width:14px;height:14px}

.balken{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.balken i{display:block;height:100%;background:var(--akzent2);border-radius:99px;transition:width .6s ease}

/* Kopf einer Seite */
.seitenkopf{display:flex;flex-direction:column;gap:6px}
.zurueck{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--muted);text-decoration:none;font-size:.95rem;width:max-content}
.zurueck svg{width:18px;height:18px}

/* Rangkarte auf der Startseite */
.rangkarte{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.rangkarte .stufe{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.rangkarte .balken{grid-column:1/-1}

/* Blöcke und Modulkarten */
.block-kopf{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.module{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.modul{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0}
a.modul:hover{border-color:var(--accent)}
.modul.zu{opacity:.6;border-style:dashed;background:transparent}
.modul .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.modul .ic svg{width:26px;height:26px}
.modul h3{font-size:1.12rem}
.modul .fuss{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Übungsmodi auf der Modulseite */
.modi{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.modus{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none}
.modus:hover{border-color:var(--accent)}
.modus svg{width:26px;height:26px;flex:none;color:var(--accent)}
.modus b{display:block;font-family:var(--f-display);font-size:1.08rem}
.modus span{font-size:.88rem;color:var(--muted)}

/* Fachbegriffe */
.begriff{border:0;background:none;padding:0;font-weight:600;text-decoration:underline dotted 2px;text-underline-offset:3px;color:inherit;cursor:help}
.begriff:hover{color:var(--accent)}
.lies{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.lies svg{width:16px;height:16px;flex:none}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--fg);max-width:min(560px,calc(100vw - 32px));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog .d-innen{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow:auto}
dialog .d-kopf{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

/* Formulare */
.feld{display:flex;flex-direction:column;gap:6px}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%;min-height:44px}
textarea{min-height:200px;resize:vertical;line-height:1.55}
.wahl{display:grid;gap:10px}
.wahl label{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;background:var(--surface-2);cursor:pointer}
.wahl input{width:20px;height:20px;accent-color:var(--accent)}

/* Tabelle (Nachweis) */
table.liste{width:100%;border-collapse:collapse;font-size:.95rem}
table.liste th,table.liste td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.liste th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pruefcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;letter-spacing:.12em;font-weight:700}

/* PEBK-Motiv: vier Parallelogramme wie im Logo, über jeder Seitenüberschrift */
.seitenkopf::before{content:"";display:block;width:92px;height:12px;margin-bottom:4px;transform:skewX(-32deg);transform-origin:left bottom;
  background:linear-gradient(90deg,var(--pebk1) 0 22%,transparent 22% 26%,var(--pebk2) 26% 48%,transparent 48% 52%,var(--pebk3) 52% 74%,transparent 74% 78%,var(--pebk4) 78% 100%)}
.seitenkopf:has(.zurueck)::before{display:none}

/* Award-Wand, Plaketten, Feier-Animation, Glossar */
.wand{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.award{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.award:hover{background:var(--surface-2)}
.award .plakette{width:88px;height:88px;transition:transform .25s ease}
.award:hover .plakette{transform:scale(1.05) rotate(-3deg)}
.award.zu .plakette{filter:grayscale(1) brightness(.8);opacity:.38}
.award .schloss{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.award .schloss svg{width:16px;height:16px}
.award .n{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15}
.award .d{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{width:70%;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.mini i{display:block;height:100%;background:var(--muted)}

.feier{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.plakette.gross{width:150px;height:150px}
.plakette.grau{filter:grayscale(1);opacity:.5}
.feier .fakt{max-width:44ch}
dialog[open] .feier .plakette.gross:not(.grau){animation:plakette-rein .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes plakette-rein{
  0%{transform:scale(.2) rotate(-40deg);opacity:0;filter:drop-shadow(0 0 0 transparent)}
  60%{transform:scale(1.12) rotate(6deg);opacity:1;filter:drop-shadow(0 0 18px var(--accent))}
  100%{transform:scale(1) rotate(0);filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
}
@media (prefers-reduced-motion: reduce){
  dialog[open] .feier .plakette.gross:not(.grau){animation:plakette-sanft .4s ease both}
  @keyframes plakette-sanft{from{opacity:0}to{opacity:1}}
}

.glossar{margin:0;display:grid;gap:10px}
.g-eintrag{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.g-eintrag dt{font-weight:700}
.g-eintrag dd{margin:4px 0 0;display:flex;flex-direction:column;gap:4px}

@media print{.nachweis{display:none}.nachweis-druck::after{content:"Der Nachweis wird nur auf dem Bildschirm angezeigt."}}

/* Rangaufstieg */
.rang-feier{padding:8px 0 4px}
.rangmarke{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 30% 25%,#4DAF8E,#1BA57E 45%,#2A473B);
  box-shadow:0 0 0 6px var(--accent-soft),0 10px 24px rgba(0,0,0,.28)}
.rangmarke svg{width:68px;height:68px;stroke-width:1.6}
.rang-feier .rangname{font-family:var(--f-display);font-size:clamp(2rem,9vw,2.9rem);font-weight:800;line-height:1.05;margin:0;
  overflow-wrap:anywhere;hyphens:auto}
dialog[open] .rang-feier .rangmarke{animation:plakette-rein .9s cubic-bezier(.2,1.4,.4,1) both}
dialog[open] .rang-feier .rangname{animation:rang-plopp .7s cubic-bezier(.2,1.6,.4,1) .25s both}
@keyframes rang-plopp{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  dialog[open] .rang-feier .rangmarke,dialog[open] .rang-feier .rangname{animation:plakette-sanft .4s ease both}
}

/* Aufgaben: Auswahl, Zuordnung, Reihenfolge, Lückentext, Rückmeldung, Karteikarten, Quiz */
.aufgabe{max-width:760px;width:100%;margin:0 auto}
.frage{font-size:1.15rem;font-weight:600;max-width:62ch}
.kennung{display:block;font-size:.85rem;font-weight:700;color:var(--accent);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
fieldset.optionen{border:0;padding:0;margin:0;display:grid;gap:8px}
fieldset.optionen legend{padding:0;margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.75rem .9rem;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{width:20px;height:20px;margin-top:.15rem;flex:none;accent-color:var(--accent)}

/* Markierung nach dem Prüfen: Farbe UND Symbol */
.richtig{background:var(--ok-soft)!important;border-color:var(--ok)!important}
.falsch{background:var(--bad-soft)!important;border-color:var(--bad)!important}
.fehlt{border-color:var(--ok)!important;border-style:dashed!important}
.opt.richtig::after,.zrow.richtig::after,.reihenfolge li.richtig::after{content:"✓";margin-left:auto;font-weight:800;color:var(--ok)}
.opt.falsch::after,.zrow.falsch::after,.reihenfolge li.falsch::after{content:"✗";margin-left:auto;font-weight:800;color:var(--bad)}
.opt.fehlt::after{content:"fehlt";margin-left:auto;font-size:.8rem;font-weight:700;color:var(--ok)}

.zuordnung{display:grid;gap:8px}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.55rem .8rem}
.zrow label{font-weight:600}
@media (max-width:540px){.zrow{grid-template-columns:1fr auto}.zrow select{grid-column:1}}

.reihenfolge{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reihenfolge li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.45rem .5rem .45rem .8rem}
.reihenfolge li:focus-visible{outline:3px solid var(--accent)}
.reihenfolge .nr{font-family:var(--f-display);font-weight:700;color:var(--muted);width:1.3rem;font-variant-numeric:tabular-nums}
.reihenfolge .t{flex:1;min-width:0}
.reihenfolge .icon-btn{width:40px;height:40px}
.reihenfolge .icon-btn:disabled{opacity:.3}

.lueckentext{line-height:2.4;font-size:1.05rem}
.luecke{display:inline-block;width:auto;min-height:38px;padding:.2rem .5rem;margin:0 .15rem;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);max-width:100%}
.korrektur{font-weight:700;color:var(--ok)}

.rueck{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rueck.ok{background:var(--ok-soft)}
.rueck.nein{background:var(--bad-soft)}
.rueck > b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.2rem}
.rueck > b svg{width:22px;height:22px}
.loesung{margin:0;padding-left:1.3rem}

.ergebnis{align-items:flex-start}
.prozent{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1}
.prozent.ok{color:var(--ok)}
.prozent.nein{color:var(--bad)}
.wiederholen{margin:0;padding-left:1.2rem;display:grid;gap:10px}

/* Karteikarten */
.faecher{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fach{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;display:flex;flex-direction:column}
.fach b{font-family:var(--f-display);font-size:1.3rem}
.kk{max-width:640px;width:100%;margin:0 auto}
.kk-text{font-size:1.15rem}
.kk-hinten{border-top:1px dashed var(--line);padding-top:12px}

/* Quiz auf Zeit */
.quiz-opts{display:grid;gap:8px;margin-top:10px}
.opt-btn{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.8rem 1rem;font-weight:500;min-height:48px}
.opt-btn:hover:not(:disabled){border-color:var(--accent)}
.opt-btn:disabled{cursor:default}
.aufstieg .stufe{font-family:var(--f-display);font-size:1.6rem;font-weight:700}

/* Operatoraufgaben, Fallarbeit, Spiele, Bildzuordnung */
.fall{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-style:italic;max-width:70ch;display:flex;flex-direction:column;gap:8px}
.fall .eyebrow{font-style:normal}
.auftrag{display:flex;flex-direction:column;gap:4px}
.muster{background:var(--info-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#datenschutz-op{display:inline-flex;gap:6px;align-items:center}
#datenschutz-op svg{width:16px;height:16px;flex:none}

/* Fehlerfahndung */
.bericht{background:var(--surface-2);border-radius:12px;padding:14px;line-height:1.9}
.satz{display:inline;border:0;background:none;padding:2px 3px;border-radius:6px;text-align:left;line-height:1.9;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.satz:hover:not(:disabled){background:var(--accent-soft)}
.satz[aria-pressed="true"]{background:var(--accent-soft);outline:2px solid var(--accent)}
.satz.richtig,.satz.falsch,.satz.fehlt{outline:2px solid}
.satz.fehlt{background:var(--ok-soft);outline-style:dashed;outline-color:var(--ok)}
.satz:disabled{cursor:default;color:inherit}
mark{background:var(--accent-soft);color:inherit;padding:0 3px;border-radius:4px}
.korr{margin-top:6px}

/* Diagnose */
.hinweise{margin:0;padding-left:1.3rem;display:grid;gap:8px}
.hinweise li{background:var(--surface-2);border-radius:10px;padding:8px 10px}

/* Enzym-Spiel */
.spielfeld{position:relative;height:min(58vh,440px);min-height:300px;background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.teil{position:absolute;transform:translateY(-50%);white-space:nowrap;border:2px solid var(--accent);background:var(--surface);color:var(--fg);
  border-radius:999px;padding:.5rem .95rem;font-weight:700;min-height:44px;box-shadow:var(--shadow)}
.teil:hover{background:var(--accent-soft)}
.teil.neu{animation:teil-rein .35s ease both}
.teil.geht{opacity:0;transition:opacity .6s ease}
@keyframes teil-rein{from{opacity:0;transform:translateY(-50%) scale(.6)}to{opacity:1;transform:translateY(-50%) scale(1)}}
.teil{font-size:1.05rem}
.teil.weg{transform:translateY(-50%) scale(.2);opacity:0;transition:transform .25s ease,opacity .25s ease}
.teil.falsch{border-color:var(--bad)}
.spielfeld.ruhig{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;padding:14px;height:auto;min-height:200px}
.spielfeld.ruhig .teil{position:static;transform:none}

/* Brötchen-Reise */
.route{list-style:none;margin:0;padding:0;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.route li{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);min-width:70px;text-align:center}
.route .punkt{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.route li.vorbei .punkt{background:var(--ok);border-color:var(--ok)}
.route li.jetzt{color:var(--fg);font-weight:700}
.route li.jetzt .punkt{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* Bildzuordnung */
.bildbox{position:relative;margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.bildbox img{display:block;width:100%;height:auto}
.marker{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font-weight:800;font-size:.9rem;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}

</style>
</head>

us (Speisebrei)!","quelle":["i-care S. 240"]},"Chymus":{"deutsch":"Speisebrei","erklaerung":"Entsteht im Magen durch Vermischung der Nahrung mit dem Magensaft. Nicht verwechseln mit Chylus (fetthaltige Lymphe)!","quelle":["i-care S. 205, 240"]},"Denaturierung":{"deutsch":"Strukturveränderung der Eiweiße","erklaerung":"Die Salzsäure des Magensafts zerstört die räumliche Struktur von Eiweißen, damit Enzyme sie leichter angreifen können.","quelle":["i-care S. 209, 239"]},"Disaccharide":{"deutsch":"Zweifachzucker","erklaerung":"Zucker aus zwei Bausteinen, z. B. Maltose, Laktose und Saccharose. Sie werden am Bürstensaum in Einfachzucker gespalten.","quelle":["MKK S. 361","i-care S. 238"]},"Duodenum":{"deutsch":"Zwölffingerdarm","erklaerung":"Erster Abschnitt des Dünndarms. Hier fließen Chymus, Pankreassaft und Galle zusammen.","quelle":["i-care S. 188, 214"]},"Emulgierung":{"deutsch":"feine Verteilung der Fette","erklaerung":"Fette werden durch Kauen, Magen- und Darmbewegungen und die Gallensäuren möglichst fein im Nahrungsbrei verteilt, damit Enzyme sie erreichen.","quelle":["i-care S. 240"]},"Enterozyten":{"deutsch":"Zellen der Dünndarmschleimhaut","erklaerung":"Die resorbierenden Epithelzellen des Dünndarms. Ihre Mikrovilli bilden den Bürstensaum.","quelle":["i-care S. 212","MKK S. 358"]},"essenziell":{"deutsch":"lebensnotwendig, muss mit der Nahrung aufgenommen werden","erklaerung":"Essenzielle Nahrungsbestandteile kann der Körper nicht oder nicht ausreichend selbst herstellen: Vitamine, Mineralstoffe, bestimmte Fett- und Aminosäuren.","quelle":["i-care S. 241"]},"Fundus":{"deutsch":"Magengrund","erklaerung":"Kuppelförmige Erweiterung des Magens unter dem Zwerchfell. Beim stehenden Menschen die höchstgelegene Region des Magens.","quelle":["MKK S. 354"]},"Gaster":{"deutsch":"Magen","erklaerung":"Auch Ventriculus genannt.","quelle":["i-care S. 205"]},"Glukoneogenese":{"deutsch":"Zuckerneubildung","erklaerung":"Die Leber bildet neue Glukose, z. B. aus Aminosäuren oder Laktat – nicht aber aus Fettsäuren.","quelle":["MKK S. 370–371","i-care S. 241"]},"Glukose":{"deutsch":"Traubenzucker","erklaerung":"Einfachzucker. Wichtigste Energiequelle des Körpers.","quelle":["MKK S. 370","i-care S. 241"]},"Glykogen":{"deutsch":"Speicherform der Glukose","erklaerung":"Bei Energieüberschuss wird Glukose in Leber und Muskulatur als Glykogen eingelagert.","quelle":["i-care S. 239","MKK S. 370"]},"Hypovitaminose":{"deutsch":"Vitaminmangelerkrankung","erklaerung":"Entsteht, wenn die Nahrung zu wenige Vitamine enthält oder ihre Aufnahme gestört ist. In Europa eher selten.","quelle":["i-care S. 243"]},"Kachexie":{"deutsch":"starke Abmagerung","erklaerung":"Bei unzureichender Ernährung älterer Menschen können hochkalorische Nahrungsergänzungen angeboten werden.","quelle":["i-care S. 247"]},"Kardia":{"deutsch":"Mageneingang","erklaerung":"Übergang von der Speiseröhre zum Magen, auch Magenmund genannt.","quelle":["i-care S. 205","MKK S. 354"]},"Korpus":{"deutsch":"Magenkörper","erklaerung":"Größter Teil des Magens.","quelle":["i-care S. 205","MKK S. 354"]},"Kurvatur":{"deutsch":"Krümmung","erklaerung":"Die große Kurvatur ist die nach außen gewölbte, die kleine Kurvatur die nach innen gewölbte Seite des Magens.","quelle":["MKK S. 354","i-care S. 208"]},"Laktose":{"deutsch":"Milchzucker","erklaerung":"Zweifachzucker, der durch die Laktase in Galaktose und Glukose gespalten wird.","quelle":["i-care S. 238"]},"Lipase":{"deutsch":"fettspaltendes Enzym","erklaerung":"Die Magenlipase spaltet 15–30 % der Nahrungsfette, die wichtigere Pankreaslipase den Rest.","quelle":["i-care S. 240","MKK S. 359"]},"Malabsorption":{"deutsch":"gestörte Aufnahme","erklaerung":"Die Aufnahme von Nährstoffen, z. B. Vitaminen, im Darm ist gestört.","quelle":["i-care S. 243"]},"Maltose":{"deutsch":"Malzzucker","erklaerung":"Zweifachzucker, der bei der Spaltung der Stärke durch die Amylase entsteht. Die Maltase spaltet ihn in zwei Glukosemoleküle.","quelle":["i-care S. 238"]},"Mikrovilli":{"deutsch":"Bürstensaum","erklaerung":"Dicht stehende Fortsätze der Enterozyten. Sie vergrößern die Oberfläche und tragen Verdauungsenzyme.","quelle":["i-care S. 210","MKK S. 358"]},"Mizellen":{"deutsch":"Gallensäure-Hüllen um Fettbestandteile","erklaerung":"Winzige Partikel aus Gallensäuren und Fettbestandteilen. Sie stellen den Kontakt zur Darmschleimhaut her.","quelle":["i-care S. 240–241","MKK S. 359"]},"Monosaccharide":{"deutsch":"Einfachzucker","erklaerung":"Glukose, Fruktose und Galaktose. Nur in dieser Form können Kohlenhydrate resorbiert werden.","quelle":["MKK S. 361","i-care S. 238"]},"Mukosa":{"deutsch":"Schleimhautschicht","erklaerung":"Innerste Schicht der Wand von Speiseröhre, Magen und Darm (Tunica mucosa).","quelle":["i-care S. 192"]},"Muskularis":{"deutsch":"Muskelschicht","erklaerung":"Schicht aus glatter Muskulatur (Tunica muscularis). Beim Magen besteht sie aus drei Schichten.","quelle":["i-care S. 192","MKK S. 354"]},"Pepsin":{"deutsch":"eiweißspaltendes Enzym des Magens","erklaerung":"Entsteht aus Pepsinogen. Spaltet Eiweiße in gröbere Bruchstücke.","quelle":["MKK S. 354–355"]},"Pepsinogen":{"deutsch":"Vorstufe von Pepsin","erklaerung":"Wird von den Hauptzellen gebildet und durch die Magensäure in Pepsin umgewandelt.","quelle":["i-care S. 209"]},"Peristaltik":{"deutsch":"wellenförmige Muskelbewegung","erklaerung":"Wiederkehrende Wellenbewegungen der Muskulatur, die den Inhalt weitertransportieren. Im Magen etwa alle 20 Sekunden in Richtung Pylorus.","quelle":["i-care S. 209","MKK S. 355"]},"Polysaccharide":{"deutsch":"Vielfachzucker","erklaerung":"Zucker aus vielen Bausteinen, z. B. Stärke. Sie müssen erst zerlegt werden, bevor sie resorbiert werden können.","quelle":["MKK S. 361","i-care S. 238"]},"Proteasen":{"deutsch":"eiweißspaltende Enzyme","erklaerung":"Enzyme des Pankreassafts wie Trypsin und Chymotrypsin. Sie werden als inaktive Vorstufen gebildet.","quelle":["i-care S. 223"]},"Pylorus":{"deutsch":"Magenpförtner","erklaerung":"Abschluss des Magens zum Dünndarm. Hier liegt der Magensphinkter.","quelle":["i-care S. 205","MKK S. 354"]},"Resorption":{"deutsch":"Aufnahme","erklaerung":"Aufnahme der Nährstoffbausteine, Vitamine, Elektrolyte und des Wassers, vor allem im Dünndarm.","quelle":["i-care S. 210, 214"]},"Saccharose":{"deutsch":"Rohr- bzw. Rübenzucker","erklaerung":"Zweifachzucker, den die Saccharase in Glukose und Fruktose spaltet.","quelle":["i-care S. 238"]},"Sphinkter":{"deutsch":"Schließmuskel","erklaerung":"Ringförmiger Muskel, der eine Öffnung verschließt, z. B. der Magensphinkter am Pylorus.","quelle":["i-care S. 205","MKK S. 359"]},"Triglyzeride":{"deutsch":"Neutralfette","erklaerung":"Hauptanteil der Nahrungsfette (etwa 90 %). Sie bestehen aus 1 Glyzerinmolekül und 3 Fettsäuren.","quelle":["MKK S. 362","i-care S. 240"]},"Abdomen":{"deutsch":"Bauch","erklaerung":"Der Teil des Körpers, der die Bauch- und Beckenhöhle enthält.","quelle":["i-care S. 189"]},"Appendizitis":{"deutsch":"„Blinddarmentzündung“","erklaerung":"Entzündung des Wurmfortsatzes. Häufigste Ursache eines akuten Abdomens.","quelle":["i-care S. 189"]},"Aszites":{"deutsch":"„Bauchwassersucht“","erklaerung":"Erhöhte Flüssigkeitsmenge im Bauchraum, z. B. bei einer Leberzirrhose.","quelle":["i-care S. 190"]},"Digestion":{"deutsch":"Verdauung","erklaerung":"Der Abbau der Nahrung in aufnehmbare Bestandteile – mechanisch und chemisch.","quelle":["MKK S. 344"]},"Ileum":{"deutsch":"Krummdarm","erklaerung":"Dritter und letzter Abschnitt des Dünndarms.","quelle":["i-care S. 188"]},"intraperitoneal":{"deutsch":"in der Bauchfellhöhle gelegen","erklaerung":"Intraperitoneale Organe sind vollständig vom Bauchfell überzogen und über ein Gekröse beweglich befestigt, z. B. Magen, Leber und Milz.","quelle":["i-care S. 189–191"]},"Jejunum":{"deutsch":"Leerdarm","erklaerung":"Zweiter Abschnitt des Dünndarms.","quelle":["i-care S. 188"]},"Kolon":{"deutsch":"Grimmdarm","erklaerung":"Größter Abschnitt des Dickdarms.","quelle":["i-care S. 188"]},"Meso":{"deutsch":"Gekröse","erklaerung":"Bindegewebsstrang, über den intraperitoneale Organe an der Bauchwand befestigt sind. Darin verlaufen Blutgefäße und Nerven. Beim Dünndarm heißt es Mesenterium.","quelle":["i-care S. 190"]},"Ösophagus":{"deutsch":"Speiseröhre","erklaerung":"Verbindet die Mundhöhle bzw. den Rachen mit dem Magen.","quelle":["i-care S. 188, 205"]},"Pankreas":{"deutsch":"Bauchspeicheldrüse","erklaerung":"Bildet den Pankreassaft mit Verdauungsenzymen und Hormone wie Insulin.","quelle":["i-care S. 188, 223"]},"Peritoneum":{"deutsch":"Bauchfell","erklaerung":"Glatte Haut, die die Bauch- und Beckenhöhle auskleidet und die Organe überzieht.","quelle":["i-care S. 189"]},"Peritonitis":{"deutsch":"Bauchfellentzündung","erklaerung":"Oft lebensbedrohliche Entzündung des Bauchfells, z. B. nach dem Durchbruch eines Darmabschnitts.","quelle":["MKK S. 345","i-care S. 190"]},"Rektum":{"deutsch":"Mastdarm","erklaerung":"Letzter Abschnitt des Darms vor dem Analkanal.","quelle":["i-care S. 188"]},"retroperitoneal":{"deutsch":"hinter dem Bauchfell gelegen","erklaerung":"Retroperitoneale Organe liegen der hinteren Rumpfwand direkt an. Das Bauchfell bedeckt nur ihre Vorderseite, z. B. bei Nieren und Bauchspeicheldrüse.","quelle":["i-care S. 191"]},"Submukosa":{"deutsch":"Bindegewebsschicht","erklaerung":"Schicht zwischen Mukosa und Muskularis. Sie enthält Blutgefäße und ein Nervengeflecht.","quelle":["i-care S. 192"]},"Zäkum":{"deutsch":"Blinddarm","erklaerung":"Erster Abschnitt des Dickdarms mit dem Wurmfortsatz (Appendix vermiformis).","quelle":["i-care S. 188"]},"Dentin":{"deutsch":"Zahnbein","erklaerung":"Sehr harte Substanz, aus der der eigentliche Zahn besteht.","quelle":["i-care S. 200"]},"Dysphagie":{"deutsch":"Schluckstörung","erklaerung":"Leitsymptom vieler Erkrankungen der Speiseröhre. Eine länger bestehende Schluckstörung sollte endoskopisch abgeklärt werden.","quelle":["MKK S. 353"]},"Epiglottis":{"deutsch":"Kehldeckel","erklaerung":"Legt sich beim Schlucken auf den Eingang des Kehlkopfs und verschließt ihn.","quelle":["i-care S. 198, 202"]},"Gingiva":{"deutsch":"Zahnfleisch","erklaerung":"Überzieht den Kieferknochen und den Zahnhals.","quelle":["i-care S. 199"]},"Karies":{"deutsch":"„Zahnfäule“","erklaerung":"Bakterien im Mund bauen Zucker ab und bilden Säure, die den Zahnschmelz angreift.","quelle":["i-care S. 201"]},"Ösophagusvarizen":{"deutsch":"Krampfadern in der Speiseröhre","erklaerung":"Entstehen bei Pfortaderhochdruck. Sie können plötzlich einreißen und lebensbedrohlich bluten.","quelle":["i-care S. 204"]},"Palatum":{"deutsch":"Gaumen","erklaerung":"Trennt die Mundhöhle von der Nasenhöhle. Vorn liegt der harte, hinten der weiche Gaumen.","quelle":["i-care S. 201"]},"Parotis":{"deutsch":"Ohrspeicheldrüse","erklaerung":"Größte Speicheldrüse. Sie liegt vor dem Ohr und mündet in den Mundvorhof.","quelle":["i-care S. 195"]},"Pulpa":{"deutsch":"Zahnmark","erklaerung":"Bindegewebe mit Blutgefäßen und Nerven in der Zahnhöhle. Es versorgt den Zahn.","quelle":["i-care S. 200"]},"Reflux":{"deutsch":"Rückfluss","erklaerung":"Magensäure fließt in die Speiseröhre zurück. Betroffene spüren ein schmerzhaftes Brennen (Sodbrennen).","quelle":["i-care S. 204","MKK S. 353"]},"Refluxösophagitis":{"deutsch":"Entzündung der Speiseröhre durch Rückfluss von Magensaft","erklaerung":"Entsteht, wenn häufig Magensaft in die Speiseröhre zurückfließt.","quelle":["i-care S. 204"]},"Uvula":{"deutsch":"Zäpfchen","erklaerung":"Sitzt am Ende des Gaumensegels.","quelle":["i-care S. 202"]},"Diarrhö":{"deutsch":"Durchfall","erklaerung":"Wässrige Stühle, z. B. bei einer Dünndarmentzündung.","quelle":["MKK S. 358"]},"Enteritis":{"deutsch":"Dünndarmentzündung","erklaerung":"Das Dünndarmepithel sondert sehr viel Gewebswasser ab. Die Folge sind wässrige Durchfälle. Ursachen sind z. B. Infektionen.","quelle":["MKK S. 358"]},"Ileus":{"deutsch":"Darmverschluss","erklaerung":"Nicht verwechseln mit dem Ileum, einem Abschnitt des Dünndarms!","quelle":["i-care S. 213"]},"Krypten":{"deutsch":"Vertiefungen der Darmschleimhaut","erklaerung":"Liegen im Dünndarm zwischen den Zotten und dienen vor allem der Erneuerung des Schleimhautepithels.","quelle":["i-care S. 210"]},"Mesenterium":{"deutsch":"Gekröse des Dünndarms","erklaerung":"Fächerförmige Aufhängung aus Bauchfell, die Jejunum und Ileum beweglich mit der hinteren Bauchwand verbindet.","quelle":["i-care S. 213"]},"Appendix vermiformis":{"deutsch":"Wurmfortsatz","erklaerung":"Dünner, blind endender Fortsatz des Blinddarms. In seiner Wand liegt Lymphgewebe.","quelle":["i-care S. 215"]},"Appendektomie":{"deutsch":"operative Entfernung des Wurmfortsatzes","erklaerung":"Wird bei einer Appendizitis durchgeführt.","quelle":["i-care S. 215"]},"Defäkation":{"deutsch":"Stuhlentleerung","erklaerung":"Setzt ein, wenn sich der innere und der äußere Schließmuskel entspannen.","quelle":["i-care S. 220"]},"Fäzes":{"deutsch":"Stuhl","erklaerung":"Entsteht im Dickdarm, indem dem Speisebrei Wasser entzogen wird und Bakterien den Darminhalt zersetzen.","quelle":["i-care S. 215"]},"Flatulenz":{"deutsch":"Blähungen","erklaerung":"Vermehrte Darmgase, z. B. bei sehr ballaststoffreicher Kost.","quelle":["i-care S. 220"]},"Kontinenz":{"deutsch":"Fähigkeit, den Stuhl zu halten","erklaerung":"Dafür sorgen vor allem der innere und der äußere Schließmuskel des Afters.","quelle":["i-care S. 219"]},"Obstipation":{"deutsch":"Verstopfung","erklaerung":"Wird durch wenig Bewegung, geringe Flüssigkeitszufuhr und ballaststoffarme Ernährung begünstigt.","quelle":["i-care S. 220"]},"Perforation":{"deutsch":"Durchbruch","erklaerung":"Bei einem Darmdurchbruch können Bakterien in die Bauchhöhle gelangen und eine Bauchfellentzündung verursachen.","quelle":["i-care S. 220"]},"endokrin":{"deutsch":"nach innen (ins Blut) abgebend","erklaerung":"Endokrine Drüsen geben ihre Hormone ins Blut ab, z. B. der hormonbildende Teil des Pankreas.","quelle":["i-care S. 221"]},"exokrin":{"deutsch":"nach außen abgebend","erklaerung":"Exokrine Drüsen geben ihre Stoffe z. B. in den Verdauungstrakt ab, wie der Teil des Pankreas, der den Verdauungssaft bildet.","quelle":["i-care S. 221"]},"Glukagon":{"deutsch":"blutzuckersteigerndes Hormon","erklaerung":"Wird in den Langerhans-Inseln des Pankreas gebildet. Gegenspieler des Insulins.","quelle":["MKK S. 367–368"]},"Insulin":{"deutsch":"blutzuckersenkendes Hormon","erklaerung":"Wird in den Langerhans-Inseln des Pankreas gebildet. Es ist das einzige blutzuckersenkende Hormon des Körpers.","quelle":["MKK S. 367–368"]},"Pankreatitis":{"deutsch":"Entzündung der Bauchspeicheldrüse","erklaerung":"Die Verdauungsenzyme werden schon im Pankreas aktiv und greifen das Organ an („Selbstverdauung“). Häufige Ursachen sind Gallensteine und Alkoholmissbrauch.","quelle":["i-care S. 224","MKK S. 367"]},"Hepar":{"deutsch":"Leber","erklaerung":"Zentrales Stoffwechselorgan im rechten Oberbauch. Sie entgiftet, bildet die Galle und speichert Nährstoffe.","quelle":["i-care S. 224"]},"Hepatozyten":{"deutsch":"Leberzellen","erklaerung":"Sie sind in den Leberläppchen strahlenförmig um die Zentralvene angeordnet und bilden unter anderem die Galle.","quelle":["i-care S. 225"]},"Albumin":{"deutsch":"Bluteiweiß","erklaerung":"Plasmaprotein, das die Leber bildet. Es hält die Flüssigkeit in den Blutgefäßen und transportiert Stoffe im Blut.","quelle":["i-care S. 231"]},"First-Pass-Effekt":{"deutsch":"Veränderung beim ersten Durchgang durch die Leber","erklaerung":"Geschluckte Arzneistoffe gelangen über die Pfortader zuerst in die Leber und werden dort umgebaut. Manche verlieren dadurch an Wirkung.","quelle":["i-care S. 234"]},"Bilirubin":{"deutsch":"Gallenfarbstoff","erklaerung":"Abbauprodukt des roten Blutfarbstoffs. Es wird mit der Galle in den Darm abgegeben; seine Abbauprodukte färben den Stuhl braun.","quelle":["i-care S. 235"]},"Ikterus":{"deutsch":"Gelbsucht","erklaerung":"Gelbliche Verfärbung von Haut, Schleimhäuten und Augen, weil sich Bilirubin ablagert.","quelle":["i-care S. 235"]},"enterohepatischer Kreislauf":{"deutsch":"Kreislauf zwischen Darm und Leber","erklaerung":"Der größte Teil der Gallensäuren wird im Darm wieder aufgenommen, gelangt über die Pfortader zur Leber und wird erneut verwendet.","quelle":["i-care S. 235"]},"Cholelithiasis":{"deutsch":"Gallensteinleiden","erklaerung":"Gallensteine können entstehen, wenn die Galle zu viel Cholesterin enthält. Meist verursachen sie keine Beschwerden.","quelle":["i-care S. 237","MKK S. 360"]},"Cholezystitis":{"deutsch":"Gallenblasenentzündung","erklaerung":"Ernsthafte Komplikation des Gallensteinleidens. Die Beschwerden ähneln einer Gallenkolik, zusätzlich besteht Fieber.","quelle":["MKK S. 361"]},"Hepatitis":{"deutsch":"Leberentzündung","erklaerung":"Ursachen sind zum Beispiel Viren, Alkohol, Gifte oder Medikamente.","quelle":["MKK S. 371"]},"Leberzirrhose":{"deutsch":"narbiger Umbau der Leber","erklaerung":"Leberzellen sterben ab und werden durch Bindegewebe ersetzt. Die Struktur der Leberläppchen wird dabei zerstört.","quelle":["i-care S. 229"]}},"awards":[{"id":"nachteule","name":{"w":"Nachteule","m":"Nachteule","n":"Nachteule"},"geheim":true,"regel":["modul_uhrzeit","0","4"],"bedingung":"Schließe ein Modul zwischen 0 und 4 Uhr ab.","fakt":"Den Grundumsatz bestimmt man morgens, 12–14 Stunden nach der letzten Mahlzeit – liegend und in völliger Ruhe.","quelle":["i-care S. 244"],"form":"zacken","farbe1":"#3d4f9e","farbe2":"#1b2352","icon":"mond"},{"id":"frueher-vogel","name":{"w":"Früher Vogel","m":"Früher Vogel","n":"Früher Vogel"},"geheim":false,"regel":["modul_uhrzeit","5","7"],"bedingung":"Schließe ein Modul zwischen 5 und 7 Uhr ab.","fakt":"Kohlenhydratreiche Speisen wie das Frühstücksbrötchen verweilen am kürzesten im Magen, fettreiche Speisen wie die Weihnachtsgans am längsten.","quelle":["MKK S. 355"],"form":"rund","farbe1":"#f6c453","farbe2":"#e0782f","icon":"sonne"},{"id":"viszeralchirurgin","name":{"w":"Viszeralchirurgin","m":"Viszeralchirurg","n":"Viszeralchirurg itel":"Robartinas Pflegebericht: Ernährung von Frau M.","bericht":"Frau M. (82) isst seit einigen Tagen sehr wenig. Ich habe ihr erklärt, dass ältere Menschen weniger Nährstoffe brauchen als jüngere. Zum Trinken habe ich ihr Limonade gebracht, weil sie den Durst am besten löscht. Wegen ihrer starken Abmagerung habe ich mit Frau Abda besprochen, ob wir hochkalorische Nahrungsergänzungen anbieten. Als Quelle für Vitamin C habe ich ihr Butter empfohlen, weil Vitamin C fettlöslich ist.","fehler":[{"links":"weniger Nährstoffe","rechts":"genauso viel|gleich viel|genau so viel|die gleichen","loesung":"genauso viele Nährstoffe (nur weniger Energie)"},{"links":"Limonade","rechts":"wasser|tee","loesung":"Wasser oder ungesüßter Tee"},{"links":"fettlöslich","rechts":"wasserlöslich","loesung":"wasserlöslich"}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-sc-kh-glukose","frage":"Zu welcher Gruppe gehört Glukose (Traubenzucker)?","optionen":[{"text":"Einfachzucker ([[Monosaccharide]])","richtig":true},{"text":"Zweifachzucker ([[Disaccharide]])","richtig":false},{"text":"Vielfachzucker ([[Polysaccharide]])","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"Stärke kommt z. B. in Kartoffeln und Reis vor.","id":"naehrstoffe-sc-kh-staerke","frage":"Zu welcher Gruppe gehört Stärke?","optionen":[{"text":"Vielfachzucker ([[Polysaccharide]])","richtig":true},{"text":"Zweifachzucker ([[Disaccharide]])","richtig":false},{"text":"Einfachzucker ([[Monosaccharide]])","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"Laktose besteht aus Galaktose und Glukose.","id":"naehrstoffe-sc-kh-laktose","frage":"Milchzucker (Laktose) ist ein …","optionen":[{"text":"Zweifachzucker ([[Disaccharide|Disaccharid]])","richtig":true},{"text":"Einfachzucker ([[Monosaccharide|Monosaccharid]])","richtig":false},{"text":"Vielfachzucker ([[Polysaccharide|Polysaccharid]])","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"Zweifach- und Vielfachzucker müssen deshalb erst in Einfachzucker zerlegt werden.","id":"naehrstoffe-sc-kh-aufnahme","frage":"In welcher Form können Kohlenhydrate aus dem Darm ins Blut aufgenommen werden?","optionen":[{"text":"nur als Einfachzucker","richtig":true},{"text":"nur als Zweifachzucker","richtig":false},{"text":"nur als Vielfachzucker","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 246, 248"],"erklaerung":"Glukose ist ein Einfachzucker und lässt den Blutzucker rasch ansteigen. Stärke muss erst verdaut werden.","id":"naehrstoffe-sc-kh-sport","frage":"Einer Läuferin geht kurz vor dem Ziel die Kraft aus. Was hilft am schnellsten?","optionen":[{"text":"ein Getränk mit Traubenzucker (Glukose)","richtig":true},{"text":"eine Portion Kartoffeln (Stärke)","richtig":false},{"text":"ein Vollkornbrot (Ballaststoffe)","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 238"],"erklaerung":"","id":"naehrstoffe-mc-kh-einfach","frage":"Welche dieser Zucker sind Einfachzucker?","optionen":[{"text":"Glukose","richtig":true},{"text":"Fruktose","richtig":true},{"text":"Galaktose","richtig":true},{"text":"Saccharose","richtig":false},{"text":"Stärke","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-mc-kh-zweifach","frage":"Welche dieser Zucker sind Zweifachzucker?","optionen":[{"text":"Maltose","richtig":true},{"text":"Laktose","richtig":true},{"text":"Saccharose","richtig":true},{"text":"Glukose","richtig":false},{"text":"Stärke","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-zu-kh-gruppe","frage":"Ordne jedem Zucker seine Gruppe zu.","paare":[{"links":"Glukose","rechts":"Einfachzucker"},{"links":"Fruktose","rechts":"Einfachzucker"},{"links":"Saccharose","rechts":"Zweifachzucker"},{"links":"Laktose","rechts":"Zweifachzucker"},{"links":"Stärke","rechts":"Vielfachzucker"}]},{"typ":"zuordnung","quelle":["i-care S. 238","MKK S. 362, 370"],"erklaerung":"","id":"naehrstoffe-zu-kh-namen","frage":"Ordne jedem Fachbegriff den deutschen Namen zu.","paare":[{"links":"Glukose","rechts":"Traubenzucker"},{"links":"Fruktose","rechts":"Fruchtzucker"},{"links":"Laktose","rechts":"Milchzucker"},{"links":"Maltose","rechts":"Malzzucker"}]},{"typ":"zuordnung","quelle":["MKK S. 361","i-care S. 238"],"erklaerung":"","id":"naehrstoffe-zu-kh-fachbegriff","frage":"Ordne jedem Fachbegriff die deutsche Bezeichnung zu.","paare":[{"links":"[[Monosaccharide]]","rechts":"Einfachzucker"},{"links":"[[Disaccharide]]","rechts":"Zweifachzucker"},{"links":"[[Polysaccharide]]","rechts":"Vielfachzucker"}]},{"typ":"reihenfolge","quelle":["i-care S. 238"],"erklaerung":"","id":"naehrstoffe-rf-kh-abbau","frage":"Stärke wird bei der Verdauung schrittweise zerlegt. Bring die Stufen in die richtige Reihenfolge.","schritte":["Vielfachzucker (Stärke)","Zweifachzucker (Maltose)","Einfachzucker (Glukose)"]},{"typ":"lückentext","quelle":["i-care S. 238, 246","MKK S. 370"],"erklaerung":"","id":"naehrstoffe-lt-kh","text":"Stärke ist ein {{Vielfachzucker|Polysaccharid}}. Milchzucker ist ein {{Zweifachzucker|Disaccharid}}. Traubenzucker ist ein {{Einfachzucker|Monosaccharid}} und gelangt sehr schnell ins Blut."},{"typ":"lückentext","quelle":["i-care S. 214"],"erklaerung":"","id":"naehrstoffe-lt-ballast","text":"Ballaststoffe sind meistens unverdauliche {{Vielfachzucker|Polysaccharide}}. Sie kommen vor allem in {{pflanzlichen}} Lebensmitteln vor, z. B. in Getreide und Gemüse."}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-kk-07f1b9","vorne":"Was sind die drei Hauptbestandteile der Nahrung?","hinten":"Kohlenhydrate, Proteine (Eiweiße) und Fette. Sie heißen auch „Brennstoffe“, weil der Körper aus ihnen Energie gewinnt."},{"typ":"karteikarte","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-kk-2d6fab","vorne":"Was bedeutet [[essenziell]]?","hinten":"Lebensnotwendig: Der Körper kann den Stoff nicht oder nicht ausreichend selbst herstellen. Er muss deshalb mit der Nahrung aufgenommen werden."},{"typ":"karteikarte","quelle":["i-care S. 241"],"erklaerung":"","id":"naehrstoffe-kk-18b6ff","vorne":"Welche Nahrungsbestandteile sind [[essenziell]]?","hinten":"Vitamine, Mineralstoffe, bestimmte Fettsäuren und bestimmte Aminosäuren."},{"typ":"karteikarte","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-kk-0c863c","vorne":"Welche Vitamine sind fettlöslich, und wie kann man sie sich merken?","hinten":"Die Vitamine E, D, K und A – Merkhilfe: die Supermarktkette „EDeKA“."},{"typ":"karteikarte","quelle":["i-care S. 242","MKK S. 362"],"erklaerung":"","id":"naehrstoffe-kk-ec60e8","vorne":"Warum sollte man fettlösliche Vitamine zusammen mit etwas Fett essen?","hinten":"Der Körper kann sie nur dann aufnehmen, wenn gleichzeitig Fett in der Nahrung ist."},{"typ":"karteikarte","quelle":["i-care S. 242"],"erklaerung":"","id":"naehrstoffe-kk-dff223","vorne":"Welches Vitamin kann der Körper mithilfe von Sonnenlicht selbst herstellen?","hinten":"Vitamin D. Sein Ausgangsstoff wird bei ausreichender Sonneneinstrahlung in der Haut gebildet."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-119cfe","vorne":"Warum müssen Veganer besonders auf Vitamin B12 achten?","hinten":"Vitamin B12 ist nur in tierischen Produkten enthalten."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-495919","vorne":"Warum ist Folsäure in der Schwangerschaft besonders wichtig?","hinten":"Der Bedarf ist erhöht. Ein Mangel kann beim Kind zu einem offenen Rücken (Spina bifida) führen."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-642446","vorne":"Welche Krankheit entsteht bei einem Mangel an Vitamin C?","hinten":"Skorbut. Früher waren häufig Matrosen betroffen, die lange keine frischen Lebensmittel hatten."},{"typ":"karteikarte","quelle":["i-care S. 243–244"],"erklaerung":"","id":"naehrstoffe-kk-621b49","vorne":"Was ist der Unterschied zwischen Mengen- und Spurenelementen?","hinten":"Mengenelemente kommen in größerer Menge im Körper vor (z. B. Kalzium, Natrium). Spurenelemente nur in geringen Mengen (z. B. Eisen, Jod)."},{"typ":"karteikarte","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-kk-634a9b","vorne":"Wo kommen die wichtigen [[essenziell|essenziellen]] Fettsäuren vor?","hinten":"Vor allem in pflanzlichen Ölen (z. B. Raps-, Oliven- oder Nussöl) und in Fisch."},{"typ":"karteikarte","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-kk-884aee","vorne":"Was ist der Grundumsatz?","hinten":"Die Energie, die der Körper in völliger Ruhe braucht, um seine lebenswichtigen Organfunktionen aufrechtzuerhalten."},{"typ":"karteikarte","quelle":["i-care S. 245"],"erklaerung":"","id":"naehrstoffe-kk-37c2f6","vorne":"Was ist der Arbeitsumsatz?","hinten":"Grundumsatz plus die Energie für alle Aktivitäten, z. B. Bewegung und körperliche Arbeit."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-f81c0e","vorne":"Welcher Nährstoff liefert pro Gramm am meisten Energie?","hinten":"Fett. Es liefert bei gleicher Menge mehr als doppelt so viel Energie wie Kohlenhydrate oder Eiweiß."},{"typ":"karteikarte","quelle":["i-care S. 214"],"erklaerung":"","id":"naehrstoffe-kk-c1d24d","vorne":"Was sind Ballaststoffe, und warum sind sie nützlich?","hinten":"Stoffe, die im Dünndarm nicht verdaut werden können, meist unverdauliche Vielfachzucker aus Getreide und Gemüse. Sie quellen auf und tragen zum Sättigungsgefühl bei."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-0e55a4","vorne":"Was bedeutet eine hohe biologische Wertigkeit eines Nahrungseiweißes?","hinten":"Das Eiweiß ähnelt dem menschlichen Körpereiweiß stark. Der Körper kann daraus viel körpereigenes Protein bilden."},{"typ":"karteikarte","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-kk-a2825b","vorne":"Welche Getränke eignen sich am besten zum Durstlöschen?","hinten":"Wasser und ungesüßte Tees. Unverdünnte Säfte und Limonaden enthalten meist viel Zucker und damit Kalorien."},{"typ":"karteikarte","quelle":["i-care S. 248"],"erklaerung":"","id":"naehrstoffe-kk-8a171d","vorne":"Welche Hormone steuern Hunger und Sättigung?","hinten":"Cholecystokinin gilt als „Sättigungshormon“, Ghrelin als „Hungerhormon“."},{"typ":"karteikarte","quelle":["i-care S. 244"],"erklaerung":"","id":"naehrstoffe-kk-7094e3","vorne":"Was gibt der Body-Mass-Index (BMI) an?","hinten":"Das Körpergewicht im Verhältnis zur Körpergröße. Ein sehr hoher BMI spricht für Fettleibigkeit ([[Adipositas]])."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-4ac263","vorne":"Wie verändert sich der Energiebedarf im Alter?","hinten":"Er sinkt, weil der Muskelanteil abnimmt. Ältere Menschen brauchen aber genauso viele Nährstoffe wie jüngere."},{"typ":"karteikarte","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-kk-d80222","vorne":"Welche drei Gruppen von Kohlenhydraten unterscheidet man?","hinten":"Einfachzucker ([[Monosaccharide]]), Zweifachzucker ([[Disaccharide]]) und Vielfachzucker ([[Polysaccharide]])."},{"typ":"karteikarte","quelle":["i-care S. 238","MKK S. 361–362, 370"],"erklaerung":"","id":"naehrstoffe-kk-3e640d","vorne":"Nenne drei Einfachzucker ([[Monosaccharide]]).","hinten":"Glukose (Traubenzucker), Fruktose (Fruchtzucker) und Galaktose."},{"typ":"karteikarte","quelle":["i-care S. 238","MKK S. 361"],"erklaerung":"","id":"naehrstoffe-kk-14c3cc","vorne":"Nenne drei Zweifachzucker ([[Disaccharide]]).","hinten":"Maltose (Malzzucker), Laktose (Milchzucker) und Saccharose (Rohr- bzw. Rübenzucker)."},{"typ":"karteikarte","quelle":["MKK S. 361","i-care S. 238"],"erklaerung":"","id":"naehrstoffe-kk-36138b","vorne":"Nenne einen wichtigen Vielfachzucker ([[Polysaccharide|Polysaccharid]]) und wo er vorkommt.","hinten":"Stärke, z. B. in Kartoffeln und Reis. Sie ist die häufigste Form der Kohlenhydrate in unserer Nahrung."},{"typ":"karteikarte","quelle":["i-care S. 246"],"erklaerung":"","id":"naehrstoffe-kk-b3bc2f","vorne":"Warum lassen Vielfachzucker den Blutzucker langsamer ansteigen als Einfachzucker?","hinten":"Vielfachzucker müssen erst verdaut und zu Einfachzuckern abgebaut werden, bevor sie ins Blut gelangen. Einfachzucker wie Glukose gelangen sehr schnell ins Blut."},{"typ":"karteikarte","quelle":["i-care S. 238"],"erklaerung":"","id":"naehrstoffe-kk-710293","vorne":"Aus welchen Einfachzuckern bestehen Maltose, Laktose und Saccharose?","hinten":"Maltose: Glukose + Glukose. Laktose: Galaktose + Glukose. Saccharose: Glukose + Fruktose."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 241, 243–244"],"erklaerung":"","id":"naehrstoffe-op-essenziell","operator":"beschreiben","afb":"I","fall":"Alaa liest auf einer Müslipackung „mit essenziellen Nährstoffen“. Er fragt Robartina in der Pause: „Was heißt eigentlich essenziell – und welche Stoffe sind das?“","auftrag":"Beschreibe, was essenzielle Nahrungsbestandteile sind, und nenne die vier Gruppen.","mindestlaenge":250,"kriterien":["Ich erkläre, dass der Körper diese Stoffe nicht oder nicht ausreichend selbst herstellen kann.","Ich erkläre, dass sie deshalb mit der Nahrung aufgenommen werden müssen.","Ich nenne Vitamine und Mineralstoffe.","Ich nenne bestimmte Fettsäuren und bestimmte Aminosäuren."],"musterloesung":"Essenzielle Nahrungsbestandteile sind Stoffe, die der Körper nicht oder nicht in ausreichender Menge selbst herstellen kann. Weil sie lebensnotwendig sind, müssen sie mit der Nahrung aufgenommen werden. Dazu gehören **Vitamine** (z. B. Vitamin C), **Mineralstoffe** (z. B. Kalzium oder Eisen), **bestimmte Fettsäuren** (z. B. aus pflanzlichen Ölen und Fisch) und **bestimmte Aminosäuren**."},{"typ":"operator","quelle":["i-care S. 243"],"erklaerung":"","id":"naehrstoffe-op-vegan","operator":"erläutern","afb":"II","fall":"Robartinas Mitschüler Alaa ernährt sich seit Kurzem vegan, also ohne Fleisch, Fisch, Milchprodukte und Eier. Frau Abda sagt zu ihm: „Das kann man gut machen – aber du musst bei zwei Dingen besonders aufpassen.“","auftrag":"Erläutere, worauf Alaa bei einer veganen Ernährung laut Buch besonders achten muss und warum.","mindestlaenge":350,"kriterien":["Ich nenne Vitamin B12 und erkläre, dass es nur in tierischen Produkten enthalten ist.","Ich nenne mögliche Nahrungsergänzungsmittel.","Ich nenne die essenziellen Aminosäuren und dass sie vor allem in tierischen Produkten vorkommen.","Ich erkläre, dass der Bedarf durch eine geeignete Zusammenstellung pflanzlicher Lebensmittel gedeckt werden kann."],"musterloesung":"**Vitamin B12** ist nur in tierischen Produkten enthalten. Veganer müssen deshalb darauf achten, dass sie – ggf. über Nahrungsergänzungsmittel – genügend Vitamin B12 aufnehmen. **Essenzielle Aminosäuren** kann der Körper nicht selbst bilden. Sie kommen vor allem in tierischen Produkten vor. Der Bedarf lässt sich aber auch über pflanzliche Lebensmittel decken, wenn man sie geeignet kombiniert. Veganer müssen ihre Mahlzeiten deshalb sorgfältig zusammenstellen."},{"typ":"operator","quelle":["i-care S. 246–247"],"erklaerung":"","id":"naehrstoffe-op-alter","operator":"beurteilen","afb":"III","fall":"Frau M. (82) liegt auf Robartinas Station. Sie isst seit Tagen sehr wenig, weil ihre Zahnprothese drückt, und hat sichtbar abgenommen. Robartina meint zu Alaa: „Ältere Menschen verbrauchen doch sowieso weniger Energie. Dann ist es nicht so schlimm, wenn sie wenig isst.“","auftrag":"Beurteile Robartinas Aussage mithilfe der Informationen aus dem Buch.","mindestlaenge":400,"kriterien":["Ich bestätige, dass der Energiebedarf im Alter sinkt.","Ich erkläre, dass ältere Menschen trotzdem genauso viele Nährstoffe benötigen.","Ich nenne Probleme wie Zahnprothesen, die zu Untergewicht oder Mangelerscheinungen führen können.","Ich nenne mögliche Maßnahmen (z. B. hochkalorische Nahrungsergänzungen bei starker Abmagerung).","Ich komme zu einem begründeten Urteil über Robartinas Aussage."],"musterloesung":"Robartina hat teilweise recht: Im Alter **sinkt der Energiebedarf**, weil der Muskelanteil abnimmt. Ältere Menschen benötigen aber **genauso viele Nährstoffe** wie jüngere. Viele haben zudem Schwierigkeiten beim Essen, z. B. **wegen Zahnprothesen**. Das kann zu **Untergewicht oder Mangelerscheinungen** führen – genau das zeichnet sich bei Frau M. ab. Bei starker Abmagerung ([[Kachexie]]) können hochkalorische Nahrungsergänzungen angeboten werden. **Urteil:** Robartinas Schlussfolgerung ist falsch. Frau M. drohen Mangelernährung und weiterer Gewichtsverlust. Das Problem mit der Prothese sollte gelöst und ihre Ernährung beobachtet werden."}],"status":"aktiv"},{"id":"aufbau","titel":"Aufgaben und Aufbau des Verdauungssystems","block":1,"nr":2,"organ":"","beschreibung":"Vom Mund bis zum After: der Weg der Nahrung im Überblick.","quellen":"i-care S. 188–192; MKK S. 344–345","icon":"verdauungstrakt","farbe":"#1b8a69","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-sc-anfang-ende","frage":"Wo beginnt und wo endet der Verdauungstrakt?","optionen":[{"text":"Er beginnt an der Mundhöhle und endet am After.","richtig":true},{"text":"Er beginnt am Magen und endet am Dünndarm.","richtig":false},{"text":"Er beginnt an der Speiseröhre und endet am Magen.","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 344"],"erklaerung":"","id":"aufbau-sc-peristaltik","frage":"Wie heißen die wellenförmigen Muskelbewegungen, die den Inhalt des Verdauungstrakts weitertransportieren?","optionen":[{"text":"[[Peristaltik]]","richtig":true},{"text":"[[Resorption]]","richtig":false},{"text":"[[Digestion]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 188"],"erklaerung":"Auf das Duodenum folgen das Jejunum und das Ileum.","id":"aufbau-sc-duodenum","frage":"Wie heißt der erste Abschnitt des Dünndarms?","optionen":[{"text":"[[Duodenum]]","richtig":true},{"text":"[[Ileum]]","richtig":false},{"text":"[[Kolon]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-sc-dickdarm","frage":"Welcher Abschnitt gehört zum Dickdarm?","optionen":[{"text":"[[Kolon]]","richtig":true},{"text":"[[Jejunum]]","richtig":false},{"text":"[[Duodenum]]","richtig":false}]},{"typ":"single-choice","quelle":["MKK S. 344"],"erklaerung":"","id":"aufbau-sc-resorption","frage":"Was bedeutet [[Resorption]]?","optionen":[{"text":"die Aufnahme der Nährstoffbausteine über die Darmschleimhaut","richtig":true},{"text":"das Zerkleinern der Nahrung im Mund","richtig":false},{"text":"das Ausscheiden des Stuhls","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-sc-leber","frage":"Welches Organ erreichen fast alle im Darm aufgenommenen Stoffe als Erstes?","optionen":[{"text":"die Leber","richtig":true},{"text":"das Herz","richtig":false},{"text":"die Nieren","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 192"],"erklaerung":"","id":"aufbau-sc-mukosa","frage":"Wie heißt die innerste Schicht der Wand des Verdauungstrakts?","optionen":[{"text":"[[Mukosa]]","richtig":true},{"text":"[[Muskularis]]","richtig":false},{"text":"[[Submukosa]]","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-sc-peritoneum","frage":"Wie heißt das Bauchfell in der Fachsprache?","optionen":[{"text":"Peritoneum","richtig":true},{"text":"Abdomen","richtig":false},{"text":"Mukosa","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 190–191"],"erklaerung":"Magen und Leber liegen intraperitoneal.","id":"aufbau-sc-retro","frage":"Welches dieser Organe liegt [[retroperitoneal]]?","optionen":[{"text":"die Bauchspeicheldrüse","richtig":true},{"text":"der Magen","richtig":false},{"text":"die Leber","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-sc-akut","frage":"Was ist die häufigste Ursache eines akuten Abdomens?","optionen":[{"text":"eine „Blinddarmentzündung“ ([[Appendizitis]])","richtig":true},{"text":"eine Erkältung","richtig":false},{"text":"ein Vitaminmangel","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-sc-unverdaulich","frage":"Was passiert mit den unverdaulichen Bestandteilen der Nahrung?","optionen":[{"text":"Sie werden mit dem Stuhl ausgeschieden.","richtig":true},{"text":"Sie werden in der Leber gespeichert.","richtig":false},{"text":"Sie werden im Magen aufgenommen.","richtig":false}]},{"typ":"single-choice","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-sc-oben","frage":"Welches Organ gehört zum oberen Verdauungstrakt?","optionen":[{"text":"der Magen","richtig":true},{"text":"der Dickdarm","richtig":false},{"text":"das Rektum","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-mc-saefte","frage":"Welche Organe bilden Verdauungssäfte?","optionen":[{"text":"die Speicheldrüsen","richtig":true},{"text":"die Bauchspeicheldrüse","richtig":true},{"text":"die Leber","richtig":true},{"text":"die Milz","richtig":false},{"text":"die Nieren","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-mc-duenndarm","frage":"Welche Abschnitte gehören zum Dünndarm?","optionen":[{"text":"Duodenum","richtig":true},{"text":"Jejunum","richtig":true},{"text":"Ileum","richtig":true},{"text":"Kolon","richtig":false},{"text":"Rektum","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-mc-aufgaben","frage":"Welche Aufgaben hat das Verdauungssystem?","optionen":[{"text":"die Nahrung zerkleinern","richtig":true},{"text":"die Nahrung mit Enzymen zerlegen","richtig":true},{"text":"die Nährstoffbausteine aufnehmen","richtig":true},{"text":"Unverdauliches ausscheiden","richtig":true},{"text":"den Körper mit Sauerstoff versorgen","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-mc-akut","frage":"Welche Zeichen gehören zu einem akuten Abdomen?","optionen":[{"text":"sehr starke, plötzlich aufgetretene Bauchschmerzen","richtig":true},{"text":"eine bretthart angespannte Bauchdecke","richtig":true},{"text":"häufig Erbrechen","richtig":true},{"text":"Husten","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 190–191"],"erklaerung":"","id":"aufbau-mc-intra","frage":"Welche Organe liegen [[intraperitoneal]]?","optionen":[{"text":"der Magen","richtig":true},{"text":"die Leber","richtig":true},{"text":"die Milz","richtig":true},{"text":"die Nieren","richtig":false}]},{"typ":"multiple-choice","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-mc-oben","frage":"Welche Organe zählen zum oberen Verdauungstrakt?","optionen":[{"text":"Mundhöhle","richtig":true},{"text":"Speiseröhre","richtig":true},{"text":"Magen","richtig":true},{"text":"Dickdarm","richtig":false},{"text":"Rektum","richtig":false}]},{"typ":"zuordnung","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-zu-namen","frage":"Ordne jedem Fachbegriff den deutschen Namen zu.","paare":[{"links":"[[Ösophagus]]","rechts":"Speiseröhre"},{"links":"[[Gaster]]","rechts":"Magen"},{"links":"[[Duodenum]]","rechts":"Zwölffingerdarm"},{"links":"[[Kolon]]","rechts":"Grimmdarm"},{"links":"[[Rektum]]","rechts":"Mastdarm"}]},{"typ":"zuordnung","quelle":["i-care S. 192"],"erklaerung":"","id":"aufbau-zu-schichten","frage":"Ordne jeder Wandschicht ihre deutsche Bezeichnung zu.","paare":[{"links":"[[Mukosa]]","rechts":"Schleimhautschicht"},{"links":"[[Submukosa]]","rechts":"Bindegewebsschicht"},{"links":"[[Muskularis]]","rechts":"Muskelschicht"}]},{"typ":"zuordnung","quelle":["i-care S. 189–191"],"erklaerung":"","id":"aufbau-zu-lage","frage":"Ordne jedem Begriff seine Bedeutung zu.","paare":[{"links":"[[Peritoneum]]","rechts":"Bauchfell"},{"links":"[[intraperitoneal]]","rechts":"vollständig vom Bauchfell überzogen"},{"links":"[[retroperitoneal]]","rechts":"nur an der Vorderseite vom Bauchfell bedeckt"}]},{"typ":"zuordnung","quelle":["MKK S. 344"],"erklaerung":"","id":"aufbau-zu-vorgaenge","frage":"Ordne jedem Vorgang seine Beschreibung zu.","paare":[{"links":"[[Digestion]]","rechts":"Abbau der Nahrung in aufnehmbare Bestandteile"},{"links":"[[Resorption]]","rechts":"Aufnahme der Bausteine in den Blutkreislauf"},{"links":"[[Peristaltik]]","rechts":"wellenförmige Muskelbewegung zum Weitertransport"}]},{"typ":"reihenfolge","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-rf-weg","frage":"Bring die Organe in die Reihenfolge, die die Nahrung durchläuft.","schritte":["Mundhöhle","Speiseröhre","Magen","Dünndarm","Dickdarm"]},{"typ":"reihenfolge","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-rf-darm","frage":"Bring die Darmabschnitte in die richtige Reihenfolge.","schritte":["[[Duodenum]]","[[Jejunum]]","[[Ileum]]","[[Kolon]]","[[Rektum]]"]},{"typ":"reihenfolge","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-rf-verdauung","frage":"Was macht das Verdauungssystem mit der Nahrung? Bring die Schritte in die richtige Reihenfolge.","schritte":["Die Nahrung wird mechanisch zerkleinert.","Enzyme zerlegen sie in kleine Bausteine.","Die Bausteine werden über die Darmschleimhaut aufgenommen.","Unverdauliches wird mit dem Stuhl ausgeschieden."]},{"typ":"reihenfolge","quelle":["i-care S. 192"],"erklaerung":"","id":"aufbau-rf-wand","frage":"Ordne die Wandschichten des Verdauungstrakts von innen nach außen.","schritte":["[[Mukosa]]","[[Submukosa]]","[[Muskularis]]"]},{"typ":"lückentext","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-lt-duenndarm","text":"Der Dünndarm besteht aus drei Abschnitten: dem {{Duodenum|Zwölffingerdarm}}, dem Jejunum und dem {{Ileum|Krummdarm}}."},{"typ":"lückentext","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-lt-bauchfell","text":"Die Bauch- und Beckenhöhle ist mit dem {{Bauchfell|Peritoneum}} ausgekleidet. Organe, die vollständig davon überzogen sind, liegen {{intraperitoneal}}."},{"typ":"lückentext","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-lt-aufgabe","text":"Das Verdauungssystem zerkleinert die Nahrung zuerst mechanisch und zerlegt sie dann mithilfe von {{Enzymen|Enzyme}}. Die Bausteine werden über die {{Darmschleimhaut|Schleimhaut}} aufgenommen."},{"typ":"fehlerfahndung","quelle":["i-care S. 188–189"],"erklaerung":"Plötzliche, sehr starke Bauchschmerzen mit brettharter Bauchdecke sprechen für ein akutes Abdomen, einen Notfall. Häufigste Ursache ist die Appendizitis. Das Bauchfell heißt Peritoneum; Abdomen bedeutet Bauch. Vom Magen gelangt die Nahrung in den Dünndarm.","id":"aufbau-ff-nachtdienst","titel":"Robartinas Bericht: Herr B. hat Bauchschmerzen","bericht":"02:10 Uhr: Herr B. klagt über sehr starke Bauchschmerzen, die plötzlich begonnen haben. Seine Bauchdecke ist bretthart. Ich habe das als harmlos eingeschätzt und abgewartet. Frau Abda erklärte mir später, dass die häufigste Ursache solcher Beschwerden eine Entzündung der Speiseröhre ist. Sie zeigte mir auch ein Schaubild: Das Bauchfell heißt in der Fachsprache Abdomen. Die Nahrung gelangt vom Magen zuerst in den Dickdarm.","fehler":[{"links":"als harmlos eingeschätzt und abgewartet","rechts":"notfall|sofort|gemeldet|arzt|informiert","loesung":"als Notfall erkannt und sofort gemeldet"},{"links":"Entzündung der Speiseröhre","rechts":"blinddarm|appendizitis|wurmfortsatz","loesung":"„Blinddarmentzündung“ (Appendizitis)"},{"links":"Abdomen","rechts":"peritoneum","loesung":"Peritoneum"},{"links":"Dickdarm","rechts":"dünndarm|duodenum|zwölffingerdarm","loesung":"Dünndarm (Duodenum)"}]}],"karten":[{"typ":"karteikarte","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-kk-0222c3","vorne":"Welche Aufgabe hat das Verdauungssystem?","hinten":"Es versorgt den Körper mit Nährstoffen: Es zerkleinert die Nahrung, zerlegt sie mit Enzymen in kleine Bausteine, nimmt diese über die Darmschleimhaut auf und scheidet Unverdauliches mit dem Stuhl aus."},{"typ":"karteikarte","quelle":["MKK S. 344"],"erklaerung":"","id":"aufbau-kk-c1438d","vorne":"Was ist der Unterschied zwischen mechanischer und chemischer Verdauung?","hinten":"Mechanisch: Die Nahrung wird zerkleinert. Chemisch: Verdauungsenzyme zerlegen die Nahrung."},{"typ":"karteikarte","quelle":["MKK S. 344"],"erklaerung":"","id":"aufbau-kk-dcba3f","vorne":"Was bedeutet [[Resorption]]?","hinten":"Die Nährstoffbausteine gelangen durch die Darmschleimhaut in den Blutkreislauf."},{"typ":"karteikarte","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-kk-e433d6","vorne":"Wo beginnt und wo endet der Verdauungstrakt?","hinten":"Er beginnt an der Mundhöhle und endet am After. Die Organe bilden einen zusammenhängenden Schlauch."},{"typ":"karteikarte","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-kk-5fbb5b","vorne":"Nenne die Organe des Verdauungstrakts in der Reihenfolge, die die Nahrung durchläuft.","hinten":"Mundhöhle, Speiseröhre ([[Ösophagus]]), Magen ([[Gaster]]), Dünndarm, Dickdarm."},{"typ":"karteikarte","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-kk-1602c2","vorne":"Aus welchen drei Abschnitten besteht der Dünndarm?","hinten":"[[Duodenum]] (Zwölffingerdarm), [[Jejunum]] (Leerdarm) und [[Ileum]] (Krummdarm)."},{"typ":"karteikarte","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-kk-c59f46","vorne":"Welche Abschnitte gehören zum Dickdarm?","hinten":"Blinddarm ([[Zäkum]]) mit Wurmfortsatz, [[Kolon]] (Grimmdarm) und [[Rektum]] (Mastdarm)."},{"typ":"karteikarte","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-kk-0de002","vorne":"Welche Organe gehören zum oberen Verdauungstrakt?","hinten":"Mundhöhle, Speiseröhre, Magen und Duodenum."},{"typ":"karteikarte","quelle":["i-care S. 188–189"],"erklaerung":"","id":"aufbau-kk-8e384d","vorne":"Welche Organe bilden die Verdauungssäfte?","hinten":"Die Speicheldrüsen, die Bauchspeicheldrüse ([[Pankreas]]) und die Leber. Auch der Magen bildet mit dem Magensaft einen Verdauungssaft."},{"typ":"karteikarte","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-kk-61018d","vorne":"Welche besondere Rolle spielt die Leber?","hinten":"Nahezu alle Stoffe, die im Darm aufgenommen werden, erreichen als erstes Organ die Leber. Sie entscheidet, ob die Stoffe verbraucht, gespeichert, umgewandelt oder abgebaut werden."},{"typ":"karteikarte","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-kk-b44d46","vorne":"Was ist das [[Peritoneum]]?","hinten":"Das Bauchfell: eine glatte Haut, die die Bauch- und Beckenhöhle auskleidet und die Organe überzieht."},{"typ":"karteikarte","quelle":["i-care S. 189–190"],"erklaerung":"","id":"aufbau-kk-c7a25f","vorne":"Was bedeutet [[intraperitoneal]]? Nenne Beispiele.","hinten":"Das Organ liegt in der Bauchfellhöhle und ist vollständig vom Bauchfell überzogen, z. B. Magen, Leber und Milz."},{"typ":"karteikarte","quelle":["i-care S. 191"],"erklaerung":"","id":"aufbau-kk-c9d634","vorne":"Was bedeutet [[retroperitoneal]]? Nenne Beispiele.","hinten":"Das Organ liegt hinter dem Bauchfell an der hinteren Rumpfwand. Nur seine Vorderseite ist vom Bauchfell bedeckt, z. B. bei den Nieren und der Bauchspeicheldrüse."},{"typ":"karteikarte","quelle":["i-care S. 190"],"erklaerung":"","id":"aufbau-kk-73e0bd","vorne":"Was ist das Gekröse ([[Meso]]), und wozu dient es?","hinten":"Ein vom Bauchfell überzogener Bindegewebsstrang, der intraperitoneale Organe mit der Bauchwand verbindet. Darin verlaufen Blutgefäße und Nerven. Es gibt den Organen Bewegungsfreiheit."},{"typ":"karteikarte","quelle":["i-care S. 190"],"erklaerung":"","id":"aufbau-kk-cd98b0","vorne":"Wozu dient die Flüssigkeit in der Bauchfellhöhle?","hinten":"Sie sorgt dafür, dass die Organe gut aneinander vorbeigleiten können."},{"typ":"karteikarte","quelle":["i-care S. 192"],"erklaerung":"","id":"aufbau-kk-22fd2c","vorne":"Aus welchen drei Schichten besteht die Wand von Speiseröhre, Magen und Darm (von innen nach außen)?","hinten":"[[Mukosa]] (Schleimhautschicht), [[Submukosa]] (Bindegewebsschicht) und [[Muskularis]] (Muskelschicht)."},{"typ":"karteikarte","quelle":["MKK S. 344"],"erklaerung":"","id":"aufbau-kk-991739","vorne":"Was ist [[Peristaltik]]?","hinten":"Wellenförmige Muskelbewegungen der Wand, die den Inhalt des Verdauungstrakts in eine Richtung weitertransportieren."},{"typ":"karteikarte","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-kk-174b64","vorne":"Was versteht man unter einem „akuten [[Abdomen]]“?","hinten":"Sehr starke, plötzlich aufgetretene Bauchschmerzen, oft mit Erbrechen und bretthart angespannter Bauchdecke. Es ist ein Notfall: Die Ursache muss schnell gefunden werden."},{"typ":"karteikarte","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-kk-7edc78","vorne":"Was ist die häufigste Ursache eines akuten Abdomens?","hinten":"Eine „Blinddarmentzündung“ ([[Appendizitis]])."},{"typ":"karteikarte","quelle":["i-care S. 190"],"erklaerung":"","id":"aufbau-kk-8e9c58","vorne":"Was ist ein [[Aszites]]?","hinten":"Eine erhöhte Flüssigkeitsmenge im Bauchraum („Bauchwassersucht“). Die Flüssigkeit tritt aus den Gefäßen aus, z. B. bei einer Leberzirrhose."}],"operatoren":[{"typ":"operator","quelle":["i-care S. 188"],"erklaerung":"","id":"aufbau-op-weg","operator":"beschreiben","afb":"I","fall":"Robartina soll einer Patientin vor einer Magenspiegelung erklären, wie der Verdauungstrakt aufgebaut ist. Die Patientin fragt: „Wo kommt mein Essen eigentlich überall vorbei?“","auftrag":"Beschreibe den Weg der Nahrung durch den Verdauungstrakt. Nenne dabei die Abschnitte des Dünndarms.","mindestlaenge":250,"kriterien":["Ich nenne Mundhöhle, Speiseröhre und Magen in der richtigen Reihenfolge.","Ich nenne die drei Abschnitte des Dünndarms (Duodenum, Jejunum, Ileum).","Ich nenne den Dickdarm mit Kolon und Rektum.","Ich verwende die Fachbegriffe korrekt."],"musterloesung":"Die Nahrung gelangt aus der **Mundhöhle** über die **Speiseröhre** (Ösophagus) in den **Magen** (Gaster). Von dort wird sie in den **Dünndarm** weitergegeben. Er besteht aus drei Abschnitten: dem **Duodenum** (Zwölffingerdarm), dem **Jejunum** (Leerdarm) und dem **Ileum** (Krummdarm). Danach folgt der **Dickdarm** mit dem Blinddarm, dem **Kolon** (Grimmdarm) und dem **Rektum** (Mastdarm). Der Verdauungstrakt endet am After."},{"typ":"operator","quelle":["i-care S. 189–191"],"erklaerung":"","id":"aufbau-op-lage","operator":"erläutern","afb":"II","fall":"Im Unterricht hat Alaa die Begriffe „intraperitoneal“ und „retroperitoneal“ gehört, kann sich darunter aber nichts vorstellen. Er bittet Robartina um Hilfe.","auftrag":"Erläutere den Unterschied zwischen intraperitonealer und retroperitonealer Lage und nenne je ein Beispiel.","mindestlaenge":350,"kriterien":["Ich erkläre, was das Bauchfell (Peritoneum) ist.","Ich erkläre, dass intraperitoneale Organe vollständig vom Bauchfell überzogen sind.","Ich erkläre, dass sie über ein Gekröse beweglich befestigt sind.","Ich erkläre, dass retroperitoneale Organe hinter dem Bauchfell liegen und nur vorn bedeckt sind.","Ich nenne je ein passendes Beispiel."],"musterloesung":"Das **Bauchfell** (Peritoneum) ist eine glatte Haut, die die Bauch- und Beckenhöhle auskleidet und die Organe überzieht. **Intraperitoneale** Organe liegen in der Bauchfellhöhle und sind vollständig vom Bauchfell überzogen, z. B. der Magen. Sie sind über ein **Gekröse** (Meso) beweglich an der hinteren Rumpfwand befestigt; darin verlaufen ihre Blutgefäße und Nerven. **Retroperitoneale** Organe liegen dagegen hinter dem Bauchfell direkt an der hinteren Rumpfwand, z. B. die Bauchspeicheldrüse. Das Bauchfell bedeckt nur ihre Vorderseite, deshalb sind sie wesentlich weniger beweglich."},{"typ":"operator","quelle":["i-care S. 189"],"erklaerung":"","id":"aufbau-op-akut","operator":"beurteilen","afb":"III","fall":"Im Nachtdienst klagt Herr B. plötzlich über sehr starke Bauchschmerzen. Er hat erbrochen, und seine Bauchdecke fühlt sich bretthart an. Alaa, der mit Robartina im Praktikum ist, meint: „Das ist bestimmt nur eine Magenverstimmung. Wir geben ihm eine Wärmflasche und warten bis morgen früh.“","auftrag":"Beurteile Alaas Vorschlag mithilfe der Informationen aus dem Buch.","mindestlaenge":350,"kriterien":["Ich erkenne die Zeichen eines akuten Abdomens (starke plötzliche Schmerzen, Erbrechen, brettharte Bauchdecke).","Ich nenne mögliche Ursachen, z. B. eine Blinddarmentzündung.","Ich erkläre, dass einige dieser Ursachen lebensbedrohlich sind.","Ich begründe, dass die Ursache schnell gefunden werden muss.","Ich komme zu einem begründeten Urteil über Alaas Vorschlag."],"musterloesung":"Herr B. hat sehr starke, plötzlich aufgetretene Bauchschmerzen, er erbricht, und seine Bauchdecke ist bretthart angespannt. Das sind die Zeichen eines **akuten Abdomens**, eines häufigen Notfalls. Die häufigste Ursache ist eine „Blinddarmentzündung“ (Appendizitis). Es kommen aber auch andere Erkrankungen infrage, z. B. eine Entzündung der Bauchspeicheldrüse oder des Bauchfells, ein Darmverschluss oder ein durchgebrochenes Magengeschwür. Weil einige dieser Erkrankungen **lebensbedrohlich** sind, muss die Ursache **möglichst schnell** gefunden werden. **Urteil:** Alaas Vorschlag ist falsch und gefährlich. Abwarten kann Herrn B. das Leben kosten. Robartina und Alaa müssen sofort die zuständige Pflegefachkraft bzw. den Arzt informieren."}],"status":"aktiv"},{"id":"mundhoehle","titel":"Mundhöhle und Speiseröhre","block":2,"nr":1,"organ":"","beschreibung":"Zähne, Zunge, Speichel und Schlucken.","quellen":"i-care S. 193–205; MKK S. 353","icon":"mund","farbe":"#2A473B","aufgaben":[{"typ":"single-choice","quelle":["i-care S. 197"],"erklaerung":"","id":"mundhoehle-sc-amylase","frage":"Welches Enzym im Speichel beginnt mit der Spaltung der Stärke?","optionen":[{"text":"[[Amylase]]","richtig":true},{"text":"[[Pepsin]]","richtig":false},{"text":"[[Lipase]]","richtig":false}]},{"typ":"single
